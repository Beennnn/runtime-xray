<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="930" viewBox="0 0 1420 930" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" role="img" aria-label="The reference use case of Runtime X-Ray: one deterministic run of sample-app, its root method RoutePlanner::travelTimeMinutes, and what each of the three tools answers about it">
<title>Runtime X-Ray — the reference use case</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#8896A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1420" height="930" fill="#FFFFFF"/>
<text x="40" y="46" font-size="19" fill="#16181A" font-weight="700" text-anchor="start">Runtime X-Ray — the reference use case</text><text x="40" y="68" font-size="12.5" fill="#5B6873" font-weight="400" text-anchor="start">One deterministic run of ~10 s, three tools attached to it, three answers that only hold together.</text>
<rect x="40" y="100" width="380" height="300" rx="14" fill="#F2F5F6" stroke="#8896A2" stroke-width="1.4" stroke-dasharray="8 6"/>
<text x="400" y="122" font-size="10.5" fill="#8896A2" font-weight="600" text-anchor="end" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">ONE RUN, MEASURED THREE TIMES OVER</text>
<rect x="70" y="140" width="320" height="76" rx="0" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/>
<svg x="84" y="156" width="32" height="32" viewBox="0 0 48 48" overflow="visible">
  
  <rect width="48" height="48" rx="13" fill="#f0f0f0"/>
