</svg>
<text x="126" y="168" font-size="12.5" fill="#16181A" font-weight="600" text-anchor="start">The analysed application</text>
<text x="126" y="186" font-size="11.5" fill="#7038D8" font-weight="400" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">sample-app.jar</text>
<text x="126" y="202" font-size="9.5" fill="#8896A2" font-weight="400" text-anchor="start">22 classes · no dependency · no clock, no randomness</text>
<rect x="70" y="236" width="320" height="84" rx="0" fill="#FFFFFF" stroke="#A3196F" stroke-width="3.2"/>
<text x="84" y="260" font-size="11.5" fill="#A3196F" font-weight="700" text-anchor="start">The root method</text>
<text x="84" y="282" font-size="12.5" fill="#A3196F" font-weight="400" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">RoutePlanner::travelTimeMinutes</text>
<text x="84" y="302" font-size="9.5" fill="#5B6873" font-weight="400" text-anchor="start">named at launch — the only one whose values are captured</text>
<text x="70" y="348" font-size="11" fill="#5B6873" font-weight="400" text-anchor="start">Deterministic: two runs produce the same trace.</text>
<text x="70" y="366" font-size="11" fill="#5B6873" font-weight="400" text-anchor="start">Calibrated to ~10 s: long enough to attach to a live process.</text>
<text x="70" y="384" font-size="11" fill="#5B6873" font-weight="400" text-anchor="start">Replayed under Java 21, then Java 25.</text>
<text x="470" y="128" font-size="10" fill="#8896A2" font-weight="600" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">WHY THIS PROGRAM, AND NOT ANOTHER</text>
<text x="470" y="154" font-size="11.5" fill="#5B6873" font-weight="400" text-anchor="start">It is built to tell tools apart. Each trait below is there to make one</text>
<text x="470" y="172" font-size="11.5" fill="#5B6873" font-weight="400" text-anchor="start">of them say something the others cannot:</text>
<circle cx="478" cy="196" r="3" fill="#8896A2"/>
<text x="492" y="200" font-size="11.5" fill="#16181A" font-weight="600" text-anchor="start">calls conditioned by the context</text>
<text x="492" y="216" font-size="10.5" fill="#8896A2" font-weight="400" text-anchor="start">a branch taken only for a trip by car</text>
<circle cx="478" cy="236" r="3" fill="#8896A2"/>
<text x="492" y="240" font-size="11.5" fill="#16181A" font-weight="600" text-anchor="start">two paths never taken</text>
<text x="492" y="256" font-size="10.5" fill="#8896A2" font-weight="400" text-anchor="start">PlaneSpeed, and the SNOW branch</text>
<circle cx="478" cy="276" r="3" fill="#8896A2"/>
<text x="492" y="280" font-size="11.5" fill="#16181A" font-weight="600" text-anchor="start">a recursion</text>
<text x="492" y="296" font-size="10.5" fill="#8896A2" font-weight="400" text-anchor="start">so the call tree has real depth</text>
<circle cx="478" cy="316" r="3" fill="#8896A2"/>
<text x="492" y="320" font-size="11.5" fill="#16181A" font-weight="600" text-anchor="start">a virtual dispatch</text>
<text x="492" y="336" font-size="10.5" fill="#8896A2" font-weight="400" text-anchor="start">so the resolved target is not the declared one</text>
<circle cx="478" cy="356" r="3" fill="#8896A2"/>
<text x="492" y="360" font-size="11.5" fill="#16181A" font-weight="600" text-anchor="start">a blocking operation</text>
<text x="492" y="376" font-size="10.5" fill="#8896A2" font-weight="400" text-anchor="start">so wall-clock and processor time diverge</text>
<text x="470" y="408" font-size="11.5" fill="#5B6873" font-weight="400" text-anchor="start">Without those, two reports would look alike and the comparison</text>
<text x="470" y="426" font-size="11.5" fill="#5B6873" font-weight="400" text-anchor="start">would say nothing about the tools.</text>
<rect x="70" y="440" width="300" height="96" rx="0" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/>
<svg x="84" y="456" width="30" height="30" viewBox="0 0 32 32" overflow="visible">
  <rect width="32" height="32" rx="8" fill="#1a7f37" fill-opacity="0.14" stroke="#1a7f37" stroke-opacity="0.5"/>
  <rect x="8" y="9"  width="16" height="3" rx="1.5" fill="#3fb950"/>
  <rect x="8" y="14.5" width="11" height="3" rx="1.5" fill="#3fb950"/>
  <rect x="8" y="20" width="7"  height="3" rx="1.5" fill="#f85149"/>
</svg>
<text x="126" y="470" font-size="13" fill="#16181A" font-weight="600" text-anchor="start">JaCoCo</text>
<text x="126" y="488" font-size="10.5" fill="#8896A2" font-weight="400" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">javaagent</text>
<text x="84" y="514" font-size="9.5" fill="#5B6873" font-weight="400" text-anchor="start">Says nothing about time, nor about the order of the calls.</text>
<path d="M370 488 H444" fill="none" stroke="#8896A2" stroke-width="1.5" marker-end="url(#fl)"/><text x="407" y="480" font-size="11" fill="#5B6873" font-weight="400" text-anchor="middle">writes</text>
<g><path d="M448 466 v40 a105.0 12 0 0 0 210 0 v-40" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/><ellipse cx="553.0" cy="466" rx="105.0" ry="12" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/></g>
<text x="553" y="490" font-size="11.5" fill="#0B7A6E" font-weight="400" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">jacoco.exec</text>
<text x="553" y="506" font-size="9.5" fill="#8896A2" font-weight="400" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">inside runs/</text>
<path d="M658 488 H726" fill="none" stroke="#8896A2" stroke-width="1.5" marker-end="url(#fl)"/><text x="692" y="480" font-size="11" fill="#5B6873" font-weight="400" text-anchor="middle">answers</text>
<rect x="730" y="440" width="620" height="96" rx="10" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/>
<rect x="730" y="440" width="5" height="96" fill="#0B7A6E"/>
<text x="752" y="466" font-size="13" fill="#16181A" font-weight="600" text-anchor="start">Which lines were executed</text>
<text x="752" y="486" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">· 91.1 % of instructions, 81.8 % of branches</text>
<text x="752" y="503" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">· PlaneSpeed: never loaded — so removable</text>
<text x="752" y="520" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">· the SNOW branch: never taken</text>
<rect x="70" y="558" width="300" height="96" rx="0" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/>
<svg x="84" y="574" width="30" height="30" viewBox="0 0 32 32" overflow="visible">
  <rect width="32" height="32" rx="8" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-opacity="0.5"/>
  <rect x="6"  y="20" width="20" height="4" rx="1.5" fill="#e3a72c"/>
  <rect x="9"  y="14.5" width="14" height="4" rx="1.5" fill="#f0b849"/>
  <rect x="12" y="9" width="8"  height="4" rx="1.5" fill="#f8d477"/>
</svg>
<text x="126" y="588" font-size="13" fill="#16181A" font-weight="600" text-anchor="start">async-profiler</text>
<text x="126" y="606" font-size="10.5" fill="#8896A2" font-weight="400" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">agentpath</text>
<text x="84" y="632" font-size="9.5" fill="#5B6873" font-weight="400" text-anchor="start">Samples: it can never prove that a piece of code did NOT run.</text>
<path d="M370 606 H444" fill="none" stroke="#8896A2" stroke-width="1.5" marker-end="url(#fl)"/><text x="407" y="598" font-size="11" fill="#5B6873" font-weight="400" text-anchor="middle">writes</text>
<g><path d="M448 584 v40 a105.0 12 0 0 0 210 0 v-40" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/><ellipse cx="553.0" cy="584" rx="105.0" ry="12" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/></g>
<text x="553" y="608" font-size="11.5" fill="#4C5A66" font-weight="400" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">profil.collapsed</text>
<text x="553" y="624" font-size="9.5" fill="#8896A2" font-weight="400" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">inside runs/</text>
<path d="M658 606 H726" fill="none" stroke="#8896A2" stroke-width="1.5" marker-end="url(#fl)"/><text x="692" y="598" font-size="11" fill="#5B6873" font-weight="400" text-anchor="middle">answers</text>
<rect x="730" y="558" width="620" height="96" rx="10" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/>
<rect x="730" y="558" width="5" height="96" fill="#4C5A66"/>
<text x="752" y="584" font-size="13" fill="#16181A" font-weight="600" text-anchor="start">Where the time goes</text>
<text x="752" y="604" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">· 71 % of the samples on business methods</text>
<text x="752" y="621" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">· the aggregated call tree, whole run</text>
<text x="752" y="638" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">· the share of time under each branch</text>
<rect x="70" y="676" width="300" height="96" rx="0" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/>
<svg x="84" y="692" width="30" height="30" viewBox="0 0 32 32" overflow="visible">
  <rect width="32" height="32" rx="8" fill="#8250df" fill-opacity="0.14" stroke="#8250df" stroke-opacity="0.5"/>
  <circle cx="14.5" cy="14" r="6" fill="none" stroke="#ab7df8" stroke-width="2.4"/>
  <path d="M19 18.5L24 23.5" stroke="#ab7df8" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="14.5" cy="14" r="2" fill="#ab7df8"/>
</svg>
<text x="126" y="706" font-size="13" fill="#16181A" font-weight="600" text-anchor="start">Arthas</text>
<text x="126" y="724" font-size="10.5" fill="#8896A2" font-weight="400" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">attach</text>
<text x="84" y="750" font-size="9.5" fill="#5B6873" font-weight="400" text-anchor="start">A console, not a report — and one method at a time.</text>
<path d="M370 724 H444" fill="none" stroke="#8896A2" stroke-width="1.5" marker-end="url(#fl)"/><text x="407" y="716" font-size="11" fill="#5B6873" font-weight="400" text-anchor="middle">writes</text>
<g><path d="M448 702 v40 a105.0 12 0 0 0 210 0 v-40" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/><ellipse cx="553.0" cy="702" rx="105.0" ry="12" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/></g>
<text x="553" y="726" font-size="11.5" fill="#7038D8" font-weight="400" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">watch-params.txt</text>
<text x="553" y="742" font-size="9.5" fill="#8896A2" font-weight="400" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">inside runs/</text>
<path d="M658 724 H726" fill="none" stroke="#8896A2" stroke-width="1.5" marker-end="url(#fl)"/><text x="692" y="716" font-size="11" fill="#5B6873" font-weight="400" text-anchor="middle">answers</text>
<rect x="730" y="676" width="620" height="96" rx="10" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/>
<rect x="730" y="676" width="5" height="96" fill="#7038D8"/>
<text x="752" y="702" font-size="13" fill="#16181A" font-weight="600" text-anchor="start">Which values went through</text>
<text x="752" y="722" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">· Trip[id=TRIP-56, mode=CAR, weather=SUNNY]</text>
<text x="752" y="739" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">· returned 52.008069818… minutes</text>
<text x="752" y="756" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">· one call's tree, with its line numbers</text>
<rect x="70" y="800" width="1280" height="58" rx="14" fill="#F2F5F6" stroke="#8896A2" stroke-width="1.4" stroke-dasharray="8 6"/>
<text x="94" y="826" font-size="13" fill="#16181A" font-weight="700" text-anchor="start">None of the three answers the other two's question.</text>
<text x="94" y="846" font-size="11" fill="#5B6873" font-weight="400" text-anchor="start">That is the whole finding of the study: the answer is a combination, and what is left to settle is which second tool — not which one wins.</text>
<text x="40" y="884" font-size="10" fill="#8896A2" font-weight="600" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">SHAPES</text><rect x="104" y="872" width="26" height="16" rx="0" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/><text x="136" y="884" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">service</text><rect x="205.4" y="872" width="26" height="16" rx="10" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/><text x="237.4" y="884" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">application</text><g><path d="M331.6 875.2 v9.6 a13.0 3.2 0 0 0 26 0 v-9.6" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/><ellipse cx="344.6" cy="875.2" rx="13.0" ry="3.2" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/></g><text x="363.6" y="884" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">storage</text><rect x="433.0" y="872" width="26" height="16" rx="14" fill="#F2F5F6" stroke="#8896A2" stroke-width="1.4" stroke-dasharray="8 6"/><text x="465.0" y="884" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">zone</text>
<text x="40" y="910" font-size="10" fill="#8896A2" font-weight="600" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">COLOURS</text><rect x="104" y="900" width="12" height="12" rx="3" fill="#0B7A6E"/><text x="122" y="910" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">Files</text><rect x="177.0" y="900" width="12" height="12" rx="3" fill="#4C5A66"/><text x="195.0" y="910" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">Infrastructure</text><rect x="305.8" y="900" width="12" height="12" rx="3" fill="#7038D8"/><text x="323.8" y="910" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">API and code</text>
<rect x="700" y="896" width="26" height="16" rx="0" fill="#FFFFFF" stroke="#A3196F" stroke-width="2.6"/>
<text x="734" y="908" font-size="10.5" fill="#5B6873" font-weight="400" text-anchor="start">the subject of the diagram: the root method</text>
<text x="1380" y="908" font-size="10" fill="#8896A2" font-weight="400" text-anchor="end">figures measured on sample-app under Java 21</text>
</svg>
