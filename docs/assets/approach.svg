<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="The Runtime X-Ray approach: scope, instrument, run, observe, decide — and the three deliverables">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <pattern id="grid2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="16" fill="url(#bg2)"/>
  <rect width="1200" height="640" rx="16" fill="url(#grid2)"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="48" y="58" fill="#e6edf3" font-size="24" font-weight="700">The approach</text>
    <text x="48" y="84" fill="#8b949e" font-size="15">A short loop: a tool is added only in order to run it for real.</text>

    <!-- ============ STEP CARDS ============ -->
    <!-- 1 -->
    <g>
      <rect x="48" y="120" width="190" height="212" rx="14" fill="#38bdf8" fill-opacity="0.06" stroke="#38bdf8" stroke-opacity="0.30"/>
      <circle cx="76" cy="152" r="15" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="76" y="157" fill="#7dd3fc" font-size="14" font-weight="700" text-anchor="middle">1</text>
      <text x="102" y="157" fill="#e6edf3" font-size="17" font-weight="600">Scope</text>
      <text x="70" y="196" fill="#9aa7b8" font-size="13.5">Set the criteria</text>
      <text x="70" y="216" fill="#9aa7b8" font-size="13.5">before looking at</text>
      <text x="70" y="236" fill="#9aa7b8" font-size="13.5">a single tool:</text>
      <text x="70" y="256" fill="#9aa7b8" font-size="13.5">features, constraints,</text>
      <text x="70" y="276" fill="#9aa7b8" font-size="13.5">costs.</text>
      <text x="70" y="310" fill="#7dd3fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">etude/methode.md</text>
    </g>
    <!-- 2 -->
    <g>
      <rect x="276" y="120" width="190" height="212" rx="14" fill="#60a5fa" fill-opacity="0.06" stroke="#60a5fa" stroke-opacity="0.30"/>
      <circle cx="304" cy="152" r="15" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.55"/>
      <text x="304" y="157" fill="#93c5fd" font-size="14" font-weight="700" text-anchor="middle">2</text>
      <text x="330" y="157" fill="#e6edf3" font-size="17" font-weight="600">Instrument</text>
      <text x="298" y="196" fill="#9aa7b8" font-size="13.5">A JVM agent or an</text>
      <text x="298" y="216" fill="#9aa7b8" font-size="13.5">attachment — never</text>
      <text x="298" y="236" fill="#9aa7b8" font-size="13.5">a dependency. The</text>
      <text x="298" y="256" fill="#9aa7b8" font-size="13.5">analysed code is</text>
      <text x="298" y="276" fill="#9aa7b8" font-size="13.5">not modified.</text>
      <text x="298" y="310" fill="#93c5fd" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tools/*/collect.sh</text>
    </g>
    <!-- 3 -->
    <g>
      <rect x="505" y="120" width="190" height="212" rx="14" fill="#818cf8" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.30"/>
      <circle cx="533" cy="152" r="15" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.55"/>
      <text x="533" y="157" fill="#a5b4fc" font-size="14" font-weight="700" text-anchor="middle">3</text>
      <text x="559" y="157" fill="#e6edf3" font-size="17" font-weight="600">Run</text>
      <text x="527" y="196" fill="#9aa7b8" font-size="13.5">The same ~10 s run</text>
      <text x="527" y="216" fill="#9aa7b8" font-size="13.5">for all of them,</text>
      <text x="527" y="236" fill="#9aa7b8" font-size="13.5">deterministic, under</text>
      <text x="527" y="256" fill="#9aa7b8" font-size="13.5">Java 21 then 25.</text>
      <text x="527" y="276" fill="#9aa7b8" font-size="13.5"></text>
      <text x="527" y="310" fill="#a5b4fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sample-app</text>
    </g>
    <!-- 4 -->
    <g>
      <rect x="733" y="120" width="190" height="212" rx="14" fill="#a78bfa" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.30"/>
      <circle cx="761" cy="152" r="15" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="761" y="157" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">4</text>
      <text x="787" y="157" fill="#e6edf3" font-size="17" font-weight="600">Observe</text>
      <text x="755" y="196" fill="#9aa7b8" font-size="13.5">Read the reports</text>
      <text x="755" y="216" fill="#9aa7b8" font-size="13.5">side by side on the</text>
      <text x="755" y="236" fill="#9aa7b8" font-size="13.5">same grid: readable?</text>
      <text x="755" y="256" fill="#9aa7b8" font-size="13.5">interactive? sendable</text>
      <text x="755" y="276" fill="#9aa7b8" font-size="13.5">off the machine?</text>
      <text x="755" y="310" fill="#c4b5fd" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">reports-demo/</text>
    </g>
    <!-- 5 -->
    <g>
      <rect x="962" y="120" width="190" height="212" rx="14" fill="#c084fc" fill-opacity="0.06" stroke="#c084fc" stroke-opacity="0.30"/>
      <circle cx="990" cy="152" r="15" fill="#c084fc" fill-opacity="0.16" stroke="#c084fc" stroke-opacity="0.55"/>
      <text x="990" y="157" fill="#d8b4fe" font-size="14" font-weight="700" text-anchor="middle">5</text>
      <text x="1016" y="157" fill="#e6edf3" font-size="17" font-weight="600">Decide</text>
      <text x="984" y="196" fill="#9aa7b8" font-size="13.5">One row per tool</text>
      <text x="984" y="216" fill="#9aa7b8" font-size="13.5">in the table, and</text>
      <text x="984" y="236" fill="#9aa7b8" font-size="13.5">the decision reads</text>
      <text x="984" y="256" fill="#9aa7b8" font-size="13.5">by itself — with</text>
      <text x="984" y="276" fill="#9aa7b8" font-size="13.5">its reasons.</text>
      <text x="984" y="310" fill="#d8b4fe" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">etude/comparatif.md</text>
    </g>

    <!-- arrows between steps -->
    <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M246 226h22"/>
      <path d="M474 226h23"/>
      <path d="M703 226h22"/>
      <path d="M931 226h23"/>
    </g>

    <!-- feedback loop 5 -> 2 -->
    <path d="M1057 340C1057 398 800 400 430 400L382 400A11 11 0 0 1 371 389L371 346" fill="none" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" marker-end="url(#arrowLoop)"/>
    <text x="714" y="428" fill="#a78bfa" font-size="13" text-anchor="middle">one more tool = one more module — the loop replays identically</text>

    <!-- ============ DELIVERABLES ============ -->
    <line x1="48" y1="462" x2="1152" y2="462" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="48" y="496" fill="#5eead4" font-size="12.5" font-weight="600" letter-spacing="2.4">WHAT IT PRODUCES</text>

    <g>
      <rect x="48" y="514" width="352" height="86" rx="12" fill="#5eead4" fill-opacity="0.05" stroke="#5eead4" stroke-opacity="0.25"/>
      <text x="72" y="548" fill="#e6edf3" font-size="15.5" font-weight="600">A comparison table</text>
      <text x="72" y="574" fill="#8b949e" font-size="13">without licence · with licence · what is missing</text>
    </g>
    <g>
      <rect x="424" y="514" width="352" height="86" rx="12" fill="#5eead4" fill-opacity="0.05" stroke="#5eead4" stroke-opacity="0.25"/>
      <text x="448" y="548" fill="#e6edf3" font-size="15.5" font-weight="600">A target application</text>
      <text x="448" y="574" fill="#8b949e" font-size="13">22 classes, no dependency, replayable</text>
    </g>
    <g>
      <rect x="800" y="514" width="352" height="86" rx="12" fill="#5eead4" fill-opacity="0.05" stroke="#5eead4" stroke-opacity="0.25"/>
      <text x="824" y="548" fill="#e6edf3" font-size="15.5" font-weight="600">The generated reports</text>
      <text x="824" y="574" fill="#8b949e" font-size="13">the real outputs, with their reading grid</text>
    </g>
  </g>
</svg>
