function contextBlock(){
  const c = R.context;
  if (!c) return "";
  const row = (k, v) => v ? '<tr><td class="ck">'+esc(k)+'</td><td class="cv">'+v+'</td></tr>' : "";
  const t = c.outils || {};
  return '<h2>Contexte de cette exécution</h2><table class="ctx">' +
    row("Programme lancé", '<code>'+esc(c.commande||"")+'</code>') +
    row("Méthode racine inspectée", c.methodeRacine ? '<code>'+esc(c.methodeRacine)+'</code>' : "") +
    row("Filtre de profil", c.filtreClasses ? '<code>'+esc(c.filtreClasses)+'</code>' : "") +
    row("Début", esc(c.debut)) +
    row("Fin", esc(c.fin) + (c.dureeSecondes ? ' <span style="opacity:.7">— '+c.dureeSecondes+' s</span>' : "")) +
    row("Statut", esc(c.statut)) +
    row("Machine", esc(c.machine) + (c.utilisateur ? ' <span style="opacity:.7">('+esc(c.utilisateur)+')</span>' : "")) +
    row("Système", esc(c.systeme) + (c.processeurs ? ' — '+c.processeurs+' cœurs' : "")) +
    row("Java", '<code>'+esc(c.java||"")+'</code>') +
    row("Répertoire de travail", '<code>'+esc(c.repertoireTravail||"")+'</code>') +
    row("Classes analysées", '<code>'+esc(c.repertoireClasses||"")+'</code>') +
    row("Sources", c.repertoiresSources ? '<code>'+esc(c.repertoiresSources)+'</code>' : "") +
    row("Outils", Object.entries(t).map(([k,v]) => esc(k)+" "+esc(v)).join(" · ")) +
    '</table>';
}
function helpContent(){
  return '<div class="home" style="padding:0;max-width:none">' +
    '<h2>Ce que cette page montre</h2>' +
    '<p>Une exécution réelle du programme : par où le code est passé, quel appel en a ' +
    'déclenché un autre, et avec quelles valeurs.</p>' +
    schema() +
    '<ol>' +
      '<li><b>À gauche, choisir un onglet</b>, puis cliquer sur une ligne.<br>' +
        '<b>Code exécuté</b> — tout ce qui a tourné, du plus coûteux au moins coûteux. C\'est l\'entrée normale.<br>' +
        '<b>Arbre d\'appel</b> — la hiérarchie des appels, avec <b>les exécutions comme racines</b> : ' +
        'une exécution est le contexte d\'appel le plus haut qui soit.<br>' +
        '<b>Packages</b> — le classement par fichier, quand on cherche une classe précise.<br>' +
        '<span style="opacity:.85">Le champ <i>Filtrer…</i> réduit la liste à mesure qu\'on tape.</span></li>' +
      '<li><b>Au centre, le code s\'affiche</b>, colorié ligne par ligne : ' +
        '<span style="background:var(--full);padding:1px 5px;border-radius:3px">exécutée</span> · ' +
        '<span style="background:var(--part);padding:1px 5px;border-radius:3px">partiellement</span> · ' +
        '<span style="background:var(--miss);padding:1px 5px;border-radius:3px">jamais exécutée</span>. ' +
        'À droite de chaque ligne, les appels qui en partent et leur durée — cliquables pour ' +
        'sauter à la méthode appelée.</li>' +
      '<li><b>Le bandeau du bas montre les valeurs de la méthode sélectionnée.</b> Chaque méthode ' +
        'a les siennes ; changer de méthode change le contexte, et donc les valeurs.</li>' +
      '<li><b>Resserré sur la méthode</b> (bouton en haut à droite, actif par défaut) : le centre ' +
        'n\'affiche que la méthode choisie, sans ses lignes jamais exécutées, et la liste écarte ' +
        'les classes mortes. C\'est ce qui garantit qu\'on regarde <b>une seule méthode à la fois</b>, ' +
        'même dans une classe qui en contient plusieurs.</li>' +
      '<li><b>Restreindre le périmètre</b> : sur une méthode ouverte, <i>« ne montrer que ce qui ' +
        'tourne sous cette méthode »</i> ne garde dans la liste que le code appelé sous elle.</li>' +
      '<li><b>Le contexte d\'appel</b>, sous le fil d\'Ariane : par quels chemins la méthode a été ' +
        'atteinte, et dans quelle proportion.</li>' +
    '</ol>' +
    '<h2>Comment ce rapport est produit</h2>' +
    '<p>Trois outils libres et gratuits ont observé la même exécution :</p>' +
    '<ul class="tools">' +
      '<li><b>JaCoCo</b> — les lignes exécutées, et la liste exhaustive du code qui a tourné.</li>' +
      '<li><b>async-profiler</b> — les mesures de temps et l\'arbre d\'appel.</li>' +
      '<li><b>Arthas</b> — les valeurs des paramètres et les annotations d\'appel sur les lignes.</li>' +
    '</ul>' +
    '<p>Aucun ne fait les trois : c\'est leur combinaison qui répond. Tous fonctionnent sans ' +
    'connexion Internet et sans licence.</p>' +
    linksBlock() +
    '</div>';
}

function drawHome(){
  document.getElementById("crumb").innerHTML =
    '<b>' + esc(R.nom) + '</b> <span class="pill">vue d\'ensemble</span>' +
    (D.runs.length > 1 ? ' <span class="pill">' + D.runs.length + ' exécutions dans ce rapport</span>' : '');
  document.getElementById("values").innerHTML = "";
  const hot = executedMethods().slice(0, 6);
  const observees = Object.keys(R.values || {});
  document.getElementById("code").innerHTML =
   '<div class="home">' +
   '<div class="cards">' +
     '<div class="card c1"><div class="k">'+AGG.pct.toFixed(1)+' %</div><div class="l">du code exécuté</div></div>'+
     '<div class="card c2"><div class="k">'+AGG.methods+'</div><div class="l">méthodes ayant tourné</div></div>'+
     '<div class="card c3"><div class="k">'+AGG.samples.toLocaleString("fr")+'</div><div class="l">mesures de temps prises</div></div>'+
     '<div class="card c4"><div class="k">'+Object.values(R.values).reduce((a,v)=>a+v.length,0)+'</div><div class="l">appels avec leurs valeurs</div></div>'+
   '</div>'+
   '<div class="bar"><span style="width:'+AGG.pct.toFixed(1)+'%"></span></div>'+
   contextBlock()+
   (AGG.dead.length ? '<h2>Jamais exécuté</h2><p>'+AGG.dead.map(d=>'<span class="chip dead">'+esc(d)+'</span>').join("")+'</p>' : '')+
   '<h2>Les plus coûteuses</h2><p>'+hot.map(h=>
      '<span class="chip hot" data-f="'+esc(h.frame)+'">'+esc(h.cls.split("/").pop()+"."+h.name)+'</span>').join("")+'</p>'+
   (observees.length
      ? '<h2>Valeurs capturées</h2><p>'+observees.map(f =>
          '<span class="chip val" data-f="'+esc(f)+'">'+esc(f.split("/").pop())+' — '+R.values[f].length+' appels</span>').join("")+'</p>'
      : '')+
   reserveBlock()+
   '<p style="margin-top:20px"><a href="#" id="openhelp">→ Comment se servir de cette page</a></p>'+
   '</div>';
  // Les puces sont cliquables : la vue d'ensemble sert de point de départ, pas de vitrine.
  document.querySelectorAll(".chip[data-f]").forEach(c => {
    c.style.cursor = "pointer";
    c.onclick = () => { const t = frameInfo(c.dataset.f); if (t) select(t, null); };
  });
  const oh = document.getElementById("openhelp");
  if (oh) oh.onclick = e => { e.preventDefault(); openHelp(); };
}

function openHelp(){
  document.getElementById("helpbody").innerHTML = helpContent();
  document.getElementById("help").hidden = false;
}

/* ------------------------------------------------------------ interactions */
document.getElementById("home").onclick = e => { e.preventDefault(); goHome(); };
document.getElementById("helpbtn").onclick = openHelp;
document.getElementById("helpclose").onclick = () => document.getElementById("help").hidden = true;
document.getElementById("help").onclick = e => {
  if (e.target.id === "help") document.getElementById("help").hidden = true;
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("help").hidden = true;
});
document.getElementById("tab-exec").onclick = renderExec;
document.getElementById("tab-tree").onclick = renderTree;
document.getElementById("tab-cls").onclick  = renderClasses;
function reselect(){
  // Re-rendre la liste efface la surbrillance : on la repose sur la méthode courante,
  // sinon basculer un réglage donne l'impression d'avoir perdu le contexte.
  if (!selected) return;
  const target = [...document.querySelectorAll("#list .node")]
    .find(n => (n.title || "") === dot(selected.frame || "") ||
               n.textContent.includes(selected.cls.split("/").pop() + "." + (selected.name || "")));
  if (target) target.classList.add("sel");
}
document.getElementById("clean").onclick = e => {
  const b = e.currentTarget;
  clean = !clean;
  b.setAttribute("aria-pressed", String(clean));
  b.lastChild.textContent = clean ? " Resserré sur la méthode" : " Fichier entier";
  b.title = clean ? "Resserré : seule la méthode sélectionnée est affichée, sans ses lignes mortes"
                  : "Fichier entier, y compris le code jamais exécuté";
  mode === "cls" ? renderClasses() : mode === "tree" ? renderTree() : renderExec();
  reselect();
  draw();
};
document.getElementById("search").oninput = e => {
  filter = e.target.value.trim().toLowerCase();
  mode === "cls" ? renderClasses() : mode === "tree" ? renderTree() : renderExec();
};
/* ------------------------------------------------------- panneaux ajustables */
(function splitters(){
  const root = document.documentElement;
  const nav = document.getElementById("nav");
  const vs = document.getElementById("vsplit"), hs = document.getElementById("hsplit");
  let navPrev = 330, valPrev = 190;

  const startDrag = (el, onMove) => {
    el.addEventListener("mousedown", e => {
      e.preventDefault(); el.classList.add("dragging");
      const move = ev => onMove(ev);
      const up = () => { el.classList.remove("dragging");
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up); };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
  };
  startDrag(vs, ev => {
    const w = Math.max(0, Math.min(ev.clientX, window.innerWidth - 200));
    root.style.setProperty("--navw", w + "px");
    if (w > 40) navPrev = w;
  });
  startDrag(hs, ev => {
    const box = document.getElementById("values").getBoundingClientRect();
    const h = Math.max(0, Math.min(box.bottom - ev.clientY, window.innerHeight - 220));
    root.style.setProperty("--valh", h + "px");
    if (h > 30) valPrev = h;
  });
  const toggleNav = () => {
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--navw")) || 330;
    const open = cur <= 40;
    root.style.setProperty("--navw", open ? navPrev + "px" : "0px");
    document.getElementById("vtoggle").textContent = open ? "‹" : "›";
  };
  const toggleValues = () => {
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--valh")) || 190;
    const open = cur <= 30;
    root.style.setProperty("--valh", open ? valPrev + "px" : "0px");
    document.getElementById("htoggle").textContent = open ? "⌄" : "⌃";
  };
  vs.ondblclick = toggleNav;
  hs.ondblclick = toggleValues;
  document.getElementById("vtoggle").onclick = e => { e.stopPropagation(); toggleNav(); };
  document.getElementById("htoggle").onclick = e => { e.stopPropagation(); toggleValues(); };
})();

renderExec();
drawHome();
</script>
