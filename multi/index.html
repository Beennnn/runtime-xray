/**
 * Flame drawn right here, from the same measurements as the tree. Two reasons not to depend
 * on a file produced alongside: the report stays a single page, and the link cannot be
 * broken. Every bar leads to its method.
 */
function flameBlock(){
  // The graph follows the pruning: showing here a branch just cut in the tree would make
  // the same page say two different things.
  const root = prunedTree(R);
  if (!root || !R.calltree || !R.calltree.total) return "";
  const H = 18, MAXD = 12;
  const bars = [];
  let maxDepth = 0;

  const measuredTotal = R.calltree.total;
  (function layout(node, depth, x){
    for (const kid of node.children){
      const w = kid.total / measuredTotal;
      if (w * 100 < 0.4 || depth > MAXD){ x += w; continue; }   // too thin to be read
      // SELF time: what the method keeps for itself, once what it delegated is removed. It
      // is the only quantity that designates a place to act — a wide bar one of whose
      // children is just as wide is only passing the baton.
      const delegated = kid.children.reduce((sum, c) => sum + c.total, 0);
      bars.push({x, w, depth, name: kid.name, known: !!frameInfo(kid.name), total: kid.total,
                 selfShare: Math.max(0, kid.total - delegated) / measuredTotal});
      maxDepth = Math.max(maxDepth, depth);
      layout(kid, depth + 1, x);
      x += w;
    }
  })(root, 0, 0);
  if (!bars.length) return "";

  const body = bars.map(b => {
    const label = frameLabel(b.name).split(".").slice(-2).join(".");
    return '<div class="fl' + (b.known ? " known" : "") + '"' +
      (b.known ? ' data-f="' + esc(b.name) + '"' : '') +
      ' style="left:' + (b.x * 100).toFixed(4) + '%;width:' + (b.w * 100).toFixed(4) + '%;' +
      'top:' + (b.depth * H) + 'px;background:' + flameColour(b.selfShare, b.known) + '"' +
      ' title="' + esc(dot(b.name)) + '  —  ' + formatWeight(b.total, measuredTotal) +
      ' total, of which ' + (b.selfShare * 100).toFixed(1) + '% self">' +
      '<span>' + esc(label) + '</span></div>';
  }).join("");

  return '<h2>Where the time went</h2>' +
    '<p style="margin-bottom:8px">Each bar is a method; its <b>width</b> is the share of time spent beneath it, its <b>colour</b> the share it keeps <b>for itself</b>, once what it delegated is taken out. A wide, pale bar only passes the baton on; <span class="flamekey"></span> a coloured bar is a place where time is really consumed. Clicking enters the method.</p>' +
    '<div class="flame" title="Each bar is a method, stacked under its caller. Width: the share of time spent beneath it. Colour: the share it keeps for itself. Clicking a bar opens the method." '
    + 'style="height:' + ((maxDepth + 1) * H) + 'px">' + body + '</div>';
}

/**
 * Fits the time graph's labels to their bar's real width.
 *
 * <p>A narrow bar carrying "RoutePlanne" or "Breaks.t" designates nothing: the name cut in
 * the middle costs room while teaching nothing. So the full name is tried, then the method
 * name alone, then nothing at all — hovering gives the whole label in every case. The
 * measurement is done after rendering, because a bar's width is a percentage: it depends
 * on the window, not on the data.
 */
function fitFlameLabels(){
  document.querySelectorAll(".flame .fl").forEach(el => {
    const span = el.querySelector("span");
    if (!span) return;
    const full = span.dataset.full || span.textContent;
    span.dataset.full = full;
    for (const attempt of [full, full.split(".").pop(), ""]) {
      span.textContent = attempt;
      if (span.scrollWidth <= span.clientWidth) break;
    }
  });
}
// The bars' width follows the window: what fitted at 1400 px no longer fits at 900.
addEventListener("resize", () => {
  clearTimeout(fitFlameLabels.t);
  fitFlameLabels.t = setTimeout(fitFlameLabels, 120);
});

/**
 * The colour says SELF time, not depth.
 *
 * <p>Colouring by depth said nothing: the vertical position already gives it, and the
 * result was six shades of the same yellow, decorative. Self time, for its part, answers the
 * question one asks in front of a flame graph — <i>where is the time actually
 * consumed?</i> — and it tells a method that works from a method that delegates.
 *
 * <p>The scale is deliberately compressed: beyond a few per cent of self time, one is
 * already in what counts, and a linear gradient would crush all the rest into the same
 * pale hue.
 */
function flameColour(selfShare, known){
  if (!known) return "var(--border)";
  const t = Math.min(1, Math.sqrt(selfShare / 0.25));      // 25 % en propre = saturation
  const palette = ["#dbe7f3", "#f3e2b4", "#f5cf7a", "#ef9f45", "#e2662c", "#c8341b"];
  return palette[Math.min(palette.length - 1, Math.round(t * (palette.length - 1)))];
}

/* -------------------------------------------------------------- sections repliables
 * The overview reads from top to bottom, and only one of its sections can be outsized:
 * "Never executed" lists the analysed classes that ran nothing, and on a real project there
 * are hundreds of them. It then pushed off the screen everything that follows it — the
 * costliest methods, the captured values, the caveat — that is to say precisely what one
 * came for. Yet that list is consulted once: it does not have to cost the whole page.
 *
 *
 * Folded, the section keeps its title and its count, which suffices to decide whether to
 * open it. The threshold is a choice: beyond PLI_AUTO entries the section arrives folded,
 * below it stays open — a short list is read at a glance, and folding it would lose a click
 * for nothing. What the user chose, for its part, is kept in the browser and always wins
 * over that default: it is a reading setting, not a datum.
 */
const FOLD_KEY = "runtime-xray.plis";
const FOLD_AUTO = 40;
let folds = {};
try { folds = JSON.parse(localStorage.getItem(FOLD_KEY) || "{}"); } catch(e){ folds = {}; }
function savePlis(){
  try { localStorage.setItem(FOLD_KEY, JSON.stringify(folds)); } catch(e){}
}
/** Open? The kept choice if there is one, otherwise the threshold. */
function foldOpen(id, size){
  return typeof folds[id] === "boolean" ? folds[id] : size <= FOLD_AUTO;
}
/**
 * The markup of a foldable section.
 *
 * @param id     stable identifier — it is what finds the kept choice again
 * @param titre  the title, already escaped
 * @param info   the title's tooltip, already escaped
 * @param compte what stays readable once folded ("422 classes")
 * @param corps  the content, already escaped
 * @param taille the number of entries, which decides the default folding
 */
function foldableSection(id, heading, info, tally, bodyEl, size){
  const isOpen = foldOpen(id, size);
  return '<section class="pliable">'
    + '<h2 title="' + info + '">'
    + '<button type="button" class="plibtn" data-pli="' + id + '"'
    + ' aria-expanded="' + isOpen + '" aria-controls="pli-' + id + '">'
    + '<span class="pliic" aria-hidden="true">&#9656;</span>'
    + '<span>' + heading + '</span>'
    + '<span class="plicnt">' + tally + '</span>'
    + '</button></h2>'
    + '<p class="plicorps" id="pli-' + id + '"' + (isOpen ? '' : ' hidden') + '>'
    + bodyEl + '</p></section>';
}
/** Wires the foldable titles of the fragment just written. */
function wireFolds(){
  document.querySelectorAll(".plibtn").forEach(b => {
    b.onclick = () => {
      const bodyEl = document.getElementById(b.getAttribute("aria-controls"));
      const isOpen = b.getAttribute("aria-expanded") !== "true";
      b.setAttribute("aria-expanded", String(isOpen));
      bodyEl.hidden = !isOpen;
      folds[b.dataset.pli] = isOpen;
      savePlis();
    };
  });
}

/* ====================================================================================
 * SOURCE ANALYSIS, UNFOLDED
 *
 * Three different things can be missing, and an empty report gives them all the same face:
 * the bytecode (the wrong application was measured), the source (the right one was measured,
 * we do not know where its code is), or the class itself (it never ran). They are fixed in
 * three opposite ways, and one cannot choose without knowing which one one is holding.
 *
 *
 * Hence this explorer: the line actually run, the roots actually opened, then the tree of
 * EVERYTHING seen — measured, compiled, written — each class carrying the colour of what it
 * is missing. The search answers the question one really asks in front of a disappointing
 * report: "and that class there, did you find it, yes or no, and where?"
 * ==================================================================================== */

/**
 * The proposed roots, with what justifies them.
 *
 * <p>A diagnostic that stops at "sources are missing" leaves the reader in front of the same
 * question as before. The tool looked for the matching files around the project and counted
 * what each root would resolve: the line is copied, and the count says whether to believe it.
 * A root that resolves 27 classes out of 27 is not a guess; one that resolves 3 out of 447
 * designates another module, and reads as such.
 */
function sourceLeads(){
  const leads = ((D.diagnostic || {}).rapprochement || {}).pistes;
  if (!leads) return "";
  if (!leads.length){
    return '<h4>Suggested roots</h4><p class="cause">The tool looked for the files '
         + '<code>.java</code> matching ones around the project and the analysed bytecode: '
         + '<b>none of them holds the expected packages</b>. The sources are not on this machine, or outside the directories explored — in which case the right one must be named by hand.</p>';
  }
  return '<h4>Suggested roots</h4>'
    + '<p class="srcline">Looked for around the analysed bytecode and the launch directory, '
    + 'then kept on evidence: only a file whose <b>declared package</b> produces exactly '
    + 'one missing key counts.</p>'
    + '<div class="pistes">' + leads.map(p => {
        const pctPart = p.surTotal ? Math.round(100 * p.resout / p.surTotal) : 0;
        const tone = pctPart >= 80 ? "ok" : pctPart >= 25 ? "moyen" : "faible";
        return '<div class="piste">'
          + '<div class="tete"><span class="score ' + tone + '">' + p.resout + ' / '
          + p.surTotal + '</span> <span class="quoi">class(es) without source that this root '
          + 'would resolve</span></div>'
          + '<pre class="remede">SOURCE_DIRS="' + esc(p.racine) + '"</pre>'
          + (p.exemples && p.exemples.length
              ? '<div class="ex">for example ' + p.exemples.map(e =>
                  '<code>' + esc(e) + '</code>').join(", ") + '</div>' : '')
          + '</div>';
      }).join("") + '</div>'
    + '<p class="srcline">Several roots are separated by <code>:</code> — a project with '
    + 'several modules often calls for two or three.</p>';
}

/**
 * The diagnostic's "sources" panel.
 *
 * <p>The file nests deliberately — {@code sources}, {@code bytecode},
 * {@code rapprochement} are three distinct inventories. Reading them through a single named
 * accessor avoids confusing them: looking for them one notch too high gave "0 roots", hence
 * a diagnostic that blamed the configuration when everything had been found.
 */
function sourceDiag(){ return (D.diagnostic || {}).sources || {}; }

/** A class's four states, and what each means for whoever has to fix things. */
const SOURCE_STATES = {
  ok:      { lib: "measured, code shown",   aide: "The class ran and its source file was found: the code view shows it annotated." },
  sansSrc: { lib: "measured, code missing",  aide: "The class ran, but no source file matches it. That is what gives “Source unavailable” — a source root is missing." },
  inerte:  { lib: "compiled, never measured",aide: "The class is in the analysed bytecode but none of its instructions were executed, or a filter left it out." },
  orphelin:{ lib: "source only",            aide: "A source file exists, with no matching class in the bytecode nor in the measurement: code not compiled, or outside the analysed scope." }
};

/**
 * Everything the tool saw, gathered by class name.
 *
 * <p>Three inventories overlap here — the classes measured by JaCoCo, the classes present
 * in the bytecode, the indexed source files. It is their intersection, and above all their
 * differences, that explain an incomplete report.
 */
let SOURCES_MODEL = null;
function sourceModel(){
  if (SOURCES_MODEL) return SOURCES_MODEL;
  const d = D.diagnostic || {};
  const byName = sourceDiag().parNom || {};
  const nodesByName = {};                       // "com/example/app/Application" -> what we know of it
  const nodeFor = n => nodesByName[n] || (nodesByName[n] = { nom: n, mesuree: false, source: null,
                                                  chemin: null, racines: [] });

  //    1. what the measurement saw — all runs taken together: a class absent from one run
  //    but present in another remains a measured class.
  D.runs.forEach(run => Object.values(run.packages || {}).forEach(classes =>
    (classes || []).forEach(c => { const e = nodeFor(c.name); e.mesuree = true; e.attendu = c.source; })));

  // 2. what the bytecode contains, and in which root
  (d.bytecode || []).forEach(r => (r.classes || []).forEach(n => {
    nodeFor(n).racines.push(r.chemin);
  }));

  // 3. what the sources supplied. The key "package/File.java" designates the file, not the
  //    class: it is attached to the class name it most probably carries.
  Object.values(byName).forEach(places => places.forEach(o => {
    const blockName = o.cle.replace(/\.java$/, "");
    const e = nodeFor(blockName);
    e.source = o.cle; e.chemin = o.chemin;
  }));

  // A measured class whose source file was found under ANOTHER key (inner class, file
  // carrying several types): attachment is done through the expected file.
  const pathByKey = {};
  Object.values(byName).forEach(l => l.forEach(o => { pathByKey[o.cle] = o.chemin; }));
  Object.values(nodesByName).forEach(e => {
    if (!e.chemin && e.attendu && pathByKey[e.attendu]){
      e.source = e.attendu; e.chemin = pathByKey[e.attendu];
    }
    e.etat = e.mesuree ? (e.chemin ? "ok" : "sansSrc")
                       : (e.racines.length ? "inerte" : "orphelin");
  });
  SOURCES_MODEL = { noeuds: nodesByName, liste: Object.values(nodesByName).sort((a,b)=>a.nom<b.nom?-1:1) };
  return SOURCES_MODEL;
}

/** The count by state, the one read before opening anything at all. */
function sourceCounts(){
  const c = { ok:0, sansSrc:0, inerte:0, orphelin:0 };
  sourceModel().liste.forEach(e => c[e.etat]++);
  return c;
}

/**
 * The tree package by package, each class coloured by what it is missing.
 *
 * <p>A package carries the colour of its worst case: that is what allows going straight down
 * to the problem in a tree of several hundred classes, without unfolding everything.
 * Entirely healthy packages stay green and folded.
 */
function sourceTree(filterText){
  const f = (filterText || "").toLowerCase();
  const byPackage = {};
  sourceModel().liste.forEach(e => {
    if (f && e.nom.toLowerCase().indexOf(f) < 0) return;
    const i = e.nom.lastIndexOf("/");
    const pkg = i < 0 ? "(default package)" : e.nom.slice(0, i);
    (byPackage[pkg] = byPackage[pkg] || []).push(e);
  });
  const names = Object.keys(byPackage).sort();
  if (!names.length) return '<p class="cause">No class matches.</p>';

  const worst = ofPackage => ofPackage.some(e => e.etat === "sansSrc") ? "sansSrc"
                      : ofPackage.some(e => e.etat === "orphelin") ? "orphelin"
                      : ofPackage.some(e => e.etat === "inerte") ? "inerte" : "ok";
  return '<div class="arbsrc">' + names.map(pkg => {
    const ofPackage = byPackage[pkg].sort((a,b)=>a.nom<b.nom?-1:1);
    const bad = ofPackage.filter(e => e.etat === "sansSrc").length;
    // Unfolded outright when the search is active, or when there is something to see.
    const isOpen = !!f || bad > 0;
    return '<div class="pkg">'
      + '<button type="button" class="pkgt e-' + worst(ofPackage) + '" data-pkg="' + esc(pkg) + '"'
      + ' aria-expanded="' + isOpen + '">'
      + '<span class="ic" aria-hidden="true">' + (isOpen ? "▾" : "▸") + '</span>'
      + '<span class="nm">' + esc(dot(pkg)) + '</span>'
      + '<span class="cnt">' + ofPackage.length + '</span>'
      + (bad ? '<span class="cnt ko">' + bad + ' without source</span>' : '')
      + '</button>'
      + '<div class="cls"' + (isOpen ? '' : ' hidden') + '>'
      + ofPackage.map(e => sourceClassLine(e)).join("")
      + '</div></div>';
  }).join("") + '</div>';
}

function sourceClassLine(e){
  const simple = e.nom.split("/").pop();
  const sourceState = SOURCE_STATES[e.etat];
  return '<div class="cl e-' + e.etat + '" title="' + esc(sourceState.aide) + '">'
    + '<span class="pt" aria-hidden="true"></span>'
    + '<span class="nm">' + esc(simple) + '</span>'
    + '<span class="et">' + esc(sourceState.lib) + '</span>'
    + (e.chemin ? '<span class="or" title="Source file read by the tool">'
                  + esc(e.chemin) + '</span>' : '')
    + (!e.chemin && e.racines.length
        ? '<span class="or" title="Bytecode root where the class was found">'
          + esc(e.racines[0]) + '</span>' : '')
    + '</div>';
}

/** A search's verdict: found or not, and where — the question one really asks. */
function searchVerdict(q){
  const f = (q || "").trim().toLowerCase();
  if (!f) return "";
  const hits = sourceModel().liste.filter(e =>
    e.nom.toLowerCase().indexOf(f) >= 0 || e.nom.split("/").pop().toLowerCase() === f);
  if (!hits.length){
    return '<p class="verdict ko"><b>“' + esc(q) +'” was seen nowhere</b> — neither in the '
         + 'measurement, nor in the analysed bytecode, nor in the indexed sources. The class '
         + 'is outside the scope: it was not loaded, or the analysed classpath does not '
         + 'contain it.</p>';
  }
  const e = hits[0];
  const sourceState = SOURCE_STATES[e.etat];
  return '<p class="verdict ' + (e.etat === "ok" ? "ok" : e.etat === "sansSrc" ? "ko" : "") + '">'
    + '<b>' + hits.length + ' match(es)</b> — ' + esc(dot(e.nom)) + ': '
    + esc(sourceState.lib) + '.'
    + (e.chemin ? ' Source read here: <code>' + esc(e.chemin) + '</code>.' : '')
    + (e.racines.length ? ' Bytecode found here: <code>' + esc(e.racines[0]) + '</code>.' : '')
    + '</p>';
}

/**
 * What each setting REALLY commands — and the confusions that cost a measurement.
 *
 * <p>Four options restrict something, and they do not restrict the same thing: one the
 * capture of values, another the measurement of time, the third the instrumentation of
 * coverage, the fourth the display of the code. In front of an incomplete report, one almost
 * always suspects the wrong one — one widens a filter that had nothing to do with it,
 * re-runs, and gets the same report.
 *
 * <p>This table is therefore written the other way round from the documentation: it starts
 * from the symptom. The rows that carry an alert are those THIS run's configuration makes
 * suspect, not generalities.
 */
function configTraps(){
  const launch = (D.diagnostic || {}).lancement || {};
  const ctx = R.context || {};
  const rootFrame = launch.methodeRacine || ctx.methodeRacine || "";
  const roots = (sourceDiag().racines || []).length;
  const without = ((D.diagnostic || {}).rapprochement || {}).fichiersSansSource || 0;

  const settingRows = [
    { opt: "--sources / SOURCE_DIRS",
      quoi: "the display of the annotated code, and nothing else",
      pas: "has no effect on the measurement: coverage, time and values are identical without it",
      alerte: (!roots || without)
        ? "It is the only setting that explains “Source unavailable”. The coverage stays "
          + "correct: it is the .java files that are missing, not the measurement."
        : null },
    { opt: "--root / ROOT_METHOD",
      quoi: "the capture of argument values (Arthas), and the default time filter",
      pas: "restricts NEITHER the coverage, NOR the displayed classes, NOR the sources",
      alerte: (rootFrame && rootFrame.indexOf("::") < 0)
        ? "“" + esc(rootFrame) + "” does not name a method: the expected format is "
          + "package.Class::method. Without “::”, no value is captured."
        : null },
    { opt: "--filter / CLASS_FILTER",
      quoi: "the classes the profiler samples — the TIME measurement",
      pas: "changes neither the coverage nor the displayed code",
      alerte: null },
    { opt: "--cover / COVER_INCLUDES",
      quoi: "the classes JaCoCo instruments — COVERAGE",
      pas: "it is this one, not --filter, that empties a coverage report when it is too narrow",
      alerte: null },
    { opt: "--classes / CLASSES_DIR",
      quoi: "the analysed bytecode: where the report's classes come from",
      pas: "pointed at a dependency jar, it drowns the project's code in thousands of classes",
      alerte: null },
    { opt: "--hide / HIDDEN_PACKAGES",
      quoi: "what is folded AT MEASUREMENT TIME — the time is carried to the caller, not lost",
      pas: "erases nothing from disk: the raw tool reports keep everything",
      alerte: null }
  ];

  return '<h4>What each setting actually controls</h4>'
    + '<p class="srcline">Four options each restrict something <b>different</b>. Widening the wrong one gives back exactly the same report.</p>'
    + '<div class="pieges">' + settingRows.map(l =>
        '<div class="piege' + (l.alerte ? ' alerte' : '') + '">'
        + '<code>' + esc(l.opt) + '</code>'
        + '<span class="agit">acts on ' + l.quoi + '</span>'
        + '<span class="nagit">' + l.pas + '</span>'
        + (l.alerte ? '<span class="ko avert">⚠ ' + l.alerte + '</span>' : '')
        + '</div>').join("") + '</div>';
}

/**
 * What the source analysis did, said in the overview.
 *
 * <p>Displaying the annotated code is the part of the report that fails most silently: it
 * depends on a path given by hand, which is checked nowhere, and its failure shows only by
 * opening a class at random. The summary is therefore put where one looks first, and it is
 * written to be read even when all is well — "447 out of 447" is information, not noise.
 *
 */
function sourcesBlock(){
  const d = D.diagnostic;
  if (!d) return "";
  const r = d.rapprochement || {}, src = sourceDiag(), roots = src.racines || [];
  const total = r.fichiersMesures || 0, withSource = r.fichiersAvecSource || 0;
  const without = r.fichiersSansSource || 0;
  const pct = total ? (100 * withSource / total) : 0;
  const c = sourceCounts();
  const launch = d.lancement || {};

  let bodyEl = '<p class="srcline">' +
    (total
      ? '<b class="' + (without ? 'ko' : 'ok') + '">' + withSource + ' of ' + total + '</b> measured '
        + 'class(es) have their source code in this page (' + pct.toFixed(0) + '%).'
      : 'No measured class: there is nothing to match.') + '</p>';

  // 1. the line actually run — the one believed to have been launched is not always that
  //    one. On reassembly there is no launch: the run's context, for its part, kept it, and
  //    it is the same one.
  const commandLine = launch.commande || (R.context || {}).commande || "";
  if (commandLine){
    bodyEl += '<h4>Line executed</h4><pre class="remede">' + esc(commandLine) + '</pre>';
  }

  // 2. the roots actually opened, bytecode then sources
  bodyEl += '<h4>Analysed bytecode</h4>';
  const bc = d.bytecode || [];
  bodyEl += bc.length
    ? '<ul class="racines">' + bc.map(x =>
        '<li><code>' + esc(x.chemin) + '</code> <span class="abs">(' + esc(x.type) + ')</span>'
        + '<br><span class="' + (x.existe && x.nombre ? 'ok' : 'ko') + '">'
        + (x.existe ? '✓ ' + x.nombre + ' class(es)' + (x.tronque ? ' (list truncated)' : '')
                    : '✗ ' + esc(x.motif || 'not found')) + '</span></li>').join("") + '</ul>'
    : '<p class="cause">The analysed bytecode is not known to this report — it is when the measurement is launched by the tool, or when <code>--classes</code> is given when it is reassembled.</p>';

  bodyEl += '<h4>Indexed sources</h4>';
  if (roots.length){
    bodyEl += '<ul class="racines">' + roots.map(x =>
      '<li><code>' + esc(x.demandee) + '</code>'
      + (x.absolue && x.absolue !== x.demandee
          ? ' <span class="abs">→ ' + esc(x.absolue) + '</span>' : '')
      + '<br><span class="' + (x.existe ? 'ok' : 'ko') + '">'
      + (x.existe ? '✓ ' + (x.fichiers || 0) + ' .java file(s)'
                  : '✗ ' + esc(x.motif || 'not found')) + '</span></li>').join("") + '</ul>';
    bodyEl += '<p class="srcline">' + (src.fichiers || 0) + ' file(s) <code>.java</code> '
          + 'indexed in total'
          + (src.tronque ? ' <span class="ko">— walk truncated, the index is incomplete</span>' : '')
          + '. The level of the root matters little: the tool reads the package each file '
          + 'declares, not its path.</p>';
  } else {
    bodyEl += '<p class="cause">No source directory was given to the tool: the measurement does not need one, the display of annotated code does. Set <code>SOURCE_DIRS</code> in the configuration, or '
          + '<code>--sources</code> on the command line.</p>';
  }
  if (r.conclusion && roots.length) bodyEl += '<p class="cause">' + esc(r.conclusion) + '</p>';
  bodyEl += sourceLeads();

  // 3. what each setting commands — written from the symptom, not from the docs
  bodyEl += configTraps();

  // 4. the tree and its search
  bodyEl += '<h4>Where each class is</h4>'
        // Files read with no measured class are not in the tree: the page carries only what
        // it can show. Their number, for its part, says whether there is matter to search.
        + (r.sourcesSansClasse
            ? '<p class="srcline">' + r.sourcesSansClasse + ' source file(s) read match no '
              + 'measured class — code not compiled, out of scope, or a root that is too '
              + 'wide. They are not carried here; <code>diagnostic.json</code> lists '
              + 'them.</p>'
            : '')
        + '<p class="srcline">' + Object.entries(SOURCE_STATES).map(([k, v]) =>
            '<span class="lgd e-' + k + '" title="' + esc(v.aide) + '"><span class="pt"></span>'
            + esc(v.lib) + ' <b>' + c[k] + '</b></span>').join("") + '</p>'
        + '<div class="srcq"><input id="srcsearch" type="search" autocomplete="off"'
        + ' placeholder="Search a class — tells whether it was found, and where"'
        + ' aria-label="Search a class in the source inventory"></div>'
        + '<div id="srcverdict"></div>'
        + '<div id="srctree">' + sourceTree("") + '</div>';

  bodyEl += '<p class="apres">The detail — launch configuration, runs, class-by-class matching — is in <code>diagnostic.json</code>, next to this page. It is the file to attach when a report does not show what you expected.</p>';

  return foldableSection("sources", "Source analysis",
    "Where the code shown beside the coverage comes from, what is missing, and where each class was found. Clicking the title folds the section.",
    total ? withSource + " / " + total : (src.fichiers || 0) + " files",
    '<div class="constat srcrecap">' + bodyEl + '</div>',
    // The default folding follows size: the scale is diverted so that it follows the anomaly
    // instead. Nothing missing → folded; something missing → open, because it is then the
    // first thing to read.
    without || !roots.length ? 0 : 999);
}

/** Wires the search and the unfolding of the tree of the fragment just written. */
function wireSourceExplorer(){
  const q = document.getElementById("srcsearch");
  if (!q) return;
  const tree = document.getElementById("srctree");
  const verdict = document.getElementById("srcverdict");
  const wirePackages = () => tree.querySelectorAll(".pkgt").forEach(b => b.onclick = () => {
    const bodyEl = b.nextElementSibling;
    const isOpen = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", String(isOpen));
    bodyEl.hidden = !isOpen;
    b.querySelector(".ic").textContent = isOpen ? "▾" : "▸";
  });
  wirePackages();
  let t = null;
  q.oninput = () => {
    // The filter rebuilds the whole tree: a typing pause is awaited so as not to redo it on
    // every keystroke over an inventory of several hundred classes.
    clearTimeout(t);
    t = setTimeout(() => {
      tree.innerHTML = sourceTree(q.value);
      verdict.innerHTML = searchVerdict(q.value);
      wirePackages();
    }, 120);
  };
}

   '<div class="bar" title="The same coverage as a bar: the green part is what ran, the pink part what never did.">'
   + '<span style="width:'+AGG.pct.toFixed(1)+'%"></span></div>'+
   flameBlock()+
   contextBlock()+

   (AGG.dead.length ? foldableSection("dead", "Never executed",

      AGG.dead.length + (AGG.dead.length > 1 ? ' classes' : ' class'),

   (watchedMethods.length
      ? '<h2 title="Methods whose arguments and return value Arthas recorded for a few invocations">Captured values</h2><p>'+watchedMethods.map(f =>
          '<span class="chip val" data-f="'+esc(f)+'" title="Open ' + esc(dot(f))
          + ' and its recorded calls">'+esc(f.split("/").pop())+' — '+R.values[f].length
          + (R.values[f].length > 1 ? ' calls' : ' call') + '</span>').join("")+'</p>'
      : '')+
   reserveBlock()+
   '<p style="margin-top:20px"><a href="#" id="openhelp">→ How to use this page</a></p>'+
   '</div>';
  // The chips are clickable: the overview serves as a starting point, not as a shop window.
  document.querySelectorAll("svg.flame g.known").forEach(g => {
    g.onclick = () => { const t = frameInfo(g.dataset.f); if (t) select(t, null); };
  });
  document.querySelectorAll(".flame .fl.known").forEach(g => {
    g.onclick = () => { const t = frameInfo(g.dataset.f); if (t) select(t, null); };
  });
  fitFlameLabels();
  document.querySelectorAll(".chip[data-f]").forEach(c => {
    c.style.cursor = "pointer";
    c.onclick = () => { const t = frameInfo(c.dataset.f); if (t) select(t, null); };

/**
 * The run's identity, as a dense band under its name.
 *
 * <p>It used to live in the page's body, as a table: a report is read, it is not filled in,
 * and a form laid in the middle of a reading is neither in its place nor easy to find again.
 * Everything editable therefore fits on one line, against the displayed name, and the
 * actions move up into the top bar with the other buttons.
 *
 * <p>What is not editable takes no room: the launch's name and the full identifier live in
 * the tooltip of the field they explain.
 */
function renderIdentity(){
  renderAnnotActs();
  const bar = document.getElementById("ident");
  if (!bar) return;
  // The card describes the whole run: it is displayed with its overview, not over the
  // reading of a method.
  if (selected){ bar.hidden = true; return; }
  bar.hidden = false;

  const a = annotationOf(R);
  const tags = Object.entries(a.etiquettes || {});
  const originName = R.nomOrigine
    ? "Name at launch: " + R.nomOrigine
    : "No name given at launch (--name)";
  const sourceState = canSave
    ? (annotationChanged(R) ? "not saved" : "up to date")
    : "kept in this browser";

  bar.innerHTML =
    '<span class="mark" title="What you add to this run: a name, a description, tags. Nothing here touches the measurements.">'
    + TOOLMARK.fiche + 'card</span>' +
    (R.uuid ? '<span class="uid" title="Permanent id, it never changes: '
              + esc(R.uuid) + '">' + esc(shortId(R)) + '</span>' : '') +
    '<input class="inom" id="identNom" type="text" value="' + esc(a.nom) +
      '" placeholder="' + esc(R.nomOrigine || shortId(R)) + '" title="' + esc(originName) +
      ' · Id: ' + esc(R.uuid || "—") + '" aria-label="Name of this run. '
      + esc(originName) + '">' +
    (a.nom ? '<button class="mini" id="identReset" title="Back to the launch name"'
             + ' aria-label="Back to the launch name">↺</button>' : '') +
    '<span class="sep"></span>' +
    '<input class="idesc" id="identDesc" type="text" value="' + esc(a.description) +
      '" placeholder="describe this run — what you were after, what you saw"' +
      ' title="Free text, kept with the run"' +
      ' aria-label="Description of this run">' +
    '<span class="sep"></span>' +
    tags.map(([k, v], i) =>
      '<span class="tag" title="Tag"><b>' + esc(k) + '</b>' +
      (v ? ' = ' + esc(String(v)) : '') +
      '<button data-tag="' + i + '" title="Remove" aria-label="Remove the tag '
      + esc(k) + '">✕</button></span>').join("") +
    '<button class="mini" id="identTagAdd" title="A key, and a value if needed">+ tag</button>' +
    '<span class="etat' + (canSave && annotationChanged(R) ? " modifie" : "") +
      '" id="identEtat">' + esc(sourceState) + '</span>';

  const blockName = document.getElementById("identNom");
  blockName.oninput = () => {
    annotationPatch(R, "nom", blockName.value.trim() || null);
    refreshRunLabels();
    refreshState();
  };
  const reset = document.getElementById("identReset");
  if (reset) reset.onclick = () => {
    // Empty, and not "absent": an erased key would let the recorded name come back, and the
    // return to the launch's name would not survive a regeneration.
    annotationPatch(R, "nom", "");
    refreshRunLabels();
    renderIdentity();
  };
  const desc = document.getElementById("identDesc");
  desc.oninput = () => { annotationPatch(R, "description", desc.value.trim()); refreshState(); };

  bar.querySelectorAll(".tag button").forEach(b => b.onclick = () => {
    const remaining = {};
    tags.forEach(([k, v], i) => { if (i !== +b.dataset.tag) remaining[k] = v; });
    annotationPatch(R, "etiquettes", remaining);
    renderIdentity();
  });
  document.getElementById("identTagAdd").onclick = e => {
    const zone = document.createElement("span");
    zone.className = "tagedit";
    zone.innerHTML = '<input class="k" type="text" placeholder="tag" '
                   + 'aria-label="Key of the new tag">' +
                     '<input class="v" type="text" placeholder="text (optional)" '
                   + 'aria-label="Text of the new tag, optional">';
    e.currentTarget.replaceWith(zone);
    const k = zone.querySelector(".k"), v = zone.querySelector(".v");
    const apply = () => {
      const srcKey = k.value.trim();
      if (!srcKey){ renderIdentity(); return; }
      const suite = Object.fromEntries(tags);
      suite[srcKey] = v.value.trim();
      annotationPatch(R, "etiquettes", suite);
      renderIdentity();
    };
    // Enter confirms, Escape abandons, and leaving the field counts as confirming: the three
    // gestures one tries in front of two small fields with no button.
    [k, v].forEach(field => {
      field.onkeydown = ev => {
        if (ev.key === "Enter"){ ev.preventDefault(); apply(); }
        if (ev.key === "Escape"){ ev.preventDefault(); renderIdentity(); }
      };
      field.onblur = () => setTimeout(() => {
        if (!zone.contains(document.activeElement)) apply();
      }, 120);
    });
    k.focus();
  };

  function refreshState(){
    const e = document.getElementById("identEtat");
    if (!e) return;
    const touched = canSave && annotationChanged(R);
    e.textContent = canSave ? (touched ? "not saved" : "up to date")
                                    : "kept in this browser";
    e.classList.toggle("modifie", touched);
    renderAnnotActs();
  }
}

/**

    (canSave && serverGuarded
      ? '<span class="mark" title="This server is guarded by a shared secret: only the ' +

        'shared secret">🔒</span>'
      : '') +
    (canSave
      ? '<a href="#" id="annotSave"' + (touched ? ' style="font-weight:700"' : '') +
        ' title="Write this run\'s record beside its results">' +
        (touched ? "save •" : "save") + '</a><span class="sep">·</span>'
      : '') +
    '<a href="#" id="annotExport" title="Download the records of every run in this report, as one file">export</a>' +
    '<span class="sep">·</span>' +

  document.getElementById("annotImport").onclick = e => { e.preventDefault(); fileInput.click(); };

    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    f.text().then(t => {
      const n = importAnnotations(t);
      renderIdentity();
      refreshRunLabels();
      mode === "tree" ? renderTree() : renderClasses();
      drawHome();
      showPanel(n + " run" + (n > 1 ? "s" : "") + " taken up"
              + " from “" + f.name + "”"
              + (canSave ? " — “save” will lay them on the server." : "."),
              "Records taken up");
    }).catch(e => showPanel(e.message, "Import refused"));
    fileInput.value = "";
  };
  document.getElementById("annotDump").onclick = e => {
    e.preventDefault();
    // A report where nobody has filled in a card yet gave "{}", alone, in a corner. That is
    // exact, and perfectly useless: the panel now says what it expects and what that file
    // is for.
    const cards = annotationsFile();
    const howMany = Object.keys(cards).length;
    const jsonText = JSON.stringify(cards, null, 2);
    showPanel(jsonText,
      howMany
        ? "Records of this report — " + howMany + " run" + (howMany > 1 ? "s" : "")
        : "Records of this report — none for the moment",
      jsonText,
      howMany ? null
        : "No run in this report has a record yet. As soon as one of them is given a "
        + "name, a description, a tag or a pruning, it appears here. This is the file "
        + "that “export” downloads and that “import” takes up, and it is also what the "
        + "server writes beside the measurements.");
  };
}

/** Displays a text over the page — it serves for copying, not for reading in the flow. */
/**
 * The corner panel: a title, a body, and what is needed to close it again.
 *
 * @param titre    what is being looked at — without it, the panel could open on two
 *                 characters with nothing saying what they were
 * @param aCopier  the text the "copy" button puts in the clipboard; this panel serves to
 *                 take JSON up again elsewhere, not to read it
 * @param avant    a sentence above, when the text alone does not suffice
 */
function showPanel(jsonText, heading, toCopy, before){
  const out = document.getElementById("annotout");
  if (!out) return;
  out.hidden = false;
  out.innerHTML = "";

  const headRow = document.createElement("div");
  headRow.className = "tete";
  const t = document.createElement("span");
  t.className = "titre";
  t.textContent = heading || "Runtime X-Ray";
  headRow.appendChild(t);

  if (toCopy) {
    const copyBtn = document.createElement("button");
    copyBtn.className = "acte";
    copyBtn.textContent = "copier";
    copyBtn.onclick = () => {
      // With no clipboard — page opened as a file, permission refused — the text is
      // selected: the user's Ctrl-C does the rest.
      const announce = m => { copyBtn.textContent = m; setTimeout(() => copyBtn.textContent = "copy", 1800); };
      const bodyEl = out.querySelector(".json");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(toCopy).then(() => announce("copied ✓"), () => selectText(bodyEl, announce));
      } else selectText(bodyEl, announce);
    };
    headRow.appendChild(copyBtn);
  }

  const closeIt = document.createElement("button");
  closeIt.className = "acte";
  closeIt.textContent = "✕";
  closeIt.title = "Close";
  closeIt.setAttribute("aria-label", "Close");
  closeIt.onclick = () => { out.hidden = true; };
  headRow.appendChild(closeIt);
  out.appendChild(headRow);

  const bodyEl = document.createElement("div");
  bodyEl.className = "corps";
  if (before) {
    const p = document.createElement("div");
    p.className = "vide";
    p.textContent = before;
    bodyEl.appendChild(p);
  }
  const json = document.createElement("span");
  json.className = "json";
  json.textContent = jsonText;
  bodyEl.appendChild(json);
  out.appendChild(bodyEl);
}

/** Selects the displayed text, for want of an accessible clipboard. */
function selectText(domNode, announce){
  if (!domNode) { announce("copy refused"); return; }
  const domRange = document.createRange();
  domRange.selectNodeContents(domNode);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(domRange);
  announce("selected — Ctrl-C");
}

/** The annotations of every run in the report, in the shape the tool expects. */
function annotationsFile(){
  const out = {};
  D.runs.forEach(run => {
    const a = annotationOf(run);
    const tags = a.etiquettes && Object.keys(a.etiquettes).length ? a.etiquettes : null;
    const e = pruningActive(run) ? pruningOf(run) : null;
    if (!a.nom && !a.description && !tags && !e) return;
    // A name alone keeps the short shape, the one that was already circulating.
    out[run.uuid] = (!a.description && !tags && !e)
      ? a.nom
      : {nom: a.nom || undefined, description: a.description || undefined,
         etiquettes: tags || undefined, elagage: e || undefined};
  });
  return out;
}

/**
 * Unfolds the whole tree, with a guard rail: on a real application, opening everything may
 * represent tens of thousands of nodes and freeze the page. We stop at a budget and say so,
 * rather than letting one believe everything is displayed.
 */
const EXPAND_BUDGET = 1500;

function expandAll(){
  let count = 0, passes = 0;
  while (passes++ < 40){
    const closed = [...document.querySelectorAll("#list .node")].filter(n => {
      const tw = n.querySelector(".tw");
      if (!tw || tw.textContent !== "▸") return false;
      // Opening ANOTHER run's root selects it and rebuilds the tree: mass unfolding would
      // fight against itself. We stay in the run being looked at; the others open with a
      // deliberate click.
      return !n.classList.contains("runroot");
    });
    if (!closed.length) break;
    for (const n of closed){
      if (count >= EXPAND_BUDGET) break;
      n.click();
      count = document.querySelectorAll("#list .node").length;
    }
    if (count >= EXPAND_BUDGET) break;
  }
  return count;
}

(function splitters(){
  const root = document.documentElement;
  const nav = document.getElementById("nav");
  const vs = document.getElementById("vsplit"), hs = document.getElementById("hsplit");
  let navPrev = 330, valPrev = 190;

  const startDrag = (el, onMove) => {
    el.addEventListener("mousedown", e => {
      e.preventDefault(); el.classList.add("dragging");
      const move = ev => onMove(ev);
      const up = () => { el.classList.remove("dragging");
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up); };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
  };
  startDrag(vs, ev => {
    const w = Math.max(0, Math.min(ev.clientX, window.innerWidth - 200));
    root.style.setProperty("--navw", w + "px");
    if (w > 40) navPrev = w;
  });
  startDrag(hs, ev => {
    const box = document.getElementById("values").getBoundingClientRect();
    const h = Math.max(0, Math.min(box.bottom - ev.clientY, window.innerHeight - 220));
    root.style.setProperty("--valh", h + "px");
    if (h > 30) valPrev = h;
  });
  const toggleNav = () => {
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--navw")) || 330;
    const open = cur <= 40;
    root.style.setProperty("--navw", open ? navPrev + "px" : "0px");
    document.getElementById("vtoggle").textContent = open ? "‹" : "›";
  };
  const toggleValues = () => {
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--valh")) || 190;
    const open = cur <= 30;
    root.style.setProperty("--valh", open ? valPrev + "px" : "0px");
    document.getElementById("htoggle").textContent = open ? "⌄" : "⌃";
  };
  vs.ondblclick = toggleNav;
  hs.ondblclick = toggleValues;
  document.getElementById("vtoggle").onclick = e => { e.stopPropagation(); toggleNav(); };
  document.getElementById("htoggle").onclick = e => { e.stopPropagation(); toggleValues(); };
})();

<script>
/*
 * The view's language — EN by default, FR on request.
 *
 * The tool speaks English first: a report is sent, attached to a ticket, read by somebody who
 * did not launch the measurement. French stays on offer because it costs nothing to keep, but
 * it imposes itself only on a browser that announces it.
 *
 * <h2>Why a DOM walk, and not keys in the template</h2>
 *
 * Because the page runs to five thousand lines and half its text is composed inside
 * concatenations of tags. Sowing keys through it would have demanded touching each of those
 * lines — hence risking an `id`, a selector or a comparison on every one — for no gain: the
 * displayed text is exactly what this walk sees. The dictionary lives here, alone, and the
 * template has not moved.
 *
 * Three things hold this choice:
 *
 * - **Only whole, known strings are translated.** No word replacement, no partial match. A
 *   class name, a captured value, a line of the observed application's code is never a label
 *   of the dictionary, and so is never touched. The displayed source code is in addition
 *   excluded from the walk — it is somebody else's code, and it is the bulk of the DOM.
 *
 * - **The original English is kept**, in a WeakMap, rather than translated back the other way.
 *   A round trip FR → EN → FR over a non-injective dictionary would lose text; here it gives
 *   the original back, to the byte.
 *
 * - **The choice survives a reload, and its failure carries nothing off.** A page opened over
 *   `file://` does not always have the right to write to `localStorage`: both the read and
 *   the write are under `try`, and with no storage the view simply opens in the browser's
 *   language.
 */
(() => {
  "use strict";

  /* The labels, word for word. The key is the English as the page writes it. */
  const DICT = {
    "— each has its own values:": "— chacune a ses propres valeurs :",
    "— naming the method to observe.": "— en nommant la méthode à observer.",

  /*
   * The composed sentences, which the exact dictionary cannot reach: they carry a class
   * name, a count, a percentage. They are recognised by their shape and the variable part
   * is kept as it is — except the numbers, which change convention on crossing the
   * Channel: “1,234” and “12.3%” become “1 234” and “12,3 %”.
   */
  const nb = s => Number(s.replace(/,/g, "")).toLocaleString("fr");
  const dec = s => s.replace(".", ",");
  const s = (n) => n === "1" ? "" : "s";

  const PATTERNS = [
    [/^Package (.+) — clicking unfolds what it holds$/,
      (m) => "Paquet " + m[1] + " — cliquer déplie ce qu'il contient"],
    [/^(.+) — clicking opens this method and its code$/,
      (m) => m[1] + " — cliquer ouvre cette méthode et son code"],
    [/^(.+) — code outside the analysed classes: no source, no coverage$/,
      (m) => m[1] + " — code hors des classes analysées : ni source, ni couverture"],
    [/^(.+?)\s+—\s+(.+?) total, of which ([\d.]+)% self$/,
      (m) => m[1] + "  —  " + m[2] + " au total, dont " + m[3] + " % en propre"],
    [/^(.+)\(\) — ran during this run\. Clicking shows its code, line by line\.$/,
      (m) => m[1] + "() — a tourné pendant cette exécution. Cliquer affiche son code, ligne par ligne."],
    [/^(.+)\(\) — never executed\. Clicking shows its code, line by line\.$/,
      (m) => m[1] + "() — jamais exécutée. Cliquer affiche son code, ligne par ligne."],
    [/^See (.+) in “(.+)”$/, (m) => "Voir " + m[1] + " dans « " + m[2] + " »"],
    [/^Covered in “(.+)”$/, (m) => "Couverte dans « " + m[1] + " »"],
    [/^— (\d+) call paths?$/, (m) => "— " + m[1] + " chemin" + s(m[1]) + " d'appel"],
    [/^Show the code of (.+)$/, (m) => "Afficher le code de " + m[1]],
    [/^Permanent id: (.+)$/, (m) => "Identifiant permanent : " + m[1]],
    [/^Name at launch: (.+) · Id: (.+)$/,
      (m) => "Nom au lancement : " + m[1] + " · Identifiant : " + m[2]],
    [/^Name at launch: (.+)$/, (m) => "Nom au lancement : " + m[1]],
    [/^Name of this run\. (.+)$/, (m) => "Nom de cette exécution. " + (translate(m[1]) || m[1])],
    [/^([\d,]+) methods?$/, (m) => nb(m[1]) + " méthodes"],
    [/^([\d,]+) samples$/, (m) => nb(m[1]) + " mesures"],
    [/^([\d,]+) runs?$/, (m) => nb(m[1]) + " exécutions"],
    [/^([\d.]+)% of time$/, (m) => dec(m[1]) + " % du temps"],
    [/^(\d+) of (\d+)$/, (m) => m[1] + " sur " + m[2]],
    [/^\s*measured class\(es\) have their source code in this page \((\d+)%\)\.$/,
      (m) => "classe(s) mesurée(s) ont leur code source dans cette page (" + m[1] + " %)."],
    [/^(\d+) measured class\(es\) out of (\d+) have no source\.$/,
      (m) => m[1] + " classe(s) mesurée(s) sur " + m[2] + " n'ont pas leur source."],
    [/^✓ (\d+) class\(es\)$/, (m) => "✓ " + m[1] + " classe(s)"],
    [/^(\d+) without source$/, (m) => m[1] + " sans source"],
    [/^… (\d+) line\(s\) above, outside this method$/,
      (m) => "… " + m[1] + " ligne(s) au-dessus, hors de cette méthode"],
    [/^… (\d+) line\(s\) below, outside this method$/,
      (m) => "… " + m[1] + " ligne(s) en dessous, hors de cette méthode"],
    [/^… (\d+) line\(s\) never executed$/,
      (m) => "… " + m[1] + " ligne(s) jamais exécutée(s)"],
    [/^▾ argument values \((\d+)\)$/, (m) => "▾ valeurs des paramètres (" + m[1] + ")"],
    [/^✓ (\d+) \.java file\(s\)$/, (m) => "✓ " + m[1] + " fichier(s) .java"],
    [/^(\d+) file\(s\)$/, (m) => m[1] + " fichier(s)"],
    // The run's status: the tool's own sentence, and the only one of run-context.json's
    // values it composes. Java says it in English; here it says it in French like the rest.
    [/^ended normally \(code (\d+)\)$/, (m) => "terminée normalement (code " + m[1] + ")"],
    [/^stopped after (\d+) s \(safety limit\)$/,
      (m) => "interrompue après " + m[1] + " s (garde-fou)"],
    [/^(.+) — (\d+) cores?$/, (m) => m[1] + " — " + m[2] + " cœur" + s(m[2])],
    [/^Open (.+) in the code list$/, (m) => "Ouvrir " + m[1] + " dans la liste du code"],
    [/^Open (.+) and its recorded calls$/, (m) => "Ouvrir " + m[1] + " et ses appels relevés"],
    [/^→ Open (.+) and see its values$/, (m) => "→ Ouvrir " + m[1] + " et voir ses valeurs"],
    [/^(\d+) captured call\(s\) — see the values$/,
      (m) => m[1] + " appel(s) capturé(s) — voir les valeurs"],
    [/^The (\d+) observed calls? of$/,
      (m) => "Les " + m[1] + " appel" + s(m[1]) + " observé" + s(m[1]) + " de"],
    // Bounded to a qualified name: “Open” also begins whole sentences.
    [/^Open ([\w.$<>]+)$/, (m) => "Ouvrir " + m[1]],
    [/^calls (.+) ([\d.]+) ms$/, (m) => "appelle " + m[1] + " " + dec(m[2]) + " ms"],
    [/^call (\d+)$/, (m) => "appel " + m[1]],
    [/^(\d+) calls?$/, (m) => m[1] + " appel" + s(m[1])],
    [/^(.+) — (\d+) calls?$/, (m) => m[1] + " — " + m[2] + " appel" + s(m[2])],
    [/^\((\d+) calls?\)$/, (m) => "(" + m[1] + " appel" + s(m[1]) + ")"],
    [/^\((\d+) calls?\) ·$/, (m) => "(" + m[1] + " appel" + s(m[1]) + ") ·"],
    [/^\((\d+) calls?\)\.$/, (m) => "(" + m[1] + " appel" + s(m[1]) + ")."],
    // A grouped number stands alone in the cards: only the separator changes.
    [/^(\d{1,3}(?:,\d{3})+)$/, (m) => nb(m[1])],
    [/^“(.+)” does not name a method: the expected format is package\.Class::method\. Without “::”, no value is captured\.$/,
      (m) => "« " + m[1] + " » ne désigne pas une méthode : le format attendu est "
           + "package.Class::method. Sans « :: », aucune valeur n'est capturée."],
    [/^display stopped at ([\d,]+) lines — fold, then open the branch you want$/,
      (m) => "affichage arrêté à " + nb(m[1]) + " lignes — replier, puis ouvrir la branche voulue"],
    [/^← Overview(.*)$/, (m) => "← Vue d'ensemble" + m[1]],
    [/^([\d,]+) class(?:es)?$/,
      (m) => nb(m[1]) + (m[1].trim() === "1" ? " classe" : " classes")],
    [/^([\d.]+)% of the executed code · ([\d,]+) methods$/,
      (m) => dec(m[1]) + " % du code exécuté · " + nb(m[2]) + " méthodes"],
    [/^Permanent id, it never changes: (.+)$/,
      (m) => "Identifiant permanent, il ne change jamais : " + m[1]],
    [/^VALUES RECEIVED BY (.+)$/, (m) => "VALEURS REÇUES PAR " + m[1]],
    [/^(.+) — ([\d.]+)% of its instructions ran\. Clicking unfolds its methods and opens the class\.$/,
      (m) => m[1] + " — " + dec(m[2]) + " % de ses instructions ont tourné. Cliquer déplie ses méthodes et ouvre la classe."],
    // The most general one last: “38.3% Something” must be tried only once the sentences
    // that begin with a percentage have been set aside.
    [/^([\d.]+)% (.+)$/, (m) => dec(m[1]) + " % " + m[2]]
  ];

  /** The original English of every already-translated node — to give it back intact. */
  const ORIGINAL = new WeakMap();

  function translate(en) {
    const key = en.trim();
    if (!key) return null;
    const exact = DICT[key];
    if (exact !== undefined) return en.replace(key, exact);
    for (const [pattern, render] of PATTERNS) {
      const m = key.match(pattern);
      if (m) return en.replace(key, render(m));
    }
    return null;
  }

  /*
   * The displayed source code is not translated: it is the observed application's code. It
   * is also, by far, the bulk of the DOM — setting it aside keeps the translation instant
   * on a report of several hundred classes.
   */
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA"]);
  const skipped = el => SKIP.has(el.nodeName.toUpperCase())
      // Only the code CELL is set aside, not the table: the same rows carry the folds
      // (“… 50 line(s) above”) and the call annotations, which are the tool's own text.
      || (el.nodeName === "TD" && el.classList.contains("c"))
      // Those two carry nothing but a package or class name. Translating them would make a
      // class named “Comment” a “Commentaire” — false text, right where one is searching.
      || el.classList.contains("nm") || el.classList.contains("lbl");

  const ATTRS = ["title", "placeholder", "aria-label"];

  function walk(root, to) {
    const stack = [root];
    while (stack.length) {
      const n = stack.pop();
      if (n.nodeType === 1) {
        if (skipped(n)) continue;
        for (const a of ATTRS) {
          const v = n.getAttribute && n.getAttribute(a);
          if (v) apply(n, a, v, to);
        }
        for (let k = n.firstChild; k; k = k.nextSibling) stack.push(k);
      } else if (n.nodeType === 3 && n.nodeValue.trim()) {
        apply(n, null, n.nodeValue, to);
      }
    }
  }

  function apply(n, attr, value, to, fresh) {
    const box = ORIGINAL.get(n) || {};
    const key = attr || "#text";
    // A tooltip rewritten by the page brings a NEW English text: keeping the old one would
    // amount to translating again a text that is no longer displayed.
    const en = !fresh && box[key] !== undefined ? box[key] : value;
    if (fresh) delete box[key];
    const rendered = to === "en" ? en : translate(en);
    // Double punctuation takes a space in French and takes none in English. That space
    // belongs to the template in the sentences the dictionary composes rather than holds
    // whole: without this, “scope: on” would survive the translation and be noticed on
    // every line. Only punctuation that ends a word is touched — never a URL, never a time.
    const done = to === "fr" && rendered !== null
        ? rendered.replace(/([^\s])([:;!?])(?=\s|$)/g, "$1 $2") : rendered;
    if (done === null || done === value) return;
    if (box[key] === undefined) { box[key] = en; ORIGINAL.set(n, box); }
    if (attr) n.setAttribute(attr, done); else n.nodeValue = done;
  }

  // ------------------------------------------------------------------ the language

  const KEY = "runtime-xray.langue";
  const read = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
  const keep = v => { try { localStorage.setItem(KEY, v); } catch (e) { /* file:// */ } };

  // English by default. French only if the browser announces it — and nothing else: a
  // German browser reads English, not French by an accident of alphabetical order.
  const chosen = read();
  let lang = chosen === "fr" || chosen === "en" ? chosen
      : (navigator.language || "en").toLowerCase().startsWith("fr") ? "fr" : "en";

  const TITLE_EN = document.title;

  let observer = null;

  function applyLanguage(to) {
    lang = to;
    if (observer) observer.disconnect();
    walk(document.body, to);
    document.documentElement.lang = to;
    document.title = to === "en" ? TITLE_EN
        : (DICT[TITLE_EN] !== undefined ? DICT[TITLE_EN] : TITLE_EN);
    document.querySelectorAll("#langsel button").forEach(b => {
      const on = b.dataset.lang === to;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    if (observer) observer.observe(document.body, WATCH);
  }

  document.querySelectorAll("#langsel button").forEach(b => {
    b.addEventListener("click", () => { keep(b.dataset.lang); applyLanguage(b.dataset.lang); });
  });

  // Everything the page draws afterwards — and it draws almost everything afterwards —
  // goes through here. The observer is cut while we write: without that, every translation
  // would call itself back.
  // Tooltips are watched as well as nodes: the page rewrites several of them after the
  // fact — the “expand everything” button changes its own at every toggle — and a `title`
  // reassigned creates no node, hence does not show in `childList`.
  const WATCH = {childList: true, subtree: true, attributes: true, attributeFilter: ATTRS};

  observer = new MutationObserver(batches => {
    if (lang === "en") return;
    observer.disconnect();
    for (const batch of batches) {
      if (batch.type === "attributes") {
        const v = batch.target.getAttribute(batch.attributeName);
        if (v) apply(batch.target, batch.attributeName, v, lang, true);
      } else for (const n of batch.addedNodes) {
        if (n.nodeType === 1 || n.nodeType === 3) walk(n, lang);
      }
    }
    observer.observe(document.body, WATCH);
  });

  applyLanguage(lang);
})();
</script>
</body>
</html>
