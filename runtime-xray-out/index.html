<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vue intégrée — Runtime X-Ray</title>
<style>
  :root{
    --bg:#fff; --panel:#f6f8fa; --panel2:#fbfcfd; --border:#d0d7de; --text:#1f2328;
    --muted:#59636e; --accent:#0969da; --accent-soft:#ddf4ff;
    --full:#b7f0c6; --part:#ffec9e; --miss:#ffc9c4;
    --fullbar:#1a7f37; --partbar:#9a6700; --missbar:#cf222e; --violet:#8250df;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1117; --panel:#151b23; --panel2:#10151c; --border:#30363d; --text:#e6edf3;
      --muted:#9198a1; --accent:#4493f8; --accent-soft:#121d2f;
      --full:#16512c; --part:#5c4710; --miss:#63201f;
      --fullbar:#3fb950; --partbar:#d29922; --missbar:#f85149; --violet:#ab7df8;
    }
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  header{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;
         align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
  header h1 a{color:inherit;text-decoration:none}
  header h1 a:hover{color:var(--accent)}
  .crumb .back{display:inline-flex;align-items:center;gap:5px;color:#fff;background:var(--accent);
               border-radius:15px;padding:3px 11px;font-size:12px;font-weight:600;
               cursor:pointer;text-decoration:none}
  .crumb .back:hover{filter:brightness(1.12)}
  /* Une seule icône d'application : les badges des trois outils invitaient à cliquer
     alors qu'ils n'étaient qu'informatifs. Leur explication vit dans la légende, en bas. */
  .applogo{display:flex;align-items:center}
  .stat{color:var(--muted);font-size:12.5px} .stat b{color:var(--text)}
  .runpick{padding:7px 9px;border-bottom:1px solid var(--border);background:var(--accent-soft)}
  .runpick[hidden]{display:none}
  .runlabel{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--accent);font-weight:700}
  .runlabel{display:block;margin-bottom:4px}
  #runboxes label{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 0;
                  cursor:pointer;color:var(--text)}
  #runboxes .cnt{color:var(--muted);font-size:11px;margin-left:auto}
  .spacer{margin-left:auto}
  .cleanbtn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;
            font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;
            border:1px solid var(--border);background:var(--bg);color:var(--muted)}
  .cleanbtn:hover{border-color:var(--accent);color:var(--accent)}
  .cleanbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--missbar);opacity:.55}
  .cleanbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .cleanbtn[aria-pressed="true"] .dot{background:#fff;opacity:1}
  .links{font-size:12px;color:var(--muted)} .links a{margin-left:12px}
  .links .by{font-size:9.5px;color:var(--muted);border:1px solid var(--border);
             border-radius:8px;padding:0 4px;margin-left:3px}
  .helpbtn{font:inherit;font-size:12px;font-weight:600;padding:4px 11px;border-radius:15px;
           cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted)}
  .helpbtn:hover{border-color:var(--accent);color:var(--accent)}
  #help{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;
        align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  #help[hidden]{display:none}
  .helpbox{position:relative;background:var(--bg);border:1px solid var(--border);
           border-radius:12px;max-width:880px;width:100%;padding:28px 32px 34px}
  .helpclose{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);
             font-size:17px;cursor:pointer}
  .helpclose:hover{color:var(--text)}
  .reserve{border:1px solid var(--border);border-left:3px solid var(--partbar);
           border-radius:6px;background:var(--panel);padding:12px 15px;color:var(--muted);
           font-size:12.5px;margin-top:22px}
  .reserve b{color:var(--text)}
  main{display:grid;grid-template-columns:var(--navw,330px) 6px 1fr;height:calc(100% - 47px)}
  @media(max-width:860px){main{grid-template-columns:1fr;height:auto} .split{display:none}}
  /* Séparateurs déplaçables : glisser pour redimensionner, double-cliquer pour replier
     entièrement le panneau voisin — utile quand on veut le code plein écran. */
  .split{background:var(--border);cursor:col-resize;position:relative}
  /* Un bouton visible sur chaque séparateur : le double-clic seul est une astuce qu'on
     ne découvre jamais. */
  .splitbtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:16px;height:34px;border-radius:8px;border:1px solid var(--border);
            background:var(--panel);color:var(--muted);font-size:11px;line-height:1;
            cursor:pointer;padding:0;z-index:3;display:flex;align-items:center;justify-content:center}
  .splitbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg)}
  .splitbtn.h{width:34px;height:16px}
  .split:hover,.split.dragging{background:var(--accent)}
  .split::after{content:"";position:absolute;inset:0 -4px}
  .split.h{cursor:row-resize;height:6px}
  .splitlabel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
              font-size:9px;color:var(--bg);pointer-events:none}
  #nav{border-right:1px solid var(--border);background:var(--panel2);
       display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--border)}
  .tabs button{flex:1;padding:8px 4px;background:none;border:0;border-bottom:2px solid transparent;
               color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  .listbar{display:flex;gap:6px;margin:8px}
  #search{flex:1;padding:5px 9px;border:1px solid var(--border);border-radius:6px;
          background:var(--bg);color:var(--text);font:inherit;font-size:12.5px;min-width:0}
  .unitbtn{font:inherit;font-size:11.5px;font-weight:700;width:38px;border-radius:6px;
           border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer}
  .unitbtn.wide{width:auto;padding:0 9px}
  .unitbtn[aria-pressed="true"]{border-color:var(--fullbar);color:var(--fullbar)}
  .unitbtn:hover{border-color:var(--accent);color:var(--accent)}
  #scope{display:none;padding:7px 10px;border-bottom:1px solid var(--border);
         font-size:11.5px;color:var(--muted)}
  #scope b{color:var(--text)}
  #scope button{margin-left:8px;font:inherit;font-size:11px;background:var(--bg);color:var(--accent);
                border:1px solid var(--border);border-radius:5px;padding:2px 7px;cursor:pointer}
  .list{overflow:auto;flex:1 1 auto;min-height:0;padding:4px 4px 24px}
  .node{padding:2px 7px;border-radius:5px;cursor:pointer;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .node:hover{background:var(--accent-soft)}
  .node.sel{background:var(--accent);color:#fff}
  .node .pct{color:var(--muted);font-size:11px;margin-right:6px;display:inline-block;
             width:38px;text-align:right;font-variant-numeric:tabular-nums}
  .node.sel .pct{color:#e8f0fb}
  .node .tw{display:inline-block;width:11px;color:var(--muted)}
  .node.jdk{color:var(--muted)}
  .node.runroot{font-weight:600;padding:5px 7px;margin-top:4px;border-radius:6px;
                background:var(--panel);border:1px solid var(--border)}
  .node.runroot.on{border-color:var(--accent)}
  .runbadge{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);
            border:1px solid var(--accent);border-radius:9px;padding:0 5px;vertical-align:1px}
  .pct2{color:var(--muted);font-weight:400;font-size:11px}
  .tagval{font-size:10px;border:1px solid var(--violet);color:var(--violet);
          border-radius:10px;padding:0 5px;vertical-align:1px}
  .node.pkgnode{color:var(--muted)}
  /* Quand on affiche tout le code, la couleur dit en un coup d'œil ce qui a servi. */
  .node.live .lbl{color:var(--fullbar)}
  .node.partial .lbl{color:var(--partbar)}
  .node.dead .lbl{color:var(--missbar);opacity:.85}
  .node.dead .pct{color:var(--missbar)}
  .tagdead{font-size:10px;border:1px solid var(--missbar);color:var(--missbar);
           border-radius:10px;padding:0 5px;vertical-align:1px}
  .node.pkgnode .lbl{color:var(--text)}
  .node.callnode{color:var(--violet)}
  .callbadge{font-size:10px;border:1px solid var(--violet);color:var(--violet);
             border-radius:10px;padding:0 5px;vertical-align:1px}
  .call.pick{cursor:pointer;border-radius:5px;padding-left:6px;padding-right:6px}
  .call.pick:hover{background:var(--accent-soft)}
  .callnav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .callnav button{font:inherit;font-size:11.5px;padding:3px 10px;border-radius:14px;
                  border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
  .callnav button:disabled{opacity:.4;cursor:default}
  .callnav a{font-size:11.5px;color:var(--accent);text-decoration:none;margin-left:auto}
  .tagrun{font-size:10px;border:1px solid var(--accent);color:var(--accent);
          border-radius:10px;padding:0 5px;vertical-align:1px}
  .tagonly{font-size:10px;border:1px solid var(--partbar);color:var(--partbar);
           border-radius:10px;padding:0 5px;vertical-align:1px}
  .node.sel .tagval{border-color:#fff;color:#fff}
  .grouphead{padding:6px 8px 2px;color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
  #detail{display:flex;flex-direction:column;min-height:0}
  .crumb{padding:9px 16px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .viewbar{padding:0 16px 9px;border-bottom:1px solid var(--border);display:flex;gap:8px}
  .crumb b{font-weight:650} .crumb span{color:var(--muted)}
  .pill{font-size:11px;border:1px solid var(--border);border-radius:20px;padding:1px 8px;color:var(--muted)}
  #context{display:none;padding:7px 16px;border-bottom:1px solid var(--border);background:var(--panel2)}
  .ctxlabel{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
  .ctxpath{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
           padding:3px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent}
  .ctxpath:hover{background:var(--accent-soft)}
  .ctxpath.on{border-color:var(--accent);background:var(--accent-soft)}
  .ctxpath .share{display:inline-block;width:38px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ctxpath a{color:var(--accent);text-decoration:none}
  .ctxpath a:hover{text-decoration:underline}
  .ctxpath a.cur{color:var(--text);font-weight:600}
  .ctxpath .sep{color:var(--muted)}
  .ctxelse{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);font-size:11.5px}
  .ctxelse a{color:var(--accent);text-decoration:none}
  .ctxelse a:hover{text-decoration:underline}
  #code{overflow:auto;flex:1 1 auto;min-height:0;padding-bottom:24px}
  table.src{border-collapse:collapse;width:100%;
            font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  table.src td{padding:0 6px;vertical-align:top;white-space:pre}
  td.n{text-align:right;color:var(--muted);user-select:none;width:1%;
       border-right:1px solid var(--border);font-variant-numeric:tabular-nums}
  /* Un liseré en marge en plus du fond : sur un fond sombre, la teinte seule se remarque
     mal, et en mode resserré on ne voit presque que des lignes exécutées. */
  tr.full td.c{background:var(--full);box-shadow:inset 3px 0 0 var(--fullbar)}
  tr.part td.c{background:var(--part);box-shadow:inset 3px 0 0 var(--partbar)}
  tr.miss td.c{background:var(--miss);box-shadow:inset 3px 0 0 var(--missbar)}
  td.c{width:99%}
  tr.inmethod td.n{color:var(--accent);font-weight:700}
  td.ann{color:var(--muted);font-size:11px;width:1%;max-width:300px;text-align:right;
         white-space:normal;padding-left:14px}
  td.ann a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
  td.ann .dur{opacity:.6}
  td.ann a.values{color:var(--violet);border-bottom-color:var(--violet);font-weight:600}
  /* Discret par défaut : le code doit rester du code, pas une page de liens. */
  a.callink{color:inherit;text-decoration:none;border-bottom:1px dotted var(--accent);
            cursor:pointer}
  a.callink:hover{color:var(--accent);background:var(--accent-soft);border-radius:3px}
  .fold{color:var(--muted);font-style:italic;padding:2px 12px;font-size:11.5px;
        background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  #values{background:var(--panel);padding:10px 16px;overflow:auto;
          height:var(--valh,190px);flex:0 0 auto}
  #values:empty{display:none} #values:empty + .legend{border-top:1px solid var(--border)}
  #values h3{margin:0 0 6px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
  #values h3 code{text-transform:none;letter-spacing:0;color:var(--text);font-size:12px}
  .sig{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
       color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:5px;
       padding:4px 8px;margin-bottom:7px;display:inline-block}
  .explain{color:var(--muted);font-size:11.5px;margin-bottom:8px}
  .explain b{color:var(--text)}
  /* Les colonnes se calent sur le contenu : avec un paramètre court, une colonne en 1fr
     rejetait la valeur renvoyée à l'autre bout de la ligne, illisible. */
  .call{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
        padding:5px 0;border-bottom:1px solid var(--border);display:grid;
        grid-template-columns:minmax(0,max-content) 20px minmax(0,max-content) 1fr;
        gap:10px;align-items:baseline}
  .callhead{display:grid;
            grid-template-columns:minmax(0,max-content) 20px minmax(0,max-content) 1fr;
            gap:10px;font-size:10px;letter-spacing:.6px;text-transform:uppercase;
            color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--border)}
  .callhead span:nth-child(2){grid-column:3}
  .call .v{color:var(--violet)} .call .sep{color:var(--muted)}
  .call .arrow{color:var(--muted);text-align:center}
  .call .t{color:var(--muted);opacity:.6;text-align:right;font-size:10.5px;white-space:nowrap}
  .legend{padding:7px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}
  /* La pastille de légende reprend EXACTEMENT le fond des lignes de code, bordé de la
     couleur vive : sinon la légende ne ressemble pas à ce qu'elle est censée expliquer. */
  .sw{display:inline-block;width:16px;height:11px;border-radius:3px;vertical-align:-1px;
      margin:0 5px 0 12px;border:1px solid}
  .home{padding:26px 32px;max-width:820px}
  .home h2{font-size:17px;margin:0 0 6px}
  .home p{color:var(--muted);margin:0 0 18px}
  .home .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
  @media(max-width:700px){.home .cards{grid-template-columns:1fr}}
  .card{border:1px solid var(--border);border-radius:9px;padding:13px 15px;background:var(--panel);
        border-left:4px solid var(--muted);display:flex;align-items:center;gap:13px}
  .card .ci{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
            border-radius:9px;background:var(--bg);border:1px solid var(--border);flex:0 0 auto}
  .card.c1{border-left-color:var(--fullbar)} .card.c1 .k,.card.c1 .ci{color:var(--fullbar)}
  .card.c2{border-left-color:var(--accent)}   .card.c2 .k,.card.c2 .ci{color:var(--accent)}
  .card.c3{border-left-color:var(--partbar)}  .card.c3 .k,.card.c3 .ci{color:var(--partbar)}
  .card.c4{border-left-color:var(--violet)}   .card.c4 .k,.card.c4 .ci{color:var(--violet)}
  .card .k{font-size:24px;font-weight:700} .card .l{color:var(--muted);font-size:12.5px}
  .card.c1 .k{color:var(--fullbar)} .card.c2 .k{color:var(--accent)}
  .card.c3 .k{color:var(--partbar)} .card.c4 .k{color:var(--violet)}
  .bar{height:9px;border-radius:6px;background:var(--miss);overflow:hidden;margin:2px 0 20px}
  .bar span{display:block;height:100%;background:var(--fullbar)}
  .chip{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11.5px;border-radius:5px;padding:2px 7px;margin:0 5px 5px 0}
  .chip.dead{background:var(--miss);color:var(--missbar);border:1px solid var(--missbar)}
  .chip.hot{background:var(--part);color:var(--partbar);border:1px solid var(--partbar)}
  .chip.val{background:var(--panel);color:var(--violet);border:1px solid var(--violet)}
  .chip[data-f]:hover{filter:brightness(1.15)}
  .home h2{font-size:17px;margin:22px 0 6px;padding-left:9px;border-left:3px solid var(--accent)}
  .links2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  @media(max-width:700px){.links2{grid-template-columns:1fr}}
  a.lk{display:block;border:1px solid var(--border);border-radius:8px;padding:10px 13px;
       text-decoration:none;background:var(--panel);transition:.15s}
  a.lk:hover{border-color:var(--accent);background:var(--accent-soft)}
  .lkt{display:block;color:var(--accent);font-weight:600;font-size:13.5px;margin-bottom:2px}
  .lkd{display:block;color:var(--muted);font-size:12px;line-height:1.45}
  .home ol{color:var(--muted);padding-left:20px} .home ol li{margin:6px 0}
  svg.plan{width:100%;height:auto;max-width:820px;display:block;margin:6px 0 18px;
           border:1px solid var(--border);border-radius:9px;background:var(--bg)}
  .home ul.tools{color:var(--muted);padding-left:20px} .home ul.tools li{margin:4px 0}
  .home ul.tools b{color:var(--text)}
  svg.flame{width:100%;display:block;margin-bottom:20px;border:1px solid var(--border);
            border-radius:8px;background:var(--panel)}
  svg.flame text{font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2328;
                 pointer-events:none}
  svg.flame g.known{cursor:pointer}
  svg.flame g.known:hover rect{stroke:var(--text);stroke-width:1}
  .flame{position:relative;width:100%;margin-bottom:20px;border:1px solid var(--border);
         border-radius:8px;background:var(--panel);overflow:hidden}
  .flame .fl{position:absolute;height:16px;border-radius:2px;overflow:hidden;
             font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1f2328;
             padding:0 3px;line-height:16px;white-space:nowrap;box-sizing:border-box}
  .flame .fl.known{cursor:pointer}
  .flame .fl.known:hover{outline:1px solid var(--text);outline-offset:-1px}
  .home code{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px}
  table.ctx{border-collapse:collapse;width:100%;margin-bottom:20px}
  table.ctx td{padding:5px 10px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}
  td.ck{color:var(--muted);white-space:nowrap;width:1%}
  td.cv{word-break:break-word}
</style>
</head>
<body>
<header>
  <span class="applogo" aria-hidden="true">
    <svg viewBox="0 0 32 32" width="26" height="26">
      <rect width="32" height="32" rx="8" fill="#0d1117"/>
      <rect width="32" height="32" rx="8" fill="#38bdf8" fill-opacity=".10"/>
      <rect x="8" y="9" width="13" height="2.6" rx="1.3" fill="#3fb950"/>
      <rect x="8" y="14" width="9" height="2.6" rx="1.3" fill="#3fb950"/>
      <rect x="8" y="19" width="6" height="2.6" rx="1.3" fill="#f85149"/>
      <rect x="5" y="15.6" width="22" height="1.2" rx=".6" fill="#7dd3fc" fill-opacity=".85"/>
      <g fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round">
        <path d="M6 10.5V7.5a1.5 1.5 0 0 1 1.5-1.5h3"/><path d="M21.5 6h3A1.5 1.5 0 0 1 26 7.5v3"/>
        <path d="M26 21.5v3a1.5 1.5 0 0 1-1.5 1.5h-3"/><path d="M10.5 26h-3A1.5 1.5 0 0 1 6 24.5v-3"/>
      </g>
    </svg>
  </span>
  <h1><a href="#" id="home" title="Revenir à la vue d'ensemble">Runtime X-Ray</a></h1>

ab.sample.RoutePlanner::travelTimeMinutes", "filtreClasses": "lab/sample/*", "repertoireClasses": "/Users/benoitbesson/dev/pro/runtime-xray/sample-app/target/classes", "repertoiresSources": "/Users/benoitbesson/dev/pro/runtime-xray/sample-app/src/main/java", "valeursInspectees": true, "debut": "20/08/2026 23:22:02", "fin": "20/08/2026 23:22:59", "dureeSecondes": 56, "statut": "terminée normalement (code 0)", "machine": "macbook-pro-benoit", "utilisateur": "benoitbesson", "systeme": "Mac OS X 26.5.2 (aarch64)", "processeurs": 10, "java": "Eclipse Adoptium 25.0.2", "javaHome": "/Users/benoitbesson/.sdkman/candidates/java/25.0.2-tem", "repertoireTravail": "/Users/benoitbesson/dev/pro/runtime-xray"}, "tracedClass": "lab/sample/RoutePlanner"}], "sources": {"lab/sample/Scenarios.java": ["package lab.sample;", "", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "import lab.sample.model.TimeOfDay;", "import lab.sample.model.Trip;", "import lab.sample.model.Weather;", "", "import java.util.ArrayList;", "import java.util.List;", "", "/**", " * Les trajets rejoués à l'identique par tous les outils.", " *", " * <p>Le tirage est <b>déterministe</b> : ni {@code Random}, ni horloge. Deux exécutions", " * produisent exactement la même trace — sans quoi comparer deux rapports reviendrait à", " * comparer deux exécutions différentes, et l'écart observé ne dirait plus rien de l'outil.", " *", " * <p>{@code Mode.PLANE} et {@code Weather.SNOW} sont volontairement absents du tirage.", " */", "final class Scenarios {", "", "    private Scenarios() {}", "", "    private static final Mode[] MODES = {Mode.CAR, Mode.TRAIN, Mode.BIKE, Mode.WALK};", "    private static final Weather[] WEATHERS = {Weather.SUNNY, Weather.RAIN};", "    private static final TimeOfDay[] TIMES = {TimeOfDay.QUIET, TimeOfDay.RUSH_HOUR, TimeOfDay.NIGHT};", "    private static final String[] PLACES = {\"Toulouse\", \"Albi\", \"Montauban\", \"Castres\", \"Auch\", \"Foix\"};", "", "    static Trip at(int i) {", "        Mode mode = MODES[i % MODES.length];", "        Weather weather = WEATHERS[(i / 4) % WEATHERS.length];", "        TimeOfDay time = TIMES[(i / 8) % TIMES.length];", "        boolean luggage = (i % 5) == 0;", "", "        int legCount = 1 + (i % 4);", "        List<Leg> legs = new ArrayList<>(legCount);", "        for (int l = 0; l < legCount; l++) {", "            String from = PLACES[(i + l) % PLACES.length];", "            String to = PLACES[(i + l + 1) % PLACES.length];", "            double km = 2 + ((i + l * 7) % 60);", "            legs.add(new Leg(from, to, km));", "        }", "        // Concaténation simple et non \"TRIP-%05d\".formatted(i) : le formatage coûtait à lui", "        // seul ~40 % du temps CPU et écrasait le calcul dans le flame graph. Le profil doit", "        // montrer la logique évaluée, pas la fabrication du jeu de test.", "        return new Trip(\"TRIP-\" + i, mode, weather, time, luggage, List.copyOf(legs));", "    }", "}"], "lab/sample/RoutePlanner.java": ["package lab.sample;", "", "import lab.sample.comfort.Breaks;", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "import lab.sample.model.Trip;", "import lab.sample.speed.SpeedModel;", "import lab.sample.speed.Speeds;", "import lab.sample.terrain.Terrain;", "import lab.sample.traffic.Traffic;", "import lab.sample.transfer.Connections;", "import lab.sample.weather.LuggagePenalty;", "import lab.sample.weather.WeatherPenalty;", "", "/**", " * <b>La fonction sous analyse.</b> « Combien de temps pour aller de A à B ? »", " *", " * <p>C'est le point d'entrée que chaque outil doit savoir cibler : à l'exécution de", " * cette fonction, donne-moi les lignes exécutées, l'arbre d'appel et les valeurs des", " * paramètres.", " *", " * <p>Elle appelle quatre familles de calcul <b>selon le contexte</b>, jamais toutes en", " * même temps :", " * <ul>", " *   <li>la vitesse du mode choisi — toujours, mais via une implémentation différente ;</li>", " *   <li>les bouchons — voiture à l'heure de pointe uniquement ;</li>", " *   <li>la météo et les bagages — vélo et marche uniquement ;</li>", " *   <li>les correspondances — train uniquement ;</li>", " *   <li>les pauses — au-delà d'une durée <em>calculée</em>, quel que soit le mode.</li>", " * </ul>", " * Deux trajets différents produisent donc deux arbres d'appel différents, à partir du", " * même appel de la même méthode. C'est précisément ce qu'on demande aux outils de montrer.", " */", "public final class RoutePlanner {", "", "    private RoutePlanner() {}", "", "    /**", "     * @param trip le trajet à évaluer", "     * @return la durée totale estimée, en minutes", "     */", "    public static double travelTimeMinutes(Trip trip) {", "        SpeedModel speed = Speeds.forMode(trip.mode());", "", "        double minutes = 0;", "        // Boucle indexée volontairement : la boucle for-each sur une List immuable", "        // allouait un itérateur par étape, qui représentait à lui seul la moitié des", "        // échantillons. Constaté au profiler, corrigé, re-mesuré.", "        for (int i = 0; i < trip.legs().size(); i++) {", "            minutes += legMinutes(trip.legs().get(i), speed, trip.mode());", "        }", "", "        if (Traffic.applies(trip.mode(), trip.timeOfDay())) {", "            minutes += Traffic.delayMinutes(trip.legs());", "        }", "", "        if (WeatherPenalty.applies(trip.mode())) {", "            minutes *= WeatherPenalty.slowdownFactor(trip.weather());", "            minutes *= LuggagePenalty.slowdownFactor(trip.withLuggage());", "        }", "", "        if (trip.mode() == Mode.TRAIN) {", "            minutes += Connections.waitMinutes(trip.legs(), 0);", "        }", "", "        // Décidé sur la durée obtenue, pas sur un argument reçu : voir Breaks.", "        minutes += Breaks.totalMinutes(minutes);", "", "        return minutes;", "    }", "", "    private static double legMinutes(Leg leg, SpeedModel speed, Mode mode) {", "        double minutes = leg.distanceKm() / speed.kmPerHour(leg) * 60.0;", "        if (Terrain.applies(mode)) {", "            minutes *= Terrain.slowdownFactor(leg, mode);", "        }", "        return minutes;", "    }", "}"], "lab/sample/Main.java": ["package lab.sample;", "", "import lab.sample.model.Trip;", "", "import java.util.ArrayList;", "import java.util.List;", "", "/**", " * Lanceur de l'application-cible.", " *", " * <p>Deux options n'existent que pour les besoins de l'analyse :", " * <ul>", " *   <li>{@code --iterations} — un profiler par échantillonnage n'a rien à montrer sur", " *       une exécution de 5 ms ; il faut du temps CPU pour que des frames soient prélevées.</li>", " *   <li>{@code --hold-seconds} — les outils qui s'<em>attachent</em> à un process vivant", " *       (VisualVM, JMC, JProfiler, YourKit) ont besoin que la JVM soit encore là quand", " *       l'opérateur clique. Sans cette pause, la cible est morte avant d'avoir été", " *       sélectionnée dans la liste.</li>", " * </ul>", " */", "public final class Main {", "", "    /** Nombre de trajets distincts fabriqués avant la mesure. Assez pour couvrir toutes", "     *  les combinaisons mode × météo × horaire × bagages, assez peu pour que leur", "     *  fabrication ne pèse rien face à la boucle de calcul. */", "    private static final int TRIP_VARIANTS = 240;", "", "    /** Calibré pour que le calcul dure ~10 s sur un Mac Apple Silicon. C'est le minimum", "     *  confortable pour qu'un outil qui s'attache à un process vivant (VisualVM, JMC,", "     *  JProfiler) ait le temps d'être lancé, de sélectionner la JVM et d'enregistrer", "     *  quelque chose. Une exécution d'une seconde ne laisse aucune prise. */", "    private static final int DEFAULT_ITERATIONS = 16_000_000;", "", "    public static void main(String[] args) throws InterruptedException {", "        int iterations = intArg(args, \"--iterations\", DEFAULT_ITERATIONS);", "        int holdSeconds = intArg(args, \"--hold-seconds\", 0);", "", "        System.out.printf(\"sample-app : %d trajets évalués, pause finale %d s%n\", iterations, holdSeconds);", "        Metrics metrics = new Metrics();", "        metrics.stage(\"JVM démarrée\");", "", "        // Les trajets sont fabriqués UNE FOIS, hors de la boucle mesurée.", "        // Sans cette séparation, la génération du jeu de test (concaténations de chaînes,", "        // allocations de listes) capte ~70 % des échantillons et l'arbre d'appel montre", "        // java.lang.StringConcatHelper au lieu du calcul d'itinéraire. Mesuré, pas supposé.", "        List<Trip> trips = new ArrayList<>(TRIP_VARIANTS);", "        for (int i = 0; i < TRIP_VARIANTS; i++) {", "            trips.add(Scenarios.at(i));", "        }", "", "        metrics.stage(\"jeu de trajets fabriqué\");", "", "        double total = 0;", "        for (int i = 0; i < iterations; i++) {", "            total += RoutePlanner.travelTimeMinutes(trips.get(i % TRIP_VARIANTS));", "        }", "        // Imprimé pour que le calcul ne puisse pas être éliminé, et pour vérifier d'un", "        // coup d'œil que deux exécutions comparées ont bien fait le même travail.", "        metrics.stage(\"calcul terminé\");", "        System.out.printf(\"durée cumulée = %.0f minutes%n\", total);", "", "        if (holdSeconds > 0) {", "            System.out.printf(\"JVM maintenue en vie %d s — attache ton profiler (pid %d)%n\",", "                    holdSeconds, ProcessHandle.current().pid());", "            Thread.sleep(holdSeconds * 1000L);", "        }", "    }", "", "    private static int intArg(String[] args, String name, int fallback) {", "        for (int i = 0; i < args.length - 1; i++) {", "            if (args[i].equals(name)) {", "                return Integer.parseInt(args[i + 1]);", "            }", "        }", "        return fallback;", "    }", "}"], "lab/sample/Metrics.java": ["package lab.sample;", "", "/**", " * Mesures d'étape : temps écoulé et mémoire occupée.", " *", " * <p>Volontairement fondé sur le seul JDK ({@code System.nanoTime}, {@code Runtime}) :", " * ces chiffres servent de <b>référence indépendante</b>. Quand un outil d'analyse annonce", " * un temps ou une empreinte, on veut pouvoir le confronter à une mesure qui ne vient pas", " * de lui — et constater au passage combien l'outil lui-même ralentit l'exécution.", " *", " * <p>La mémoire est lue après un appel à {@code System.gc()} : sans lui, on mesure surtout", " * les déchets pas encore ramassés, ce qui ne veut rien dire. L'appel reste une", " * <em>suggestion</em> faite à la JVM, jamais une garantie — d'où l'ordre de grandeur", " * annoncé plutôt qu'une valeur exacte.", " */", "public final class Metrics {", "", "    private final long startNanos = System.nanoTime();", "    private long lastNanos = startNanos;", "", "    void stage(String label) {", "        long now = System.nanoTime();", "        double sinceLastMs = (now - lastNanos) / 1_000_000.0;", "        double totalMs = (now - startNanos) / 1_000_000.0;", "        lastNanos = now;", "", "        System.gc();", "        Runtime runtime = Runtime.getRuntime();", "        long usedMb = (runtime.totalMemory() - runtime.freeMemory()) / (1024 * 1024);", "        long maxMb = runtime.maxMemory() / (1024 * 1024);", "", "        System.out.printf(\"  [%-28s] étape %8.0f ms | cumul %8.0f ms | mémoire ~%d Mo / %d Mo max%n\",", "                label, sinceLastMs, totalMs, usedMb, maxMb);", "    }", "}"], "lab/sample/traffic/RushHourDelay.java": ["package lab.sample.traffic;", "", "import lab.sample.model.Leg;", "", "/** Retard dû aux bouchons de l'heure de pointe. */", "public final class RushHourDelay {", "", "    private RushHourDelay() {}", "", "    static double minutesFor(Leg leg) {", "        // Les bouchons pénalisent surtout les entrées et sorties d'agglomération,", "        // donc les étapes courtes : d'où un retard qui ne suit pas la distance.", "        if (leg.distanceKm() < 5) {", "            return 8;", "        }", "        return leg.distanceKm() < 40 ? 15 : 20;", "    }", "}"], "lab/sample/traffic/Traffic.java": ["package lab.sample.traffic;", "", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "import lab.sample.model.TimeOfDay;", "", "import java.util.List;", "", "/**", " * Retard lié à la circulation.", " *", " * <p>Sous-arbre entièrement <b>conditionnel</b> : il n'existe que pour la voiture, et", " * seulement à l'heure de pointe. Sur un trajet en train à 22 h, aucune de ces lignes", " * ne s'exécute — et c'est exactement ce que le dépôt cherche à rendre visible.", " */", "public final class Traffic {", "", "    private Traffic() {}", "", "    public static boolean applies(Mode mode, TimeOfDay timeOfDay) {", "        return mode == Mode.CAR && timeOfDay == TimeOfDay.RUSH_HOUR;", "    }", "", "    public static double delayMinutes(List<Leg> legs) {", "        double total = 0;", "        for (Leg leg : legs) {", "            total += RushHourDelay.minutesFor(leg);", "        }", "        return total;", "    }", "}"], "lab/sample/speed/BikeSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** À vélo : on ralentit sur les longues distances (fatigue). */", "public final class BikeSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return leg.distanceKm() > 20 ? 15 : 18;", "    }", "}"], "lab/sample/speed/Speeds.java": ["package lab.sample.speed;", "", "import lab.sample.model.Mode;", "", "/** Fabrique : associe un mode de transport à son modèle de vitesse. */", "public final class Speeds {", "", "    // Instances partagées : les modèles de vitesse sont sans état. Les allouer à chaque", "    // appel captait ~25 % des échantillons — du bruit d'allocation qui masquait le calcul.", "    private static final SpeedModel CAR = new CarSpeed();", "    private static final SpeedModel TRAIN = new TrainSpeed();", "    private static final SpeedModel BIKE = new BikeSpeed();", "    private static final SpeedModel WALK = new WalkSpeed();", "", "    private Speeds() {}", "", "    public static SpeedModel forMode(Mode mode) {", "        return switch (mode) {", "            case CAR -> CAR;", "            case TRAIN -> TRAIN;", "            case BIKE -> BIKE;", "            case WALK -> WALK;", "            // Instancié ici et non partagé comme les autres : ainsi PlaneSpeed n'est", "            // JAMAIS chargée ni exécutée, et reste à 0 % dans le rapport de couverture.", "            // Un champ static final l'aurait fait construire au chargement de Speeds.", "            case PLANE -> new PlaneSpeed();", "        };", "    }", "}"], "lab/sample/speed/TrainSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** En train : vitesse quasi constante, indépendante de la longueur de l'étape. */", "public final class TrainSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return leg.distanceKm() > 100 ? 220 : 90;", "    }", "}"], "lab/sample/speed/PlaneSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** En avion. <b>Jamais instanciée par les scénarios</b> : cette classe entière doit", " *  apparaître à 0 % dans un rapport de couverture. C'est le test le plus visuel du", " *  critère « sait-on par où le code n'est PAS passé ? » — un profiler par", " *  échantillonnage, lui, ne dira jamais rien de ce code. */", "public final class PlaneSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return leg.distanceKm() > 1000 ? 850 : 600;", "    }", "}"], "lab/sample/speed/WalkSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** À pied : 5 km/h, la vitesse de marche de tout le monde. */", "public final class WalkSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return 5;", "    }", "}"], "lab/sample/speed/CarSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** En voiture : plus l'étape est longue, plus on roule vite (ville puis voie rapide). */", "public final class CarSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        if (leg.distanceKm() < 5) {", "            return 25;   // trajet urbain", "        }", "        return leg.distanceKm() < 40 ? 70 : 110;", "    }", "}"], "lab/sample/speed/SpeedModel.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** Vitesse moyenne d'un mode de transport sur une étape.", " *", " *  <p>Point de <b>dispatch virtuel</b> du programme : l'appel part toujours de", " *  l'interface, mais c'est l'implémentation concrète qui travaille. Un bon arbre", " *  d'appel doit nommer l'implémentation réellement exécutée ; certains outils", " *  s'arrêtent à l'interface, et c'est une différence qui se voit tout de suite. */", "public interface SpeedModel {", "    double kmPerHour(Leg leg);", "}"], "lab/sample/transfer/Timetable.java": ["package lab.sample.transfer;", "", "import lab.sample.model.Leg;", "", "import java.util.Map;", "import java.util.concurrent.ConcurrentHashMap;", "", "/**", " * Consultation des horaires — la seule opération <b>bloquante</b> du programme.", " *", " * <p>Elle simule un appel à un service extérieur par un {@code Thread.sleep}. Sa", " * présence n'est pas décorative : elle crée du <em>temps d'attente</em> à côté du temps", " * de calcul, et c'est un excellent discriminant entre outils. Un profiler qui échantillonne", " * le CPU ne la verra pratiquement pas ; un profiler en temps réel (wall clock) la verra", " * dominer. Deux outils peuvent donc donner deux réponses opposées à « où passe le temps ? »", " * sur exactement la même exécution — et il faut savoir laquelle on regarde.", " *", " * <p>Le résultat est mis en cache : un horaire ne se demande qu'une fois par liaison.", " */", "public final class Timetable {", "", "    private static final Map<String, Integer> CACHE = new ConcurrentHashMap<>();", "    private static final int LOOKUP_MILLIS = 3;", "", "    private Timetable() {}", "", "    /** @return la fréquence de passage, en minutes, pour cette liaison. */", "    public static int frequencyMinutes(Leg leg) {", "        return CACHE.computeIfAbsent(leg.from() + \">\" + leg.to(), key -> {", "            try {", "                Thread.sleep(LOOKUP_MILLIS); // appel réseau simulé", "            } catch (InterruptedException e) {", "                Thread.currentThread().interrupt();", "            }", "            return 10 + (Math.abs(key.hashCode()) % 50);", "        });", "    }", "}"], "lab/sample/transfer/Connections.java": ["package lab.sample.transfer;", "", "import lab.sample.model.Leg;", "", "import java.util.List;", "", "/**", " * Temps d'attente aux correspondances — propre au train.", " *", " * <p>Le calcul est <b>récursif</b> sur la liste des étapes : il ajoute un foyer de", " * récursion distinct de celui de {@code comfort.Breaks}, dans une branche que seuls", " * certains scénarios empruntent. Utile pour vérifier qu'un outil ne confond pas deux", " * récursions différentes dans le même arbre.", " */", "public final class Connections {", "", "    private Connections() {}", "", "    public static double waitMinutes(List<Leg> legs, int index) {", "        if (index >= legs.size() - 1) {", "            return 0; // dernière étape : plus de correspondance après", "        }", "        double here = transferMinutes(legs.get(index), legs.get(index + 1));", "        return here + waitMinutes(legs, index + 1);", "    }", "", "    private static double transferMinutes(Leg arriving, Leg departing) {", "        // Une correspondance dans la même gare est plus rapide qu'un changement de gare,", "        // et l'attente dépend de la fréquence de passage — donc d'une consultation", "        // d'horaires, seule opération bloquante du programme.", "        double walk = arriving.to().equals(departing.from()) ? 6 : 18;", "        return walk + Timetable.frequencyMinutes(departing) / 2.0;", "    }", "}"], "lab/sample/comfort/Breaks.java": ["package lab.sample.comfort;", "", "/**", " * Pauses obligatoires sur les longs trajets.", " *", " * <p>Particularité volontaire : la décision se prend sur une <b>valeur calculée</b>", " * (la durée obtenue jusque-là) et non sur un argument reçu tel quel. Un outil qui ne", " * capture que les arguments d'entrée de la fonction analysée ne saura pas expliquer", " * pourquoi cette branche a été prise — alors qu'elle change le résultat.", " */", "public final class Breaks {", "", "    /** Au-delà de 2 h de conduite ou de marche, on s'arrête. */", "    public static final double THRESHOLD_MINUTES = 120;", "", "    private Breaks() {}", "", "    public static int count(double travelMinutes) {", "        if (travelMinutes < THRESHOLD_MINUTES) {", "            return 0;", "        }", "        return (int) (travelMinutes / THRESHOLD_MINUTES);", "    }", "", "    public static double totalMinutes(double travelMinutes) {", "        return count(travelMinutes) * 15.0;", "    }", "}"], "lab/sample/terrain/Terrain.java": ["package lab.sample.terrain;", "", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "", "/**", " * Ralentissement dû au relief, moyenné sur les sous-segments d'une étape.", " *", " * <p>Deux raisons d'exister :", " * <ul>", " *   <li>c'est le <b>cœur de calcul</b> du programme — sans lui, l'application passe son", " *       temps dans les itérateurs du JDK et un profiler ne montre rien du métier ;</li>", " *   <li>il n'est appelé que pour les modes sensibles au terrain : le train suit une voie", " *       ferrée dont la pente est négligeable, il saute donc tout ce sous-arbre.</li>", " * </ul>", " */", "public final class Terrain {", "", "    /** Nombre de sous-segments analysés par étape. */", "    private static final int STEPS = 24;", "", "    private Terrain() {}", "", "    public static boolean applies(Mode mode) {", "        return mode != Mode.TRAIN;", "    }", "", "    public static double slowdownFactor(Leg leg, Mode mode) {", "        double sum = 0;", "        for (int step = 0; step < STEPS; step++) {", "            double grade = Elevation.gradePercentAt(leg, step);", "            sum += penaltyFor(grade, mode);", "        }", "        return sum / STEPS;", "    }", "", "    /** Une montée coûte plus qu'une descente ne rapporte, et d'autant plus qu'on est", "     *  à la force du mollet. */", "    private static double penaltyFor(double gradePercent, Mode mode) {", "        double sensitivity = switch (mode) {", "            case BIKE -> 0.09;", "            case WALK -> 0.05;", "            case CAR -> 0.01;", "            case TRAIN -> 0.00;", "            case PLANE -> 0.00;", "        };", "        if (gradePercent > 0) {", "            return 1.0 + gradePercent * sensitivity;", "        }", "        return 1.0 + gradePercent * sensitivity * 0.3; // la descente ne compense qu'en partie", "    }", "}"], "lab/sample/terrain/Elevation.java": ["package lab.sample.terrain;", "", "import lab.sample.model.Leg;", "", "/** Relief le long d'une étape, échantillonné en sous-segments.", " *", " *  <p>Déterministe : le profil d'une étape donnée est toujours le même, sinon deux", " *  exécutions ne seraient plus comparables. */", "public final class Elevation {", "", "    private Elevation() {}", "", "    /** @return la pente du {@code step}-ième sous-segment, en pourcentage (−8 % à +8 %). */", "    public static double gradePercentAt(Leg leg, int step) {", "        // Arithmétique simple plutôt que Math.sin/cos : les intrinsèques trigonométriques", "        // apparaissaient comme feuilles dominantes du profil (dsin/dcos, ~50 % des", "        // échantillons), ce qui rendait l'arbre d'appel illisible pour qui cherche les", "        // méthodes métier. Le relief reste déterministe et varié.", "        double phase = (Math.abs(leg.from().hashCode()) % 17) + step;", "        double wave = ((phase * 37) % 21) - 10.0;          // -10 .. +10, en dents de scie", "        double smooth = wave * (1.0 - Math.abs(wave) / 25.0);", "        return smooth * 0.8;", "    }", "}"], "lab/sample/model/Mode.java": ["package lab.sample.model;", "", "/** Comment on se déplace. C'est le principal <b>aiguilleur</b> du calcul : chaque mode", " *  active une famille de calculs différente (bouchons pour la voiture, correspondances", " *  pour le train, météo pour le vélo et la marche).", " *", " *  <p>{@code PLANE} n'est jamais choisi par les scénarios : la classe de vitesse", " *  correspondante doit rester à 0 % dans un rapport de couverture. */", "public enum Mode { CAR, TRAIN, BIKE, WALK, PLANE }"], "lab/sample/model/Weather.java": ["package lab.sample.model;", "", "/** Météo du jour. {@code SNOW} n'est jamais tiré par les scénarios : second trou de", " *  couverture volontaire, à l'intérieur d'une classe par ailleurs bien couverte —", " *  un cas que les rapports agrégés par package ont tendance à diluer. */", "public enum Weather { SUNNY, RAIN, SNOW }"], "lab/sample/model/Leg.java": ["package lab.sample.model;", "", "/** Une étape du trajet : une portion parcourue d'un seul tenant. */", "public record Leg(String from, String to, double distanceKm) {}"], "lab/sample/model/TimeOfDay.java": ["package lab.sample.model;", "", "/** Moment de la journée. Seule {@code RUSH_HOUR} déclenche le calcul de bouchons,", " *  et seulement en voiture : c'est l'exemple le plus simple d'une fonction appelée", " *  ou non selon le contexte. */", "public enum TimeOfDay { QUIET, RUSH_HOUR, NIGHT }"], "lab/sample/model/Trip.java": ["package lab.sample.model;", "", "import java.util.List;", "", "/**", " * Le trajet dont on veut connaître la durée — <b>le paramètre dont on veut voir la", " * valeur capturée</b>.", " *", " * <p>Chaque champ envoie l'exécution dans une branche différente. C'est ce qui rend la", " * question « quelles valeurs ont été passées ? » décisive : deux appels de même", " * signature peuvent parcourir des sous-arbres complètement disjoints, et un outil qui", " * n'affiche que {@code Trip@3f2a1b} ne permet pas de savoir lequel des deux on regarde.", " */", "public record Trip(", "        String id,", "        Mode mode,", "        Weather weather,", "        TimeOfDay timeOfDay,", "        boolean withLuggage,   // ne pèse qu'à vélo et à pied", "        List<Leg> legs) {", "", "    public double totalDistanceKm() {", "        double km = 0;", "        for (Leg leg : legs) {", "            km += leg.distanceKm();", "        }", "        return km;", "    }", "}"], "lab/sample/weather/WeatherPenalty.java": ["package lab.sample.weather;", "", "import lab.sample.model.Mode;", "import lab.sample.model.Weather;", "", "/**", " * Ralentissement dû à la météo.", " *", " * <p>Ne concerne que les modes exposés — vélo et marche. La branche {@code SNOW} n'est", " * jamais empruntée : c'est un trou de couverture <em>à l'intérieur</em> d'une méthode", " * par ailleurs exécutée des milliers de fois. Un rapport qui n'affiche qu'un", " * pourcentage par classe le masque ; un rapport qui colorie les lignes le montre.", " */", "public final class WeatherPenalty {", "", "    private WeatherPenalty() {}", "", "    public static boolean applies(Mode mode) {", "        return mode == Mode.BIKE || mode == Mode.WALK;", "    }", "", "    public static double slowdownFactor(Weather weather) {", "        return switch (weather) {", "            case SUNNY -> 1.00;", "            case RAIN -> 1.15;", "            case SNOW -> 1.60;", "        };", "    }", "}"], "lab/sample/weather/LuggagePenalty.java": ["package lab.sample.weather;", "", "/** Ralentissement dû aux bagages. Double condition : il faut des bagages <b>et</b> un", " *  mode où ils gênent. Deux conditions imbriquées = une branche qu'on n'atteint que", " *  dans une minorité de scénarios. */", "public final class LuggagePenalty {", "", "    private LuggagePenalty() {}", "", "    public static double slowdownFactor(boolean withLuggage) {", "        return withLuggage ? 1.10 : 1.00;", "    }", "}"]}};
// Plusieurs exécutions peuvent cohabiter dans le même rapport. R désigne celle qu'on
// regarde ; tout le reste de la page lit R, jamais D directement (sauf les sources,
// communes à toutes les exécutions).
let runIndex = 0;
let R = D.runs[0];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const dot = s => s.replace(/\//g,".");
let clean = true, mode = "exec", scopeFrame = null, selected = null, filter = "", ctxIndex = 0;
// Un nœud d'arbre d'appel désigne un CHEMIN, pas un appel : le profil est un agrégat.
// Les appels individuels viennent de l'inspection, et chacun est sélectionnable à part.
// callIndex vaut null quand on regarde la méthode, ou l'indice de l'appel regardé.
let callIndex = null;
// Les listes « Code exécuté » et « Packages » peuvent réunir plusieurs exécutions : on
// coche celles qu'on veut voir. La vue de code, elle, reste rattachée à UNE exécution —
// couverture et valeurs n'ont de sens que dans celle où l'appel a eu lieu.
let shownRuns = new Set(D.runs.map((_, i) => i));
// Deux façons de lire le temps : la part du total, ou une durée estimée. La seconde parle
// davantage à qui cherche « combien de temps », la première à qui compare deux méthodes.
let unit = "pct";
// Les noms de paquet complets rendent l'arbre illisible sur un projet à l'arborescence
// profonde ; on peut les replier d'un bouton.
let showPackages = true;
// Par défaut, l'ordre alphabétique : on cherche une méthode qu'on connaît. Le classement
// par temps répond à une autre question, et reste accessible d'un bouton.
let sortBy = "nom";
// Dans la vue par structure : ne montrer que ce qui a tourné, ou tout le code du projet.
// Quand on montre tout, il faut distinguer d'un coup d'œil ce qui a servi de ce qui dort.
let executedOnly = true;

/** Nom d'une frame, avec ou sans son paquet, selon le réglage. */
function frameLabel(frame){
  const full = dot(frame);
  if (showPackages) return full;
  const parts = full.split(".");
  return parts.length <= 2 ? full : parts.slice(-2).join(".");
}

/** Un relevé est pris toutes les millisecondes de temps processeur : le compte d'échantillons
 *  d'une méthode est donc, à peu de chose près, son temps processeur en millisecondes. */
function formatWeight(samples, total){
  if (!samples) return "·";
  if (unit === "pct"){
    const share = 100 * samples / (total || 1);
    return share >= 0.05 ? share.toFixed(1) + "%" : "·";
  }
  const ms = samples * (R.intervalMs || 1);
  if (ms >= 10000) return (ms / 1000).toFixed(1) + "s";
  if (ms >= 1000) return (ms / 1000).toFixed(2) + "s";
  return Math.round(ms) + "ms";
}

/* ---------------------------------------------------------------- agrégats */
function ranIn(run, frame){
  const cls = frame.slice(0, frame.lastIndexOf("."));
  const name = frame.slice(frame.lastIndexOf(".") + 1);
  const info = run.methods[cls];
  return !!(info && info.methods.some(m => m.name === name && m.covered));
}
function computeAgg(){
  let cov=0, miss=0; const dead=[];
  for (const classes of Object.values(R.packages))
    for (const c of classes){ cov+=c.covered; miss+=c.missed; if(!c.covered) dead.push(c.simple); }
  const weights = {};
  (function walk(n){ for(const k of n.children){ weights[k.name]=(weights[k.name]||0)+k.total; walk(k);} })(R.calltree);
  let methods=0;
  for (const info of Object.values(R.methods)) methods += info.methods.filter(m=>m.covered).length;
  return {cov, miss, dead, weights, methods,
          pct: cov+miss ? 100*cov/(cov+miss) : 0, samples: R.calltree.total};
}
let AGG = computeAgg();

(function initRuns(){
  if (D.runs.length < 2) return;
  document.getElementById("runpick").hidden = false;
  const box = document.getElementById("runboxes");
  box.innerHTML = D.runs.map((r, i) =>
    '<label><input type="checkbox" data-run="' + i + '" checked> ' +
    esc(r.nom) + '<span class="cnt">' + methodCount(r) + ' méthodes</span></label>').join("");
  box.querySelectorAll("input[data-run]").forEach(cb => cb.onchange = () => {
    const i = +cb.dataset.run;
    cb.checked ? shownRuns.add(i) : shownRuns.delete(i);
    if (!shownRuns.size){ shownRuns.add(i); cb.checked = true; return; }  // jamais rien à voir
    mode === "cls" ? renderClasses() : renderTree();
  });
})();

function methodCount(run){
  let n = 0;
  for (const info of Object.values(run.methods)) n += info.methods.filter(m => m.covered).length;
  return n;
}

function switchRun(i, redraw){
  runIndex = i; R = D.runs[i]; AGG = computeAgg(); methodIndex = null;
  scopeFrame = null; ctxIndex = 0;
  const sel = document.getElementById("runsel");
  if (sel && !sel.hidden) sel.value = String(i);
  refreshHeader(); refreshLinks();
  if (redraw){ selected = null; renderTree(); drawHome(); }
}

refreshHeader();

  '<span class="sw" style="background:var(--full);border-color:var(--fullbar)"></span>exécutée' +
