<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vue intégrée — Runtime X-Ray</title>
<style>
  :root{
    --bg:#fff; --panel:#f6f8fa; --panel2:#fbfcfd; --border:#d0d7de; --text:#1f2328;
    --muted:#59636e; --accent:#0969da; --accent-soft:#ddf4ff;
    --full:#dafbe1; --part:#fff8c5; --miss:#ffebe9;
    --fullbar:#1a7f37; --partbar:#9a6700; --missbar:#cf222e; --violet:#8250df;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1117; --panel:#151b23; --panel2:#10151c; --border:#30363d; --text:#e6edf3;
      --muted:#9198a1; --accent:#4493f8; --accent-soft:#121d2f;
      --full:#12261c; --part:#2b2412; --miss:#2d1416;
      --fullbar:#3fb950; --partbar:#d29922; --missbar:#f85149; --violet:#ab7df8;
    }
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  header{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;
         align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
  header h1 a{color:inherit;text-decoration:none}
  header h1 a:hover{color:var(--accent)}
  .crumb .back{display:inline-flex;align-items:center;gap:5px;color:#fff;background:var(--accent);
               border-radius:15px;padding:3px 11px;font-size:12px;font-weight:600;
               cursor:pointer;text-decoration:none}
  .crumb .back:hover{filter:brightness(1.12)}
  /* Une seule icône d'application : les badges des trois outils invitaient à cliquer
     alors qu'ils n'étaient qu'informatifs. Leur explication vit dans la légende, en bas. */
  .applogo{display:flex;align-items:center}
  .stat{color:var(--muted);font-size:12.5px} .stat b{color:var(--text)}
  .spacer{margin-left:auto}
  .cleanbtn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;
            font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;
            border:1px solid var(--border);background:var(--bg);color:var(--muted)}
  .cleanbtn:hover{border-color:var(--accent);color:var(--accent)}
  .cleanbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--missbar);opacity:.55}
  .cleanbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .cleanbtn[aria-pressed="true"] .dot{background:#fff;opacity:1}
  .links{font-size:12px;color:var(--muted)} .links a{margin-left:10px}
  .reserve{border:1px solid var(--border);border-left:3px solid var(--partbar);
           border-radius:6px;background:var(--panel);padding:12px 15px;color:var(--muted);
           font-size:12.5px;margin-top:22px}
  .reserve b{color:var(--text)}
  main{display:grid;grid-template-columns:var(--navw,330px) 6px 1fr;height:calc(100% - 47px)}
  @media(max-width:860px){main{grid-template-columns:1fr;height:auto} .split{display:none}}
  /* Séparateurs déplaçables : glisser pour redimensionner, double-cliquer pour replier
     entièrement le panneau voisin — utile quand on veut le code plein écran. */
  .split{background:var(--border);cursor:col-resize;position:relative}
  .split:hover,.split.dragging{background:var(--accent)}
  .split::after{content:"";position:absolute;inset:0 -4px}
  .split.h{cursor:row-resize;height:6px}
  .splitlabel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
              font-size:9px;color:var(--bg);pointer-events:none}
  #nav{border-right:1px solid var(--border);background:var(--panel2);
       display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--border)}
  .tabs button{flex:1;padding:8px 4px;background:none;border:0;border-bottom:2px solid transparent;
               color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  #search{margin:8px;padding:5px 9px;border:1px solid var(--border);border-radius:6px;
          background:var(--bg);color:var(--text);font:inherit;font-size:12.5px}
  #scope{padding:7px 10px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--muted)}
  #scope b{color:var(--text)}
  #scope button{margin-top:5px;font:inherit;font-size:11px;background:var(--bg);color:var(--accent);
                border:1px solid var(--border);border-radius:5px;padding:2px 7px;cursor:pointer}
  .list{overflow:auto;flex:1 1 auto;min-height:0;padding:4px 4px 24px}
  .node{padding:2px 7px;border-radius:5px;cursor:pointer;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .node:hover{background:var(--accent-soft)}
  .node.sel{background:var(--accent);color:#fff}
  .node .pct{color:var(--muted);font-size:11px;margin-right:6px;display:inline-block;
             width:38px;text-align:right;font-variant-numeric:tabular-nums}
  .node.sel .pct{color:#e8f0fb}
  .node .tw{display:inline-block;width:11px;color:var(--muted)}
  .node.jdk{color:var(--muted)}
  .tagval{font-size:10px;border:1px solid var(--violet);color:var(--violet);
          border-radius:10px;padding:0 5px;vertical-align:1px}
  .node.sel .tagval{border-color:#fff;color:#fff}
  .grouphead{padding:6px 8px 2px;color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
  #detail{display:flex;flex-direction:column;min-height:0}
  .crumb{padding:9px 16px;border-bottom:1px solid var(--border);font-size:13px;
         display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .crumb b{font-weight:650} .crumb span{color:var(--muted)}
  .pill{font-size:11px;border:1px solid var(--border);border-radius:20px;padding:1px 8px;color:var(--muted)}
  #context{display:none;padding:7px 16px;border-bottom:1px solid var(--border);background:var(--panel2)}
  .ctxlabel{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
  .ctxpath{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
           padding:3px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent}
  .ctxpath:hover{background:var(--accent-soft)}
  .ctxpath.on{border-color:var(--accent);background:var(--accent-soft)}
  .ctxpath .share{display:inline-block;width:38px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ctxpath a{color:var(--accent);text-decoration:none}
  .ctxpath a:hover{text-decoration:underline}
  .ctxpath a.cur{color:var(--text);font-weight:600}
  .ctxpath .sep{color:var(--muted)}
  #code{overflow:auto;flex:1 1 auto;min-height:0;padding-bottom:24px}
  table.src{border-collapse:collapse;width:100%;
            font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  table.src td{padding:0 6px;vertical-align:top;white-space:pre}
  td.n{text-align:right;color:var(--muted);user-select:none;width:1%;
       border-right:1px solid var(--border);font-variant-numeric:tabular-nums}
  tr.full td.c{background:var(--full)} tr.part td.c{background:var(--part)} tr.miss td.c{background:var(--miss)}
  td.c{width:99%}
  tr.inmethod td.n{color:var(--accent);font-weight:700}
  td.ann{color:var(--muted);font-size:11px;width:1%;max-width:300px;text-align:right;
         white-space:normal;padding-left:14px}
  td.ann a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
  td.ann .dur{opacity:.6}
  td.ann a.values{color:var(--violet);border-bottom-color:var(--violet);font-weight:600}
  .fold{color:var(--muted);font-style:italic;padding:2px 12px;font-size:11.5px;
        background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  #values{background:var(--panel);padding:10px 16px;overflow:auto;
          height:var(--valh,190px);flex:0 0 auto}
  #values:empty{display:none} #values:empty + .legend{border-top:1px solid var(--border)}
  #values h3{margin:0 0 6px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
  #values h3 code{text-transform:none;letter-spacing:0;color:var(--text);font-size:12px}
  .sig{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
       color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:5px;
       padding:4px 8px;margin-bottom:7px;display:inline-block}
  .explain{color:var(--muted);font-size:11.5px;margin-bottom:8px}
  .explain b{color:var(--text)}
  .call{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
        padding:5px 0;border-bottom:1px solid var(--border);display:grid;
        grid-template-columns:1fr 18px minmax(90px,auto) 84px;gap:8px;align-items:baseline}
  .callhead{display:grid;grid-template-columns:1fr 18px minmax(90px,auto) 84px;gap:8px;
            font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);
            padding-bottom:4px;border-bottom:1px solid var(--border)}
  .callhead span:nth-child(2){grid-column:3}
  .call .v{color:var(--violet)} .call .sep{color:var(--muted)}
  .call .arrow{color:var(--muted);text-align:center}
  .call .t{color:var(--muted);opacity:.65;text-align:right;font-size:10.5px}
  .legend{padding:7px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin:0 4px 0 10px}
  .home{padding:26px 32px;max-width:820px}
  .home h2{font-size:17px;margin:0 0 6px}
  .home p{color:var(--muted);margin:0 0 18px}
  .home .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
  @media(max-width:700px){.home .cards{grid-template-columns:1fr}}
  .card{border:1px solid var(--border);border-radius:9px;padding:13px 15px;background:var(--panel);
        border-left:4px solid var(--muted)}
  .card.c1{border-left-color:var(--fullbar)} .card.c1 .k{color:var(--fullbar)}
  .card.c2{border-left-color:var(--accent)}   .card.c2 .k{color:var(--accent)}
  .card.c3{border-left-color:var(--partbar)}  .card.c3 .k{color:var(--partbar)}
  .card.c4{border-left-color:var(--violet)}   .card.c4 .k{color:var(--violet)}
  .card .k{font-size:24px;font-weight:700} .card .l{color:var(--muted);font-size:12.5px}
  .card.c1 .k{color:var(--fullbar)} .card.c2 .k{color:var(--accent)}
  .card.c3 .k{color:var(--partbar)} .card.c4 .k{color:var(--violet)}
  .bar{height:9px;border-radius:6px;background:var(--miss);overflow:hidden;margin:2px 0 20px}
  .bar span{display:block;height:100%;background:var(--fullbar)}
  .chip{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11.5px;border-radius:5px;padding:2px 7px;margin:0 5px 5px 0}
  .chip.dead{background:var(--miss);color:var(--missbar);border:1px solid var(--missbar)}
  .chip.hot{background:var(--part);color:var(--partbar);border:1px solid var(--partbar)}
  .home h2{font-size:17px;margin:22px 0 6px;padding-left:9px;border-left:3px solid var(--accent)}
  .links2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  @media(max-width:700px){.links2{grid-template-columns:1fr}}
  a.lk{display:block;border:1px solid var(--border);border-radius:8px;padding:10px 13px;
       text-decoration:none;background:var(--panel);transition:.15s}
  a.lk:hover{border-color:var(--accent);background:var(--accent-soft)}
  .lkt{display:block;color:var(--accent);font-weight:600;font-size:13.5px;margin-bottom:2px}
  .lkd{display:block;color:var(--muted);font-size:12px;line-height:1.45}
  .home ol{color:var(--muted);padding-left:20px} .home ol li{margin:6px 0}
  .home ul.tools{color:var(--muted);padding-left:20px} .home ul.tools li{margin:4px 0}
  .home ul.tools b{color:var(--text)}
  .home code{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px}
  table.ctx{border-collapse:collapse;width:100%;margin-bottom:20px}
  table.ctx td{padding:5px 10px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}
  td.ck{color:var(--muted);white-space:nowrap;width:1%}
  td.cv{word-break:break-word}
</style>
</head>

<header>
  <span class="applogo" aria-hidden="true">
    <svg viewBox="0 0 32 32" width="26" height="26">
      <rect width="32" height="32" rx="8" fill="#0d1117"/>
      <rect width="32" height="32" rx="8" fill="#38bdf8" fill-opacity=".10"/>
      <rect x="8" y="9" width="13" height="2.6" rx="1.3" fill="#3fb950"/>
      <rect x="8" y="14" width="9" height="2.6" rx="1.3" fill="#3fb950"/>
      <rect x="8" y="19" width="6" height="2.6" rx="1.3" fill="#f85149"/>
      <rect x="5" y="15.6" width="22" height="1.2" rx=".6" fill="#7dd3fc" fill-opacity=".85"/>

      </g>
    </svg>
  </span>
  <h1><a href="#" id="home" title="Revenir à la vue d'ensemble">Runtime X-Ray</a></h1>
  <div class="stat" id="stats"></div>
  <span class="spacer"></span>
  <span class="links" id="links"></span>
  <button id="clean" class="cleanbtn" aria-pressed="true"
          title="Resserré : seule la méthode sélectionnée est affichée, sans ses lignes mortes">
    <span class="dot"></span> Resserré sur la méthode
  </button>
</header>
<main>
  <div id="nav">
    <div class="tabs">
      <button id="tab-exec" class="on">Code exécuté</button>
      <button id="tab-tree">Arbre d'appel</button>
      <button id="tab-cls">Packages</button>
    </div>
    <input id="search" placeholder="Filtrer…" autocomplete="off">
    <div id="scope"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="split" id="vsplit" title="Glisser pour redimensionner · double-clic pour replier"></div>
  <div id="detail">
    <div class="crumb" id="crumb"></div>
    <div id="context"></div>
    <div id="code"></div>
    <div class="split h" id="hsplit" title="Glisser pour redimensionner · double-clic pour replier"></div>
    <div id="values"></div>
    <div class="legend" id="legend"></div>
  </div>
</main>

te static final Mode[] MODES = {Mode.CAR, Mode.TRAIN, Mode.BIKE, Mode.WALK};", "    private static final Weather[] WEATHERS = {Weather.SUNNY, Weather.RAIN};", "    private static final TimeOfDay[] TIMES = {TimeOfDay.QUIET, TimeOfDay.RUSH_HOUR, TimeOfDay.NIGHT};", "    private static final String[] PLACES = {\"Toulouse\", \"Albi\", \"Montauban\", \"Castres\", \"Auch\", \"Foix\"};", "", "    static Trip at(int i) {", "        Mode mode = MODES[i % MODES.length];", "        Weather weather = WEATHERS[(i / 4) % WEATHERS.length];", "        TimeOfDay time = TIMES[(i / 8) % TIMES.length];", "        boolean luggage = (i % 5) == 0;", "", "        int legCount = 1 + (i % 4);", "        List<Leg> legs = new ArrayList<>(legCount);", "        for (int l = 0; l < legCount; l++) {", "            String from = PLACES[(i + l) % PLACES.length];", "            String to = PLACES[(i + l + 1) % PLACES.length];", "            double km = 2 + ((i + l * 7) % 60);", "            legs.add(new Leg(from, to, km));", "        }", "        // Concaténation simple et non \"TRIP-%05d\".formatted(i) : le formatage coûtait à lui", "        // seul ~40 % du temps CPU et écrasait le calcul dans le flame graph. Le profil doit", "        // montrer la logique évaluée, pas la fabrication du jeu de test.", "        return new Trip(\"TRIP-\" + i, mode, weather, time, luggage, List.copyOf(legs));", "    }", "}"], "lab/sample/RoutePlanner.java": ["package lab.sample;", "", "import lab.sample.comfort.Breaks;", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "import lab.sample.model.Trip;", "import lab.sample.speed.SpeedModel;", "import lab.sample.speed.Speeds;", "import lab.sample.terrain.Terrain;", "import lab.sample.traffic.Traffic;", "import lab.sample.transfer.Connections;", "import lab.sample.weather.LuggagePenalty;", "import lab.sample.weather.WeatherPenalty;", "", "/**", " * <b>La fonction sous analyse.</b> « Combien de temps pour aller de A à B ? »", " *", " * <p>C'est le point d'entrée que chaque outil doit savoir cibler : à l'exécution de", " * cette fonction, donne-moi les lignes exécutées, l'arbre d'appel et les valeurs des", " * paramètres.", " *", " * <p>Elle appelle quatre familles de calcul <b>selon le contexte</b>, jamais toutes en", " * même temps :", " * <ul>", " *   <li>la vitesse du mode choisi — toujours, mais via une implémentation différente ;</li>", " *   <li>les bouchons — voiture à l'heure de pointe uniquement ;</li>", " *   <li>la météo et les bagages — vélo et marche uniquement ;</li>", " *   <li>les correspondances — train uniquement ;</li>", " *   <li>les pauses — au-delà d'une durée <em>calculée</em>, quel que soit le mode.</li>", " * </ul>", " * Deux trajets différents produisent donc deux arbres d'appel différents, à partir du", " * même appel de la même méthode. C'est précisément ce qu'on demande aux outils de montrer.", " */", "public final class RoutePlanner {", "", "    private RoutePlanner() {}", "", "    /**", "     * @param trip le trajet à évaluer", "     * @return la durée totale estimée, en minutes", "     */", "    public static double travelTimeMinutes(Trip trip) {", "        SpeedModel speed = Speeds.forMode(trip.mode());", "", "        double minutes = 0;", "        // Boucle indexée volontairement : la boucle for-each sur une List immuable", "        // allouait un itérateur par étape, qui représentait à lui seul la moitié des", "        // échantillons. Constaté au profiler, corrigé, re-mesuré.", "        for (int i = 0; i < trip.legs().size(); i++) {", "            minutes += legMinutes(trip.legs().get(i), speed, trip.mode());", "        }", "", "        if (Traffic.applies(trip.mode(), trip.timeOfDay())) {", "            minutes += Traffic.delayMinutes(trip.legs());", "        }", "", "        if (WeatherPenalty.applies(trip.mode())) {", "            minutes *= WeatherPenalty.slowdownFactor(trip.weather());", "            minutes *= LuggagePenalty.slowdownFactor(trip.withLuggage());", "        }", "", "        if (trip.mode() == Mode.TRAIN) {", "            minutes += Connections.waitMinutes(trip.legs(), 0);", "        }", "", "        // Décidé sur la durée obtenue, pas sur un argument reçu : voir Breaks.", "        minutes += Breaks.totalMinutes(minutes);", "", "        return minutes;", "    }", "", "    private static double legMinutes(Leg leg, SpeedModel speed, Mode mode) {", "        double minutes = leg.distanceKm() / speed.kmPerHour(leg) * 60.0;", "        if (Terrain.applies(mode)) {", "            minutes *= Terrain.slowdownFactor(leg, mode);", "        }", "        return minutes;", "    }", "}"], "lab/sample/Main.java": ["package lab.sample;", "", "import lab.sample.model.Trip;", "", "import java.util.ArrayList;", "import java.util.List;", "", "/**", " * Lanceur de l'application-cible.", " *", " * <p>Deux options n'existent que pour les besoins de l'analyse :", " * <ul>", " *   <li>{@code --iterations} — un profiler par échantillonnage n'a rien à montrer sur", " *       une exécution de 5 ms ; il faut du temps CPU pour que des frames soient prélevées.</li>", " *   <li>{@code --hold-seconds} — les outils qui s'<em>attachent</em> à un process vivant", " *       (VisualVM, JMC, JProfiler, YourKit) ont besoin que la JVM soit encore là quand", " *       l'opérateur clique. Sans cette pause, la cible est morte avant d'avoir été", " *       sélectionnée dans la liste.</li>", " * </ul>", " */", "public final class Main {", "", "    /** Nombre de trajets distincts fabriqués avant la mesure. Assez pour couvrir toutes", "     *  les combinaisons mode × météo × horaire × bagages, assez peu pour que leur", "     *  fabrication ne pèse rien face à la boucle de calcul. */", "    private static final int TRIP_VARIANTS = 240;", "", "    /** Calibré pour que le calcul dure ~10 s sur un Mac Apple Silicon. C'est le minimum", "     *  confortable pour qu'un outil qui s'attache à un process vivant (VisualVM, JMC,", "     *  JProfiler) ait le temps d'être lancé, de sélectionner la JVM et d'enregistrer", "     *  quelque chose. Une exécution d'une seconde ne laisse aucune prise. */", "    private static final int DEFAULT_ITERATIONS = 16_000_000;", "", "    public static void main(String[] args) throws InterruptedException {", "        int iterations = intArg(args, \"--iterations\", DEFAULT_ITERATIONS);", "        int holdSeconds = intArg(args, \"--hold-seconds\", 0);", "", "        System.out.printf(\"sample-app : %d trajets évalués, pause finale %d s%n\", iterations, holdSeconds);", "        Metrics metrics = new Metrics();", "        metrics.stage(\"JVM démarrée\");", "", "        // Les trajets sont fabriqués UNE FOIS, hors de la boucle mesurée.", "        // Sans cette séparation, la génération du jeu de test (concaténations de chaînes,", "        // allocations de listes) capte ~70 % des échantillons et l'arbre d'appel montre", "        // java.lang.StringConcatHelper au lieu du calcul d'itinéraire. Mesuré, pas supposé.", "        List<Trip> trips = new ArrayList<>(TRIP_VARIANTS);", "        for (int i = 0; i < TRIP_VARIANTS; i++) {", "            trips.add(Scenarios.at(i));", "        }", "", "        metrics.stage(\"jeu de trajets fabriqué\");", "", "        double total = 0;", "        for (int i = 0; i < iterations; i++) {", "            total += RoutePlanner.travelTimeMinutes(trips.get(i % TRIP_VARIANTS));", "        }", "        // Imprimé pour que le calcul ne puisse pas être éliminé, et pour vérifier d'un", "        // coup d'œil que deux exécutions comparées ont bien fait le même travail.", "        metrics.stage(\"calcul terminé\");", "        System.out.printf(\"durée cumulée = %.0f minutes%n\", total);", "", "        if (holdSeconds > 0) {", "            System.out.printf(\"JVM maintenue en vie %d s — attache ton profiler (pid %d)%n\",", "                    holdSeconds, ProcessHandle.current().pid());", "            Thread.sleep(holdSeconds * 1000L);", "        }", "    }", "", "    private static int intArg(String[] args, String name, int fallback) {", "        for (int i = 0; i < args.length - 1; i++) {", "            if (args[i].equals(name)) {", "                return Integer.parseInt(args[i + 1]);", "            }", "        }", "        return fallback;", "    }", "}"], "lab/sample/Metrics.java": ["package lab.sample;", "", "/**", " * Mesures d'étape : temps écoulé et mémoire occupée.", " *", " * <p>Volontairement fondé sur le seul JDK ({@code System.nanoTime}, {@code Runtime}) :", " * ces chiffres servent de <b>référence indépendante</b>. Quand un outil d'analyse annonce", " * un temps ou une empreinte, on veut pouvoir le confronter à une mesure qui ne vient pas", " * de lui — et constater au passage combien l'outil lui-même ralentit l'exécution.", " *", " * <p>La mémoire est lue après un appel à {@code System.gc()} : sans lui, on mesure surtout", " * les déchets pas encore ramassés, ce qui ne veut rien dire. L'appel reste une", " * <em>suggestion</em> faite à la JVM, jamais une garantie — d'où l'ordre de grandeur", " * annoncé plutôt qu'une valeur exacte.", " */", "public final class Metrics {", "", "    private final long startNanos = System.nanoTime();", "    private long lastNanos = startNanos;", "", "    void stage(String label) {", "        long now = System.nanoTime();", "        double sinceLastMs = (now - lastNanos) / 1_000_000.0;", "        double totalMs = (now - startNanos) / 1_000_000.0;", "        lastNanos = now;", "", "        System.gc();", "        Runtime runtime = Runtime.getRuntime();", "        long usedMb = (runtime.totalMemory() - runtime.freeMemory()) / (1024 * 1024);", "        long maxMb = runtime.maxMemory() / (1024 * 1024);", "", "        System.out.printf(\"  [%-28s] étape %8.0f ms | cumul %8.0f ms | mémoire ~%d Mo / %d Mo max%n\",", "                label, sinceLastMs, totalMs, usedMb, maxMb);", "    }", "}"], "lab/sample/traffic/RushHourDelay.java": ["package lab.sample.traffic;", "", "import lab.sample.model.Leg;", "", "/** Retard dû aux bouchons de l'heure de pointe. */", "public final class RushHourDelay {", "", "    private RushHourDelay() {}", "", "    static double minutesFor(Leg leg) {", "        // Les bouchons pénalisent surtout les entrées et sorties d'agglomération,", "        // donc les étapes courtes : d'où un retard qui ne suit pas la distance.", "        if (leg.distanceKm() < 5) {", "            return 8;", "        }", "        return leg.distanceKm() < 40 ? 15 : 20;", "    }", "}"], "lab/sample/traffic/Traffic.java": ["package lab.sample.traffic;", "", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "import lab.sample.model.TimeOfDay;", "", "import java.util.List;", "", "/**", " * Retard lié à la circulation.", " *", " * <p>Sous-arbre entièrement <b>conditionnel</b> : il n'existe que pour la voiture, et", " * seulement à l'heure de pointe. Sur un trajet en train à 22 h, aucune de ces lignes", " * ne s'exécute — et c'est exactement ce que le dépôt cherche à rendre visible.", " */", "public final class Traffic {", "", "    private Traffic() {}", "", "    public static boolean applies(Mode mode, TimeOfDay timeOfDay) {", "        return mode == Mode.CAR && timeOfDay == TimeOfDay.RUSH_HOUR;", "    }", "", "    public static double delayMinutes(List<Leg> legs) {", "        double total = 0;", "        for (Leg leg : legs) {", "            total += RushHourDelay.minutesFor(leg);", "        }", "        return total;", "    }", "}"], "lab/sample/speed/BikeSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** À vélo : on ralentit sur les longues distances (fatigue). */", "public final class BikeSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return leg.distanceKm() > 20 ? 15 : 18;", "    }", "}"], "lab/sample/speed/Speeds.java": ["package lab.sample.speed;", "", "import lab.sample.model.Mode;", "", "/** Fabrique : associe un mode de transport à son modèle de vitesse. */", "public final class Speeds {", "", "    // Instances partagées : les modèles de vitesse sont sans état. Les allouer à chaque", "    // appel captait ~25 % des échantillons — du bruit d'allocation qui masquait le calcul.", "    private static final SpeedModel CAR = new CarSpeed();", "    private static final SpeedModel TRAIN = new TrainSpeed();", "    private static final SpeedModel BIKE = new BikeSpeed();", "    private static final SpeedModel WALK = new WalkSpeed();", "", "    private Speeds() {}", "", "    public static SpeedModel forMode(Mode mode) {", "        return switch (mode) {", "            case CAR -> CAR;", "            case TRAIN -> TRAIN;", "            case BIKE -> BIKE;", "            case WALK -> WALK;", "            // Instancié ici et non partagé comme les autres : ainsi PlaneSpeed n'est", "            // JAMAIS chargée ni exécutée, et reste à 0 % dans le rapport de couverture.", "            // Un champ static final l'aurait fait construire au chargement de Speeds.", "            case PLANE -> new PlaneSpeed();", "        };", "    }", "}"], "lab/sample/speed/TrainSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** En train : vitesse quasi constante, indépendante de la longueur de l'étape. */", "public final class TrainSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return leg.distanceKm() > 100 ? 220 : 90;", "    }", "}"], "lab/sample/speed/PlaneSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** En avion. <b>Jamais instanciée par les scénarios</b> : cette classe entière doit", " *  apparaître à 0 % dans un rapport de couverture. C'est le test le plus visuel du", " *  critère « sait-on par où le code n'est PAS passé ? » — un profiler par", " *  échantillonnage, lui, ne dira jamais rien de ce code. */", "public final class PlaneSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return leg.distanceKm() > 1000 ? 850 : 600;", "    }", "}"], "lab/sample/speed/WalkSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** À pied : 5 km/h, la vitesse de marche de tout le monde. */", "public final class WalkSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return 5;", "    }", "}"], "lab/sample/speed/CarSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** En voiture : plus l'étape est longue, plus on roule vite (ville puis voie rapide). */", "public final class CarSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        if (leg.distanceKm() < 5) {", "            return 25;   // trajet urbain", "        }", "        return leg.distanceKm() < 40 ? 70 : 110;", "    }", "}"], "lab/sample/speed/SpeedModel.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** Vitesse moyenne d'un mode de transport sur une étape.", " *", " *  <p>Point de <b>dispatch virtuel</b> du programme : l'appel part toujours de", " *  l'interface, mais c'est l'implémentation concrète qui travaille. Un bon arbre", " *  d'appel doit nommer l'implémentation réellement exécutée ; certains outils", " *  s'arrêtent à l'interface, et c'est une différence qui se voit tout de suite. */", "public interface SpeedModel {", "    double kmPerHour(Leg leg);", "}"], "lab/sample/transfer/Timetable.java": ["package lab.sample.transfer;", "", "import lab.sample.model.Leg;", "", "import java.util.Map;", "import java.util.concurrent.ConcurrentHashMap;", "", "/**", " * Consultation des horaires — la seule opération <b>bloquante</b> du programme.", " *", " * <p>Elle simule un appel à un service extérieur par un {@code Thread.sleep}. Sa", " * présence n'est pas décorative : elle crée du <em>temps d'attente</em> à côté du temps", " * de calcul, et c'est un excellent discriminant entre outils. Un profiler qui échantillonne", " * le CPU ne la verra pratiquement pas ; un profiler en temps réel (wall clock) la verra", " * dominer. Deux outils peuvent donc donner deux réponses opposées à « où passe le temps ? »", " * sur exactement la même exécution — et il faut savoir laquelle on regarde.", " *", " * <p>Le résultat est mis en cache : un horaire ne se demande qu'une fois par liaison.", " */", "public final class Timetable {", "", "    private static final Map<String, Integer> CACHE = new ConcurrentHashMap<>();", "    private static final int LOOKUP_MILLIS = 3;", "", "    private Timetable() {}", "", "    /** @return la fréquence de passage, en minutes, pour cette liaison. */", "    public static int frequencyMinutes(Leg leg) {", "        return CACHE.computeIfAbsent(leg.from() + \">\" + leg.to(), key -> {", "            try {", "                Thread.sleep(LOOKUP_MILLIS); // appel réseau simulé", "            } catch (InterruptedException e) {", "                Thread.currentThread().interrupt();", "            }", "            return 10 + (Math.abs(key.hashCode()) % 50);", "        });", "    }", "}"], "lab/sample/transfer/Connections.java": ["package lab.sample.transfer;", "", "import lab.sample.model.Leg;", "", "import java.util.List;", "", "/**", " * Temps d'attente aux correspondances — propre au train.", " *", " * <p>Le calcul est <b>récursif</b> sur la liste des étapes : il ajoute un foyer de", " * récursion distinct de celui de {@code comfort.Breaks}, dans une branche que seuls", " * certains scénarios empruntent. Utile pour vérifier qu'un outil ne confond pas deux", " * récursions différentes dans le même arbre.", " */", "public final class Connections {", "", "    private Connections() {}", "", "    public static double waitMinutes(List<Leg> legs, int index) {", "        if (index >= legs.size() - 1) {", "            return 0; // dernière étape : plus de correspondance après", "        }", "        double here = transferMinutes(legs.get(index), legs.get(index + 1));", "        return here + waitMinutes(legs, index + 1);", "    }", "", "    private static double transferMinutes(Leg arriving, Leg departing) {", "        // Une correspondance dans la même gare est plus rapide qu'un changement de gare,", "        // et l'attente dépend de la fréquence de passage — donc d'une consultation", "        // d'horaires, seule opération bloquante du programme.", "        double walk = arriving.to().equals(departing.from()) ? 6 : 18;", "        return walk + Timetable.frequencyMinutes(departing) / 2.0;", "    }", "}"], "lab/sample/comfort/Breaks.java": ["package lab.sample.comfort;", "", "/**", " * Pauses obligatoires sur les longs trajets.", " *", " * <p>Particularité volontaire : la décision se prend sur une <b>valeur calculée</b>", " * (la durée obtenue jusque-là) et non sur un argument reçu tel quel. Un outil qui ne", " * capture que les arguments d'entrée de la fonction analysée ne saura pas expliquer", " * pourquoi cette branche a été prise — alors qu'elle change le résultat.", " */", "public final class Breaks {", "", "    /** Au-delà de 2 h de conduite ou de marche, on s'arrête. */", "    public static final double THRESHOLD_MINUTES = 120;", "", "    private Breaks() {}", "", "    public static int count(double travelMinutes) {", "        if (travelMinutes < THRESHOLD_MINUTES) {", "            return 0;", "        }", "        return (int) (travelMinutes / THRESHOLD_MINUTES);", "    }", "", "    public static double totalMinutes(double travelMinutes) {", "        return count(travelMinutes) * 15.0;", "    }", "}"], "lab/sample/terrain/Terrain.java": ["package lab.sample.terrain;", "", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "", "/**", " * Ralentissement dû au relief, moyenné sur les sous-segments d'une étape.", " *", " * <p>Deux raisons d'exister :", " * <ul>", " *   <li>c'est le <b>cœur de calcul</b> du programme — sans lui, l'application passe son", " *       temps dans les itérateurs du JDK et un profiler ne /* --------------------------------------------------------- frame -> source */
function frameInfo(frame){
  const i = frame.lastIndexOf(".");
  if (i < 0) return null;
  const cls = frame.slice(0,i), name = frame.slice(i+1);
  const info = D.methods[cls];
  if (!info) return null;
  const decl = info.methods.find(m => m.name === name);
  return {frame, cls, name, line: decl ? decl.line : 0,
          source: info.source, methods: info.methods};
}

/* ------------------------------------------- périmètre : sous une méthode */
function framesUnder(target){
  const acc = {};
  (function walk(node, inside){
    for (const kid of node.children){
      const now = inside || kid.name === target;
      if (now) acc[kid.name] = (acc[kid.name]||0) + kid.total;
      walk(kid, now);
    }
  })(D.calltree, false);
  return acc;
}
function executedMethods(){
  const scoped = scopeFrame ? framesUnder(scopeFrame) : null;
  const out = [];
  for (const [cls, info] of Object.entries(D.methods))
    for (const m of info.methods){
      if (!m.covered) continue;
      const frame = cls + "." + m.name;
      if (scoped && !(frame in scoped)) continue;
      if (filter && !(dot(frame).toLowerCase().includes(filter))) continue;
      out.push({frame, cls, name: m.name, line: m.line, source: info.source,
                methods: info.methods, samples: AGG.weights[frame] || 0});
    }
  return out.sort((a,b) => b.samples - a.samples || a.frame.localeCompare(b.frame));
}

  (function level(container, node, depth){
    for (const kid of node.children){
      if (filter && !dot(kid.name).toLowerCase().includes(filter) && !hasMatch(kid)) continue;
      const info = frameInfo(kid.name);
      const el = document.createElement("div");

                     '<span class="pct">'+(100*kid.total/total).toFixed(1)+'%</span>'+
                     esc(dot(kid.name));
      container.appendChild(el);
      const holder = document.createElement("div");
      holder.style.display = "none"; container.appendChild(holder);
      level(holder, kid, depth+1);
      el.onclick = e => {
        e.stopPropagation();
        if (kid.children.length){
          const open = holder.style.display === "none";

/* ------------------------------------------- contextes d'appel d'une méthode
   Dans l'arbre, le contexte est donné par le chemin parcouru. Dans les listes à plat
   (Code exécuté, Packages) il manque : une méthode appelée depuis deux endroits n'est
   pas la même histoire. On reconstruit donc les chemins connus qui mènent à elle. */
function pathsTo(frame, max = 4){
  const found = [];
  (function walk(node, path){
    for (const kid of node.children){
      const next = path.concat([kid.name]);
      if (kid.name === frame) found.push({path: next, total: kid.total});
      else walk(kid, next);
    }
  })(D.calltree, []);
  found.sort((a,b) => b.total - a.total);
  const sum = found.reduce((a,f) => a + f.total, 0) || 1;
  return {chemins: found.slice(0, max), total: sum, nb: found.length};
}
function renderContexts(info){
  const box = document.getElementById("context");
  if (!info || !info.name){ box.innerHTML = ""; box.style.display = "none"; return; }
  const {chemins, total, nb} = pathsTo(info.frame);
  if (!chemins.length){ box.innerHTML = ""; box.style.display = "none"; return; }
  box.style.display = "block";
  const label = nb === 1 ? "Appelée depuis un seul contexte :"
                         : "Appelée depuis " + nb + " contextes — choisir lequel regarder :";
  box.innerHTML = '<span class="ctxlabel">' + label + '</span>' +
    chemins.map((c, i) => {
      const chain = c.path.filter(f => frameInfo(f));
      const short = chain.map((f, j) =>
        '<a href="#" data-f="'+esc(f)+'" class="'+(j === chain.length-1 ? "cur" : "")+'">'+
        esc(f.split("/").pop())+'</a>').join('<span class="sep"> › </span>');
      return '<div class="ctxpath'+(i === ctxIndex ? " on" : "")+'" data-i="'+i+'">'+
             '<span class="share">'+(100*c.total/total).toFixed(0)+' %</span>'+short+'</div>';
    }).join("");
  box.querySelectorAll(".ctxpath").forEach(el => el.onclick = e => {
    if (e.target.tagName === "A") return;
    ctxIndex = +el.dataset.i;
    renderContexts(info);
  });
  box.querySelectorAll("a[data-f]").forEach(a => a.onclick = e => {
    e.preventDefault();
    const t = frameInfo(a.dataset.f);
    if (t) { ctxIndex = 0; select(t, null); }
  });
}

    const nr = i+1, c = cov[nr];
    if (narrow && (nr < from || nr > to)) return;
    if (clean && c && c.s === "miss"){ fold++; return; }
    if (fold){ html += '<tr><td colspan="3" class="fold">… '+fold+' ligne(s) jamais exécutée(s)</td></tr>'; fold = 0; }
    const cls = [c ? c.s : "", (info.line && nr>=from && nr<=to) ? "inmethod" : ""].join(" ");
    let ann = "";
    if (info.line && nr === info.line && myCalls.length)
      ann = '<a href="#" id="lineValues" class="values">▾ valeurs des paramètres ('+myCalls.length+')</a>';
    else if (traced && D.trace[nr])
      { const all = D.trace[nr];
        ann = "appelle " + all.slice(0,2).map(a =>
          '<a href="#" data-f="'+esc(a.frame||"")+'">'+esc(a.callee)+'</a> <span class="dur">'+esc(a.cost)+'</span>').join(" · ")
          + (all.length > 2 ? ' <span style="opacity:.7">+'+(all.length-2)+'</span>' : ''); }
    html += '<tr class="'+cls+'" id="L'+nr+'"><td class="n">'+nr+'</td><td class="c">'+
            esc(text)+'</td><td class="ann">'+ann+'</td></tr>';
  });
  if (fold) html += '<tr><td colspan="3" class="fold">… '+fold+' ligne(s) jamais exécutée(s)</td></tr>';
  if (narrow && to < src.length)
    html += '<tr><td colspan="3" class="fold">… '+(src.length-to)+' ligne(s) en dessous, hors de cette méthode</td></tr>';
  code.innerHTML = html+"</table>";

  const anchor = document.getElementById("L"+(info.line||1));
  if (anchor) code.scrollTop += anchor.getBoundingClientRect().top
                              - code.getBoundingClientRect().top - code.clientHeight/3;
  code.querySelectorAll("td.ann a").forEach(a => a.onclick = e => {
    e.preventDefault();
    const f = a.dataset.f;
    if (f && frameInfo(f)) select(frameInfo(f), null);
  });
  const sb = document.getElementById("scopeBtn");
  if (sb) sb.onclick = () => { scopeFrame = info.frame; renderExec(); };
  const lv = document.getElementById("lineValues");
  if (lv) lv.onclick = e => { e.preventDefault();
    document.getElementById("values").scrollIntoView({block:"nearest"}); };
  const bh = document.getElementById("backHome");
  if (bh) bh.onclick = e => { e.preventDefault(); goHome(); };
  renderContexts(info);
  drawValues(info);
  const pv = document.getElementById("pillValues");
  if (pv) pv.onclick = () => document.getElementById("values").scrollIntoView({block:"nearest"});
}
function declarationLine(info){
  const src = D.sources[info.source] || [];
  if (!info.name) return info.line;
  const needle = new RegExp("\\b" + info.name.replace(/[$]/g, "\\$") + "\\s*\\(");
  for (let i = info.line - 1; i >= Math.max(0, info.line - 12); i--)
    if (needle.test(src[i] || "")) return i + 1;
  return info.line;
}
function declarationOf(info){
  const src = D.sources[info.source] || [];
  if (!info.line || !info.name) return "";
  const needle = new RegExp("\\b" + info.name.replace(/[$]/g, "\\$") + "\\s*\\(");
  for (let i = info.line - 1; i >= Math.max(0, info.line - 12); i--)
    if (needle.test(src[i] || "")) return (src[i] || "").trim().replace(/\s*\{\s*$/, "");
  return "";
}
function drawValues(info){
  const box = document.getElementById("values");
  const calls = D.values[info.frame] || [];
  if (!calls.length){
    // Rien pour CETTE méthode : dire lesquelles en ont, plutôt que de laisser un vide.
    const others = Object.keys(D.values);
    box.innerHTML = others.length
      ? '<h3>Valeurs des paramètres</h3><div class="call" style="border:0;color:var(--muted)">'+
        'Aucune valeur capturée pour <code>'+esc(info.name||info.cls.split("/").pop())+'</code>. '+
        'Méthodes observées : '+ others.map(f =>
          '<a href="#" class="vlink" data-f="'+esc(f)+'">'+esc(f.split("/").pop())+'</a>').join(" · ")+
        '</div>'
      : "";
    box.querySelectorAll(".vlink").forEach(a => a.onclick = e => {
      e.preventDefault();
      const t = frameInfo(a.dataset.f); if (t) select(t, null);
    });
    return;
  }
  // Rappeler la signature : sans elle, on ne sait pas à quel paramètre correspond
  // chaque valeur affichée.
  // JaCoCo pointe la première ligne EXÉCUTABLE, pas la déclaration : on remonte jusqu'à
  // la ligne qui porte le nom de la méthode suivi d'une parenthèse.
  const sig = declarationOf(info);
  box.innerHTML =
    "<h3>Valeurs reçues par <code>"+esc(info.name)+"</code></h3>" +
    (sig ? '<div class="sig">'+esc(sig)+'</div>' : '') +
    '<div class="explain"><b>Une ligne = un appel.</b> La méthode a été appelée un grand '+
    'nombre de fois pendant l\'exécution ; voici les '+calls.length+' premiers appels '+
    'observés, avec ce qu\'ils ont reçu et ce qu\'ils ont renvoyé.</div>' +
    '<div class="callhead"><span>paramètres reçus</span><span>valeur renvoyée</span></div>' +
    calls.map(v =>
      '<div class="call"><span class="p">'+
        (v.params||[]).map(x => '<span class="v">'+esc(x.value)+'</span>').join('<span class="sep">,</span> ')+
      '</span><span class="arrow">→</span><span class="r">'+
        (v.retour ? '<span class="v">'+esc(v.retour.value)+'</span>' : '<i>—</i>')+
      '</span><span class="t" title="durée de cet appel">'+esc(v.cost)+'</span></div>').join("");
}
function valuesHelp(){
  const t = dot(D.tracedClass || "");
  const name = t.split(".").pop();
  const methods = Object.keys(D.values || {});
  const has = methods.length;
  if (!has)
    return '<h2>Les valeurs des paramètres</h2><p>Aucune valeur n\'a été capturée pour ce ' +
      'rapport. Relancer en indiquant la méthode racine à inspecter (<code>--root</code>).</p>';
  return '<h2>Où voir les valeurs des paramètres</h2>' +
    '<p>Elles ne sont capturées que sur <b>une seule méthode</b> : la <b>méthode racine</b> ' +
    'désignée au lancement — ici <code>' + esc(t) + '</code>. C\'est volontaire : capturer ' +
    'les valeurs de toutes les méthodes produirait un volume ingérable.</p>' +
    '<p><b>Les méthodes observées</b> — chacune a ses propres valeurs : ' +
    methods.map(f => '<code>'+esc(f.split("/").pop())+'</code> ('+D.values[f].length+' appels)').join(" · ") +
    '.</p>' +
    '<p><b>Pour les voir</b> : ouvrir la méthode depuis la liste de gauche — elle porte une ' +
    'pastille <span class="tagval">valeurs</span> — puis regarder le <b>bandeau en bas</b>. ' +
    'On peut aussi cliquer le marqueur violet posé sur sa ligne de déclaration.</p>' +
    '<p><a href="#" id="gotoValues">→ Ouvrir ' + esc(name) + ' et voir ses valeurs</a></p>';
}

  const repo = "https://github.com/Beennnn/runtime-xray";
  const l = (href, titre, quoi) =>

      "Le rapport complet, fichier par fichier, avec le code annoté ligne à ligne.") +
    l("jacoco-focused/html/index.html", "Couverture ciblée",
      "Le même, restreint aux classes qui ont réellement tourné.") +
    l("async-profiler/flamegraph.html", "Flame graph",
      "Où le temps est passé, vu comme un paysage : la largeur d\'une barre est sa durée.") +
    l("async-profiler/tree.html", "Arbre d\'appel complet",
      "La hiérarchie des appels, dépliable et cherchable, telle que produite par l\'outil de mesure.") +
    l(repo, "Le dépôt du projet ↗",
      "Le code, les scripts de collecte, et comment lancer cet outil sur un autre projet.") +

      "Ce qui a été comparé, ce qui a été écarté, et ce qui reste à trancher.") +

}
function reserveBlock(){
  if (!D.profileNote) return "";
  return '<div class="reserve"><b>Une réserve sur les pourcentages de temps.</b> ' +
    esc(D.profileNote) + ' <br><br>' +
    'Tout a été collecté en <b>un seul lancement</b> : c\'est le mode par défaut, parce ' +
    'qu\'il donne les trois informations recherchées d\'un coup et que le temps d\'exécution ' +
    'n\'est pas un critère du projet. <b>Si les temps devaient compter</b>, il suffit de ' +
    'faire <b>plusieurs lancements</b> : un premier pour la couverture et le profil, un ' +
    'second pour la capture des valeurs. Les pourcentages deviennent alors exacts, au prix ' +
    'd\'une exécution supplémentaire.</div>';
}
function contextBlock(){
  const c = D.context;
  if (!c) return "";
  const row = (k, v) => v ? '<tr><td class="ck">'+esc(k)+'</td><td class="cv">'+v+'</td></tr>' : "";
  const t = c.outils || {};
  return '<h2>Contexte de cette exécution</h2><table class="ctx">' +
    row("Programme lancé", '<code>'+esc(c.commande||"")+'</code>') +
    row("Méthode racine inspectée", c.methodeRacine ? '<code>'+esc(c.methodeRacine)+'</code>' : "") +
    row("Filtre de profil", c.filtreClasses ? '<code>'+esc(c.filtreClasses)+'</code>' : "") +
    row("Début", esc(c.debut)) +
    row("Fin", esc(c.fin) + (c.dureeSecondes ? ' <span style="opacity:.7">— '+c.dureeSecondes+' s</span>' : "")) +
    row("Statut", esc(c.statut)) +
    row("Machine", esc(c.machine) + (c.utilisateur ? ' <span style="opacity:.7">('+esc(c.utilisateur)+')</span>' : "")) +
    row("Système", esc(c.systeme) + (c.processeurs ? ' — '+c.processeurs+' cœurs' : "")) +
    row("Java", '<code>'+esc(c.java||"")+'</code>') +
    row("Répertoire de travail", '<code>'+esc(c.repertoireTravail||"")+'</code>') +
    row("Classes analysées", '<code>'+esc(c.repertoireClasses||"")+'</code>') +
    row("Sources", c.repertoiresSources ? '<code>'+esc(c.repertoiresSources)+'</code>' : "") +
    row("Outils", Object.entries(t).map(([k,v]) => esc(k)+" "+esc(v)).join(" · ")) +
    '</table>';
}
function drawHome(){
  document.getElementById("crumb").innerHTML = '<span>Vue d\'ensemble</span>';
  document.getElementById("values").innerHTML = "";
  const hot = executedMethods().slice(0,5);
  document.getElementById("code").innerHTML =
   '<div class="home"><h2>Ce que cette page montre</h2>'+
   '<p>Une exécution réelle du programme, vue par trois outils gratuits, assemblée ici.</p>'+
   '<div class="cards">'+
     '<div class="card c1"><div class="k">'+AGG.pct.toFixed(1)+' %</div><div class="l">du code exécuté</div></div>'+
     '<div class="card c2"><div class="k">'+AGG.methods+'</div><div class="l">méthodes ayant tourné</div></div>'+
     '<div class="card c3"><div class="k">'+AGG.samples.toLocaleString("fr")+'</div><div class="l">mesures de temps prises</div></div>'+
     '<div class="card c4"><div class="k">'+Object.values(D.values).reduce((a,v)=>a+v.length,0)+'</div><div class="l">appels avec leurs valeurs</div></div>'+
   '</div>'+
   '<div class="bar"><span style="width:'+AGG.pct.toFixed(1)+'%"></span></div>'+
   '<h2>Comment s\'en servir</h2>'+
   '<ol>'+
     '<li><b>À gauche, choisir un onglet</b>, puis cliquer sur une ligne.<br>'+
       '<b>Code exécuté</b> — tout ce qui a tourné, du plus coûteux au moins coûteux. C\'est l\'entrée normale.<br>'+
       '<b>Arbre d\'appel</b> — la même chose vue comme une hiérarchie d\'appels.<br>'+
       '<b>Packages</b> — le classement par fichier, quand on cherche une classe précise.<br>'+
       '<span style="opacity:.85">Le champ <i>Filtrer…</i> réduit la liste à mesure qu\'on tape.</span></li>'+
     '<li><b>Au centre, le code s\'affiche</b>, colorié ligne par ligne : '+
       '<span style="background:var(--full);padding:1px 5px;border-radius:3px">exécutée</span> · '+
       '<span style="background:var(--part);padding:1px 5px;border-radius:3px">partiellement</span> · '+
       '<span style="background:var(--miss);padding:1px 5px;border-radius:3px">jamais exécutée</span>. '+
       'À droite de chaque ligne, en violet, les appels qui en partent et leur coût — cliquables pour sauter à la méthode appelée.</li>'+
     '<li><b>Le bandeau du bas montre les valeurs de la méthode sélectionnée</b> — chaque méthode a les siennes. '+
       'Choisir une autre méthode à gauche change le contexte, et donc les valeurs affichées.</li>'+
     '<li><b>Resserré sur la méthode</b> (bouton en haut à droite, actif par défaut) : le centre '+
       'n\'affiche que la méthode choisie, sans ses lignes jamais exécutées, et la liste de gauche '+
       'écarte les classes mortes. C\'est ce qui garantit qu\'on regarde <b>une seule méthode à la '+
       'fois</b>, même dans une classe qui en contient plusieurs. Le désactiver montre le fichier entier.</li>'+
     '<li><b>Restreindre le périmètre</b> : sur une méthode ouverte, le bouton <i>« ne montrer que ce qui tourne sous cette méthode »</i> ne garde dans la liste que le code appelé sous elle — sans avoir à descendre d\'appel en appel.</li>'+
     '<li><b>Le contexte d\'appel</b> : juste sous le fil d\'Ariane, la liste des chemins par lesquels '+
       'la méthode a été atteinte, avec leur part. Une méthode appelée depuis deux endroits n\'est pas '+
       'la même histoire — cliquer un chemin le retient, cliquer un maillon ouvre ce maillon.</li>'+
     '<li><b>Revenir ici</b> : le bouton <i>← Vue d\'ensemble</i> en haut du code, ou le titre <i>Runtime X-Ray</i>.</li>'+
   '</ol>'+
   valuesHelp()+
   '<h2>Comment ce rapport est produit</h2>'+
   '<p>Trois outils libres et gratuits ont observé la même exécution, et leurs sorties ont '+
   'été assemblées dans cette page :</p>'+
   '<ul class="tools">'+
     '<li><b>JaCoCo</b> — les lignes exécutées, et la liste exhaustive du code qui a tourné.</li>'+
     '<li><b>async-profiler</b> — les pourcentages de temps et l\'arbre d\'appel.</li>'+
     '<li><b>Arthas</b> — les valeurs des paramètres et les annotations d\'appel sur les lignes.</li>'+
   '</ul>'+
   '<p>Aucun ne fait les trois : c\'est leur combinaison qui répond. Tous fonctionnent sans '+
   'connexion Internet et sans licence.</p>'+
   contextBlock() +
   (AGG.dead.length ? '<h2>Jamais exécuté</h2><p>'+AGG.dead.map(d=>'<span class="chip dead">'+esc(d)+'</span>').join("")+'</p>' : '')+
   '<h2>Les plus coûteuses</h2><p>'+hot.map(h=>'<span class="chip hot">'+esc(h.cls.split("/").pop()+"."+h.name)+'</span>').join("")+'</p>'+
   reserveBlock()+
   linksBlock()+
   '</div>';
  const g = document.getElementById("gotoValues");
  if (g) g.onclick = e => {
    e.preventDefault();
    const n = [...document.querySelectorAll("#list .node")]
      .find(x => (x.title||"").startsWith(dot(D.tracedClass)));
    if (n) n.click();
  };
}

function goHome(){
  selected = null; ctxIndex = 0;
  const c = document.getElementById("context"); if (c){ c.innerHTML=""; c.style.display="none"; }
  document.querySelectorAll(".node.sel").forEach(n=>n.classList.remove("sel"));
  document.getElementById("code").scrollTop = 0;
  drawHome();
}

/* ------------------------------------------------------------ interactions */
document.getElementById("home").onclick = e => { e.preventDefault(); goHome(); };
document.getElementById("tab-exec").onclick = renderExec;
document.getElementById("tab-tree").onclick = renderTree;
document.getElementById("tab-cls").onclick  = renderClasses;
document.getElementById("clean").onclick = e => {
  const b = e.currentTarget;
  clean = !clean;
  b.setAttribute("aria-pressed", String(clean));
  b.lastChild.textContent = clean ? " Resserré sur la méthode" : " Fichier entier";
  b.title = clean ? "Resserré : seule la méthode sélectionnée est affichée, sans ses lignes mortes"
                  : "Fichier entier, y compris le code jamais exécuté";
  mode === "cls" ? renderClasses() : mode === "tree" ? renderTree() : renderExec();
  draw();
};
document.getElementById("search").oninput = e => {
  filter = e.target.value.trim().toLowerCase();
  mode === "cls" ? renderClasses() : mode === "tree" ? renderTree() : renderExec();
};
/* ------------------------------------------------------- panneaux ajustables */
(function splitters(){
  const root = document.documentElement;
  const nav = document.getElementById("nav");
  const vs = document.getElementById("vsplit"), hs = document.getElementById("hsplit");
  let navPrev = 330, valPrev = 190;

  const startDrag = (el, onMove) => {
    el.addEventListener("mousedown", e => {
      e.preventDefault(); el.classList.add("dragging");
      const move = ev => onMove(ev);
      const up = () => { el.classList.remove("dragging");
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up); };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
  };
  startDrag(vs, ev => {
    const w = Math.max(0, Math.min(ev.clientX, window.innerWidth - 200));
    root.style.setProperty("--navw", w + "px");
    if (w > 40) navPrev = w;
  });
  startDrag(hs, ev => {
    const box = document.getElementById("values").getBoundingClientRect();
    const h = Math.max(0, Math.min(box.bottom - ev.clientY, window.innerHeight - 220));
    root.style.setProperty("--valh", h + "px");
    if (h > 30) valPrev = h;
  });
  vs.ondblclick = () => {
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--navw")) || 330;
    root.style.setProperty("--navw", cur > 40 ? "0px" : navPrev + "px");
  };
  hs.ondblclick = () => {
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--valh")) || 190;
    root.style.setProperty("--valh", cur > 30 ? "0px" : valPrev + "px");
  };
})();

renderExec();
drawHome();
</script>
