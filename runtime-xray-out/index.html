<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vue intégrée — Runtime X-Ray</title>
<style>
  :root{
    --bg:#fff; --panel:#f6f8fa; --panel2:#fbfcfd; --border:#d0d7de; --text:#1f2328;
    --muted:#59636e; --accent:#0969da; --accent-soft:#ddf4ff;
    --full:#b7f0c6; --part:#ffec9e; --miss:#ffc9c4;
    --fullbar:#1a7f37; --partbar:#9a6700; --missbar:#cf222e; --violet:#8250df;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1117; --panel:#151b23; --panel2:#10151c; --border:#30363d; --text:#e6edf3;
      --muted:#9198a1; --accent:#4493f8; --accent-soft:#121d2f;
      --full:#16512c; --part:#5c4710; --miss:#63201f;
      --fullbar:#3fb950; --partbar:#d29922; --missbar:#f85149; --violet:#ab7df8;
    }
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  header{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;
         align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
  header h1 a{color:inherit;text-decoration:none}
  header h1 a:hover{color:var(--accent)}
  .crumb .back{display:inline-flex;align-items:center;gap:5px;color:#fff;background:var(--accent);
               border-radius:15px;padding:3px 11px;font-size:12px;font-weight:600;
               cursor:pointer;text-decoration:none}
  .crumb .back:hover{filter:brightness(1.12)}
  /* Une seule icône d'application : les badges des trois outils invitaient à cliquer
     alors qu'ils n'étaient qu'informatifs. Leur explication vit dans la légende, en bas. */
  .applogo{display:flex;align-items:center}
  .stat{color:var(--muted);font-size:12.5px} .stat b{color:var(--text)}
  .runpick{display:flex;align-items:center;gap:7px;padding:6px 8px;
           border-bottom:1px solid var(--border);background:var(--accent-soft)}
  .runpick[hidden]{display:none}
  .runlabel{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--accent);font-weight:700}
  #runsel{flex:1;min-width:0;font:inherit;font-size:12.5px;font-weight:600;padding:3px 8px;
          border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
  .spacer{margin-left:auto}
  .cleanbtn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;
            font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;
            border:1px solid var(--border);background:var(--bg);color:var(--muted)}
  .cleanbtn:hover{border-color:var(--accent);color:var(--accent)}
  .cleanbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--missbar);opacity:.55}
  .cleanbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .cleanbtn[aria-pressed="true"] .dot{background:#fff;opacity:1}
  .links{font-size:12px;color:var(--muted)} .links a{margin-left:12px}
  .links .by{font-size:9.5px;color:var(--muted);border:1px solid var(--border);
             border-radius:8px;padding:0 4px;margin-left:3px}
  .helpbtn{font:inherit;font-size:12px;font-weight:600;padding:4px 11px;border-radius:15px;
           cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted)}
  .helpbtn:hover{border-color:var(--accent);color:var(--accent)}
  #help{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;
        align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  #help[hidden]{display:none}
  .helpbox{position:relative;background:var(--bg);border:1px solid var(--border);
           border-radius:12px;max-width:880px;width:100%;padding:28px 32px 34px}
  .helpclose{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);
             font-size:17px;cursor:pointer}
  .helpclose:hover{color:var(--text)}
  .reserve{border:1px solid var(--border);border-left:3px solid var(--partbar);
           border-radius:6px;background:var(--panel);padding:12px 15px;color:var(--muted);
           font-size:12.5px;margin-top:22px}
  .reserve b{color:var(--text)}
  main{display:grid;grid-template-columns:var(--navw,330px) 6px 1fr;height:calc(100% - 47px)}
  @media(max-width:860px){main{grid-template-columns:1fr;height:auto} .split{display:none}}
  /* Séparateurs déplaçables : glisser pour redimensionner, double-cliquer pour replier
     entièrement le panneau voisin — utile quand on veut le code plein écran. */
  .split{background:var(--border);cursor:col-resize;position:relative}
  /* Un bouton visible sur chaque séparateur : le double-clic seul est une astuce qu'on
     ne découvre jamais. */
  .splitbtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:16px;height:34px;border-radius:8px;border:1px solid var(--border);
            background:var(--panel);color:var(--muted);font-size:11px;line-height:1;
            cursor:pointer;padding:0;z-index:3;display:flex;align-items:center;justify-content:center}
  .splitbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg)}
  .splitbtn.h{width:34px;height:16px}
  .split:hover,.split.dragging{background:var(--accent)}
  .split::after{content:"";position:absolute;inset:0 -4px}
  .split.h{cursor:row-resize;height:6px}
  .splitlabel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
              font-size:9px;color:var(--bg);pointer-events:none}
  #nav{border-right:1px solid var(--border);background:var(--panel2);
       display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--border)}
  .tabs button{flex:1;padding:8px 4px;background:none;border:0;border-bottom:2px solid transparent;
               color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  .listbar{display:flex;gap:6px;margin:8px}
  #search{flex:1;padding:5px 9px;border:1px solid var(--border);border-radius:6px;
          background:var(--bg);color:var(--text);font:inherit;font-size:12.5px;min-width:0}
  .unitbtn{font:inherit;font-size:11.5px;font-weight:700;width:38px;border-radius:6px;
           border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer}
  .unitbtn:hover{border-color:var(--accent);color:var(--accent)}
  #scope{display:none;padding:7px 10px;border-bottom:1px solid var(--border);
         font-size:11.5px;color:var(--muted)}
  #scope b{color:var(--text)}
  #scope button{margin-left:8px;font:inherit;font-size:11px;background:var(--bg);color:var(--accent);
                border:1px solid var(--border);border-radius:5px;padding:2px 7px;cursor:pointer}
  .list{overflow:auto;flex:1 1 auto;min-height:0;padding:4px 4px 24px}
  .node{padding:2px 7px;border-radius:5px;cursor:pointer;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .node:hover{background:var(--accent-soft)}
  .node.sel{background:var(--accent);color:#fff}
  .node .pct{color:var(--muted);font-size:11px;margin-right:6px;display:inline-block;
             width:38px;text-align:right;font-variant-numeric:tabular-nums}
  .node.sel .pct{color:#e8f0fb}
  .node .tw{display:inline-block;width:11px;color:var(--muted)}
  .node.jdk{color:var(--muted)}
  .node.runroot{font-weight:600;padding:5px 7px;margin-top:4px;border-radius:6px;
                background:var(--panel);border:1px solid var(--border)}
  .node.runroot.on{border-color:var(--accent)}
  .runbadge{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);
            border:1px solid var(--accent);border-radius:9px;padding:0 5px;vertical-align:1px}
  .pct2{color:var(--muted);font-weight:400;font-size:11px}
  .tagval{font-size:10px;border:1px solid var(--violet);color:var(--violet);
          border-radius:10px;padding:0 5px;vertical-align:1px}
  .node.callnode{color:var(--violet)}
  .callbadge{font-size:10px;border:1px solid var(--violet);color:var(--violet);
             border-radius:10px;padding:0 5px;vertical-align:1px}
  .call.pick{cursor:pointer;border-radius:5px;padding-left:6px;padding-right:6px}
  .call.pick:hover{background:var(--accent-soft)}
  .callnav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .callnav button{font:inherit;font-size:11.5px;padding:3px 10px;border-radius:14px;
                  border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
  .callnav button:disabled{opacity:.4;cursor:default}
  .callnav a{font-size:11.5px;color:var(--accent);text-decoration:none;margin-left:auto}
  .tagrun{font-size:10px;border:1px solid var(--accent);color:var(--accent);
          border-radius:10px;padding:0 5px;vertical-align:1px}
  .tagonly{font-size:10px;border:1px solid var(--partbar);color:var(--partbar);
           border-radius:10px;padding:0 5px;vertical-align:1px}
  .node.sel .tagval{border-color:#fff;color:#fff}
  .grouphead{padding:6px 8px 2px;color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
  #detail{display:flex;flex-direction:column;min-height:0}
  .crumb{padding:9px 16px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .viewbar{padding:0 16px 9px;border-bottom:1px solid var(--border);display:flex;gap:8px}
  .crumb b{font-weight:650} .crumb span{color:var(--muted)}
  .pill{font-size:11px;border:1px solid var(--border);border-radius:20px;padding:1px 8px;color:var(--muted)}
  #context{display:none;padding:7px 16px;border-bottom:1px solid var(--border);background:var(--panel2)}
  .ctxlabel{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
  .ctxpath{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
           padding:3px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent}
  .ctxpath:hover{background:var(--accent-soft)}
  .ctxpath.on{border-color:var(--accent);background:var(--accent-soft)}
  .ctxpath .share{display:inline-block;width:38px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ctxpath a{color:var(--accent);text-decoration:none}
  .ctxpath a:hover{text-decoration:underline}
  .ctxpath a.cur{color:var(--text);font-weight:600}
  .ctxpath .sep{color:var(--muted)}
  .ctxelse{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);font-size:11.5px}
  .ctxelse a{color:var(--accent);text-decoration:none}
  .ctxelse a:hover{text-decoration:underline}
  #code{overflow:auto;flex:1 1 auto;min-height:0;padding-bottom:24px}
  table.src{border-collapse:collapse;width:100%;
            font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  table.src td{padding:0 6px;vertical-align:top;white-space:pre}
  td.n{text-align:right;color:var(--muted);user-select:none;width:1%;
       border-right:1px solid var(--border);font-variant-numeric:tabular-nums}
  /* Un liseré en marge en plus du fond : sur un fond sombre, la teinte seule se remarque
     mal, et en mode resserré on ne voit presque que des lignes exécutées. */
  tr.full td.c{background:var(--full);box-shadow:inset 3px 0 0 var(--fullbar)}
  tr.part td.c{background:var(--part);box-shadow:inset 3px 0 0 var(--partbar)}
  tr.miss td.c{background:var(--miss);box-shadow:inset 3px 0 0 var(--missbar)}
  td.c{width:99%}
  tr.inmethod td.n{color:var(--accent);font-weight:700}
  td.ann{color:var(--muted);font-size:11px;width:1%;max-width:300px;text-align:right;
         white-space:normal;padding-left:14px}
  td.ann a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
  td.ann .dur{opacity:.6}
  td.ann a.values{color:var(--violet);border-bottom-color:var(--violet);font-weight:600}
  /* Discret par défaut : le code doit rester du code, pas une page de liens. */
  a.callink{color:inherit;text-decoration:none;border-bottom:1px dotted var(--accent);
            cursor:pointer}
  a.callink:hover{color:var(--accent);background:var(--accent-soft);border-radius:3px}
  .fold{color:var(--muted);font-style:italic;padding:2px 12px;font-size:11.5px;
        background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  #values{background:var(--panel);padding:10px 16px;overflow:auto;
          height:var(--valh,190px);flex:0 0 auto}
  #values:empty{display:none} #values:empty + .legend{border-top:1px solid var(--border)}
  #values h3{margin:0 0 6px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
  #values h3 code{text-transform:none;letter-spacing:0;color:var(--text);font-size:12px}
  .sig{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
       color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:5px;
       padding:4px 8px;margin-bottom:7px;display:inline-block}
  .explain{color:var(--muted);font-size:11.5px;margin-bottom:8px}
  .explain b{color:var(--text)}
  /* Les colonnes se calent sur le contenu : avec un paramètre court, une colonne en 1fr
     rejetait la valeur renvoyée à l'autre bout de la ligne, illisible. */
  .call{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
        padding:5px 0;border-bottom:1px solid var(--border);display:grid;
        grid-template-columns:minmax(0,max-content) 20px minmax(0,max-content) 1fr;
        gap:10px;align-items:baseline}
  .callhead{display:grid;
            grid-template-columns:minmax(0,max-content) 20px minmax(0,max-content) 1fr;
            gap:10px;font-size:10px;letter-spacing:.6px;text-transform:uppercase;
            color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--border)}
  .callhead span:nth-child(2){grid-column:3}
  .call .v{color:var(--violet)} .call .sep{color:var(--muted)}
  .call .arrow{color:var(--muted);text-align:center}
  .call .t{color:var(--muted);opacity:.6;text-align:right;font-size:10.5px;white-space:nowrap}
  .legend{padding:7px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}
  /* La pastille de légende reprend EXACTEMENT le fond des lignes de code, bordé de la
     couleur vive : sinon la légende ne ressemble pas à ce qu'elle est censée expliquer. */
  .sw{display:inline-block;width:16px;height:11px;border-radius:3px;vertical-align:-1px;
      margin:0 5px 0 12px;border:1px solid}
  .home{padding:26px 32px;max-width:820px}
  .home h2{font-size:17px;margin:0 0 6px}
  .home p{color:var(--muted);margin:0 0 18px}
  .home .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
  @media(max-width:700px){.home .cards{grid-template-columns:1fr}}
  .card{border:1px solid var(--border);border-radius:9px;padding:13px 15px;background:var(--panel);
        border-left:4px solid var(--muted);display:flex;align-items:center;gap:13px}
  .card .ci{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
            border-radius:9px;background:var(--bg);border:1px solid var(--border);flex:0 0 auto}
  .card.c1{border-left-color:var(--fullbar)} .card.c1 .k,.card.c1 .ci{color:var(--fullbar)}
  .card.c2{border-left-color:var(--accent)}   .card.c2 .k,.card.c2 .ci{color:var(--accent)}
  .card.c3{border-left-color:var(--partbar)}  .card.c3 .k,.card.c3 .ci{color:var(--partbar)}
  .card.c4{border-left-color:var(--violet)}   .card.c4 .k,.card.c4 .ci{color:var(--violet)}
  .card .k{font-size:24px;font-weight:700} .card .l{color:var(--muted);font-size:12.5px}
  .card.c1 .k{color:var(--fullbar)} .card.c2 .k{color:var(--accent)}
  .card.c3 .k{color:var(--partbar)} .card.c4 .k{color:var(--violet)}
  .bar{height:9px;border-radius:6px;background:var(--miss);overflow:hidden;margin:2px 0 20px}
  .bar span{display:block;height:100%;background:var(--fullbar)}
  .chip{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:11.5px;border-radius:5px;padding:2px 7px;margin:0 5px 5px 0}
  .chip.dead{background:var(--miss);color:var(--missbar);border:1px solid var(--missbar)}
  .chip.hot{background:var(--part);color:var(--partbar);border:1px solid var(--partbar)}
  .chip.val{background:var(--panel);color:var(--violet);border:1px solid var(--violet)}
  .chip[data-f]:hover{filter:brightness(1.15)}
  .home h2{font-size:17px;margin:22px 0 6px;padding-left:9px;border-left:3px solid var(--accent)}
  .links2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  @media(max-width:700px){.links2{grid-template-columns:1fr}}
  a.lk{display:block;border:1px solid var(--border);border-radius:8px;padding:10px 13px;
       text-decoration:none;background:var(--panel);transition:.15s}
  a.lk:hover{border-color:var(--accent);background:var(--accent-soft)}
  .lkt{display:block;color:var(--accent);font-weight:600;font-size:13.5px;margin-bottom:2px}
  .lkd{display:block;color:var(--muted);font-size:12px;line-height:1.45}
  .home ol{color:var(--muted);padding-left:20px} .home ol li{margin:6px 0}
  svg.plan{width:100%;height:auto;max-width:820px;display:block;margin:6px 0 18px;
           border:1px solid var(--border);border-radius:9px;background:var(--bg)}
  .home ul.tools{color:var(--muted);padding-left:20px} .home ul.tools li{margin:4px 0}
  .home ul.tools b{color:var(--text)}
  svg.flame{width:100%;display:block;margin-bottom:20px;border:1px solid var(--border);
            border-radius:8px;background:var(--panel)}
  svg.flame text{font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2328;
                 pointer-events:none}
  svg.flame g.known{cursor:pointer}
  svg.flame g.known:hover rect{stroke:var(--text);stroke-width:1}
  .flame{position:relative;width:100%;margin-bottom:20px;border:1px solid var(--border);
         border-radius:8px;background:var(--panel);overflow:hidden}
  .flame .fl{position:absolute;height:16px;border-radius:2px;overflow:hidden;
             font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1f2328;
             padding:0 3px;line-height:16px;white-space:nowrap;box-sizing:border-box}
  .flame .fl.known{cursor:pointer}
  .flame .fl.known:hover{outline:1px solid var(--text);outline-offset:-1px}
  .home code{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px}
  table.ctx{border-collapse:collapse;width:100%;margin-bottom:20px}
  table.ctx td{padding:5px 10px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}
  td.ck{color:var(--muted);white-space:nowrap;width:1%}
  td.cv{word-break:break-word}
</style>
</head>
<body>
<header>
  <span class="applogo" aria-hidden="true">
    <svg viewBox="0 0 32 32" width="26" height="26">
      <rect width="32" height="32" rx="8" fill="#0d1117"/>
      <rect width="32" height="32" rx="8" fill="#38bdf8" fill-opacity=".10"/>
      <rect x="8" y="9" width="13" height="2.6" rx="1.3" fill="#3fb950"/>
      <rect x="8" y="14" width="9" height="2.6" rx="1.3" fill="#3fb950"/>
      <rect x="8" y="19" width="6" height="2.6" rx="1.3" fill="#f85149"/>
      <rect x="5" y="15.6" width="22" height="1.2" rx=".6" fill="#7dd3fc" fill-opacity=".85"/>
      <g fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round">
        <path d="M6 10.5V7.5a1.5 1.5 0 0 1 1.5-1.5h3"/><path d="M21.5 6h3A1.5 1.5 0 0 1 26 7.5v3"/>
        <path d="M26 21.5v3a1.5 1.5 0 0 1-1.5 1.5h-3"/><path d="M10.5 26h-3A1.5 1.5 0 0 1 6 24.5v-3"/>
      </g>
    </svg>
  </span>
  <h1><a href="#" id="home" title="Revenir à la vue d'ensemble">Runtime X-Ray</a></h1>
  <span class="spacer"></span>
  <span class="links" id="links"></span>
  <button id="helpbtn" class="helpbtn" title="Comment lire et utiliser cette page">? Aide</button>
  <a class="helpbtn" href="https://github.com/Beennnn/runtime-xray" target="_blank" rel="noopener"
     title="Le code, les scripts, et comment lancer cet outil sur un autre projet"
     style="text-decoration:none">Dépôt ↗</a>
</header>
<div id="help" hidden><div class="helpbox">
  <button id="helpclose" class="helpclose" title="Fermer">✕</button>
  <div id="helpbody"></div>
</div></div>
<main>
  <div id="nav">
    <span class="runpick" id="runpick" hidden>
      <span class="runlabel">exécution</span>
      <select id="runsel" title="Choisir l'exécution à regarder"></select>

gs.add(new Leg(from, to, km));", "        }", "        // Concaténation simple et non \"TRIP-%05d\".formatted(i) : le formatage coûtait à lui", "        // seul ~40 % du temps CPU et écrasait le calcul dans le flame graph. Le profil doit", "        // montrer la logique évaluée, pas la fabrication du jeu de test.", "        return new Trip(\"TRIP-\" + i, mode, weather, time, luggage, List.copyOf(legs));", "    }", "}"], "lab/sample/RoutePlanner.java": ["package lab.sample;", "", "import lab.sample.comfort.Breaks;", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "import lab.sample.model.Trip;", "import lab.sample.speed.SpeedModel;", "import lab.sample.speed.Speeds;", "import lab.sample.terrain.Terrain;", "import lab.sample.traffic.Traffic;", "import lab.sample.transfer.Connections;", "import lab.sample.weather.LuggagePenalty;", "import lab.sample.weather.WeatherPenalty;", "", "/**", " * <b>La fonction sous analyse.</b> « Combien de temps pour aller de A à B ? »", " *", " * <p>C'est le point d'entrée que chaque outil doit savoir cibler : à l'exécution de", " * cette fonction, donne-moi les lignes exécutées, l'arbre d'appel et les valeurs des", " * paramètres.", " *", " * <p>Elle appelle quatre familles de calcul <b>selon le contexte</b>, jamais toutes en", " * même temps :", " * <ul>", " *   <li>la vitesse du mode choisi — toujours, mais via une implémentation différente ;</li>", " *   <li>les bouchons — voiture à l'heure de pointe uniquement ;</li>", " *   <li>la météo et les bagages — vélo et marche uniquement ;</li>", " *   <li>les correspondances — train uniquement ;</li>", " *   <li>les pauses — au-delà d'une durée <em>calculée</em>, quel que soit le mode.</li>", " * </ul>", " * Deux trajets différents produisent donc deux arbres d'appel différents, à partir du", " * même appel de la même méthode. C'est précisément ce qu'on demande aux outils de montrer.", " */", "public final class RoutePlanner {", "", "    private RoutePlanner() {}", "", "    /**", "     * @param trip le trajet à évaluer", "     * @return la durée totale estimée, en minutes", "     */", "    public static double travelTimeMinutes(Trip trip) {", "        SpeedModel speed = Speeds.forMode(trip.mode());", "", "        double minutes = 0;", "        // Boucle indexée volontairement : la boucle for-each sur une List immuable", "        // allouait un itérateur par étape, qui représentait à lui seul la moitié des", "        // échantillons. Constaté au profiler, corrigé, re-mesuré.", "        for (int i = 0; i < trip.legs().size(); i++) {", "            minutes += legMinutes(trip.legs().get(i), speed, trip.mode());", "        }", "", "        if (Traffic.applies(trip.mode(), trip.timeOfDay())) {", "            minutes += Traffic.delayMinutes(trip.legs());", "        }", "", "        if (WeatherPenalty.applies(trip.mode())) {", "            minutes *= WeatherPenalty.slowdownFactor(trip.weather());", "            minutes *= LuggagePenalty.slowdownFactor(trip.withLuggage());", "        }", "", "        if (trip.mode() == Mode.TRAIN) {", "            minutes += Connections.waitMinutes(trip.legs(), 0);", "        }", "", "        // Décidé sur la durée obtenue, pas sur un argument reçu : voir Breaks.", "        minutes += Breaks.totalMinutes(minutes);", "", "        return minutes;", "    }", "", "    private static double legMinutes(Leg leg, SpeedModel speed, Mode mode) {", "        double minutes = leg.distanceKm() / speed.kmPerHour(leg) * 60.0;", "        if (Terrain.applies(mode)) {", "            minutes *= Terrain.slowdownFactor(leg, mode);", "        }", "        return minutes;", "    }", "}"], "lab/sample/Main.java": ["package lab.sample;", "", "import lab.sample.model.Trip;", "", "import java.util.ArrayList;", "import java.util.List;", "", "/**", " * Lanceur de l'application-cible.", " *", " * <p>Deux options n'existent que pour les besoins de l'analyse :", " * <ul>", " *   <li>{@code --iterations} — un profiler par échantillonnage n'a rien à montrer sur", " *       une exécution de 5 ms ; il faut du temps CPU pour que des frames soient prélevées.</li>", " *   <li>{@code --hold-seconds} — les outils qui s'<em>attachent</em> à un process vivant", " *       (VisualVM, JMC, JProfiler, YourKit) ont besoin que la JVM soit encore là quand", " *       l'opérateur clique. Sans cette pause, la cible est morte avant d'avoir été", " *       sélectionnée dans la liste.</li>", " * </ul>", " */", "public final class Main {", "", "    /** Nombre de trajets distincts fabriqués avant la mesure. Assez pour couvrir toutes", "     *  les combinaisons mode × météo × horaire × bagages, assez peu pour que leur", "     *  fabrication ne pèse rien face à la boucle de calcul. */", "    private static final int TRIP_VARIANTS = 240;", "", "    /** Calibré pour que le calcul dure ~10 s sur un Mac Apple Silicon. C'est le minimum", "     *  confortable pour qu'un outil qui s'attache à un process vivant (VisualVM, JMC,", "     *  JProfiler) ait le temps d'être lancé, de sélectionner la JVM et d'enregistrer", "     *  quelque chose. Une exécution d'une seconde ne laisse aucune prise. */", "    private static final int DEFAULT_ITERATIONS = 16_000_000;", "", "    public static void main(String[] args) throws InterruptedException {", "        int iterations = intArg(args, \"--iterations\", DEFAULT_ITERATIONS);", "        int holdSeconds = intArg(args, \"--hold-seconds\", 0);", "", "        System.out.printf(\"sample-app : %d trajets évalués, pause finale %d s%n\", iterations, holdSeconds);", "        Metrics metrics = new Metrics();", "        metrics.stage(\"JVM démarrée\");", "", "        // Les trajets sont fabriqués UNE FOIS, hors de la boucle mesurée.", "        // Sans cette séparation, la génération du jeu de test (concaténations de chaînes,", "        // allocations de listes) capte ~70 % des échantillons et l'arbre d'appel montre", "        // java.lang.StringConcatHelper au lieu du calcul d'itinéraire. Mesuré, pas supposé.", "        List<Trip> trips = new ArrayList<>(TRIP_VARIANTS);", "        for (int i = 0; i < TRIP_VARIANTS; i++) {", "            trips.add(Scenarios.at(i));", "        }", "", "        metrics.stage(\"jeu de trajets fabriqué\");", "", "        double total = 0;", "        for (int i = 0; i < iterations; i++) {", "            total += RoutePlanner.travelTimeMinutes(trips.get(i % TRIP_VARIANTS));", "        }", "        // Imprimé pour que le calcul ne puisse pas être éliminé, et pour vérifier d'un", "        // coup d'œil que deux exécutions comparées ont bien fait le même travail.", "        metrics.stage(\"calcul terminé\");", "        System.out.printf(\"durée cumulée = %.0f minutes%n\", total);", "", "        if (holdSeconds > 0) {", "            System.out.printf(\"JVM maintenue en vie %d s — attache ton profiler (pid %d)%n\",", "                    holdSeconds, ProcessHandle.current().pid());", "            Thread.sleep(holdSeconds * 1000L);", "        }", "    }", "", "    private static int intArg(String[] args, String name, int fallback) {", "        for (int i = 0; i < args.length - 1; i++) {", "            if (args[i].equals(name)) {", "                return Integer.parseInt(args[i + 1]);", "            }", "        }", "        return fallback;", "    }", "}"], "lab/sample/Metrics.java": ["package lab.sample;", "", "/**", " * Mesures d'étape : temps écoulé et mémoire occupée.", " *", " * <p>Volontairement fondé sur le seul JDK ({@code System.nanoTime}, {@code Runtime}) :", " * ces chiffres servent de <b>référence indépendante</b>. Quand un outil d'analyse annonce", " * un temps ou une empreinte, on veut pouvoir le confronter à une mesure qui ne vient pas", " * de lui — et constater au passage combien l'outil lui-même ralentit l'exécution.", " *", " * <p>La mémoire est lue après un appel à {@code System.gc()} : sans lui, on mesure surtout", " * les déchets pas encore ramassés, ce qui ne veut rien dire. L'appel reste une", " * <em>suggestion</em> faite à la JVM, jamais une garantie — d'où l'ordre de grandeur", " * annoncé plutôt qu'une valeur exacte.", " */", "public final class Metrics {", "", "    private final long startNanos = System.nanoTime();", "    private long lastNanos = startNanos;", "", "    void stage(String label) {", "        long now = System.nanoTime();", "        double sinceLastMs = (now - lastNanos) / 1_000_000.0;", "        double totalMs = (now - startNanos) / 1_000_000.0;", "        lastNanos = now;", "", "        System.gc();", "        Runtime runtime = Runtime.getRuntime();", "        long usedMb = (runtime.totalMemory() - runtime.freeMemory()) / (1024 * 1024);", "        long maxMb = runtime.maxMemory() / (1024 * 1024);", "", "        System.out.printf(\"  [%-28s] étape %8.0f ms | cumul %8.0f ms | mémoire ~%d Mo / %d Mo max%n\",", "                label, sinceLastMs, totalMs, usedMb, maxMb);", "    }", "}"], "lab/sample/traffic/RushHourDelay.java": ["package lab.sample.traffic;", "", "import lab.sample.model.Leg;", "", "/** Retard dû aux bouchons de l'heure de pointe. */", "public final class RushHourDelay {", "", "    private RushHourDelay() {}", "", "    static double minutesFor(Leg leg) {", "        // Les bouchons pénalisent surtout les entrées et sorties d'agglomération,", "        // donc les étapes courtes : d'où un retard qui ne suit pas la distance.", "        if (leg.distanceKm() < 5) {", "            return 8;", "        }", "        return leg.distanceKm() < 40 ? 15 : 20;", "    }", "}"], "lab/sample/traffic/Traffic.java": ["package lab.sample.traffic;", "", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "import lab.sample.model.TimeOfDay;", "", "import java.util.List;", "", "/**", " * Retard lié à la circulation.", " *", " * <p>Sous-arbre entièrement <b>conditionnel</b> : il n'existe que pour la voiture, et", " * seulement à l'heure de pointe. Sur un trajet en train à 22 h, aucune de ces lignes", " * ne s'exécute — et c'est exactement ce que le dépôt cherche à rendre visible.", " */", "public final class Traffic {", "", "    private Traffic() {}", "", "    public static boolean applies(Mode mode, TimeOfDay timeOfDay) {", "        return mode == Mode.CAR && timeOfDay == TimeOfDay.RUSH_HOUR;", "    }", "", "    public static double delayMinutes(List<Leg> legs) {", "        double total = 0;", "        for (Leg leg : legs) {", "            total += RushHourDelay.minutesFor(leg);", "        }", "        return total;", "    }", "}"], "lab/sample/speed/BikeSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** À vélo : on ralentit sur les longues distances (fatigue). */", "public final class BikeSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return leg.distanceKm() > 20 ? 15 : 18;", "    }", "}"], "lab/sample/speed/Speeds.java": ["package lab.sample.speed;", "", "import lab.sample.model.Mode;", "", "/** Fabrique : associe un mode de transport à son modèle de vitesse. */", "public final class Speeds {", "", "    // Instances partagées : les modèles de vitesse sont sans état. Les allouer à chaque", "    // appel captait ~25 % des échantillons — du bruit d'allocation qui masquait le calcul.", "    private static final SpeedModel CAR = new CarSpeed();", "    private static final SpeedModel TRAIN = new TrainSpeed();", "    private static final SpeedModel BIKE = new BikeSpeed();", "    private static final SpeedModel WALK = new WalkSpeed();", "", "    private Speeds() {}", "", "    public static SpeedModel forMode(Mode mode) {", "        return switch (mode) {", "            case CAR -> CAR;", "            case TRAIN -> TRAIN;", "            case BIKE -> BIKE;", "            case WALK -> WALK;", "            // Instancié ici et non partagé comme les autres : ainsi PlaneSpeed n'est", "            // JAMAIS chargée ni exécutée, et reste à 0 % dans le rapport de couverture.", "            // Un champ static final l'aurait fait construire au chargement de Speeds.", "            case PLANE -> new PlaneSpeed();", "        };", "    }", "}"], "lab/sample/speed/TrainSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** En train : vitesse quasi constante, indépendante de la longueur de l'étape. */", "public final class TrainSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return leg.distanceKm() > 100 ? 220 : 90;", "    }", "}"], "lab/sample/speed/PlaneSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** En avion. <b>Jamais instanciée par les scénarios</b> : cette classe entière doit", " *  apparaître à 0 % dans un rapport de couverture. C'est le test le plus visuel du", " *  critère « sait-on par où le code n'est PAS passé ? » — un profiler par", " *  échantillonnage, lui, ne dira jamais rien de ce code. */", "public final class PlaneSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return leg.distanceKm() > 1000 ? 850 : 600;", "    }", "}"], "lab/sample/speed/WalkSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** À pied : 5 km/h, la vitesse de marche de tout le monde. */", "public final class WalkSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return 5;", "    }", "}"], "lab/sample/speed/CarSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** En voiture : plus l'étape est longue, plus on roule vite (ville puis voie rapide). */", "public final class CarSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        if (leg.distanceKm() < 5) {", "            return 25;   // trajet urbain", "        }", "        return leg.distanceKm() < 40 ? 70 : 110;", "    }", "}"], "lab/sample/speed/SpeedModel.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** Vitesse moyenne d'un mode de transport sur une étape.", " *", " *  <p>Point de <b>dispatch virtuel</b> du programme : l'appel part toujours de", " *  l'interface, mais c'est l'implémentation concrète qui travaille. Un bon arbre", " *  d'appel doit nommer l'implémentation réellement exécutée ; certains outils", " *  s'arrêtent à l'interface, et c'est une différence qui se voit tout de suite. */", "public interface SpeedModel {", "    double kmPerHour(Leg leg);", "}"], "lab/sample/transfer/Timetable.java": ["package lab.sample.transfer;", "", "import lab.sample.model.Leg;", "", "import java.util.Map;", "import java.util.concurrent.ConcurrentHashMap;", "", "/**", " * Consultation des horaires — la seule opération <b>bloquante</b> du programme.", " *", " * <p>Elle simule un appel à un service extérieur par un {@code Thread.sleep}. Sa", " * présence n'est pas décorative : elle crée du <em>temps d'attente</em> à côté du temps", " * de calcul, et c'est un excellent discriminant entre outils. Un profiler qui échantillonne", " * le CPU ne la verra pratiquement pas ; un profiler en temps réel (wall clock) la verra", " * dominer. Deux outils peuvent donc donner deux réponses opposées à « où passe le temps ? »", " * sur exactement la même exécution — et il faut savoir laquelle on regarde.", " *", " * <p>Le résultat est mis en cache : un horaire ne se demande qu'une fois par liaison.", " */", "public final class Timetable {", "", "    private static final Map<String, Integer> CACHE = new ConcurrentHashMap<>();", "    private static final int LOOKUP_MILLIS = 3;", "", "    private Timetable() {}", "", "    /** @return la fréquence de passage, en minutes, pour cette liaison. */", "    public static int frequencyMinutes(Leg leg) {", "        return CACHE.computeIfAbsent(leg.from() + \">\" + leg.to(), key -> {", "            try {", "                Thread.sleep(LOOKUP_MILLIS); // appel réseau simulé", "            } catch (InterruptedException e) {", "                Thread.currentThread().interrupt();", "            }", "            return 10 + (Math.abs(key.hashCode()) % 50);", "        });", "    }", "}"], "lab/sample/transfer/Connections.java": ["package lab.sample.transfer;", "", "import lab.sample.model.Leg;", "", "import java.util.List;", "", "/**", " * Temps d'attente aux correspondances — propre au train.", " *", " * <p>Le calcul est <b>récursif</b> sur la liste des étapes : il ajoute un foyer de", " * récursion distinct de celui de {@code comfort.Breaks}, dans une branche que seuls", " * certains scénarios empruntent. Utile pour vérifier qu'un outil ne confond pas deux", " * récursions différentes dans le même arbre.", " */", "public final class Connections {", "", "    private Connections() {}", "", "    public static double waitMinutes(List<Leg> legs, int index) {", "        if (index >= legs.size() - 1) {", "            return 0; // dernière étape : plus de correspondance après", "        }", "        double here = transferMinutes(legs.get(index), legs.get(index + 1));", "        return here + waitMinutes(legs, index + 1);", "    }", "", "    private static double transferMinutes(Leg arriving, Leg departing) {", "        // Une correspondance dans la même gare est plus rapide qu'un changement de gare,", "        // et l'attente dépend de la fréquence de passage — donc d'une consultation", "        // d'horaires, seule opération bloquante du programme.", "        double walk = arriving.to().equals(departing.from()) ? 6 : 18;", "        return walk + Timetable.frequencyMinutes(departing) / 2.0;", "    }", "}"], "lab/sample/comfort/Breaks.java": ["package lab.sample.comfort;", "", "/**", " * Pauses obligatoires sur les longs trajets.", " *", " * <p>Particularité volontaire : la décision se prend sur une <b>valeur calculée</b>", " * (la durée obtenue jusque-là) et non sur un argument reçu tel quel. Un outil qui ne", " * capture que les arguments d'entrée de la fonction analysée ne saura pas expliquer", " * pourquoi cette branche a ble penaltyFor(double gradePercent, Mode mode) {", "        double sensitivity = switch (mode) {", "            case BIKE -> 0.09;", "            case WALK -> 0.05;", "            case CAR -> 0.01;", "            case TRAIN -> 0.00;", "            case PLANE -> 0.00;", "        };", "        if (gradePercent > 0) {", "            return 1.0 + gradePercent * sensitivity;", "        }", "        return 1.0 + gradePercent * sensitivity * 0.3; // la descente ne compense qu'en partie", "    }", "}"], "lab/sample/terrain/Elevation.java": ["package lab.sample.terrain;", "", "import lab.sample.model.Leg;", "", "/** Relief le long d'une étape, échantillonné en sous-segments.", " *", " *  <p>Déterministe : le profil d'une étape donnée est toujours le même, sinon deux", " *  exécutions ne seraient plus comparables. */", "public final class Elevation {", "", "    private Elevation() {}", "", "    /** @return la pente du {@code step}-ième sous-segment, en pourcentage (−8 % à +8 %). */", "    public static double gradePercentAt(Leg leg, int step) {", "        // Arithmétique simple plutôt que Math.sin/cos : les intrinsèques trigonométriques", "        // apparaissaient comme feuilles dominantes du profil (dsin/dcos, ~50 % des", "        // échantillons), ce qui rendait l'arbre d'appel illisible pour qui cherche les", "        // méthodes métier. Le relief reste déterministe et varié.", "        double phase = (Math.abs(leg.from().hashCode()) % 17) + step;", "        double wave = ((phase * 37) % 21) - 10.0;          // -10 .. +10, en dents de scie", "        double smooth = wave * (1.0 - Math.abs(wave) / 25.0);", "        return smooth * 0.8;", "    }", "}"], "lab/sample/model/Mode.java": ["package lab.sample.model;", "", "/** Comment on se déplace. C'est le principal <b>aiguilleur</b> du calcul : chaque mode", " *  active une famille de calculs différente (bouchons pour la voiture, correspondances", " *  pour le train, météo pour le vélo et la marche).", " *", " *  <p>{@code PLANE} n'est jamais choisi par les scénarios : la classe de vitesse", " *  correspondante doit rester à 0 % dans un rapport de couverture. */", "public enum Mode { CAR, TRAIN, BIKE, WALK, PLANE }"], "lab/sample/model/Weather.java": ["package lab.sample.model;", "", "/** Météo du jour. {@code SNOW} n'est jamais tiré par les scénarios : second trou de", " *  couverture volontaire, à l'intérieur d'une classe par ailleurs bien couverte —", " *  un cas que les rapports agrégés par package ont tendance à diluer. */", "public enum Weather { SUNNY, RAIN, SNOW }"], "lab/sample/model/Leg.java": ["package lab.sample.model;", "", "/** Une étape du trajet : une portion parcourue d'un seul tenant. */", "public record Leg(String from, String to, double distanceKm) {}"], "lab/sample/model/TimeOfDay.java": ["package lab.sample.model;", "", "/** Moment de la journée. Seule {@code RUSH_HOUR} déclenche le calcul de bouchons,", " *  et seulement en voiture : c'est l'exemple le plus simple d'une fonction appelée", " *  ou non selon le contexte. */", "public enum TimeOfDay { QUIET, RUSH_HOUR, NIGHT }"], "lab/sample/model/Trip.java": ["package lab.sample.model;", "", "import java.util.List;", "", "/**", " * Le trajet dont on veut connaître la durée — <b>le paramètre dont on veut voir la", " * valeur capturée</b>.", " *", " * <p>Chaque champ envoie l'exécution dans une branche différente. C'est ce qui rend la", " * question « quelles valeurs ont été passées ? » décisive : deux appels de même", " * signature peuvent parcourir des sous-arbres complètement disjoints, et un outil qui", " * n'affiche que {@code Trip@3f2a1b} ne permet pas de savoir lequel des deux on regarde.", " */", "public record Trip(", "        String id,", "        Mode mode,", "        Weather weather,", "        TimeOfDay timeOfDay,", "        boolean withLuggage,   // ne pèse qu'à vélo et à pied", "        List<Leg> legs) {", "", "    public double totalDistanceKm() {", "        double km = 0;", "        for (Leg leg : legs) {", "            km += leg.distanceKm();", "        }", "        return km;", "    }", "}"], "lab/sample/weather/WeatherPenalty.java": ["package lab.sample.weather;", "", "import lab.sample.model.Mode;", "import lab.sample.model.Weather;", "", "/**", " * Ralentissement dû à la météo.", " *", " * <p>Ne concerne que les modes exposés — vélo et marche. La branche {@code SNOW} n'est", " * jamais empruntée : c'est un trou de couverture <em>à l'intérieur</em> d'une méthode", " * par ailleurs exécutée des milliers de fois. Un rapport qui n'affiche qu'un", " * pourcentage par classe le masque ; un rapport qui colorie les lignes le montre.", " */", "public final class WeatherPenalty {", "", "    private WeatherPenalty() {}", "", "    public static boolean applies(Mode mode) {", "        return mode == Mode.BIKE || mode == Mode.WALK;", "    }", "", "    public static double slowdownFactor(Weather weather) {", "        return switch (weather) {", "            case SUNNY -> 1.00;", "            case RAIN -> 1.15;", "            case SNOW -> 1.60;", "        };", "    }", "}"], "lab/sample/weather/LuggagePenalty.java": ["package lab.sample.weather;", "", "/** Ralentissement dû aux bagages. Double condition : il faut des bagages <b>et</b> un", " *  mode où ils gênent. Deux conditions imbriquées = une branche qu'on n'atteint que", " *  dans une minorité de scénarios. */", "public final class LuggagePenalty {", "", "    private LuggagePenalty() {}", "", "    public static double slowdownFactor(boolean withLuggage) {", "        return withLuggage ? 1.10 : 1.00;", "    }", "}"]}};
// Plusieurs exécutions peuvent cohabiter dans le même rapport. R désigne celle qu'on
// regarde ; tout le reste de la page lit R, jamais D directement (sauf les sources,
// communes à toutes les exécutions).
let runIndex = 0;
let R = D.runs[0];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const dot = s => s.replace(/\//g,".");
let clean = true, mode = "exec", scopeFrame = null, selected = null, filter = "", ctxIndex = 0;
// Un nœud d'arbre d'appel désigne un CHEMIN, pas un appel : le profil est un agrégat.
// Les appels individuels viennent de l'inspection, et chacun est sélectionnable à part.
// callIndex vaut null quand on regarde la méthode, ou l'indice de l'appel regardé.
let callIndex = null;
// Deux façons de lire le temps : la part du total, ou une durée estimée. La seconde parle
// davantage à qui cherche « combien de temps », la première à qui compare deux méthodes.
let unit = "pct";
// Les noms de paquet complets rendent l'arbre illisible sur un projet à l'arborescence
// profonde ; on peut les replier d'un bouton.
let showPackages = true;

/** Nom d'une frame, avec ou sans son paquet, selon le réglage. */
function frameLabel(frame){
  const full = dot(frame);
  if (showPackages) return full;
  const parts = full.split(".");
  return parts.length <= 2 ? full : parts.slice(-2).join(".");
}

/** Un relevé est pris toutes les millisecondes de temps processeur : le compte d'échantillons
 *  d'une méthode est donc, à peu de chose près, son temps processeur en millisecondes. */
function formatWeight(samples, total){
  if (!samples) return "·";
  if (unit === "pct"){
    const share = 100 * samples / (total || 1);
    return share >= 0.05 ? share.toFixed(1) + "%" : "·";
  }
  const ms = samples * (R.intervalMs || 1);
  if (ms >= 10000) return (ms / 1000).toFixed(1) + "s";
  if (ms >= 1000) return (ms / 1000).toFixed(2) + "s";
  return Math.round(ms) + "ms";
}

/* ---------------------------------------------------------------- agrégats */
function ranIn(run, frame){
  const cls = frame.slice(0, frame.lastIndexOf("."));
  const name = frame.slice(frame.lastIndexOf(".") + 1);
  const info = run.methods[cls];
  return !!(info && info.methods.some(m => m.name === name && m.covered));
}
function computeAgg(){
  let cov=0, miss=0; const dead=[];
  for (const classes of Object.values(R.packages))
    for (const c of classes){ cov+=c.covered; miss+=c.missed; if(!c.covered) dead.push(c.simple); }
  const weights = {};
  (function walk(n){ for(const k of n.children){ weights[k.name]=(weights[k.name]||0)+k.total; walk(k);} })(R.calltree);
  let methods=0;
  for (const info of Object.values(R.methods)) methods += info.methods.filter(m=>m.covered).length;
  return {cov, miss, dead, weights, methods,
          pct: cov+miss ? 100*cov/(cov+miss) : 0, samples: R.calltree.total};
}
let AGG = computeAgg();

(function initRuns(){
  const sel = document.getElementById("runsel");
  if (D.runs.length < 2){ return; }
  document.getElementById("runpick").hidden = false;
  sel.innerHTML = D.runs.map((r,i) =>
    '<option value="'+i+'">'+r.nom.replace(/</g,"&lt;")+'</option>').join("");
  sel.onchange = () => switchRun(+sel.value, true);
})();

function switchRun(i, redraw){
  runIndex = i; R = D.runs[i]; AGG = computeAgg(); methodIndex = null;
  scopeFrame = null; ctxIndex = 0;
  const sel = document.getElementById("runsel");
  if (sel && !sel.hidden) sel.value = String(i);
  refreshHeader(); refreshLinks();
  if (redraw){ selected = null; renderExec(); drawHome(); }
}

function refreshHeader(){
  // Les chiffres vivent sur la page principale, où ils ont du contexte. L'en-tête ne garde
  // que ce qui sert à naviguer.
}
refreshHeader();
function refreshLinks(){
  // On n'affiche un lien que si le fichier a réellement été produit : un lien mort est
  // pire que pas de lien. Le générateur nous dit ce qui existe.
  const b = R.chemin || "", a = R.rapports || {};
  // On nomme l'outil qui produit chaque rapport : ici, contrairement à la surface
  // d'analyse, l'information est utile — elle dit à quoi s'attendre en cliquant.
  const l = (ok, href, txt, outil) => ok
    ? '<a href="'+b+href+'" title="Rapport produit par '+outil+'">'+txt+
      ' <span class="by">'+outil+'</span></a>' : "";
  document.getElementById("links").innerHTML =
    l(a.couverture, "jacoco/html/index.html", "couverture détaillée", "JaCoCo") +

    l(a.flamegraph, "async-profiler/flamegraph.html", "flame graph", "async-profiler") +
    l(a.arbre, "async-profiler/tree.html", "arbre d'appel", "async-profiler") +
    l(Object.keys(R.values||{}).length, "arthas/watch-params.txt", "valeurs brutes", "Arthas");
}
refreshLinks();
document.getElementById("legend").innerHTML =
  '<span class="sw" style="background:var(--full);border-color:var(--fullbar)"></span>exécutée' +
  '<span class="sw" style="background:var(--part);border-color:var(--partbar)"></span>partiellement' +
  '<span class="sw" style="background:var(--miss);border-color:var(--missbar)"></span>jamais exécutée' +
  ' <span style="opacity:.75">(masquée tant que « Resserré sur la méthode » est actif)</span>' +
  '<span style="margin-left:16px">À droite d\'une ligne : <b>appelle …</b> = les méthodes appelées ' +
  'depuis cette ligne et leur <i>durée</i> · <span style="color:var(--violet)">valeurs des paramètres</span> ' +
  '= les valeurs reçues par la méthode, détaillées dans le bandeau du bas.</span>';
// La répartition du travail entre les outils sous-jacents n'a pas sa place ici : elle
// n'aide en rien à lire le rapport. Elle reste expliquée sur la vue d'ensemble.

/* --------------------------------------------------------- frame -> source */
function frameInfo(frame){
  const i = frame.lastIndexOf(".");
  if (i < 0) return null;
  const cls = frame.slice(0,i), name = frame.slice(i+1);
  const info = R.methods[cls];
  if (!info) return null;
  const decl = info.methods.find(m => m.name === name);
  return {frame, cls, name, line: decl ? decl.line : 0,
          source: info.source, methods: info.methods};
}

/* ------------------------------------------- périmètre : sous une méthode */
function framesUnder(target){
  const acc = {};
  (function walk(node, inside){
    for (const kid of node.children){
      const now = inside || kid.name === target;
      if (now) acc[kid.name] = (acc[kid.name]||0) + kid.total;
      walk(kid, now);
    }
  })(R.calltree, false);
  return acc;
}
function executedMethods(){
  const scoped = scopeFrame ? framesUnder(scopeFrame) : null;
  const out = [];
  for (const [cls, info] of Object.entries(R.methods))
    for (const m of info.methods){
      if (!m.covered) continue;
      const frame = cls + "." + m.name;
      if (scoped && !(frame in scoped)) continue;
      if (filter && !(dot(frame).toLowerCase().includes(filter))) continue;
      out.push({frame, cls, name: m.name, line: m.line, source: info.source,
                methods: info.methods, samples: AGG.weights[frame] || 0});
    }
  return out.sort((a,b) => b.samples - a.samples || a.frame.localeCompare(b.frame));
}

/* ------------------------------------------------------------------ listes */
function renderScope(){
  const box = document.getElementById("scope");
  if (mode !== "exec"){ box.innerHTML = ""; box.style.display = "none"; return; }
  // Rien à afficher quand le périmètre est complet : une explication permanente freine la
  // prise en main sans rien apprendre. Elle reste sur la vue d'ensemble, à sa place.
  if (!scopeFrame){ box.innerHTML = ""; box.style.display = "none"; return; }
  box.style.display = "block";
  box.innerHTML = "Périmètre : <b>ce qui a tourné sous " +
      esc(dot(scopeFrame).split(".").slice(-2).join(".")) + "</b>" +
      "<button id='unscope'>Toute l'exécution</button>";
  const b = document.getElementById("unscope");
  if (b) b.onclick = () => { scopeFrame = null; renderExec(); };
}
function tab(id){ document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on"));
                  document.getElementById(id).classList.add("on"); }

function renderExec(){
  mode = "exec"; tab("tab-exec"); renderScope();
  const box = document.getElementById("list"); box.innerHTML = "";
  const rows = executedMethods();
  const total = rows.reduce((a,r)=>a+r.samples,0) || 1;
  const head = document.createElement("div");
  head.className = "grouphead";
  head.textContent = rows.length + " méthode(s) — cliquer pour voir le code";
  box.appendChild(head);
  for (const r of rows){
    const el = document.createElement("div");
    el.className = "node";
    const share = 100*r.samples/total;
    const carriesValues = !!(R.values[r.frame] || []).length;
    // Repère « mélangé » : dans quelles AUTRES exécutions cette méthode a-t-elle tourné ?
    const alsoIn = D.runs.length > 1
      ? D.runs.map((run, i) => i !== runIndex && ranIn(run, r.frame) ? i : -1).filter(i => i >= 0)
      : [];
    el.innerHTML = '<span class="pct">'+(share >= 0.05 ? share.toFixed(1)+"%" : "·")+
                   '</span>'+esc(r.cls.split("/").pop()+"."+r.name)+
                   (carriesValues ? ' <span class="tagval">valeurs</span>' : '') +
                   (D.runs.length > 1
                     ? (alsoIn.length
                          ? ' <span class="tagrun" title="aussi exécutée dans : '+
                            alsoIn.map(i => esc(D.runs[i].nom)).join(", ")+'">+'+alsoIn.length+'</span>'
                          : ' <span class="tagonly" title="propre à cette exécution">seule ici</span>')
                     : '');
    el.title = dot(r.frame);
    el.onclick = () => select(r, el);
    box.appendChild(el);
  }
}

function renderTree(){
  mode = "tree"; tab("tab-tree"); renderScope();
  const box = document.getElementById("list"); box.innerHTML = "";

  // Les exécutions sont les RACINES de l'arbre : une exécution est le contexte d'appel le
  // plus haut qui soit, celui qui englobe tous les autres. Avec plusieurs exécutions, on
  // les voit côte à côte et on descend dans celle qu'on veut.
  D.runs.forEach((run, idx) => {
    const total = run.calltree.total || 1;
    const head = document.createElement("div");
    head.className = "node runroot" + (idx === runIndex ? " on" : "");
    head.innerHTML = '<span class="tw">' + (idx === runIndex ? "▾" : "▸") + '</span>' +
                     '<span class="runbadge">exécution</span> ' + esc(run.nom) +
                     ' <span class="pct2">' + total.toLocaleString("fr") + ' mesures</span>';
    box.appendChild(head);
    const holder = document.createElement("div");
    holder.style.display = idx === runIndex ? "block" : "none";
    box.appendChild(holder);
    let built = false;
    if (idx === runIndex){ level(holder, run.calltree, 1, total, idx); built = true; }
    head.onclick = () => {
      const open = holder.style.display === "none";
      if (open && !built){ level(holder, run.calltree, 1, total, idx); built = true; }
      holder.style.display = open ? "block" : "none";
      head.querySelector(".tw").textContent = open ? "▾" : "▸";
      if (open && idx !== runIndex) switchRun(idx, false);
    };
  });

  function level(container, node, depth, total, idx){
    for (const kid of node.children){
      if (filter && !dot(kid.name).toLowerCase().includes(filter) && !hasMatch(kid)) continue;
      const known = !!frameInfo(kid.name);
      const el = document.createElement("div");
      el.className = "node" + (known ? "" : " jdk");
      el.style.paddingLeft = (6 + depth * 11) + "px";
      const hasCalls = frameInfo(kid.name) && (R.values[kid.name] || []).length;
      el.innerHTML = '<span class="tw">' + ((kid.children.length || hasCalls) ? "▸" : "") + '</span>' +
                     '<span class="pct">' + formatWeight(kid.total, total) + '</span>' +
                     esc(frameLabel(kid.name)) +
                     ((known && (R.values[kid.name] || []).length)
                        ? ' <span class="tagval">' + R.values[kid.name].length + ' appels</span>' : '');
      container.appendChild(el);
      const holder = document.createElement("div");
      holder.style.display = "none";
      container.appendChild(holder);
      // Les enfants ne sont construits qu'au premier dépliage. Sur une vraie application,
      // un arbre d'appel compte des dizaines de milliers de nœuds : tout construire d'avance
      // fige la page. Ici on ne paie que ce qu'on ouvre.
      // Les appels observés de cette méthode deviennent des nœuds à part entière : un
      // nœud = un appel, ce que le profil agrégé ne peut pas offrir.
      const observedCalls = known ? (R.values[kid.name] || []) : [];
      let built = false;
      el.onclick = e => {
        e.stopPropagation();
        if (kid.children.length || observedCalls.length){
          const open = holder.style.display === "none";
          if (open && !built){
            observedCalls.forEach((call, k) => {
              const leaf = document.createElement("div");
              leaf.className = "node callnode";
              leaf.style.paddingLeft = (6 + (depth + 1) * 11) + "px";
              const resume = (call.params || []).map(x => x.value).join(", ");
              leaf.innerHTML = '<span class="tw"></span><span class="callbadge">appel ' +
                               (k + 1) + '</span> ' + esc(resume.slice(0, 60));
              leaf.title = resume;
              leaf.onclick = ev => {
                ev.stopPropagation();
                if (idx !== runIndex) switchRun(idx, false);
                const info2 = frameInfo(kid.name);
                if (info2) select(info2, leaf, k);
              };
              holder.appendChild(leaf);
            });
            level(holder, kid, depth + 1, total, idx);
            built = true;
          }
          holder.style.display = open ? "block" : "none";
          el.querySelector(".tw").textContent = open ? "▾" : "▸";
        }
        if (idx !== runIndex) switchRun(idx, false);
        if (known) selectFrame(kid.name, el);
      };
    }
  }
  function hasMatch(node){
    return node.children.some(k => dot(k.name).toLowerCase().includes(filter) || hasMatch(k));
  }
}

function renderClasses(){
  mode = "cls"; tab("tab-cls"); renderScope();
  const box = document.getElementById("list"); box.innerHTML = "";
  for (const pkg of Object.keys(R.packages).sort()){
    let classes = R.packages[pkg];
    if (clean) classes = classes.filter(c => c.covered > 0);
    if (filter) classes = classes.filter(c => (pkg+"."+c.simple).toLowerCase().includes(filter));
    if (!classes.length) continue;
    const head = document.createElement("div");
    head.className = "grouphead"; head.textContent = dot(pkg);
    box.appendChild(head);
    for (const c of classes){
      const el = document.createElement("div");
      el.className = "node"; el.style.paddingLeft = "14px";
      const pct = c.covered+c.missed ? Math.round(100*c.covered/(c.covered+c.missed)) : 0;
      el.innerHTML = '<span class="pct">'+pct+'%</span>'+esc(c.simple);
      el.onclick = () => select({frame:c.name, cls:c.name, name:null, line:0, source:c.source,
                                 methods:(R.methods[c.name]||{}).methods||[]}, el);
      box.appendChild(el);
    }
  }
}

/* ------------------------------------------- contextes d'appel d'une méthode
   Dans l'arbre, le contexte est donné par le chemin parcouru. Dans les listes à plat
   (Code exécuté, Packages) il manque : une méthode appelée depuis deux endroits n'est
   pas la même histoire. On reconstruit donc les chemins connus qui mènent à elle. */
function pathsTo(frame, max = 4){
  const found = [];
  (function walk(node, path){
    for (const kid of node.children){
      const next = path.concat([kid.name]);
      if (kid.name === frame) found.push({path: next, total: kid.total});
      else walk(kid, next);
    }
  })(R.calltree, []);
  found.sort((a,b) => b.total - a.total);
  const sum = found.reduce((a,f) => a + f.total, 0) || 1;
  return {chemins: found.slice(0, max), total: sum, nb: found.length};
}
/** Combien de chemins distincts mènent à cette méthode dans une exécution donnée. */
function occurrencesOf(run, frame){
  let n = 0;
  (function walk(node){
    for (const kid of node.children){
      if (kid.name === frame) n++;
      walk(kid);
    }
  })(run.calltree);
  return n;
}
function renderContexts(info){
  const box = document.getElementById("context");
  if (!info || !info.name){ box.innerHTML = ""; box.style.display = "none"; return; }
  const {chemins, total, nb} = pathsTo(info.frame);
  if (!chemins.length){ box.innerHTML = ""; box.style.display = "none"; return; }
  box.style.display = "block";
  const label = nb === 1 ? "Appelée depuis un seul contexte :"
                         : "Appelée depuis " + nb + " contextes — choisir lequel regarder :";
  box.innerHTML = '<span class="ctxlabel">' + label + '</span>' +
    chemins.map((c, i) => {
      const chain = c.path.filter(f => frameInfo(f));
      const short = chain.map((f, j) =>
        '<a href="#" data-f="'+esc(f)+'" class="'+(j === chain.length-1 ? "cur" : "")+'">'+
        esc(f.split("/").pop())+'</a>').join('<span class="sep"> › </span>');
      return '<div class="ctxpath'+(i === ctxIndex ? " on" : "")+'" data-i="'+i+'">'+
             '<span class="share">'+(100*c.total/total).toFixed(0)+' %</span>'+short+'</div>';
    }).join("");
  box.querySelectorAll(".ctxpath").forEach(el => el.onclick = e => {
    if (e.target.tagName === "A") return;
    ctxIndex = +el.dataset.i;
    renderContexts(info);
  });
  // Une même méthode peut avoir tourné dans d'autres exécutions : on le dit, et on y va.
  if (D.runs.length > 1){
    const ailleurs = D.runs
      .map((run, i) => ({ i, run, n: occurrencesOf(run, info.frame) }))
      .filter(o => o.i !== runIndex && o.n > 0);
    if (ailleurs.length){
      box.innerHTML += '<div class="ctxelse">Aussi appelée dans : ' +
        ailleurs.map(o => '<a href="#" data-run="'+o.i+'">'+esc(o.run.nom)+
          ' <span class="share">'+o.n+' contexte'+(o.n > 1 ? 's' : '')+'</span></a>').join(" · ") +
        '</div>';
      box.querySelectorAll("a[data-run]").forEach(a => a.onclick = e => {
        e.preventDefault();
        switchRun(+a.dataset.run, false);
        const t = frameInfo(info.frame);
        renderExec();
        if (t) select(t, null);
      });
    }
  }
  box.querySelectorAll("a[data-f]").forEach(a => a.onclick = e => {
    e.preventDefault();
    const t = frameInfo(a.dataset.f);
    if (t) { ctxIndex = 0; select(t, null); }
  });
}

/* -------------------------------------------- appels cliquables dans le code
   Rendre navigable le code lui-même : sur une ligne qui appelle une méthode de
   l'application, le nom de cette méthode devient un lien. C'est le geste naturel —
   on lit le code, on suit l'appel — et il évite de passer par la liste de gauche.

   L'ambiguïté (deux classes ayant une méthode du même nom) est levée d'abord par les
   appels RÉELLEMENT observés sur cette ligne ; à défaut, on ne lie que les noms qui
   n'existent qu'à un seul endroit. Mieux vaut pas de lien qu'un lien qui ment. */
let methodIndex = null;

function buildMethodIndex(){
  const index = new Map();
  for (const [cls, info] of Object.entries(R.methods)){
    for (const m of info.methods){
      if (!m.covered) continue;                 // ne pas proposer du code jamais exécuté
      if (!index.has(m.name)) index.set(m.name, []);
      index.get(m.name).push(cls + "." + m.name);
    }
  }
  return index;
}

const RESERVED = new Set(["if","for","while","switch","catch","return","new","super","this","synchronized"]);

function linkifyCalls(escapedLine, lineNumber){
  if (!methodIndex) methodIndex = buildMethodIndex();
  // Ce que la trace a vu partir de cette ligne : l'information la plus sûre.
  const observed = new Map();
  for (const call of (R.trace[lineNumber] || [])){
    if (call.frame) observed.set(call.frame.slice(call.frame.lastIndexOf(".") + 1), call.frame);
  }
  return escapedLine.replace(/\b([A-Za-z_$][\w$]*)(\s*\()/g, (whole, name, tail) => {
    if (RESERVED.has(name)) return whole;
    let frame = observed.get(name);
    if (!frame){
      const candidates = methodIndex.get(name);
      if (!candidates || candidates.length !== 1) return whole;
      frame = candidates[0];
    }
    if (selected && frame === selected.frame) return whole;   // ne pas se lier à soi-même
    return '<a class="callink" href="#" data-f="' + frame + '" title="' +
           dot(frame) + '">' + name + '</a>' + tail;
  });
}

/* ------------------------------------------------------------ vue de code */
function selectFrame(frame, el){
  const info = frameInfo(frame);
  if (!info) return;
  scopeFrame = frame;
  select(info, el);
}
function select(info, el, call){
  document.querySelectorAll(".node.sel").forEach(n=>n.classList.remove("sel"));
  if (el) el.classList.add("sel");
  selected = info;
  callIndex = (call === undefined) ? null : call;
  draw();
}
function draw(){
  const code = document.getElementById("code");
  if (!selected){ drawHome(); return; }
  const info = selected, src = D.sources[info.source], cov = R.coverage[info.source] || {};
  const myCalls = R.values[info.frame] || [];
  const traced = info.cls === R.tracedClass;
  const samples = AGG.weights[info.frame] || 0;

  document.getElementById("crumb").innerHTML =
    '<a class="back" id="backHome" title="Revenir à la vue d\'ensemble">← Vue d\'ensemble</a> <span>›</span> ' +
    '<span>'+esc(dot(info.cls).split(".").slice(0,-1).join("."))+' ›</span> <b>'+
    esc(info.cls.split("/").pop())+'.java</b>'+
    (info.name ? ' <span>›</span> <b>'+esc(info.name)+'()</b>' : '') +
    (samples ? ' <span class="pill" title="Temps passé dans cette méthode">'+
        formatWeight(samples, R.calltree.total) + ' du temps</span>' : '') +
    (myCalls.length ? ' <span class="pill" id="pillValues" style="color:var(--violet);border-color:var(--violet);cursor:pointer">'
        + myCalls.length + ' appel(s) capturé(s) — voir les valeurs</span>' : '') +
    (mode==="exec" && info.name ? ' <span class="pill" style="cursor:pointer" id="scopeBtn">ne montrer que ce qui tourne sous cette méthode</span>' : '') +
    jacocoLink(info);

  if (!src){ code.innerHTML = '<p style="padding:18px;color:var(--muted)">Source indisponible.</p>';
             document.getElementById("values").innerHTML=""; return; }

  let from = 0, to = 1e9;
  if (info.line){
    from = declarationLine(info);
    const next = info.methods.filter(m=>m.line>info.line).map(m=>m.line).sort((a,b)=>a-b)[0];
    to = next ? next-1 : 1e9;
  }
  // En mode resserré, on n'affiche QUE la méthode sélectionnée : à un instant donné on est
  // dans une seule méthode, ce qui lève l'ambiguïté d'une classe qui en contient plusieurs.
  const narrow = clean && info.line;
  let html = '<table class="src">', fold = 0;
  if (narrow && from > 1)
    html += '<tr><td colspan="3" class="fold">… '+(from-1)+' ligne(s) au-dessus, hors de cette méthode</td></tr>';
  src.forEach((text,i) => {
    const nr = i+1, c = cov[nr];
    if (narrow && (nr < from || nr > to)) return;
    if (clean && c && c.s === "miss"){ fold++; return; }
    if (fold){ html += '<tr><td colspan="3" class="fold">… '+fold+' ligne(s) jamais exécutée(s)</td></tr>'; fold = 0; }
    const cls = [c ? c.s : "", (info.line && nr>=from && nr<=to) ? "inmethod" : ""].join(" ");
    let ann = "";
    if (info.line && nr === info.line && myCalls.length)
      ann = '<a href="#" id="lineValues" class="values">▾ valeurs des paramètres ('+myCalls.length+')</a>';
    else if (traced && R.trace[nr])
      { const all = R.trace[nr];
        ann = "appelle " + all.slice(0,2).map(a =>
          '<a href="#" data-f="'+esc(a.frame||"")+'">'+esc(a.callee)+'</a> <span class="dur">'+esc(a.cost)+'</span>').join(" · ")
          + (all.length > 2 ? ' <span style="opacity:.7">+'+(all.length-2)+'</span>' : ''); }
    html += '<tr class="'+cls+'" id="L'+nr+'"><td class="n">'+nr+'</td><td class="c">'+
            linkifyCalls(esc(text), nr)+'</td><td class="ann">'+ann+'</td></tr>';
  });
  if (fold) html += '<tr><td colspan="3" class="fold">… '+fold+' ligne(s) jamais exécutée(s)</td></tr>';
  if (narrow && to < src.length)
    html += '<tr><td colspan="3" class="fold">… '+(src.length-to)+' ligne(s) en dessous, hors de cette méthode</td></tr>';
  code.innerHTML = html+"</table>";

  const anchor = document.getElementById("L"+(info.line||1));
  if (anchor) code.scrollTop += anchor.getBoundingClientRect().top
                              - code.getBoundingClientRect().top - code.clientHeight/3;
  code.querySelectorAll("td.c a.callink").forEach(a => a.onclick = e => {
    e.preventDefault();
    const t = frameInfo(a.dataset.f);
    if (t) { ctxIndex = 0; select(t, null); }
  });
  code.querySelectorAll("td.ann a").forEach(a => a.onclick = e => {
    e.preventDefault();
    const f = a.dataset.f;
    if (f && frameInfo(f)) select(frameInfo(f), null);
  });
  const sb = document.getElementById("scopeBtn");
  if (sb) sb.onclick = () => { scopeFrame = info.frame; renderExec(); };
  const lv = document.getElementById("lineValues");
  if (lv) lv.onclick = e => { e.preventDefault();
    document.getElementById("values").scrollIntoView({block:"nearest"}); };
  const bh = document.getElementById("backHome");
  if (bh) bh.onclick = e => { e.preventDefault(); goHome(); };
  renderContexts(info);
  drawValues(info);
  const pv = document.getElementById("pillValues");
  if (pv) pv.onclick = () => document.getElementById("values").scrollIntoView({block:"nearest"});
}
/** Lien direct vers la page de couverture de CETTE classe, à la bonne ligne. Le rapport
 *  détaillé montre des choses que la vue intégrée n'affiche pas (compteurs par branche,
 *  complexité) : il faut pouvoir y basculer sans repartir de sa racine. */
function jacocoLink(info){
  if (!(R.rapports || {}).couverture) return "";
  const pkg = info.cls.split("/").slice(0, -1).join(".");
  const file = info.cls.split("/").pop() + ".java.html";
  const href = (R.chemin || "") + "jacoco/html/" + pkg + "/" + file +
               (info.line ? "#L" + info.line : "");
  return ' <a class="pill" style="text-decoration:none" target="_blank" rel="noopener" href="' +
         href + '" title="Ouvrir cette classe dans le rapport de couverture détaillé">' +
         'voir dans le rapport détaillé ↗</a>';
}
function declarationLine(info){
  const src = D.sources[info.source] || [];
  if (!info.name) return info.line;
  const needle = new RegExp("\\b" + info.name.replace(/[$]/g, "\\$") + "\\s*\\(");
  for (let i = info.line - 1; i >= Math.max(0, info.line - 12); i--)
    if (needle.test(src[i] || "")) return i + 1;
  return info.line;
}
function declarationOf(info){
  const src = D.sources[info.source] || [];
  if (!info.line || !info.name) return "";
  const needle = new RegExp("\\b" + info.name.replace(/[$]/g, "\\$") + "\\s*\\(");
  for (let i = info.line - 1; i >= Math.max(0, info.line - 12); i--)
    if (needle.test(src[i] || "")) return (src[i] || "").trim().replace(/\s*\{\s*$/, "");
  return "";
}
function drawValues(info){
  const box = document.getElementById("values");
  const calls = R.values[info.frame] || [];
  if (!calls.length){
    const others = Object.keys(R.values);
    // Expliquer POURQUOI il n'y a rien : sans cela, on croit à un défaut de l'outil alors
    // que c'est un choix — l'observation des valeurs est ciblée, et elle doit l'être.
    const nom = esc(info.name || info.cls.split("/").pop());
    const racine = R.context && R.context.methodeRacine ? R.context.methodeRacine : null;
    box.innerHTML = others.length
      ? '<h3>Valeurs des paramètres</h3><div class="explain">' +
        '<b>Aucune valeur n\'a été capturée pour <code>' + nom + '</code></b> — ce qui ne veut ' +
        'pas dire qu\'elle n\'a pas tourné : la couverture et les temps la montrent bien. ' +
        'L\'observation des valeurs est <b>ciblée</b> sur une méthode racine' +
        (racine ? ' — ici <code>' + esc(racine) + '</code>' : '') + ', parce qu\'observer ' +
        'toutes les méthodes produirait un volume ingérable et fausserait la mesure.' +
        '<br>Pour obtenir les valeurs de <code>' + nom + '</code>, relancer avec ' +
        '<code>--root ' + esc(dot(info.cls) + "::" + (info.name || "")) + '</code>.' +
        '<br>Méthodes observées dans cette exécution : ' + others.map(f =>
          '<a href="#" class="vlink" data-f="' + esc(f) + '">' + esc(f.split("/").pop()) + '</a>')
          .join(" · ") + '</div>'
      : '<h3>Valeurs des paramètres</h3><div class="explain">Aucune méthode n\'a été observée ' +
        'dans cette exécution : relancer avec <code>--root paquet.Classe::methode</code> pour ' +
        'capturer les valeurs reçues par une méthode.</div>';
    box.querySelectorAll(".vlink").forEach(a => a.onclick = e => {
      e.preventDefault();
      const t = frameInfo(a.dataset.f);
      if (t) select(t, null);
    });
    return;
  }

  const decl = declarationOf(info);
  // Sans appel choisi, on propose la liste — chaque ligne EST un appel, et en choisir un
  // ferme la question « de quel appel parle-t-on ? ».
  if (callIndex === null){
    box.innerHTML =
      '<h3>Appels observés de <code>' + esc(info.name) + '</code></h3>' +
      (decl ? '<div class="sig">' + esc(decl) + '</div>' : '') +
      '<div class="explain"><b>' + calls.length + ' appel' + (calls.length > 1 ? 's ont' : ' a') +
      ' été observé' + (calls.length > 1 ? 's' : '') + '</b> pendant l\'exécution. ' +
      'Choisir un appel pour ne voir que le sien.</div>' +
      '<div class="callhead"><span>paramètres reçus</span><span>valeur renvoyée</span></div>' +
      calls.map((v, i) => callRow(v, i, true)).join("");
  } else {
    const v = calls[callIndex];
    box.innerHTML =
      '<h3>Appel ' + (callIndex + 1) + ' sur ' + calls.length +
      ' de <code>' + esc(info.name) + '</code></h3>' +
      (decl ? '<div class="sig">' + esc(decl) + '</div>' : '') +
      '<div class="callnav">' +
        '<button data-go="' + (callIndex - 1) + '"' + (callIndex === 0 ? " disabled" : "") + '>‹ précédent</button>' +
        '<button data-go="' + (callIndex + 1) + '"' + (callIndex === calls.length - 1 ? " disabled" : "") + '>suivant ›</button>' +
        '<a href="#" id="allcalls">voir les ' + calls.length + ' appels observés</a>' +
      '</div>' +
      '<div class="callhead"><span>paramètres reçus</span><span>valeur renvoyée</span></div>' +
      callRow(v, callIndex, false);
  }

  box.querySelectorAll(".call[data-i]").forEach(row => row.onclick = () => {
    callIndex = +row.dataset.i;
    draw();
  });
  box.querySelectorAll("button[data-go]").forEach(b => b.onclick = () => {
    callIndex = +b.dataset.go;
    draw();
  });
  const all = document.getElementById("allcalls");
  if (all) all.onclick = e => { e.preventDefault(); callIndex = null; draw(); };
}

function callRow(v, i, clickable){
  return '<div class="call' + (clickable ? " pick" : "") + '"' +
    (clickable ? ' data-i="' + i + '" title="Ne voir que cet appel"' : '') + '>' +
    '<span class="p">' + (v.params || []).map(x =>
      '<span class="v">' + esc(x.value) + '</span>').join('<span class="sep">,</span> ') +
    '</span><span class="arrow">→</span><span class="r">' +
    (v.retour ? '<span class="v">' + esc(v.retour.value) + '</span>' : '<i>—</i>') +
    '</span><span class="t">' + (clickable ? "appel " + (i + 1) : "") + '</span></div>';
}

/** Plan de l'interface. Une capture serait vite fausse ; un schéma dessiné reste juste,
 *  suit le thème clair/sombre, et pointe les quatre gestes qui comptent. */
function schema(){
  return `<svg class="plan" viewBox="0 0 820 400" role="img"
       aria-label="Plan de l'interface : liste à gauche, code au centre, valeurs en bas, bouton resserré en haut à droite">

      .num{fill:var(--accent)} .numt{fill:#fff;font:700 11px sans-serif;text-anchor:middle}
      .cap{fill:var(--text);font:600 11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
      .lead{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 3;fill:none}
    </style></defs>

    <!-- en-tête -->
    <rect x="8" y="8" width="804" height="34" rx="6" class="fr"/>
    <rect x="18" y="18" width="14" height="14" rx="3" fill="var(--accent)" opacity=".55"/>
    <text x="40" y="29" class="tb">Runtime X-Ray</text>
    <text x="130" y="29" class="tx">92,7 % du code exécuté · 40 méthodes</text>
    <rect x="612" y="15" width="190" height="21" rx="11" fill="var(--accent)"/>
    <text x="628" y="29" fill="#fff" font-size="10.5" font-family="sans-serif">● Resserré sur la méthode</text>

    <!-- colonne gauche -->
    <rect x="8" y="50" width="210" height="286" rx="6" class="fr2"/>

/**
 * Flamme dessinée ici même, à partir des mêmes mesures que l'arbre. Deux raisons de ne pas
 * dépendre d'un fichier produit à côté : le rapport reste une page unique, et le lien ne
 * peut pas être cassé. Chaque barre mène à sa méthode.
 */
function flameBlock(){
  const root = R.calltree;
  if (!root || !root.total) return "";
  const H = 18, MAXD = 12;
  const bars = [];
  let maxDepth = 0;

  (function layout(node, depth, x){
    for (const kid of node.children){
      const w = kid.total / root.total;
      if (w * 100 < 0.4 || depth > MAXD){ x += w; continue; }   // trop fin pour être lu
      bars.push({x, w, depth, name: kid.name, known: !!frameInfo(kid.name), total: kid.total});
      maxDepth = Math.max(maxDepth, depth);
      layout(kid, depth + 1, x);
      x += w;
    }
  })(root, 0, 0);
  if (!bars.length) return "";

  const body = bars.map(b => {
    const label = frameLabel(b.name).split(".").slice(-2).join(".");
    return '<div class="fl' + (b.known ? " known" : "") + '"' +
      (b.known ? ' data-f="' + esc(b.name) + '"' : '') +
      ' style="left:' + (b.x * 100).toFixed(4) + '%;width:' + (b.w * 100).toFixed(4) + '%;' +
      'top:' + (b.depth * H) + 'px;background:' + flameColour(b.depth, b.known) + '"' +
      ' title="' + esc(dot(b.name)) + '  —  ' + formatWeight(b.total, root.total) + '">' +
      '<span>' + esc(label) + '</span></div>';
  }).join("");

  return '<h2>Où le temps est passé</h2>' +
    '<p style="margin-bottom:8px">Chaque barre est une méthode ; sa largeur est la part du ' +
    'temps passé dessous. Cliquer entre dans la méthode.</p>' +
    '<div class="flame" style="height:' + ((maxDepth + 1) * H) + 'px">' + body + '</div>';
}

/** Teintes chaudes en dégradé par profondeur, grisées hors code applicatif. */
function flameColour(depth, known){
  if (!known) return "var(--border)";
  const tones = ["#e3a72c", "#e8b342", "#edbf58", "#f1c96e", "#f5d485", "#f8de9b"];
  return tones[depth % tones.length];
}

   (observees.length

          '<span class="chip val" data-f="'+esc(f)+'">'+esc(f.split("/").pop())+' — '+R.values[f].length+' appels</span>').join("")+'</p>'
      : '')+
   reserveBlock()+
   '<p style="margin-top:20px"><a href="#" id="openhelp">→ Comment se servir de cette page</a></p>'+
   '</div>';
  // Les puces sont cliquables : la vue d'ensemble sert de point de départ, pas de vitrine.

    g.onclick = () => { const t = frameInfo(g.dataset.f); if (t) select(t, null); };

    c.style.cursor = "pointer";
    c.onclick = () => { const t = frameInfo(c.dataset.f); if (t) select(t, null); };
  });
  const oh = document.getElementById("openhelp");
  if (oh) oh.onclick = e => { e.preventDefault(); openHelp(); };
}

/* ------------------------------------------------------- panneaux ajustables */
(function splitters(){
  const root = document.documentElement;
  const nav = document.getElementById("nav");
  const vs = document.getElementById("vsplit"), hs = document.getElementById("hsplit");
  let navPrev = 330, valPrev = 190;

  const startDrag = (el, onMove) => {
    el.addEventListener("mousedown", e => {
      e.preventDefault(); el.classList.add("dragging");
      const move = ev => onMove(ev);
      const up = () => { el.classList.remove("dragging");
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up); };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
  };
  startDrag(vs, ev => {
    const w = Math.max(0, Math.min(ev.clientX, window.innerWidth - 200));
    root.style.setProperty("--navw", w + "px");
    if (w > 40) navPrev = w;
  });
  startDrag(hs, ev => {
    const box = document.getElementById("values").getBoundingClientRect();
    const h = Math.max(0, Math.min(box.bottom - ev.clientY, window.innerHeight - 220));
    root.style.setProperty("--valh", h + "px");
    if (h > 30) valPrev = h;
  });
  const toggleNav = () => {
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--navw")) || 330;
    const open = cur <= 40;
    root.style.setProperty("--navw", open ? navPrev + "px" : "0px");
    document.getElementById("vtoggle").textContent = open ? "‹" : "›";
  };
  const toggleValues = () => {
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--valh")) || 190;
    const open = cur <= 30;
    root.style.setProperty("--valh", open ? valPrev + "px" : "0px");
    document.getElementById("htoggle").textContent = open ? "⌄" : "⌃";
  };
  vs.ondblclick = toggleNav;
  hs.ondblclick = toggleValues;
  document.getElementById("vtoggle").onclick = e => { e.stopPropagation(); toggleNav(); };
  document.getElementById("htoggle").onclick = e => { e.stopPropagation(); toggleValues(); };
})();
