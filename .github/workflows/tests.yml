# The tests, on every push and every pull request.
#
# The repository had none: what passed on the development machine passed, and nothing
# checked it elsewhere. The twelve failures that motivated this branch came precisely from
# a difference between machines.
#
# And they still do. On 26 August 2026, a `mvn clean install` under Windows brought down a
# test the CI saw green: an assertion compared a path to a literal written with "/". While
# looking into it, we found worse — an absolute Windows path was being split in two on the
# ":" of its drive letter, and had been forever, with the tool answering "not found" on a
# perfectly valid directory. A CI that runs only under Linux cannot see defects like those;
# it leaves them to be discovered by the user, that is to say in the worst place and at the
# worst moment.
#
# Hence the matrix. Windows is not a stopgap platform for this tool: it is the platform of
# the machines that use it.
name: Tests

on:
  push:
    branches: ['main']
  pull_request:

# A push replaces the branch's previous run, instead of adding to it.
#
# On 26 August 2026, a run was created and then never scheduled: "queued" for seventeen
# hours, no job at all, the API refusing right up to its cancellation ("Cannot cancel a
# workflow re-run that has not yet queued"). It stayed as a pending check on the pull
# request, which could therefore never go through, and nothing — neither a re-run nor a
# cancellation — allowed getting out of it. One single thing unblocked it: pushing one more
# commit.
#
# This grouping makes that the official escape hatch: whatever happens to a run, the next
# one cancels it and takes its place. The pull request can no longer end up stuck behind a
# ghost.
#
# On `main`, we do not cancel: there, every run is the trace of a published state, and two
# pushes close together must leave two verdicts.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    strategy:
      # Without this, the first failure cancels the other machine and half the information
      # is lost: knowing whether a defect is SPECIFIC to Windows, or common to both, changes
      # entirely what one has to go and look at.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # GitHub's default is six hours. These jobs last under a minute on Linux and a few
    # minutes on Windows: beyond twenty, it is no longer slowness, it is a hang, and it is
    # better to see it red straight away than to wait for it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - run: mvn -B test

  # Do the three editions still build? A broken profile would not show otherwise: the
  # default build does not touch them.
  #
  # On a single machine, and deliberately so: what this step exercises is the Maven profiles
  # and the assembly of the jars — nothing that depends on the system. Redoing it under
  # Windows would double a 19 MB component download to check the same thing twice.
  editions:
    runs-on: ubuntu-latest
    # It downloads 19 MB of components for the complete edition: wider than the tests, but
    # very far from the six hours of the default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: The three editions build
        run: |
          mvn -B -DskipTests package
          mvn -B -Pjacoco  -DskipTests package
          mvn -B -Pcomplet -DskipTests package
          ls -la orchestrator/target/*.jar
