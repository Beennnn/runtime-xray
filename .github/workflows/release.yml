# Publishes the three editions of the jar when a version tag is pushed.
#
# This is the answer to "where do the binaries go". Not in the repository: git keeps every
# version forever, and a 19 MB complete jar would weigh down every clone to come, with no
# way back without rewriting history. The artefacts therefore live attached to a tag, built
# here, from the code of that tag exactly.
#
#   git tag v1.1.0 && git push origin v1.1.0
name: Publish a release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the release and drop the files into it

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # A tag that does not match the pom would publish a badly named artefact: better to
      # fail here than to discover it on the releases page.
      - name: The tag and the pom must coincide
        run: |
          POM=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          TAG=${GITHUB_REF_NAME#v}
          echo "pom=$POM tag=$TAG"
          [ "$POM" = "$TAG" ] || { echo "::error::pom $POM != tag $TAG"; exit 1; }
          echo "VERSION=$POM" >> "$GITHUB_ENV"

      - name: The tests
        run: mvn -B test

      - name: The three editions
        run: |
          mvn -B -DskipTests package
          mvn -B -Pjacoco  -DskipTests package
          mvn -B -Pcomplet -DskipTests package
          mkdir -p publication
          # The name carried by v1.0.0, kept: it is the one the already-written links use.
          cp orchestrator/target/runtime-xray.jar          "publication/runtime-xray-cli-$VERSION.jar"
          cp orchestrator/target/runtime-xray-jacoco.jar   "publication/runtime-xray-jacoco-$VERSION.jar"
          cp orchestrator/target/runtime-xray-complet.jar  "publication/runtime-xray-complet-$VERSION.jar"

      # Attached to v1.0.0, hence expected here. The build name does not carry the version
      # (finalName), so we put it back: a release asset with no version cannot be filed.
      - name: The sources and the javadoc
        run: |
          mvn -B -pl orchestrator source:jar javadoc:jar -DskipTests
          cp orchestrator/target/runtime-xray-sources.jar "publication/runtime-xray-cli-$VERSION-sources.jar"
          cp orchestrator/target/runtime-xray-javadoc.jar "publication/runtime-xray-cli-$VERSION-javadoc.jar"

      - name: The fingerprints
        run: |
          (cd publication && sha256sum * > SHA256SUMS.txt)
          ls -la publication

      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Three editions of the same tool. All of them ask for a JDK 21, and nothing else.

          | Edition | Weight | What works with no network |
          |---|---|---|
          | `runtime-xray-cli` | ~175 KB | nothing in advance: the components are to be found elsewhere |
          | `runtime-xray-jacoco` | ~950 KB | the **coverage** |
          | `runtime-xray-complet` | ~19 MB | the coverage, the **times** and the **values** |

          The last two embed their analysis components and lay them down in
          `~/.runtime-xray` at first launch: no network access, ever. The difference
          between them is Arthas, 17 MB on its own for capturing the values. What they
          redistribute, and under which licence, is detailed in `THIRD-PARTY.md`.

          The ordinary edition looks for its components on the machine before going out on
          the network: cache, `--components`, the jar's neighbourhood, the local Maven
          repository — and only then a remote Maven repository.

          SHA-256 fingerprints in `SHA256SUMS.txt`.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "runtime-xray $VERSION" \
            --notes-file notes.md \
            publication/*

      # The documentation's download links designate the PUBLISHED release. They are
      # therefore rewritten here, afterwards, never before: naming a tag in advance that
      # does not exist offers a 404 to the home page's first reader.
      #
      # This gesture was replayed by hand three times in two days, identically. It is the
      # same drift as the one that left the home page behind its source, and it is handled
      # the same way: what is copied mechanically must not depend on somebody remembering
      # to do it.
      - name: Switch the documentation's links on main
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main

          # Three shapes only, and deliberately narrow: the download URL, the jar's name,
          # and the table's "Version" row. The README's other version numbers speak of
          # something else — the MIT licence of the already-published 1.0.0, the tagging
          # example — and must stay intact.
          #
          # The delimiter is "#", not "|": the third expression contains vertical bars (it
          # is a Markdown table row), and escaping them in a command itself delimited by
          # "|" gives a pattern BSD sed reads wrong — tried, it rewrote the whole file.
          sed -i -E \
            -e "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/#releases/download/v$VERSION/#g" \
            -e "s#runtime-xray-cli-[0-9]+\.[0-9]+\.[0-9]+\.jar#runtime-xray-cli-$VERSION.jar#g" \
            -e "s#^\| Version \| \`[0-9]+\.[0-9]+\.[0-9]+\` \|\$#| Version | \`$VERSION\` |#" \
            README.md docs/outil/mode-emploi.md

          if git diff --quiet; then
            echo "The links already designate $VERSION — nothing to switch."
            exit 0
          fi

          git diff --stat
          git commit -am "Switch the documentation's links to $VERSION

          Automatic copy, triggered by the publication of $GITHUB_REF_NAME."
          git push origin main
