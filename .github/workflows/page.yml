# Publishes the home page onto gh-pages when its source changes.
#
# The source lives in `site/index.html`, on `main`; the page served lives at the root of
# `gh-pages`. Nothing linked the two: we copied by hand, and on 24 August 2026 we found
# that the published page was a paragraph behind its source — and had been for long enough
# that nobody could say since when. It is the kind of drift that does not show, since the
# two files look as though each exists on its own.
#
# The trigger is deliberately narrow: only a change to `site/index.html` on `main` causes a
# publication. `workflow_dispatch` stays there to republish on demand, for instance after a
# fix applied directly on `gh-pages`.
name: Publish the home page

on:
  push:
    branches: ['main']
    paths: ['site/index.html']
  workflow_dispatch:

permissions:
  contents: write   # to push onto gh-pages

# Two pushes close together on site/ would produce two concurrent publications, and the
# second would fail to push onto a branch that had moved under it.
concurrency:
  group: page-accueil
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: The source, from main
        uses: actions/checkout@v4
        with:
          path: source

      # gh-pages also carries `demo/`, `jfr/` and `multi/` — generated reports that exist
      # nowhere in `main`. We check it out whole and copy ONLY `index.html`: rebuilding the
      # branch from `site/` would wipe them out.
      - name: The published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publie

      - name: Copy the page over, and push only if it changed
        run: |
          cp source/site/index.html publie/index.html
          cd publie
          if git diff --quiet -- index.html; then
            echo "The published page is already up to date — nothing to do."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Republish the home page from site/index.html

          Automatic copy of ${GITHUB_SHA:0:7}, pushed on main."
          git push
