<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vue intégrée — Runtime X-Ray</title>
<style>
  :root{
    --bg:#fff; --panel:#f6f8fa; --panel2:#fbfcfd; --border:#d0d7de; --text:#1f2328;
    --muted:#59636e; --accent:#0969da; --accent-soft:#ddf4ff;
    --full:#b7f0c6; --part:#ffec9e; --miss:#ffc9c4;
    --fullbar:#1a7f37; --partbar:#9a6700; --missbar:#cf222e; --violet:#8250df;
    /* The card has a colour of its own, which is no measurement's: green says
       “executed”, red “never”, purple “captured values”. What comes from a human
       must look like none of the three. */
    --fiche:#0f766e; --fiche-soft:#e9f6f4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1117; --panel:#151b23; --panel2:#10151c; --border:#30363d; --text:#e6edf3;
      --muted:#9198a1; --accent:#4493f8; --accent-soft:#121d2f;
      --full:#16512c; --part:#5c4710; --miss:#63201f;
      --fullbar:#3fb950; --partbar:#d29922; --missbar:#f85149; --violet:#ab7df8;
      --fiche:#2dd4bf; --fiche-soft:#102420;
    }
  }
  *{box-sizing:border-box} html,body{height:100%}
  /* A target reached by keyboard must show. The outline appears on the keyboard only
     — :focus-visible — so as not to ring what was just clicked with the mouse. */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  /* Reach the content without tabbing through the whole toolbar. */
  .saut{position:absolute;left:-9999px;top:0;z-index:100;background:var(--accent);color:#fff;
        padding:8px 14px;border-radius:0 0 8px 0;font-weight:600;text-decoration:none}
  .saut:focus{left:0}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  header{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;
         align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
  header h1 a{color:inherit;text-decoration:none}
  header h1 a:hover{color:var(--accent)}
  .crumb .back{display:inline-flex;align-items:center;gap:5px;color:#fff;background:var(--accent);
               border-radius:15px;padding:3px 11px;font-size:12px;font-weight:600;
               cursor:pointer;text-decoration:none}
  .crumb .back:hover{filter:brightness(1.12)}
  /* One application icon only: the three tools' badges invited a click
     when they were merely informative. Their explanation lives in the legend, at the bottom. */
  .applogo{display:flex;align-items:center}
  .stat{color:var(--muted);font-size:12.5px} .stat b{color:var(--text)}
  .runpick{padding:7px 9px;border-bottom:1px solid var(--border);background:var(--accent-soft);
           flex:0 0 auto}
  .runpick[hidden]{display:none}
  .runlabel{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--accent);font-weight:700}
  .runlabel{display:block;margin-bottom:4px}
  /* An acceptance campaign is thirty runs: the list of checkboxes must scroll inside
     itself. Without this bound it kept its content height — a flex item does not compress
     below its own — pushed the source tree out of the panel, and #nav's `overflow:hidden`
     cut it off leaving no scrollbar. The code was no longer visible at all.
     The bound is in vh so a large screen shows more of it, and the label as well as the
     “accumulate” box stay outside: they are the landmarks, they must not scroll. */
  #runboxes{max-height:32vh;overflow:auto;scrollbar-width:thin;overscroll-behavior:contain}
  #runboxes label{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 0;
                  cursor:pointer;color:var(--text)}
  #runboxes .cnt{color:var(--muted);font-size:11px;margin-left:auto}
  .spacer{margin-left:auto}
  .cleanbtn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;
            font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;
            border:1px solid var(--border);background:var(--bg);color:var(--muted)}
  .cleanbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .cleanbtn .ic{display:inline-flex}
  .cleanbtn .ic svg{display:block}
  .cleanbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  /* What the button's other position does, written beside it: a switch that changes its own
     label when actioned never says what clicking will get you. */
  /* The links are grouped BY TOOL: “detailed coverage” and “focused coverage” come from
     the same tool and repeating it on each was noise. The mark carries the name once,
     the links follow. */
  .links{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .toolgrp{display:inline-flex;align-items:center;gap:7px;background:var(--bg);
           border:1px solid var(--border);border-radius:16px;padding:3px 11px}
  .toolgrp .mark{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
                 letter-spacing:.4px;color:var(--text);text-transform:uppercase;
                 border-right:1px solid var(--border);padding-right:8px}
  .links a{margin:0}
  .toolgrp .sep{color:var(--border)}
  /* A dozen download links laid flat in the top bar: one could no longer see which file
     came from which tool, and they took the whole width for an occasional use. Folded into
     a menu, the categories become titles again, each file gains the sentence that says what
     it holds, and the bar breathes. */
  /* The top bar's “card” group carries the same colour as the banner: one sees at a
     glance that the two speak of the same thing. */
  .toolgrp.fichegrp{border-color:var(--fiche);background:var(--fiche-soft)}
  .toolgrp.fichegrp .mark{color:var(--fiche);border-right-color:var(--fiche)}
  .dl{position:relative;display:inline-flex}
  .dlmenu{position:absolute;top:calc(100% + 7px);left:0;z-index:45;width:min(94vw,430px);
          max-height:min(70vh,540px);overflow:auto;background:var(--bg);
          border:1px solid var(--border);border-radius:11px;padding:7px;
          box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .dlmenu[hidden]{display:none}
  .dlmenu h4{display:flex;align-items:center;gap:6px;margin:9px 8px 4px;font-size:10px;
             font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text)}
  .dlmenu h4:first-child{margin-top:3px}
  .dlmenu .note{margin:0 8px 5px;font-size:11px;color:var(--muted);line-height:1.4}
  .dlmenu a{display:block;padding:6px 9px;border-radius:7px;text-decoration:none}
  .dlmenu a:hover,.dlmenu a:focus-visible{background:var(--accent-soft)}
  .dlmenu a .t{display:block;font-size:12.5px;font-weight:600;color:var(--accent)}
  .dlmenu a .d{display:block;font-size:11.5px;color:var(--muted);line-height:1.35}
  /* An absent export stays named: the capability must show even when the file is not
     there. Greyed out, but clickable — the click says how to get it. */
  .dlmenu a.off .t{color:var(--muted);text-decoration:underline;text-decoration-style:dotted}
  .links a.off{color:var(--muted);text-decoration-style:dotted}
  .links a.off:hover{color:var(--accent);opacity:1}
  .helpbtn{font:inherit;font-size:12px;font-weight:600;padding:4px 11px;border-radius:15px;
           cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted)}
  .helpbtn:hover{border-color:var(--accent);color:var(--accent)}
  /* Two letters, no flag: a flag names a country, not a language — and one would then
     have to choose one for English. */
  .langsel{display:inline-flex;border:1px solid var(--border);border-radius:15px;overflow:hidden}
  .langsel button{font:inherit;font-size:11px;font-weight:700;letter-spacing:.4px;
                  padding:4px 9px;cursor:pointer;border:0;background:var(--bg);
                  color:var(--muted)}
  .langsel button + button{border-left:1px solid var(--border)}
  .langsel button:hover{color:var(--accent)}
  .langsel button.on{background:var(--accent-soft);color:var(--accent)}
  #help{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;
        align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  #help[hidden]{display:none}
  .helpbox{position:relative;background:var(--bg);border:1px solid var(--border);
           border-radius:12px;max-width:880px;width:100%;padding:28px 32px 34px}
  .helpclose{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);
             font-size:17px;cursor:pointer}
  .helpclose:hover{color:var(--text)}
  .reserve{border:1px solid var(--border);border-left:3px solid var(--partbar);
           border-radius:6px;background:var(--panel);padding:12px 15px;color:var(--muted);
           font-size:12.5px;margin-top:22px}
  .reserve b{color:var(--text)}
  /* The page fills the window and NEVER scrolls as a whole: only the panels that carry long
     content have a scrollbar. The layout used to take a header height off the body, written
     hard — 47 px — when that header grows with its links, with the browser's zoom, with the
     system font, and folds onto two lines as soon as the window narrows. One pixel too many
     was enough to give the whole window a scrollbar that came and stuck against the
     report's: two superimposed scrollbars, of which the useful one ended up hidden.
     Measuring the header rather than guessing it removes the cause. */
  body{display:flex;flex-direction:column;height:100%;overflow:hidden}
  header{flex:0 0 auto}
  /* “minmax(0, 1fr)” and not “1fr”: a grid column's implicit minimum is the min-content of
     what it carries, and a 450-character line of code — they exist — then widens it instead
     of scrolling. The column overflowed the window, carrying the code's vertical scrollbar
     off the screen with it: one could neither scroll down nor see the end of the line.
     The zero gives the column back the right to be narrower than its content, which is
     exactly the condition for the panel to scroll. */
  main{display:grid;grid-template-columns:var(--navw,330px) 6px minmax(0, 1fr);
       flex:1 1 auto;min-height:0}
  /* Under 860 px the two panels stack: there, there is only one long content left, and it
     is the page that must scroll normally. */
  @media(max-width:860px){
    body{display:block;height:auto;overflow:visible}
    main{grid-template-columns:1fr;height:auto} .split{display:none}
  }
  /* Draggable separators: drag to resize, double-click to fold the neighbouring panel
     away entirely — useful when one wants the code full screen. */
  .split{background:var(--border);cursor:col-resize;position:relative}
  /* A visible button on each separator: the double-click alone is a trick nobody ever
     discovers. */
  .splitbtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:16px;height:34px;border-radius:8px;border:1px solid var(--border);
            background:var(--panel);color:var(--muted);font-size:11px;line-height:1;
            cursor:pointer;padding:0;z-index:3;display:flex;align-items:center;justify-content:center}
  .splitbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg)}
  .splitbtn.h{width:34px;height:16px}
  .split:hover,.split.dragging{background:var(--accent)}
  .split::after{content:"";position:absolute;inset:0 -4px}
  .split.h{cursor:row-resize;height:6px}
  .splitlabel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
              font-size:9px;color:var(--bg);pointer-events:none}
  /* The panel folds down to zero width. Its content does not fold: the search field, the
     buttons and the help sentence packed themselves into a one-character column and
     overflowed 371 px below the window, which gave itself a scrollbar for empty space.
     Folded means hidden: we clip. The list keeps its own, it needs one. */
  #nav{border-right:1px solid var(--border);background:var(--panel2);
       display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .tabs{display:flex;border-bottom:1px solid var(--border)}
  .tabs button{flex:1;padding:8px 4px;background:none;border:0;border-bottom:2px solid transparent;
               color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  /* The bar wraps rather than crushing the field: with five buttons, a min-width:0 reduced
     “Search…” to “Sea”, which no longer means anything. */
  .listbar{display:flex;gap:6px;margin:8px;flex-wrap:wrap}
  #search{flex:1 1 100%;padding:5px 9px;border:1px solid var(--border);border-radius:6px;
          background:var(--bg);color:var(--text);font:inherit;font-size:12.5px;min-width:96px}
  /* The settings were bare labels — “%”, “pkg” — one had to have tried to know what they
     did. Each now carries its icon, its label in full, and the state it is in: an active
     setting is blue and solid, an available one grey and hollow. So one sees at a glance
     what is on and what is left to switch on.
     */
  .unitbtn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:11.5px;
           font-weight:600;padding:4px 9px;border-radius:14px;border:1px solid var(--border);
           background:var(--bg);color:var(--muted);cursor:pointer;line-height:1;
           white-space:nowrap}
  .unitbtn .ic{display:inline-flex;flex:0 0 auto}
  .unitbtn .ic svg{display:block}
  .unitbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .unitbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);
                                background:var(--accent-soft)}
  .unitbtn[aria-pressed="true"] .ic{color:var(--accent)}
  #scope{display:none;padding:7px 10px;border-bottom:1px solid var(--border);
         font-size:11.5px;color:var(--muted)}
  #scope b{color:var(--text)}
  #scope button{margin-left:8px;font:inherit;font-size:11px;background:var(--bg);color:var(--accent);
                border:1px solid var(--border);border-radius:5px;padding:2px 7px;cursor:pointer}
  .list{overflow:auto;flex:1 1 auto;min-height:0;padding:4px 4px 24px}
  .node{padding:2px 7px;border-radius:5px;cursor:pointer;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .node:hover{background:var(--accent-soft)}
  .node.sel{background:var(--accent);color:#fff}
  /* The keyboard cursor is NOT the selection: one must be able to walk the tree without
     changing what the right-hand panel shows. Hence an outline, not a fill. */
  .node.cur{outline:2px solid var(--accent);outline-offset:-2px}
  .node.sel.cur{outline-color:#fff}
  .node .pct{color:var(--muted);font-size:11px;margin-right:6px;display:inline-block;
             width:38px;text-align:right;font-variant-numeric:tabular-nums}
  .node.sel .pct{color:#e8f0fb}
  .node .tw{display:inline-block;width:11px;color:var(--muted)}
  .node.jdk{color:var(--muted)}
  .node.runroot{font-weight:600;padding:5px 7px;margin-top:4px;border-radius:6px;
                background:var(--panel);border:1px solid var(--border)}
  .node.runroot.on{border-color:var(--accent)}
  /* A run's row carries four things of unequal value: the marker, the name, the identifier
     and the sample count. When room runs short, it is the NAME that must be elided — the
     other three are short, and losing the sample count to gain three more letters of a
     name makes no sense at all. */
  .node.runroot{display:flex;align-items:center;gap:6px}
  .node.runroot .runname{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .node.runroot .runbadge,.node.runroot .uid,.node.runroot .pct2{flex:0 0 auto}
  .node.runroot .uid{margin-left:0}
  .runbadge{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);
            border:1px solid var(--accent);border-radius:9px;padding:0 5px;vertical-align:1px}
  .pct2{color:var(--muted);font-weight:400;font-size:11px}
  .tagval{font-size:10px;border:1px solid var(--violet);color:var(--violet);
          border-radius:10px;padding:0 5px;vertical-align:1px}
  .node.pkgnode{color:var(--muted)}
  .node.valnode{cursor:default;font-size:11.5px}
  .node.valnode:hover{background:none}
  .vkey{color:var(--muted)} .veq{color:var(--border);margin:0 4px}
  .vval{color:var(--text)}
  .node.vret .vkey{color:var(--violet)}
  /* “filter” shows on hover only: permanently present on hundreds of rows, it would make a
     wall of text and pull the eye away from reading. */
  .node .mask{float:right;margin-left:8px;opacity:0;color:var(--muted);font-size:10.5px;
              padding:0 5px;border-radius:9px;border:1px solid var(--border);
              font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .node:hover .mask{opacity:.75}
  .node .mask:hover{opacity:1;color:#fff;background:var(--missbar);border-color:var(--missbar)}
  /* Pruning banner: what was cut must stay in sight, otherwise an amputated tree reads
     like an incomplete measurement. */
  .prunebar{padding:7px 9px;border-bottom:1px solid var(--border);background:var(--panel);
            border-left:3px solid var(--violet);font-size:12px;color:var(--text)}
  .prunebar[hidden]{display:none}
  .prunebar > b{display:block;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;
                color:var(--muted);margin-bottom:3px}
  .prunebar .chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);
                  border:1px solid var(--border);border-radius:12px;padding:1px 4px 1px 8px;
                  margin:3px 4px 0 0;font-size:11.5px;max-width:100%}
  .prunebar .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prunebar .chip button{font:inherit;border:0;background:none;cursor:pointer;
                         color:var(--muted);padding:0 3px;border-radius:8px}
  .prunebar .chip button:hover{color:#fff;background:var(--missbar)}
  .prunebar .note{color:var(--muted);font-size:11px;margin-top:5px}
  .prunebar .acts{margin-top:6px}
  .prunebar .acts button{font:inherit;font-size:11.5px;border:1px solid var(--border);
                         background:var(--bg);color:var(--accent);border-radius:12px;
                         padding:2px 9px;cursor:pointer}
  .prunebar .acts button:hover{border-color:var(--accent)}
  /* The pruning gesture is offered like “filter”: on hover only, otherwise it would make
     a wall of text over hundreds of rows. */
  .node .prune{float:right;margin-left:8px;opacity:0;color:var(--muted);font-size:10.5px;
               padding:0 5px;border-radius:9px;border:1px solid var(--border);
               font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .node:hover .prune{opacity:.75}
  .node .prune:hover{opacity:1;color:#fff;background:var(--violet);border-color:var(--violet)}
  .node.sel .prune{color:#e8f0fb}
  .filterhint{padding:6px 10px;font-size:11.5px;color:var(--muted);
              border-bottom:1px solid var(--border);line-height:1.4}
  .filterhint b{color:var(--text)}
  .filterhint[hidden]{display:none}
  .node.sel .mask{color:#e8f0fb}
  #maskpop{position:fixed;z-index:60;background:var(--bg);border:1px solid var(--border);
           border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;min-width:230px}
  #maskpop h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
              color:var(--muted)}
  #maskpop button{display:block;width:100%;text-align:left;font:inherit;font-size:12.5px;
                  background:none;border:0;border-radius:6px;padding:5px 7px;cursor:pointer;
                  color:var(--text)}
  #maskpop button:hover{background:var(--accent-soft);color:var(--accent)}
  #maskpop button .q{color:var(--muted);font-size:11px;margin-left:6px}
  /* The banner stands out by an outline, not by a hard-coded colour: a fixed tint becomes
     unreadable as soon as the reader is in a dark theme. */
  .maskbar{padding:7px 9px;border-bottom:1px solid var(--border);background:var(--panel);
           border-left:3px solid var(--missbar);font-size:12px;color:var(--text)}
  .maskbar > b{display:block;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;
               color:var(--muted);margin-bottom:2px}
  .maskbar[hidden]{display:none}
  .maskbar .chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);
                 border:1px solid var(--border);border-radius:12px;padding:1px 4px 1px 8px;
                 margin:3px 4px 0 0;font-size:11.5px}
  .maskbar .chip button{font:inherit;border:0;background:none;cursor:pointer;color:var(--muted);
                        padding:0 3px;border-radius:8px}
  .maskbar .chip button:hover{color:#fff;background:var(--missbar)}
  .maskbar .acts{margin-top:6px;display:flex;gap:8px}
  .maskbar .acts button{font:inherit;font-size:11.5px;border:1px solid var(--border);
                        background:var(--bg);color:var(--accent);border-radius:12px;
                        padding:2px 9px;cursor:pointer}
  .maskbar .acts button:hover{border-color:var(--accent)}
  /* The wrap happens between names, not in the middle: “org.apache.com | mons” over two
     lines no longer reads as a package name. A name wider than the column stays cut —
     but it alone. */
  .maskbar code{font-size:11px;word-break:normal;overflow-wrap:break-word}
  /* When all the code is shown, colour says at a glance what was of use. */
  .node.live .lbl{color:var(--fullbar)}
  .node.partial .lbl{color:var(--partbar)}
  .node.dead .lbl{color:var(--missbar);opacity:.85}
  .node.dead .pct{color:var(--missbar)}
  .tagdead{font-size:10px;border:1px solid var(--missbar);color:var(--missbar);
           border-radius:10px;padding:0 5px;vertical-align:1px}
  .node.pkgnode .lbl{color:var(--text)}
  .node.callnode{color:var(--violet)}
  .callbadge{font-size:10px;border:1px solid var(--violet);color:var(--violet);
             border-radius:10px;padding:0 5px;vertical-align:1px}
  /* The selected row is a solid blue fill: everything it carries goes back to white.
     Without these rules, the coverage colour — green, orange, red — stayed applied to the
     name and landed on that blue, where it can no longer be read. */
  .node.sel, .node.sel.jdk, .node.sel.callnode{color:#fff}
  .node.sel .lbl, .node.sel.live .lbl, .node.sel.partial .lbl,
  .node.sel.dead .lbl, .node.sel.pkgnode .lbl{color:#fff;opacity:1}
  .node.sel.dead .pct{color:#e8f0fb}
  .node.sel .tagdead{color:#fff;border-color:#fff}
  .call.pick{cursor:pointer;border-radius:5px;padding-left:6px;padding-right:6px}
  .call.pick:hover{background:var(--accent-soft)}

  .flame{position:relative;width:100%;margin-bottom:20px;border:1px solid var(--border);
         border-radius:8px;background:var(--panel);overflow:hidden}
  .flame .fl{position:absolute;height:16px;border-radius:2px;overflow:hidden;
             font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1f2328;
             padding:0 3px;line-height:16px;white-space:nowrap;box-sizing:border-box}
  /* A narrow bar does not show the start of a name: “RoutePlanne” or “Breaks.t” designate
     nothing. The name is shortened, then removed if it still does not fit — hovering
     gives it in full anyway. */
  .flame .fl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flame .fl.known{cursor:pointer}
  .flame .fl.known:hover{outline:1px solid var(--text);outline-offset:-1px}
  /* The legend takes the graph's exact scale: an approximate legend relates to nothing
     one can see. */
  .flamekey{display:inline-block;width:74px;height:9px;border-radius:5px;vertical-align:-1px;
            margin:0 3px;border:1px solid var(--border);
            background:linear-gradient(to right,#dbe7f3,#f3e2b4,#f5cf7a,#ef9f45,#e2662c,#c8341b)}
  .home code{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px}
  /* Identity: the identifier follows the run wherever its name shows, because the name may
     have been changed and the identifier never changes. */
  .uid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;
       color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:0 4px;
       margin-left:6px;vertical-align:1px}
  /* What can be edited does not live in the body of the page: a report is read, it is not
     filled in. The run's identity therefore sits on a dense band, right under its name,
     and the actions move up into the top bar with the other buttons. */
  /* The band melted into the page: nothing said that this particular row is not a
     measurement but what was said about one. An outline and a tinted ground detach it. */
  .identbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
            padding:9px 16px 9px 13px;border-bottom:1px solid var(--border);
            border-left:3px solid var(--fiche);background:var(--fiche-soft)}
  .identbar[hidden]{display:none}
  /* The same word and icon as above: it really is the card that this band fills in. */
  .identbar .mark{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
                  letter-spacing:.4px;color:var(--fiche);text-transform:uppercase;
                  border-right:1px solid var(--border);padding-right:9px}
  .identbar .uid{margin-left:0;cursor:default;font-size:10.5px;color:var(--text);
                 background:var(--bg);padding:2px 6px}
  /* A field that does not look like a field goes unused: the outline is there before the
     hover, and the prompt text reads — it carries the band's only instruction. */
  .identbar input{font:inherit;font-size:12.5px;color:var(--text);background:var(--bg);
                  border:1px solid var(--border);border-radius:6px;padding:4px 8px}
  .identbar input:hover{border-color:var(--muted)}
  .identbar input:focus{border-color:var(--accent);outline:none;
                        box-shadow:0 0 0 2px var(--accent-soft)}
  .identbar input::placeholder{color:var(--muted);opacity:1}
  /* The name IS the view's title: it has its size, and it is edited in place — a title one
     cannot correct forces one to go looking for it elsewhere. */
  .identbar .inom{font-weight:650;font-size:15px;min-width:150px;flex:0 1 260px}
  .identbar .idesc{flex:1 1 260px;min-width:160px}
  .identbar .sep{width:1px;align-self:stretch;background:var(--border);margin:0 2px}
  .identbar .mini{font:inherit;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:11px;
                  border:1px solid var(--border);background:var(--bg);color:var(--text);
                  cursor:pointer;white-space:nowrap}
  .identbar .mini:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .identbar .tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;
                 border:1px solid var(--violet);color:var(--violet);border-radius:11px;
                 padding:1px 4px 1px 8px;white-space:nowrap}
  .identbar .tag b{font-weight:650}
  .identbar .tag button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;
                        padding:0 3px;border-radius:8px;opacity:.7}
  .identbar .tag button:hover{opacity:1;color:#fff;background:var(--missbar)}
  .identbar .tagedit{display:inline-flex;gap:4px;align-items:center}
  .identbar .tagedit input{border-color:var(--border);font-size:11.5px;padding:2px 6px}
  .identbar .tagedit .k{width:96px} .identbar .tagedit .v{width:110px}
  .identbar .etat{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap;
                  border:1px solid var(--border);border-radius:11px;padding:2px 9px;
                  background:var(--bg)}
  .identbar .etat.modifie{color:var(--partbar);font-weight:600;border-color:var(--partbar)}
  /* The JSON shows on top, not in the flow: it is there to copy, not to read. */
  /* This panel used to open with no title and no minimum width. On a report where no card
     is filled in, it therefore fitted in “{}”: forty pixels in a corner, which nobody
     sees — clicking “JSON” looked as though it did nothing. */
  #annotout{position:fixed;top:52px;right:16px;z-index:60;width:min(92vw,560px);
            max-height:70vh;display:flex;flex-direction:column;background:var(--bg);
            border:1px solid var(--border);border-radius:10px;
            box-shadow:0 12px 34px rgba(0,0,0,.22);font-size:11.5px;font-family:inherit}
  #annotout[hidden]{display:none}
  #annotout .tete{display:flex;align-items:center;gap:8px;padding:9px 12px;
                  border-bottom:1px solid var(--border);background:var(--panel);
                  border-radius:9px 9px 0 0}
  #annotout .titre{font-family:inherit;font-size:12.5px;font-weight:650;color:var(--text);
                   margin-right:auto;font-feature-settings:normal}
  /* The monospace is for the JSON, not for the sentence that introduces it: setting that
     in a fixed pitch made it read like code. */
  #annotout .corps{overflow:auto;padding:11px 13px;line-height:1.5}
  #annotout .json{display:block;white-space:pre-wrap;
                  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #annotout .vide{color:var(--muted);font-size:12.5px;line-height:1.45;
                  border-bottom:1px dashed var(--border);padding-bottom:9px;margin-bottom:9px}
  #annotout .acte{font:inherit;font-size:11.5px;font-weight:600;padding:3px 10px;
                  border-radius:11px;border:1px solid var(--border);background:var(--bg);
                  color:var(--text);cursor:pointer;white-space:nowrap}
  #annotout .acte:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  /* The notice of a changed report: visible, but it interrupts nothing. */
  #nouvelles{position:fixed;bottom:16px;right:16px;z-index:60;display:flex;align-items:center;
             gap:8px;background:var(--bg);border:1px solid var(--accent);border-radius:10px;

  #nouvelles .mini{font:inherit;font-size:11.5px;font-weight:600;padding:3px 10px;

                   color:var(--accent);cursor:pointer}
  #nouvelles .mini:hover{border-color:var(--accent);background:var(--accent-soft)}
  #annotout .fermer{position:absolute;top:6px;right:9px;background:none;border:0;
                    color:var(--muted);font-size:15px;cursor:pointer}
  .annot input,.annot textarea{font:inherit;font-size:12.5px;color:var(--text);
       background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 8px}
  .annot input[type=text]{width:100%;max-width:420px}
  .annot textarea{width:100%;max-width:560px;min-height:52px;resize:vertical}
  .annot .tagline{display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
  .annot .tagline .k{width:150px} .annot .tagline .v{flex:1;min-width:160px;max-width:340px}
  .annot .mini{font:inherit;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:12px;
       border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer}
  .annot .mini:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .annot .hint{color:var(--muted);font-size:11.5px;margin-left:8px}
  /* Caught between a wide field and a button, the explanation broke into two unreadable
     pieces: it takes a line of its own. */
  .annot .hint.sous{display:block;margin:4px 0 0}
  .annot .annotacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .annot .mini.fort{border-color:var(--accent);color:#fff;background:var(--accent)}
  .annot .mini.fort:hover{filter:brightness(1.1);background:var(--accent);color:#fff}
  .annot .annotacts .hint{flex:1 1 100%}
  .annot .drop{color:var(--muted);border-color:transparent;padding:3px 7px}
  .annot .drop:hover{border-color:var(--missbar);color:var(--missbar);background:transparent}
  .annot pre{background:var(--panel);border:1px solid var(--border);border-radius:8px;
       padding:10px 12px;font-size:11.5px;overflow:auto;max-height:180px;margin:8px 0 0}
  table.ctx{border-collapse:collapse;width:100%;margin-bottom:20px}
  table.ctx td{padding:5px 10px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}
  td.ck{color:var(--muted);white-space:nowrap;width:1%}
  td.cv{word-break:break-word}
</style>

<script>
const D = /*__DATA__*/;
// Several runs can cohabit in the same report. R designates the one being looked at
// at; all the rest of the page reads R, never D directly (except the sources,
// common to every run).
/* =====================================================================================
 * THE BLOCK LOADER
 *
 * The page now carries only the first picture: the runs' identity, the class tree, and the
 * source KEYS. Everything that shows only after a gesture — line-by-line coverage, the
 * call tree, the values, the code itself — lives in donnees/ and arrives on demand only.
 *
 *
 * They are <script src>, and not fetches: opened over file:// — the normal case, one
 * double-clicks index.html — a fetch to a neighbouring file is refused on the grounds of
 * the origin, and the page would stay empty. A script, for its part, loads.
 *
 * Freeing counts as much as loading: beyond the ceiling we erase the entry AND remove the
 * <script> from the DOM. Erasing without removing keeps the source text in memory, and the
 * heap does not come back down — verified.
 * ===================================================================================== */
const XR = {
  cache: new Map(),         // block name -> what it brought
  ordre: [],                // from oldest to most recent
  scripts: new Map(),
  attente: new Map(),       // the same block asked for twice is loaded only once
  PLAFOND: 6,
  _recu: null,

  /** Called by every line of a block while it loads. */
  bloc(type, cle, valeur){
    if (XR._recu) XR._recu.push([type, cle, valeur]);
  },

  /* Loads follow one another instead of overlapping, and that is not a detail: the
     tampon qui recueille les lignes d'un bloc est unique, et deux scripts en vol se le
     disputent — le second l'écrase avant que le premier ne se soit vidé. Constaté. Les
     paralléliser ne gagnerait rien ici : ce sont des fichiers locaux, et la file ne bloque
     que le temps d'un parse. */
  _file: Promise.resolve(),

  charger(nom){
    if (XR.cache.has(nom)) { XR.toucher(nom); return Promise.resolve(); }
    if (XR.attente.has(nom)) return XR.attente.get(nom);
    const p = XR._file.then(() => new Promise((ok, ko) => {
      if (XR.cache.has(nom)) { XR.toucher(nom); ok(); return; }
      const recu = [];
      XR._recu = recu;
      const s = document.createElement("script");
      s.src = nom;
      s.onload = () => {
        XR._recu = null; XR.attente.delete(nom); XR.ranger(nom, recu); ok();
      };
      s.onerror = () => {
        XR._recu = null; XR.attente.delete(nom); s.remove(); XR.scripts.delete(nom);
        ko(new Error("bloc introuvable : " + nom));
      };
      document.head.appendChild(s);
      XR.scripts.set(nom, s);
    }));
    XR.attente.set(nom, p);
    // The queue must not stop on a missing block: the next one has every right to be there.
    XR._file = p.catch(() => {});
    return p;
  },

  /** Files what a block brought where the view already reads it. */
  ranger(nom, recu){
    const pose = [];
    for (const [type, cle, valeur] of recu){
      if (type === "src"){ D.sources[cle] = valeur; pose.push(["src", cle]); }
      else if (type === "cumul"){ D.cumul[cle] = valeur; pose.push(["cumul", cle]); }
      else if (type === "poids"){ D.poids[cle] = valeur; pose.push(["poids", cle]); }
      else if (type === "presence"){ D.presence[cle] = valeur; pose.push(["presence", cle]); }
      else if (type === "run"){
        const [uuid, champ] = cle.split("/");
        const run = D.runs.find(r => r.uuid === uuid);
        if (run){ run[champ] = valeur; pose.push(["run", run, champ]); }
      }
    }
    XR.cache.set(nom, pose);
    // Global indexes do not age: they are small, they serve all the time, and
    // evicting them breaks accumulation as soon as a few more classes are opened — seen.
    if (XR.permanent(nom)) return;
    XR.toucher(nom);
    XR.evincer();
  },

  toucher(nom){
    if (XR.permanent(nom)) return;
    XR.ordre = XR.ordre.filter(x => x !== nom); XR.ordre.push(nom);
  },

  /** A global index: it crosses runs, it is small, it stays. */
  permanent(nom){ return nom.startsWith((D.global || "vue/")) && !nom.includes("/sources/"); },

  /**
   * Forget the oldest blocks: the entry AND the script, without which the memory never
   * comes back down.
   *
   * <p>A protected block — one of a run being looked at — goes back to the end of the queue
   * and we <b>continue</b>: stopping there let through everything that followed it, and the
   * ceiling no longer held. The counter bounds the round, failing which a whole queue of
   * protected blocks would spin for ever.
   */
  evincer(){
    let tours = XR.ordre.length;
    while (XR.ordre.length > XR.PLAFOND && tours-- > 0){
      const vieux = XR.ordre.shift();
      if (XR.protege.has(vieux)) { XR.ordre.push(vieux); continue; }
      for (const pose of (XR.cache.get(vieux) || [])){
        if (pose[0] === "src") delete D.sources[pose[1]];
        else if (pose[0] === "cumul") delete D.cumul[pose[1]];
        else if (pose[0] === "poids") delete D.poids[pose[1]];
        else if (pose[0] === "presence") delete D.presence[pose[1]];
        else if (pose[0] === "run") delete pose[1][pose[2]];
      }
      XR.cache.delete(vieux);
      const s = XR.scripts.get(vieux);
      if (s){ s.remove(); XR.scripts.delete(vieux); }
    }
  },

  /** What we do not free: what the view is showing right now. */
  protege: new Set(),

  /** The blocks needed to display these runs — each has its own, under it. */
  async runs(indices){
    const voulus = [];
    for (const i of indices) for (const b of ((D.runs[i] || {}).blocs || [])) voulus.push(b);
    XR.protege = new Set(voulus);
    await Promise.all(voulus.map(b => XR.charger(b).catch(e => console.error(e))));
  },

  /** A global index: it crosses runs, so it lives above them. */
  async global(nom){
    const chemin = (D.global || "vue/") + nom;
    if (XR.cache.has(chemin)) { XR.toucher(chemin); return; }
    await XR.charger(chemin).catch(e => console.error(e));
  },

  /** The block that carries this file's code, if there is one. */
  async source(cle){
    const bloc = D.sourcesDisponibles[cle];
    if (bloc && !D.sources[cle]) await XR.charger(bloc);
  },

  async cumulIndex(){ await XR.global("cumul.js"); },
  async poidsIndex(){ await XR.global("poids.js"); },
  async presenceIndex(){ await XR.global("presence.js"); }
};
D.sources = {};
D.cumul = {};
D.poids = {};
D.presence = {};
D.sourcesDisponibles = D.sourcesDisponibles || {};

/* The report's format is demanded: the view does not carry yesterday's shapes, since the
   reconstruire ne coûte qu'un --report-only. Mieux vaut le dire que d'afficher de travers. */
if (D.format !== "2.0"){
  document.addEventListener("DOMContentLoaded", () => {
    document.body.innerHTML = '<div style="padding:40px;font:15px/1.6 system-ui;max-width:60ch">'
      + '<h1 style="font-size:20px">Ce rapport a été engendré par une autre version</h1>'
      + '<p>La page attend le format <b>2.0</b>, ce rapport annonce <b>'
      + (D.format ? String(D.format) : 'aucun format') + '</b>.</p>'
      + '<p>Rien n\'est perdu : les mesures sont intactes sous <code>runs/</code>. Réassembler '
      + 'la vue suffit, sans relancer l\'application :</p>'
      + '<pre style="background:#eee;padding:10px;border-radius:6px">java -jar runtime-xray.jar '
      + '--report-only --out .</pre></div>';
  });
}

let runIndex = 0;
let R = D.runs[0];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const dot = s => s.replace(/\//g,".");
let clean = true, mode = "exec", scopeFrame = null, selected = null, filter = "", ctxIndex = 0;
// A call-tree node designates a PATH, not a call: the profile is an aggregate.
// The individual calls come from the inspection, and each is selectable on its own.
// callIndex is null when looking at the method, or the index of the call being looked at.
let callIndex = null;
// The “Executed code” and “Packages” lists can gather several runs: one ticks the ones to
// see. The code view, for its part, stays attached to ONE run — coverage and values only
// make sense in the one where the call took place.
let shownRuns = new Set(D.runs.map((_, i) => i));
/* --------------------------------------------------------------- cumulative coverage
 * An acceptance campaign is not one run: it is ten, and the question asked in front of the
 * code is “did SOMETHING cover this line?”, not “did
 * the last one covered it?”. Reading one run at a time forces one to make the union in
 * one's head, class by class, which nobody does honestly beyond three.
 *
 * Accumulating therefore unites the TICKED runs — the same as the left-hand list — and
 * keeps, for each line, WHICH one covered it. It is that second half that is worth the
 * detour: a line covered by one run out of ten is a single point of passage, and a line
 * nobody reaches after ten scenarios is not “not yet tested”.
 *
 * The setting is deliberately in the page and not in the measurement: it changes in one
 * click, with nothing to re-run, and the union recomputes on data already there. */
let cumul = false;
try { cumul = localStorage.getItem("runtime-xray.cumul") === "1"; } catch(e){}
if (D.runs.length < 2) cumul = false;

/** The ticked runs, in the page's order. */
function runsCoches(){
  return D.runs.map((r, i) => i).filter(i => shownRuns.has(i));
}

/**
 * Coverage as the code view must read it.
 *
 * <p>Outside accumulation it is that of the run being looked at, unchanged. Accumulating,
 * it is the union of the ticked runs: a line is covered as soon as a single one covered it,
 * and partial as long as none covered it entirely. Branches keep the best reading — the
 * same rule JaCoCo applies when merging two {@code .exec} files.
 */
function covPourVue(source){
  if (!cumul) return (R.coverage && R.coverage[source]) || {};
  // The union is read from an index computed at assembly: per line, two bit masks — who
  // covered it entirely, who partially. Uniting a subset becomes a binary AND, one
  // operation per line, instead of a search per line AND per run.
  const index = D.cumul[source];
  if (!index) return (R.coverage && R.coverage[source]) || {};
  let masque = 0;
  for (const i of runsCoches()) masque |= (1 << i);
  const out = {};
  for (const [nr, plein, partiel] of index){
    const p = plein & masque, q = partiel & masque;
    if (!p && !q) continue;
    const bits = p | q, qui = [];
    for (let i = 0; i < D.runs.length; i++) if (bits & (1 << i)) qui.push(i);
    out[nr] = { s: p ? "full" : "part", b: null, runs: qui };
  }
  return out;
}

/** The pips that say which runs covered a line. */
function pastillesRuns(c){
  if (!cumul || !c || !c.runs || !c.runs.length) return "";
  return '<span class="quiruns">' + c.runs.map(i =>
    '<span class="runbadge r' + (i % 8) + '" title="Couverte dans « ' + esc(runLabel(D.runs[i]))
    + ' »">' + (i + 1) + '</span>').join("") + '</span>';
}

/* ------------------------------------------------------------- hiding by learning
 * One does not write the list of packages to hide in advance: one discovers it while
 * reading the code, where they announce themselves. Hence this mechanism — click “filter”
 * beside a method, choose how far up to go (the class, its package, the parent package…),
 * and it disappears. The list accumulates, is read back, and is copied into the
 * configuration file so the following runs start clean.
 *
 * The hiding is purely visual: the node is not rendered, so its weight stays counted
 * in its parent — exactly the folding the tool applies to the JDK. Nothing is lost. */
const MASK_KEY = "runtime-xray.masques";
let masked = [];
try { masked = JSON.parse(localStorage.getItem(MASK_KEY) || "[]"); } catch(e){ masked = []; }

/** The packages already hidden AT COLLECTION, from the configuration: they are no longer
 *  in the data; we show them so the displayed list tells the whole truth. */
const maskedAtSource = (D.runs.find(r => r.paquetsMasques) || {}).paquetsMasques || "";

function isMasked(frame){
  if (!masked.length || !frame) return false;
  const n = frame.replace(/\./g, "/");
  return masked.some(p => n === p || n.startsWith(p + "/") || n.startsWith(p + "."));
}

/** The hiding levels available for a method, from the widest to the narrowest. */
function maskLevels(frame){
  const cls = frame.includes(".") ? frame.slice(0, frame.lastIndexOf(".")) : frame;
  const parts = cls.split("/");
  const out = [];
  for (let i = 1; i < parts.length; i++){
    out.push({ path: parts.slice(0, i).join("/"),
               label: parts.slice(0, i).join("."),
               quoi: "tout ce paquet" });
  }
  out.push({ path: cls, label: parts.join("."), quoi: "cette classe seule" });
  return out;
}

function saveMasks(){
  localStorage.setItem(MASK_KEY, JSON.stringify(masked));
  renderMaskBar();
  mode === "cls" ? renderClasses() : renderTree();
  reselect();
}

function addMask(path){
  if (!masked.includes(path)){
    // A wider rule makes the narrower ones pointless: we drop them so the list stays
    // ligne de configuration produite reste lisible.
    masked = masked.filter(m => !(m === path || m.startsWith(path + "/")));
    masked.push(path);
    masked.sort();
  }
  saveMasks();
}
// Two ways of reading time: the share of the total, or an estimated duration. The second
// speaks to whoever asks “how long”, the first to whoever compares two methods.
let unit = "pct";
// Full package names make the tree unreadable on a project with a deep layout; they can
// be folded with one button.
let showPackages = true;
// The Code view is alphabetical by construction — packages, classes and methods sorted by
// name: one looks there for something one knows. Ranking by time is the Runs view's
// question.
// In the structure view: show only what ran, or the whole of the project's code.
// When everything is shown, one must tell at a glance what served from what sleeps.
let executedOnly = true;

/** A frame's name, with or without its package, according to the setting. */
function frameLabel(frame){
  const full = dot(frame);
  if (showPackages) return full;
  const parts = full.split(".");
  return parts.length <= 2 ? full : parts.slice(-2).join(".");
}

/** One sample is taken every millisecond of processor time: a method's sample count is
 *  therefore, near enough, its processor time in milliseconds. */
function formatWeight(samples, total){
  if (!samples) return "·";
  if (unit === "pct"){
    const share = 100 * samples / (total || 1);
    return share >= 0.05 ? share.toFixed(1) + "%" : "·";
  }
  const ms = samples * (R.intervalMs || 1);
  if (ms >= 10000) return (ms / 1000).toFixed(1) + "s";
  if (ms >= 1000) return (ms / 1000).toFixed(2) + "s";
  return Math.round(ms) + "ms";
}

/**
 * The share of time, written out in full for the breadcrumb.
 *
 * <p>{@code formatWeight} renders “·” under 0.1 %: in a narrow column that is the right
 * sign for “negligible”, but next to “of time” it gave “· of time”, which says nothing.
 * And in milliseconds, “62ms of time” did not mean much more.
 */
function partDuTemps(samples){
  const t = formatWeight(samples, R.calltree.total);
  if (unit !== "pct") return t + " cumulées ici";
  if (t === "·") return "moins de 0,1 % du temps";
  // In a column, “8.6%” saves two characters; in a sentence, the comma and the space
  // are the ones needed.
  return t.replace(".", ",").replace("%", " %") + " du temps";
}

/* --------------------------------------------------------------- aggregates */
function ranIn(run, frame){
  const cls = frame.slice(0, frame.lastIndexOf("."));
  const name = frame.slice(frame.lastIndexOf(".") + 1);
  const info = run.methods[cls];
  return !!(info && info.methods.some(m => m.name === name && m.covered));
}
function computeAgg(){
  // The call tree arrives with the run's block. Until it is there we return empty counters
  // rather than failing: the view redraws as soon as the block has loaded.
  if (!R || !R.calltree) return {cov:0, miss:0, dead:[], weights:{}, methods:0, pct:0, samples:0};
  let cov=0, miss=0; const dead=[];
  for (const classes of Object.values(R.packages))
    for (const c of classes){ cov+=c.covered; miss+=c.missed; if(!c.covered) dead.push(c.simple); }
  const weights = {};
  (function walk(n){ for(const k of n.children){ weights[k.name]=(weights[k.name]||0)+k.total; walk(k);} })(R.calltree);
  let methods=0;
  for (const info of Object.values(R.methods)) methods += info.methods.filter(m=>m.covered).length;
  return {cov, miss, dead, weights, methods,
          pct: cov+miss ? 100*cov/(cov+miss) : 0, samples: R.calltree.total};
}
// Empty when the script loads: the call tree arrives with the block. Recomputed at
// start-up, at the bottom of this file, as soon as the block is there.
let AGG = computeAgg();

/* ------------------------------------------------------------ run identity
 * A run carries three distinct things, and confusing them loses track of what is being
 * looked at: an identifier, which never changes; the name given at launch, which says what
 * one thought was being measured; the name given afterwards, which says what was
 * understood. The page can capture the last two, plus a description and tags; it keeps
 * them in the browser and can render the “noms.json” that will make them final.
 */
const ANNOT_KEY = "runtime-xray-annotations";
let annotations = {};
try { annotations = JSON.parse(localStorage.getItem(ANNOT_KEY) || "{}"); } catch(e){ annotations = {}; }
function saveAnnotations(){
  try { localStorage.setItem(ANNOT_KEY, JSON.stringify(annotations)); } catch(e){}
}
/** What was typed into the page wins over what the report already carried. */
function annotationOf(run){
  const local = annotations[run.uuid] || {};
  const base = annotationEnregistree(run);
  return {
    nom: local.nom !== undefined ? local.nom : base.nom,
    description: local.description !== undefined ? local.description : base.description,
    etiquettes: local.etiquettes !== undefined ? local.etiquettes : base.etiquettes,
    elagage: local.elagage !== undefined ? local.elagage : base.elagage
  };
}
function annotationPatch(run, champ, valeur){
  const a = annotations[run.uuid] || (annotations[run.uuid] = {});
  if (valeur === null) delete a[champ]; else a[champ] = valeur;
  if (!Object.keys(a).length) delete annotations[run.uuid];
  saveAnnotations();
}

/* ----------------------------------------------- writing, exporting, importing
 * A page opened as a file can write nothing to disk: that is a rule of the browser, and
 * it is also what makes it passable on as it stands. The annotations therefore live in
 * the browser, and three paths take them out of it:
 *
 *   — served by the tool (“--serve”), the page SAVES into noms.json, beside the runs, and
 *     the report is regenerated: the annotation becomes the report's own;
 *   — otherwise, one EXPORTS the file and drops it in oneself;
 *   — and one IMPORTS an existing noms.json to find again, in this browser, what a
 *     colleague annotated.
 */
let peutEnregistrer = false;
// What the shared server already carries: other people's annotations, and the fingerprint
// of each. The fingerprint is what lets us say “somebody came by since”.
let annotationsServeur = {};
let empreintesServeur = {};
// Is the server guarded by a shared secret? We say so in the bar: whoever annotates has
// the right to know whether what they write goes to a server open to everyone.
let serveurGarde = false;
// The report's revision on the server: it changes when a run is dropped in or removed.
// The page does not reload by itself — we do not make what somebody is reading disappear
// somebody is reading — it offers.
let revisionServeur = null;

function lireServeur(){
  return fetch("__xray/noms", {cache: "no-store"})
    .then(r => { if (r.status === 401) { sessionExpiree(); return null; }
                 return r.ok ? r.json() : null; })
    .then(j => {
      if (!j) return false;
      const avant = JSON.stringify(empreintesServeur);
      annotationsServeur = j.annotations || {};
      empreintesServeur = j.empreintes || {};
      if (revisionServeur === null) revisionServeur = j.revision || null;
      else if (j.revision && j.revision !== revisionServeur) annoncerNouvelles(j.executions);
      return JSON.stringify(empreintesServeur) !== avant;
    })
    .catch(() => false);
}

fetch("__xray/ping", {cache: "no-store"})
  .then(r => r.ok ? r.json() : null)
  .then(j => {
    if (!j || !j.peutEcrire) return;
    peutEnregistrer = true;
    serveurGarde = !!j.garde;
    return lireServeur().then(() => {
      renderIdentity();
      refreshRunLabels();
      // Several people can annotate at once: we read back regularly, and we lay down the
      // names of the runs one is not editing oneself.
      setInterval(() => lireServeur().then(change => {
        if (!change) return;
        refreshRunLabels();
        if (!document.getElementById("annotName")
            || document.activeElement.id !== "annotName") renderIdentity();
      }), 15000);
    });
  })
  .catch(() => {});   // page opened as a file: we stay on the export

/**
 * Signals that the server no longer recognises us: the session guarded by the shared
 * secret expired, or the server restarted.
 *
 * <p>What was typed and not yet saved stays in this browser: reconnecting and saving again
 * is enough. We say so, because without it “failed” looks like data lost.
 *
 */
function sessionExpiree(){
  peutEnregistrer = false;
  if (document.getElementById("nouvelles")) return;
  const barre = document.createElement("div");
  barre.id = "nouvelles";
  barre.innerHTML = 'Session expirée. Ce qui n\'est pas encore enregistré reste dans ce ' +
    'navigateur. <button class="mini" id="nouvellesGo">se reconnecter</button>' +
    '<button class="mini" id="nouvellesNon" aria-label="Ignorer">✕</button>';
  document.body.appendChild(barre);
  document.getElementById("nouvellesGo").onclick = () => location.reload();
  document.getElementById("nouvellesNon").onclick = () => barre.remove();
}

/**
 * Signals that the report changed on the server — a run dropped in, another removed.
 *
 * <p>We do not reload on their behalf: somebody may be reading a method, or writing a
 * description. We say so, and we let them decide.
 */
function annoncerNouvelles(combien){
  if (document.getElementById("nouvelles")) return;
  const barre = document.createElement("div");
  barre.id = "nouvelles";
  barre.innerHTML = 'Le rapport a changé sur le serveur' +
    (combien ? ' — ' + combien + ' exécution' + (combien > 1 ? 's' : '') + ' à présent' : '') +
    '. <button class="mini" id="nouvellesGo">recharger</button>' +
    '<button class="mini" id="nouvellesNon" aria-label="Ignorer">✕</button>';
  document.body.appendChild(barre);
  document.getElementById("nouvellesGo").onclick = () => location.reload();
  document.getElementById("nouvellesNon").onclick = () => barre.remove();
}

/** A run's annotation as it is saved: the server first, otherwise the one the page
 *  carried when it was built. */
function annotationEnregistree(run){
  const distante = annotationsServeur[run.uuid];
  if (distante !== undefined) {
    return typeof distante === "string"
      ? {nom: distante, description: "", etiquettes: {}, elagage: null}
      : {nom: distante.nom || "", description: distante.description || "",
         etiquettes: distante.etiquettes || {}, elagage: distante.elagage || null};
  }
  return {nom: run.nomOutil || "", description: run.description || "",
          etiquettes: run.etiquettes || {}, elagage: run.elagage || null};
}

/** True if this browser carries, for this run, something other than what is saved. */
function annotationModifiee(run){
  const local = annotations[run.uuid];
  if (!local) return false;
  const a = annotationOf(run), e = annotationEnregistree(run);
  return JSON.stringify([a.nom, a.description, a.etiquettes, a.elagage])
      !== JSON.stringify([e.nom, e.description, e.etiquettes, e.elagage]);
}

/**
 * Sends the annotation of the run being looked at.
 *
 * <p>One run at a time, with the fingerprint of what was in front of us: two people
 * annotating two runs never cross, and on the same run the second is warned instead of
 * overwriting the first.
 */
function enregistrerAnnotations(bouton){
  const run = R;
  const dire = t => { bouton.textContent = t; };
  const a = annotationOf(run);
  const tags = a.etiquettes && Object.keys(a.etiquettes).length ? a.etiquettes : undefined;
  const el = elagageActif(run) ? elagageOf(run) : undefined;
  const valeur = (!a.nom && !a.description && !tags && !el)
    ? {}
    : {nom: a.nom || undefined, description: a.description || undefined,
       etiquettes: tags, elagage: el};
  const rendre = () => setTimeout(renderIdentity, 2500);

  dire("enregistrement…");
  fetch("__xray/noms/" + encodeURIComponent(run.uuid), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    // No known fingerprint — a page opened before the server answered — counts as “no
    // check”: better than a blanket refusal on a run that was never annotated.
    body: JSON.stringify({base: empreintesServeur[run.uuid] !== undefined
                                ? empreintesServeur[run.uuid] : null,
                          valeur: valeur})
  }).then(r => r.json().then(j => ({status: r.status, body: j})).catch(() => ({status: r.status, body: {}})))
    .then(({status, body}) => {
      if (status === 409){
        // Somebody else came by: we show what is saved, and we let them decide —
        // overwriting silently would make their work disappear.
        annotationsServeur[run.uuid] = body.valeur;
        empreintesServeur[run.uuid] = body.empreinte;
        dire("modifiée entre-temps");
        montrer("La fiche de cette exécution a été modifiée par quelqu'un d'autre pendant que vous la "
          + "modifiiez. Version enregistrée :\n\n"
          + JSON.stringify(body.valeur, null, 2)
          + "\n\nCliquer « enregistrer » à nouveau remplacera la sienne par la vôtre ; "
          + "recharger la page reprendra la sienne et abandonnera vos modifications.",
          "Fiche modifiée entre-temps");
        rendre();
        return;
      }
      if (status === 401){
        // The worst moment to lose access: somebody has just written a description.
        // It is not lost — it stays in this browser as long as the server has
        // not taken — and that is exactly what to say, rather than a “failure”.
        dire("session expirée");
        sessionExpiree();
        rendre();
        return;
      }
      if (status !== 200) throw new Error("refus du serveur (" + status + ")");
      // What is saved is no longer “a local change”: we erase the browser's copy, so that
      // “changed” designates only what has not yet gone out.
      delete annotations[run.uuid];
      saveAnnotations();
      annotationsServeur[run.uuid] = valeur && Object.keys(valeur).length ? valeur : undefined;
      empreintesServeur[run.uuid] = body.empreinte;
      dire("enregistré ✓");
      rendre();
    })
    .catch(e => { dire("échec : " + e.message); rendre(); });
}

/** Drops a run's local changes and takes back what is saved. */
function reprendreEnregistree(run){
  delete annotations[run.uuid];
  saveAnnotations();
  renderIdentity();
  refreshRunLabels();
  mode === "tree" ? renderTree() : renderClasses();
  drawHome();
}

function exporterAnnotations(){
  const blob = new Blob([JSON.stringify(annotationsFile(), null, 2)],
                        {type: "application/json"});

/** Takes up a noms.json: the runs it names overwrite what we had, the others stay —
 *  importing is not starting over. */
function importerAnnotations(texte){
  const lu = JSON.parse(texte);
  if (!lu || typeof lu !== "object" || Array.isArray(lu)) {
    throw new Error("ce fichier ne porte aucune fiche d'exécution");
  }
  // A single-run file — name, description, tags — is not indexed by identifier: it holds
  // for the run being looked at, and that is the only possible reading.
  if (lu.nom !== undefined || lu.description !== undefined
      || lu.etiquettes !== undefined || lu.elagage !== undefined) {
    annotations[R.uuid] = {nom: lu.nom || "", description: lu.description || "",
                           etiquettes: lu.etiquettes || {}, elagage: lu.elagage || null};
    saveAnnotations();
    return 1;
  }
  let reprises = 0;
  for (const [uuid, valeur] of Object.entries(lu)){
    annotations[uuid] = (typeof valeur === "string")
      ? {nom: valeur}
      : {nom: valeur.nom || "", description: valeur.description || "",
         etiquettes: valeur.etiquettes || {}, elagage: valeur.elagage || null};
    reprises++;
  }
  saveAnnotations();
  return reprises;
}
function shortId(run){ return (run.uuid || "").slice(0, 8); }

/* ------------------------------------------------------------------- pruning the tree
 * A complete call tree shows everything that ran — the start-up, the machinery, the
 * branches nobody cares about today. What one wants to show somebody else is often ONE
 * branch. Hence two gestures: cutting a branch, and starting again from a node while
 * hiding the levels above it.
 *
 * What pruning does NOT do: change the measurements. The percentages stay relative to the
 * run's total, and nothing is removed from the files. It is a reading frame, not a
 * correction of the measurement — and the band says so, permanently.
 *
 * A path is written as in the folded-stacks file: the frames from the root to the node,
 * separated by “;”. Two methods of the same name called from two places are therefore two
 * distinct paths, which is exactly what one wants to cut.
 */
function elagageOf(run){
  const a = annotationOf(run).elagage || {};
  return {
    racine: typeof a.racine === "string" ? a.racine : "",
    coupes: Array.isArray(a.coupes) ? a.coupes : []
  };
}
function elagageActif(run){
  const e = elagageOf(run);
  return !!(e.racine || e.coupes.length);
}
function poseElagage(run, e){
  annotationPatch(run, "elagage", {racine: e.racine, coupes: e.coupes});
  renderAnnotActs();
}
function nodeAtPath(root, path){
  let node = root;
  for (const name of path.split(";")){
    node = (node.children || []).find(k => k.name === name);
    if (!node) return null;
  }
  return node;
}
/** A copy of the tree without the cut branches, each node carrying its original path. */
function copyPruned(node, path, coupes){
  const kids = [];
  for (const kid of node.children || []){
    const p = path ? path + ";" + kid.name : kid.name;
    if (coupes.includes(p)) continue;
    kids.push(copyPruned(kid, p, coupes));
  }
  return {name: node.name, total: node.total, children: kids, __path: path};
}
/**
 * The tree as one has decided to read it.
 *
 * <p>A path that has become unfindable — the measurement changed, the method disappeared —
 * is ignored rather than applied wrongly: better to show too much than to show something else.
 */
function prunedTree(run){
  const e = elagageOf(run);
  // The copy also serves to lay down each node's path, which the display needs even
  // without pruning: it is therefore always made, but kept as long as nothing changes.
  const cle = e.racine + "|" + e.coupes.join("|");
  if (run.__prunedKey === cle) return run.__pruned;
  let base = run.calltree, basePath = "";
  if (e.racine){
    const trouve = nodeAtPath(run.calltree, e.racine);
    if (trouve){ base = trouve; basePath = e.racine; }
  }
  const élagué = copyPruned(base, basePath, e.coupes);
  // Root brought down: we reintroduce a mute parent so the chosen node displays itself,
  // and not only its children — otherwise one no longer knows where one starts from.
  const arbre = basePath
    ? {name: "tout", total: run.calltree.total, children: [élagué], __path: ""}
    : élagué;
  run.__prunedKey = cle;
  run.__pruned = arbre;
  return arbre;
}

/** A node's path as the pruning designates it. */
function pathOf(node){ return node && node.__path ? node.__path : (node ? node.name : ""); }
/** The name set in the tool, else the launch name, else the identifier: never anything invented. */
function runLabel(run){
  return annotationOf(run).nom || run.nomOrigine || shortId(run) || run.chemin || "exécution";
}
/** Lays the labels down again wherever they show, without rebuilding the view. */
function refreshRunLabels(){
  document.querySelectorAll("[data-runname]").forEach(el => {
    const nom = runLabel(D.runs[+el.dataset.runname]);
    el.textContent = nom;
    if (el.title) el.title = nom;
  });
  const c = document.getElementById("crumbname");
  if (c) c.textContent = runLabel(R);
  const titre = document.getElementById("identNom");
  if (titre && document.activeElement !== titre) titre.value = annotationOf(R).nom;
}

(function initRuns(){
  if (D.runs.length < 2) return;
  document.getElementById("runpick").hidden = false;
  const box = document.getElementById("runboxes");
  box.innerHTML = D.runs.map((r, i) =>
    '<label title="Décocher retire cette exécution de la liste du code"><input '
    + 'type="checkbox" data-run="' + i + '" checked '
    + 'aria-label="Afficher le code de ' + esc(runLabel(r)) + '"> ' +
    '<span data-runname="' + i + '">' + esc(runLabel(r)) + '</span>' +
    (r.uuid ? '<span class="uid" title="Identifiant permanent : ' + esc(r.uuid) + '">'
              + esc(shortId(r)) + '</span>' : '') +
    '<span class="cnt" title="Méthodes ayant tourné dans cette exécution">'
    + methodCount(r) + ' méthodes</span></label>').join("");
  box.querySelectorAll("input[data-run]").forEach(cb => cb.onchange = async () => {
    const i = +cb.dataset.run;
    cb.checked ? shownRuns.add(i) : shownRuns.delete(i);
    if (!shownRuns.size){ shownRuns.add(i); cb.checked = true; return; }  // never nothing to see
    // A run one ticks must have its block: the list reads its covered methods.
    await XR.runs(runsCoches()).catch(e => console.error(e));
    const open = captureExpanded();
    mode === "cls" ? renderClasses() : renderTree();
    restoreExpanded(open);
    reselect();
  });
  const cb = document.getElementById("cumulcb");
  cb.checked = cumul;
  cb.onchange = async () => {
    cumul = cb.checked;
    try { localStorage.setItem("runtime-xray.cumul", cumul ? "1" : "0"); } catch(e){}
    if (cumul) await XR.cumulIndex();
    refreshHeader();
    renderLegend();
    // draw() chooses for itself between the code and the overview. Calling a “drawCode”
    // that never existed did not show as long as no class was open — accumulating from the
    // overview went through drawHome, and the defect slept.
    draw();
  };
})();

function methodCount(run){
  let n = 0;
  for (const info of Object.values(run.methods)) n += info.methods.filter(m => m.covered).length;
  return n;
}

async function switchRun(i, redraw){
  runIndex = i; R = D.runs[i];
  await XR.runs([i]).catch(e => console.error(e));
  AGG = computeAgg(); methodIndex = null;
  scopeFrame = null; ctxIndex = 0;
  const sel = document.getElementById("runsel");
  if (sel && !sel.hidden) sel.value = String(i);
  refreshHeader(); refreshLinks();
  if (redraw){ selected = null; renderTree(); drawHome(); }
}

/**
 * Opening, closing, and walking with the keyboard.
 *
 * <p>A menu that closes only by clicking its own button traps the mouse, and a menu one
 * cannot walk with the arrow keys is no menu for whoever uses no mouse.
 */
function poserMenuExports(){
  const bouton = document.getElementById("dlbtn");
  const menu = document.getElementById("dlmenu");
  if (!bouton || !menu) return;
  const items = () => [...menu.querySelectorAll("a")];
  const fermer = (rendreLeFocus) => {
    menu.hidden = true;
    bouton.setAttribute("aria-expanded", "false");
    if (rendreLeFocus) bouton.focus();
  };
  bouton.onclick = e => {
    e.preventDefault();
    const ouvert = menu.hidden;
    menu.hidden = !ouvert;
    bouton.setAttribute("aria-expanded", String(ouvert));
    if (ouvert) { const l = items()[0]; if (l) l.focus(); }
  };
  menu.onkeydown = e => {
    const l = items(), i = l.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); fermer(true); }
    else if (e.key === "ArrowDown") { e.preventDefault(); l[Math.min(l.length - 1, i + 1)].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); (i <= 0 ? bouton : l[i - 1]).focus(); }
  };
  bouton.onkeydown = e => { if (e.key === "Escape" && !menu.hidden) fermer(true); };
  // A click elsewhere closes: that is what every menu does, and not doing it gives
  // the impression that the page is stuck. Laid ONCE on the document: the bar rebuilds at
  // every change of run, and one listener per rebuild
  // would accumulate with nothing to show it.
  if (!poserMenuExports.pose) {
    poserMenuExports.pose = true;
    document.addEventListener("click", e => {
      const m = document.getElementById("dlmenu"), b = document.getElementById("dlbtn");
      if (m && !m.hidden && !m.contains(e.target) && b && !b.contains(e.target)) {
        m.hidden = true;
        b.setAttribute("aria-expanded", "false");
      }
    });
  }
  menu.addEventListener("click", e => {
    const a = e.target.closest("a.off");
    if (!a) { if (e.target.closest("a")) fermer(false); return; }
    e.preventDefault();
    fermer(false);
    // Each group says how to get back WHAT it carries: the open formats
    // rewrite measurements already there, the JaCoCo sites demand another setting. One
    // command for both would have sent one of the two into a wall.
    montrer(a.dataset.cmd
      ? "« " + a.dataset.export + " » n'a pas été produit pour ce rapport.\n\n"
        + a.dataset.cmd
      : "« " + a.dataset.export + " » n'a pas été produit pour ce rapport.\n\n"
        + "Pour l'obtenir, sans relancer la moindre mesure :\n\n"
        + "    java -jar runtime-xray.jar --report-only --out <ce dossier> --export tout\n\n"
        + "Les fichiers sont écrits dans <exécution>/exports/, et ce menu les liera.",
      "« " + a.dataset.export + " » n'a pas été produit");
  });
}

/* --------------------------------------------------------- frame -> source */
function frameInfo(frame){
  const i = frame.lastIndexOf(".");
  if (i < 0) return null;
  const cls = frame.slice(0,i), name = frame.slice(i+1);
  const info = R.methods[cls];
  if (!info) return null;
  const decl = info.methods.find(m => m.name === name);
  return {frame, cls, name, line: decl ? decl.line : 0,
          source: info.source, methods: info.methods};
}

/* ------------------------------------------ perimeter: under one method */
function framesUnder(target){
  const acc = {};
  (function walk(node, inside){
    for (const kid of node.children){
      const now = inside || kid.name === target;
      if (now) acc[kid.name] = (acc[kid.name]||0) + kid.total;
      walk(kid, now);
    }
  })(R.calltree, false);
  return acc;
}
function executedMethods(){
  const scoped = scopeFrame ? framesUnder(scopeFrame) : null;
  const merged = new Map();
  for (const i of [...shownRuns].sort()){
    const run = D.runs[i];
    // A method's weight in THIS run is read from the global index, computed at assembly.
    // Deriving it here would demand the call tree of every ticked run —
    // hence loading them all for a list of six lines.
    const weights = (frame) => (D.poids[frame] || [])[i] || 0;
    for (const [cls, info] of Object.entries(run.methods)){
      for (const m of info.methods){
        if (!m.covered) continue;
        const frame = cls + "." + m.name;
        if (scoped && !(frame in scoped)) continue;
        if (filter && !(dot(frame).toLowerCase().includes(filter))) continue;
        const seen = merged.get(frame);
        const samples = weights(frame);
        if (!seen){
          merged.set(frame, {frame, cls, name: m.name, line: m.line, source: info.source,
                             methods: info.methods, samples, runs: [i], bestRun: i, best: samples});
        } else {
          seen.samples += samples;
          seen.runs.push(i);
          if (samples > seen.best){ seen.best = samples; seen.bestRun = i; }
        }
      }
    }
  }
  // Only remaining use: the overview's most costly methods. Sorting by
  // time is therefore the right one, and the only one.
  return [...merged.values()]
      .sort((a, b) => b.samples - a.samples || a.frame.localeCompare(b.frame));
}

/* ------------------------------------------------------------------ listes */
function renderScope(){
  const box = document.getElementById("scope");
  if (mode !== "exec"){ box.innerHTML = ""; box.style.display = "none"; return; }
  // Nothing to show when the perimeter is whole: a permanent explanation slows the
  // learning without teaching anything. It stays on the overview, where it belongs.
  if (!scopeFrame){ box.innerHTML = ""; box.style.display = "none"; return; }
  box.style.display = "block";
  box.innerHTML = "Périmètre : <b>ce qui a tourné sous " +
      esc(dot(scopeFrame).split(".").slice(-2).join(".")) + "</b>" +
      "<button id='unscope'>Toute l'exécution</button>";
  const b = document.getElementById("unscope");
  if (b) b.onclick = () => { scopeFrame = null; mode === "cls" ? renderClasses() : renderTree(); };
}
/**
 * Some actions change the list of nodes — ticking a run, switching executed/all — and
 * force a rebuild. Closing the tree on that occasion loses the thread of what was being
 * looked at: we note what was open, and we reopen it.
 */
function captureExpanded(){
  const open = new Set();
  document.querySelectorAll("#list .node").forEach(n => {
    const tw = n.querySelector(".tw");
    if (tw && tw.textContent === "▾"){
      const key = n.dataset.frame || n.dataset.path;
      if (key) open.add(key);
    }
  });
  return open;
}

function restoreExpanded(open){
  if (!open || !open.size) return;
  for (let pass = 0; pass < 30; pass++){
    const toOpen = [...document.querySelectorAll("#list .node")].filter(n => {
      const tw = n.querySelector(".tw");
      const key = n.dataset.frame || n.dataset.path;
      return tw && tw.textContent === "▸" && key && open.has(key) && !n.classList.contains("runroot");
    });
    if (!toOpen.length) return;
    toOpen.forEach(n => n.click());
  }
}
