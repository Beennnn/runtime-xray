/**
 * Flame drawn right here, from the same measurements as the tree. Two reasons not to depend
 * on a file produced alongside: the report stays a single page, and the link cannot be
 * broken. Every bar leads to its method.
 */
function flameBlock(){
  // The graph follows the pruning: showing here a branch just cut in the tree would make
  // the same page say two different things.
  const root = prunedTree(R);
  if (!root || !R.calltree || !R.calltree.total) return "";
  const H = 18, MAXD = 12;
  const bars = [];
  let maxDepth = 0;

  const totalMesure = R.calltree.total;
  (function layout(node, depth, x){
    for (const kid of node.children){
      const w = kid.total / totalMesure;
      if (w * 100 < 0.4 || depth > MAXD){ x += w; continue; }   // too thin to be read
      // SELF time: what the method keeps for itself, once what it delegated is removed. It
      // is the only quantity that designates a place to act — a wide bar one of whose
      // children is just as wide is only passing the baton.
      const delegue = kid.children.reduce((sum, c) => sum + c.total, 0);
      bars.push({x, w, depth, name: kid.name, known: !!frameInfo(kid.name), total: kid.total,
                 propre: Math.max(0, kid.total - delegue) / totalMesure});
      maxDepth = Math.max(maxDepth, depth);
      layout(kid, depth + 1, x);
      x += w;
    }
  })(root, 0, 0);
  if (!bars.length) return "";

  const body = bars.map(b => {
    const label = frameLabel(b.name).split(".").slice(-2).join(".");
    return '<div class="fl' + (b.known ? " known" : "") + '"' +
      (b.known ? ' data-f="' + esc(b.name) + '"' : '') +
      ' style="left:' + (b.x * 100).toFixed(4) + '%;width:' + (b.w * 100).toFixed(4) + '%;' +
      'top:' + (b.depth * H) + 'px;background:' + flameColour(b.propre, b.known) + '"' +
      ' title="' + esc(dot(b.name)) + '  —  ' + formatWeight(b.total, totalMesure) +
      ' au total, dont ' + (b.propre * 100).toFixed(1) + ' % en propre">' +
      '<span>' + esc(label) + '</span></div>';
  }).join("");

  return '<h2>Où le temps est passé</h2>' +
    '<p style="margin-bottom:8px">Chaque barre est une méthode ; sa <b>largeur</b> est la ' +
    'part du temps passé dessous, sa <b>couleur</b> la part qu\'elle garde <b>pour elle</b>, ' +
    'une fois retiré ce qu\'elle a délégué. Une barre large et pâle ne fait que passer le ' +
    'relais ; <span class="flamekey"></span> une barre colorée est un endroit où le temps ' +
    'se consomme vraiment. Cliquer entre dans la méthode.</p>' +
    '<div class="flame" title="Chaque barre est une méthode, empilée sous celle qui '
    + 'l\'appelle. Largeur : la part du temps passée dessous. Couleur : la part qu\'elle '
    + 'garde pour elle. Cliquer une barre ouvre la méthode." '
    + 'style="height:' + ((maxDepth + 1) * H) + 'px">' + body + '</div>';
}

/**
 * Fits the time graph's labels to their bar's real width.
 *
 * <p>A narrow bar carrying "RoutePlanne" or "Breaks.t" designates nothing: the name cut in
 * the middle costs room while teaching nothing. So the full name is tried, then the method
 * name alone, then nothing at all — hovering gives the whole label in every case. The
 * measurement is done after rendering, because a bar's width is a percentage: it depends
 * on the window, not on the data.
 */
function fitFlameLabels(){
  document.querySelectorAll(".flame .fl").forEach(el => {
    const span = el.querySelector("span");
    if (!span) return;
    const full = span.dataset.full || span.textContent;
    span.dataset.full = full;
    for (const essai of [full, full.split(".").pop(), ""]) {
      span.textContent = essai;
      if (span.scrollWidth <= span.clientWidth) break;
    }
  });
}
// The bars' width follows the window: what fitted at 1400 px no longer fits at 900.
addEventListener("resize", () => {
  clearTimeout(fitFlameLabels.t);
  fitFlameLabels.t = setTimeout(fitFlameLabels, 120);
});

/**
 * The colour says SELF time, not depth.
 *
 * <p>Colouring by depth said nothing: the vertical position already gives it, and the
 * result was six shades of the same yellow, decorative. Self time, for its part, answers the
 * question one asks in front of a flame graph — <i>where is the time actually
 * consumed?</i> — and it tells a method that works from a method that delegates.
 *
 * <p>The scale is deliberately compressed: beyond a few per cent of self time, one is
 * already in what counts, and a linear gradient would crush all the rest into the same
 * pale hue.
 */
function flameColour(propre, known){
  if (!known) return "var(--border)";
  const t = Math.min(1, Math.sqrt(propre / 0.25));      // 25 % en propre = saturation
  const tons = ["#dbe7f3", "#f3e2b4", "#f5cf7a", "#ef9f45", "#e2662c", "#c8341b"];
  return tons[Math.min(tons.length - 1, Math.round(t * (tons.length - 1)))];
}

/* -------------------------------------------------------------- sections repliables
 * The overview reads from top to bottom, and only one of its sections can be outsized:
 * "Never executed" lists the analysed classes that ran nothing, and on a real project there
 * are hundreds of them. It then pushed off the screen everything that follows it — the
 * costliest methods, the captured values, the caveat — that is to say precisely what one
 * came for. Yet that list is consulted once: it does not have to cost the whole page.
 *
 *
 * Folded, the section keeps its title and its count, which suffices to decide whether to
 * open it. The threshold is a choice: beyond PLI_AUTO entries the section arrives folded,
 * below it stays open — a short list is read at a glance, and folding it would lose a click
 * for nothing. What the user chose, for its part, is kept in the browser and always wins
 * over that default: it is a reading setting, not a datum.
 */
const PLI_KEY = "runtime-xray.plis";
const PLI_AUTO = 40;
let plis = {};
try { plis = JSON.parse(localStorage.getItem(PLI_KEY) || "{}"); } catch(e){ plis = {}; }
function savePlis(){
  try { localStorage.setItem(PLI_KEY, JSON.stringify(plis)); } catch(e){}
}
/** Open? The kept choice if there is one, otherwise the threshold. */
function pliOuvert(id, taille){
  return typeof plis[id] === "boolean" ? plis[id] : taille <= PLI_AUTO;
}
/**
 * The markup of a foldable section.
 *
 * @param id     stable identifier — it is what finds the kept choice again
 * @param titre  the title, already escaped
 * @param info   the title's tooltip, already escaped
 * @param compte what stays readable once folded ("422 classes")
 * @param corps  the content, already escaped
 * @param taille the number of entries, which decides the default folding
 */
function sectionPliable(id, titre, info, compte, corps, taille){
  const ouvert = pliOuvert(id, taille);
  return '<section class="pliable">'
    + '<h2 title="' + info + '">'
    + '<button type="button" class="plibtn" data-pli="' + id + '"'
    + ' aria-expanded="' + ouvert + '" aria-controls="pli-' + id + '">'
    + '<span class="pliic" aria-hidden="true">&#9656;</span>'
    + '<span>' + titre + '</span>'
    + '<span class="plicnt">' + compte + '</span>'
    + '</button></h2>'
    + '<p class="plicorps" id="pli-' + id + '"' + (ouvert ? '' : ' hidden') + '>'
    + corps + '</p></section>';
}
/** Wires the foldable titles of the fragment just written. */
function cablerPlis(){
  document.querySelectorAll(".plibtn").forEach(b => {
    b.onclick = () => {
      const corps = document.getElementById(b.getAttribute("aria-controls"));
      const ouvert = b.getAttribute("aria-expanded") !== "true";
      b.setAttribute("aria-expanded", String(ouvert));
      corps.hidden = !ouvert;
      plis[b.dataset.pli] = ouvert;
      savePlis();
    };
  });
}

/* ====================================================================================
 * SOURCE ANALYSIS, UNFOLDED
 *
 * Three different things can be missing, and an empty report gives them all the same face:
 * the bytecode (the wrong application was measured), the source (the right one was measured,
 * we do not know where its code is), or the class itself (it never ran). They are fixed in
 * three opposite ways, and one cannot choose without knowing which one one is holding.
 *
 *
 * Hence this explorer: the line actually run, the roots actually opened, then the tree of
 * EVERYTHING seen — measured, compiled, written — each class carrying the colour of what it
 * is missing. The search answers the question one really asks in front of a disappointing
 * report: "and that class there, did you find it, yes or no, and where?"
 * ==================================================================================== */

/**
 * The proposed roots, with what justifies them.
 *
 * <p>A diagnostic that stops at "sources are missing" leaves the reader in front of the same
 * question as before. The tool looked for the matching files around the project and counted
 * what each root would resolve: the line is copied, and the count says whether to believe it.
 * A root that resolves 27 classes out of 27 is not a guess; one that resolves 3 out of 447
 * designates another module, and reads as such.
 */
function pistesSources(){
  const pistes = ((D.diagnostic || {}).rapprochement || {}).pistes;
  if (!pistes) return "";
  if (!pistes.length){
    return '<h4>Racines proposées</h4><p class="cause">L\'outil a cherché les fichiers '
         + '<code>.java</code> correspondants autour du projet et du bytecode analysé : '
         + '<b>aucun ne porte les paquets attendus</b>. Les sources ne sont pas sur cette '
         + 'machine, ou hors des répertoires explorés — auquel cas il faut désigner le bon '
         + 'à la main.</p>';
  }
  return '<h4>Racines proposées</h4>'
    + '<p class="srcline">Cherchées autour du bytecode analysé et du répertoire de lancement, '
    + 'puis retenues sur preuve : seul compte un fichier dont le <b>paquet déclaré</b> produit '
    + 'exactement une clé manquante.</p>'
    + '<div class="pistes">' + pistes.map(p => {
        const part = p.surTotal ? Math.round(100 * p.resout / p.surTotal) : 0;
        const ton = part >= 80 ? "ok" : part >= 25 ? "moyen" : "faible";
        return '<div class="piste">'
          + '<div class="tete"><span class="score ' + ton + '">' + p.resout + ' / '
          + p.surTotal + '</span> <span class="quoi">classe(s) sans source que cette racine '
          + 'résoudrait</span></div>'
          + '<pre class="remede">SOURCE_DIRS="' + esc(p.racine) + '"</pre>'
          + (p.exemples && p.exemples.length
              ? '<div class="ex">par exemple ' + p.exemples.map(e =>
                  '<code>' + esc(e) + '</code>').join(", ") + '</div>' : '')
          + '</div>';
      }).join("") + '</div>'
    + '<p class="srcline">Plusieurs racines se séparent par <code>:</code> — un projet à '
    + 'plusieurs modules en demande souvent deux ou trois.</p>';
}

/**
 * The diagnostic's "sources" panel.
 *
 * <p>The file nests deliberately — {@code sources}, {@code bytecode},
 * {@code rapprochement} are three distinct inventories. Reading them through a single named
 * accessor avoids confusing them: looking for them one notch too high gave "0 roots", hence
 * a diagnostic that blamed the configuration when everything had been found.
 */
function diagSources(){ return (D.diagnostic || {}).sources || {}; }

/** A class's four states, and what each means for whoever has to fix things. */
const ETATS_SOURCE = {
  ok:      { lib: "mesurée, code affiché",   aide: "La classe a tourné et son fichier source a été trouvé : la vue de code la montre annotée." },
  sansSrc: { lib: "mesurée, code manquant",  aide: "La classe a tourné, mais aucun fichier source ne lui correspond. C'est ce qui donne « Source indisponible » — il manque une racine de sources." },
  inerte:  { lib: "compilée, jamais mesurée",aide: "La classe est dans le bytecode analysé mais aucune de ses instructions n'a été exécutée, ou elle a été écartée par un filtre." },
  orphelin:{ lib: "source seule",            aide: "Un fichier source existe, sans classe correspondante dans le bytecode ni dans la mesure : code non compilé, ou hors du périmètre analysé." }
};

/**
 * Everything the tool saw, gathered by class name.
 *
 * <p>Three inventories overlap here — the classes measured by JaCoCo, the classes present
 * in the bytecode, the indexed source files. It is their intersection, and above all their
 * differences, that explain an incomplete report.
 */
let MODELE_SOURCES = null;
function modeleSources(){
  if (MODELE_SOURCES) return MODELE_SOURCES;
  const d = D.diagnostic || {};
  const parNom = diagSources().parNom || {};
  const noeuds = {};                       // "com/example/app/Application" -> what we know of it
  const prendre = n => noeuds[n] || (noeuds[n] = { nom: n, mesuree: false, source: null,
                                                  chemin: null, racines: [] });

  //    1. what the measurement saw — all runs taken together: a class absent from one run
  //    but present in another remains a measured class.
  D.runs.forEach(run => Object.values(run.packages || {}).forEach(classes =>
    (classes || []).forEach(c => { const e = prendre(c.name); e.mesuree = true; e.attendu = c.source; })));

  // 2. what the bytecode contains, and in which root
  (d.bytecode || []).forEach(r => (r.classes || []).forEach(n => {
    prendre(n).racines.push(r.chemin);
  }));

  // 3. what the sources supplied. The key "package/File.java" designates the file, not the
  //    class: it is attached to the class name it most probably carries.
  Object.values(parNom).forEach(endroits => endroits.forEach(o => {
    const nom = o.cle.replace(/\.java$/, "");
    const e = prendre(nom);
    e.source = o.cle; e.chemin = o.chemin;
  }));

  // A measured class whose source file was found under ANOTHER key (inner class, file
  // carrying several types): attachment is done through the expected file.
  const cheminParCle = {};
  Object.values(parNom).forEach(l => l.forEach(o => { cheminParCle[o.cle] = o.chemin; }));
  Object.values(noeuds).forEach(e => {
    if (!e.chemin && e.attendu && cheminParCle[e.attendu]){
      e.source = e.attendu; e.chemin = cheminParCle[e.attendu];
    }
    e.etat = e.mesuree ? (e.chemin ? "ok" : "sansSrc")
                       : (e.racines.length ? "inerte" : "orphelin");
  });
  MODELE_SOURCES = { noeuds, liste: Object.values(noeuds).sort((a,b)=>a.nom<b.nom?-1:1) };
  return MODELE_SOURCES;
}

/** The count by state, the one read before opening anything at all. */
function comptesSources(){
  const c = { ok:0, sansSrc:0, inerte:0, orphelin:0 };
  modeleSources().liste.forEach(e => c[e.etat]++);
  return c;
}

/**
 * The tree package by package, each class coloured by what it is missing.
 *
 * <p>A package carries the colour of its worst case: that is what allows going straight down
 * to the problem in a tree of several hundred classes, without unfolding everything.
 * Entirely healthy packages stay green and folded.
 */
function arbreSources(filtre){
  const f = (filtre || "").toLowerCase();
  const paquets = {};
  modeleSources().liste.forEach(e => {
    if (f && e.nom.toLowerCase().indexOf(f) < 0) return;
    const i = e.nom.lastIndexOf("/");
    const pkg = i < 0 ? "(paquet par défaut)" : e.nom.slice(0, i);
    (paquets[pkg] = paquets[pkg] || []).push(e);
  });
  const noms = Object.keys(paquets).sort();
  if (!noms.length) return '<p class="cause">Aucune classe ne correspond.</p>';

  const pire = liste => liste.some(e => e.etat === "sansSrc") ? "sansSrc"
                      : liste.some(e => e.etat === "orphelin") ? "orphelin"
                      : liste.some(e => e.etat === "inerte") ? "inerte" : "ok";
  return '<div class="arbsrc">' + noms.map(pkg => {
    const liste = paquets[pkg].sort((a,b)=>a.nom<b.nom?-1:1);
    const mauvais = liste.filter(e => e.etat === "sansSrc").length;
    // Unfolded outright when the search is active, or when there is something to see.
    const ouvert = !!f || mauvais > 0;
    return '<div class="pkg">'
      + '<button type="button" class="pkgt e-' + pire(liste) + '" data-pkg="' + esc(pkg) + '"'
      + ' aria-expanded="' + ouvert + '">'
      + '<span class="ic" aria-hidden="true">' + (ouvert ? "▾" : "▸") + '</span>'
      + '<span class="nm">' + esc(dot(pkg)) + '</span>'
      + '<span class="cnt">' + liste.length + '</span>'
      + (mauvais ? '<span class="cnt ko">' + mauvais + ' sans source</span>' : '')
      + '</button>'
      + '<div class="cls"' + (ouvert ? '' : ' hidden') + '>'
      + liste.map(e => ligneClasseSource(e)).join("")
      + '</div></div>';
  }).join("") + '</div>';
}

function ligneClasseSource(e){
  const simple = e.nom.split("/").pop();
  const etat = ETATS_SOURCE[e.etat];
  return '<div class="cl e-' + e.etat + '" title="' + esc(etat.aide) + '">'
    + '<span class="pt" aria-hidden="true"></span>'
    + '<span class="nm">' + esc(simple) + '</span>'
    + '<span class="et">' + esc(etat.lib) + '</span>'
    + (e.chemin ? '<span class="ou" title="Fichier source lu par l\'outil">'
                  + esc(e.chemin) + '</span>' : '')
    + (!e.chemin && e.racines.length
        ? '<span class="ou" title="Racine de bytecode où la classe a été trouvée">'
          + esc(e.racines[0]) + '</span>' : '')
    + '</div>';
}

/** A search's verdict: found or not, and where — the question one really asks. */
function verdictRecherche(q){
  const f = (q || "").trim().toLowerCase();
  if (!f) return "";
  const trouves = modeleSources().liste.filter(e =>
    e.nom.toLowerCase().indexOf(f) >= 0 || e.nom.split("/").pop().toLowerCase() === f);
  if (!trouves.length){
    return '<p class="verdict ko"><b>« ' + esc(q) +' » n\'a été vue nulle part</b> — ni dans '
         + 'la mesure, ni dans le bytecode analysé, ni dans les sources indexées. La classe '
         + 'est hors du périmètre : elle n\'a pas été chargée, ou le classpath analysé ne la '
         + 'contient pas.</p>';
  }
  const e = trouves[0];
  const etat = ETATS_SOURCE[e.etat];
  return '<p class="verdict ' + (e.etat === "ok" ? "ok" : e.etat === "sansSrc" ? "ko" : "") + '">'
    + '<b>' + trouves.length + ' correspondance(s)</b> — ' + esc(dot(e.nom)) + ' : '
    + esc(etat.lib) + '.'
    + (e.chemin ? ' Source lue ici : <code>' + esc(e.chemin) + '</code>.' : '')
    + (e.racines.length ? ' Bytecode trouvé ici : <code>' + esc(e.racines[0]) + '</code>.' : '')
    + '</p>';
}

/**
 * What each setting REALLY commands — and the confusions that cost a measurement.
 *
 * <p>Four options restrict something, and they do not restrict the same thing: one the
 * capture of values, another the measurement of time, the third the instrumentation of
 * coverage, the fourth the display of the code. In front of an incomplete report, one almost
 * always suspects the wrong one — one widens a filter that had nothing to do with it,
 * re-runs, and gets the same report.
 *
 * <p>This table is therefore written the other way round from the documentation: it starts
 * from the symptom. The rows that carry an alert are those THIS run's configuration makes
 * suspect, not generalities.
 */
function piegesConfig(){
  const lanc = (D.diagnostic || {}).lancement || {};
  const ctx = R.context || {};
  const racine = lanc.methodeRacine || ctx.methodeRacine || "";
  const racines = (diagSources().racines || []).length;
  const sans = ((D.diagnostic || {}).rapprochement || {}).fichiersSansSource || 0;

  const lignes = [
    { opt: "--sources / SOURCE_DIRS",
      quoi: "l'affichage du code annoté, et lui seul",
      pas: "n'a aucun effet sur la mesure : couverture, temps et valeurs sont identiques sans lui",
      alerte: (!racines || sans)
        ? "C'est le seul réglage qui explique « Source indisponible ». La couverture reste "
          + "juste : ce sont les fichiers .java qui manquent, pas la mesure."
        : null },
    { opt: "--root / ROOT_METHOD",
      quoi: "la capture des valeurs de paramètres (Arthas), et le filtre de temps par défaut",
      pas: "ne restreint NI la couverture, NI les classes affichées, NI les sources",
      alerte: (racine && racine.indexOf("::") < 0)
        ? "« " + esc(racine) + " » ne désigne pas une méthode : le format attendu est "
          + "package.Class::method. Sans « :: », aucune valeur n'est capturée."
        : null },
    { opt: "--filter / CLASS_FILTER",
      quoi: "les classes échantillonnées par le profileur — la mesure du TEMPS",
      pas: "ne change rien à la couverture ni au code affiché",
      alerte: null },
    { opt: "--cover / COVER_INCLUDES",
      quoi: "les classes instrumentées par JaCoCo — la COUVERTURE",
      pas: "c'est lui, et pas --filter, qui vide un rapport de couverture s'il est trop étroit",
      alerte: null },
    { opt: "--classes / CLASSES_DIR",
      quoi: "le bytecode analysé : d'où viennent les classes du rapport",
      pas: "pointé sur un jar de dépendance, il noie le code du projet dans des milliers de classes",
      alerte: null },
    { opt: "--hide / HIDDEN_PACKAGES",
      quoi: "ce qui est replié À LA MESURE — le temps est reporté sur l'appelant, pas perdu",
      pas: "n'efface rien du disque : les rapports bruts des outils gardent tout",
      alerte: null }
  ];

  return '<h4>Ce que chaque réglage commande</h4>'
    + '<p class="srcline">Quatre options restreignent quelque chose de <b>différent</b>. '
    + 'Élargir la mauvaise redonne exactement le même rapport.</p>'
    + '<div class="pieges">' + lignes.map(l =>
        '<div class="piege' + (l.alerte ? ' alerte' : '') + '">'
        + '<code>' + esc(l.opt) + '</code>'
        + '<span class="agit">agit sur ' + l.quoi + '</span>'
        + '<span class="nagit">' + l.pas + '</span>'
        + (l.alerte ? '<span class="ko avert">⚠ ' + l.alerte + '</span>' : '')
        + '</div>').join("") + '</div>';
}

/**
 * What the source analysis did, said in the overview.
 *
 * <p>Displaying the annotated code is the part of the report that fails most silently: it
 * depends on a path given by hand, which is checked nowhere, and its failure shows only by
 * opening a class at random. The summary is therefore put where one looks first, and it is
 * written to be read even when all is well — "447 out of 447" is information, not noise.
 *
 */
function sourcesBlock(){
  const d = D.diagnostic;
  if (!d) return "";
  const r = d.rapprochement || {}, src = diagSources(), racines = src.racines || [];
  const total = r.fichiersMesures || 0, avec = r.fichiersAvecSource || 0;
  const sans = r.fichiersSansSource || 0;
  const pct = total ? (100 * avec / total) : 0;
  const c = comptesSources();
  const lanc = d.lancement || {};

  let corps = '<p class="srcline">' +
    (total
      ? '<b class="' + (sans ? 'ko' : 'ok') + '">' + avec + ' sur ' + total + '</b> classe(s) '
        + 'mesurée(s) ont leur code source dans cette page (' + pct.toFixed(0) + ' %).'
      : 'Aucune classe mesurée : il n\'y a rien à rapprocher.') + '</p>';

  // 1. the line actually run — the one believed to have been launched is not always that
  //    one. On reassembly there is no launch: the run's context, for its part, kept it, and
  //    it is the same one.
  const commande = lanc.commande || (R.context || {}).commande || "";
  if (commande){
    corps += '<h4>Ligne exécutée</h4><pre class="remede">' + esc(commande) + '</pre>';
  }

  // 2. the roots actually opened, bytecode then sources
  corps += '<h4>Bytecode analysé</h4>';
  const bc = d.bytecode || [];
  corps += bc.length
    ? '<ul class="racines">' + bc.map(x =>
        '<li><code>' + esc(x.chemin) + '</code> <span class="abs">(' + esc(x.type) + ')</span>'
        + '<br><span class="' + (x.existe && x.nombre ? 'ok' : 'ko') + '">'
        + (x.existe ? '✓ ' + x.nombre + ' classe(s)' + (x.tronque ? ' (liste tronquée)' : '')
                    : '✗ ' + esc(x.motif || 'introuvable')) + '</span></li>').join("") + '</ul>'
    : '<p class="cause">Le bytecode analysé n\'est pas connu de ce rapport — il l\'est quand '
      + 'la mesure est lancée par l\'outil, ou quand <code>--classes</code> est donné à '
      + 'la réassemblée.</p>';

  corps += '<h4>Sources indexées</h4>';
  if (racines.length){
    corps += '<ul class="racines">' + racines.map(x =>
      '<li><code>' + esc(x.demandee) + '</code>'
      + (x.absolue && x.absolue !== x.demandee
          ? ' <span class="abs">→ ' + esc(x.absolue) + '</span>' : '')
      + '<br><span class="' + (x.existe ? 'ok' : 'ko') + '">'
      + (x.existe ? '✓ ' + (x.fichiers || 0) + ' fichier(s) .java'
                  : '✗ ' + esc(x.motif || 'introuvable')) + '</span></li>').join("") + '</ul>';
    corps += '<p class="srcline">' + (src.fichiers || 0) + ' fichier(s) <code>.java</code> '
          + 'indexé(s) au total'
          + (src.tronque ? ' <span class="ko">— parcours tronqué, l\'index est incomplet</span>' : '')
          + '. Le niveau de la racine importe peu : l\'outil lit le paquet déclaré par chaque '
          + 'fichier, pas son chemin.</p>';
  } else {
    corps += '<p class="cause">Aucun répertoire de sources n\'a été passé à l\'outil : '
          + 'la mesure n\'en a pas besoin, l\'affichage du code annoté si. '
          + 'Renseigner <code>SOURCE_DIRS</code> dans la configuration, ou '
          + '<code>--sources</code> en ligne de commande.</p>';
  }
  if (r.conclusion && racines.length) corps += '<p class="cause">' + esc(r.conclusion) + '</p>';
  corps += pistesSources();

  // 3. what each setting commands — written from the symptom, not from the docs
  corps += piegesConfig();

  // 4. the tree and its search
  corps += '<h4>Où est chaque classe</h4>'
        // Files read with no measured class are not in the tree: the page carries only what
        // it can show. Their number, for its part, says whether there is matter to search.
        + (r.sourcesSansClasse
            ? '<p class="srcline">' + r.sourcesSansClasse + ' fichier(s) source lu(s) ne '
              + 'correspondent à aucune classe mesurée — code non compilé, hors périmètre, ou '
              + 'racine trop large. Ils ne sont pas embarqués ici ; <code>diagnostic.json</code> '
              + 'les recense.</p>'
            : '')
        + '<p class="srcline">' + Object.entries(ETATS_SOURCE).map(([k, v]) =>
            '<span class="lgd e-' + k + '" title="' + esc(v.aide) + '"><span class="pt"></span>'
            + esc(v.lib) + ' <b>' + c[k] + '</b></span>').join("") + '</p>'
        + '<div class="srcq"><input id="srcsearch" type="search" autocomplete="off"'
        + ' placeholder="Chercher une classe — dit si on l\'a trouvée, et où"'
        + ' aria-label="Chercher une classe dans l\'inventaire des sources"></div>'
        + '<div id="srcverdict"></div>'
        + '<div id="srctree">' + arbreSources("") + '</div>';

  corps += '<p class="apres">Le détail — configuration du lancement, exécutions, '
        + 'rapprochement classe par classe — est dans <code>diagnostic.json</code>, '
        + 'à côté de cette page. C\'est le fichier à joindre pour faire analyser un '
        + 'rapport qui ne montre pas ce qu\'on attendait.</p>';

  return sectionPliable("sources", "Analyse des sources",
    "D'où vient le code affiché à côté de la couverture, ce qui manque, et où chaque classe "
    + "a été trouvée. Cliquer le titre replie la section.",
    total ? avec + " / " + total : (src.fichiers || 0) + " fichiers",
    '<div class="constat srcrecap">' + corps + '</div>',
    // The default folding follows size: the scale is diverted so that it follows the anomaly
    // instead. Nothing missing → folded; something missing → open, because it is then the
    // first thing to read.
    sans || !racines.length ? 0 : 999);
}

/** Wires the search and the unfolding of the tree of the fragment just written. */
function cablerExplorateurSources(){
  const q = document.getElementById("srcsearch");
  if (!q) return;
  const tree = document.getElementById("srctree");
  const verdict = document.getElementById("srcverdict");
  const cablerPaquets = () => tree.querySelectorAll(".pkgt").forEach(b => b.onclick = () => {
    const corps = b.nextElementSibling;
    const ouvert = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", String(ouvert));
    corps.hidden = !ouvert;
    b.querySelector(".ic").textContent = ouvert ? "▾" : "▸";
  });
  cablerPaquets();
  let t = null;
  q.oninput = () => {
    // The filter rebuilds the whole tree: a typing pause is awaited so as not to redo it on
    // every keystroke over an inventory of several hundred classes.
    clearTimeout(t);
    t = setTimeout(() => {
      tree.innerHTML = arbreSources(q.value);
      verdict.innerHTML = verdictRecherche(q.value);
      cablerPaquets();
    }, 120);
  };
}

    // "in this report" required knowing what a report is. It is the number of runs in the

    (D.runs.length > 1 ? ' <span class="pill" title="Cette page en réunit plusieurs ; '

       "Nombre de relevés de pile pris par async-profiler pendant l'exécution — un toutes "
       + "les " + (R.intervalMs || 1) + " ms. C'est la base de tous les pourcentages de temps.")+
     card("c4", ICON.valeurs, Object.values(R.values || {}).reduce((a,v)=>a+v.length,0),
       "appels avec leurs valeurs",
       "Nombre d'invocations dont Arthas a relevé les paramètres et le retour. Quelques-unes "
       + "seulement : les capturer coûte cher, elles servent d'exemples, pas de statistique.")+
   '</div>'+
   '<div class="bar" title="La même couverture en barre : la part verte est ce qui a '

   '<h2 title="Les méthodes sous lesquelles le plus de temps a été passé, appels compris">'
   + 'Les plus coûteuses</h2><p>'+hot.map(h=>
      '<span class="chip hot" data-f="'+esc(h.frame)+'" title="Ouvrir '
      + esc(dot(h.frame)) + '">'+esc(h.cls.split("/").pop()+"."+h.name)+'</span>').join("")+'</p>'+
   (observees.length
      ? '<h2 title="Méthodes dont Arthas a relevé les paramètres et le retour de quelques '
        + 'invocations">Valeurs capturées</h2><p>'+observees.map(f =>

   '</div>';
  // The chips are clickable: the overview serves as a starting point, not as a shop window.
  document.querySelectorAll("svg.flame g.known").forEach(g => {

  });
  document.querySelectorAll(".flame .fl.known").forEach(g => {

/**
 * The run's identity, as a dense band under its name.
 *
 * <p>It used to live in the page's body, as a table: a report is read, it is not filled in,
 * and a form laid in the middle of a reading is neither in its place nor easy to find again.
 * Everything editable therefore fits on one line, against the displayed name, and the
 * actions move up into the top bar with the other buttons.
 *
 * <p>What is not editable takes no room: the launch's name and the full identifier live in
 * the tooltip of the field they explain.
 */
function renderIdentity(){
  renderAnnotActs();
  const bar = document.getElementById("ident");
  if (!bar) return;
  // The card describes the whole run: it is displayed with its overview, not over the
  // reading of a method.
  if (selected){ bar.hidden = true; return; }
  bar.hidden = false;

  const a = annotationOf(R);
  const tags = Object.entries(a.etiquettes || {});
  const origine = R.nomOrigine
    ? "Nom au lancement : " + R.nomOrigine
    : "Aucun nom donné au lancement (--name)";
  const etat = peutEnregistrer
    ? (annotationModifiee(R) ? "non enregistré" : "à jour")
    : "gardé dans ce navigateur";

  bar.innerHTML =
    '<span class="mark" title="Ce que vous ajoutez à cette exécution : un nom, une ' +
    'description, des étiquettes. Rien ici ne touche aux mesures.">'
    + TOOLMARK.fiche + 'fiche</span>' +
    (R.uuid ? '<span class="uid" title="Identifiant permanent, il ne change jamais : '
              + esc(R.uuid) + '">' + esc(shortId(R)) + '</span>' : '') +
    '<input class="inom" id="identNom" type="text" value="' + esc(a.nom) +
      '" placeholder="' + esc(R.nomOrigine || shortId(R)) + '" title="' + esc(origine) +
      ' · Identifiant : ' + esc(R.uuid || "—") + '" aria-label="Nom de cette exécution. '
      + esc(origine) + '">' +
    (a.nom ? '<button class="mini" id="identReset" title="Revenir au nom du lancement"'
             + ' aria-label="Revenir au nom du lancement">↺</button>' : '') +
    '<span class="sep"></span>' +
    '<input class="idesc" id="identDesc" type="text" value="' + esc(a.description) +
      '" placeholder="décrire cette exécution — ce qu\'on cherchait, ce qu\'on a vu"' +
      ' title="Description libre, gardée avec l\'exécution"' +
      ' aria-label="Description de cette exécution">' +
    '<span class="sep"></span>' +
    tags.map(([k, v], i) =>
      '<span class="tag" title="Étiquette"><b>' + esc(k) + '</b>' +
      (v ? ' = ' + esc(String(v)) : '') +
      '<button data-tag="' + i + '" title="Retirer" aria-label="Retirer l\'étiquette '
      + esc(k) + '">✕</button></span>').join("") +
    '<button class="mini" id="identTagAdd" title="Une clé, et un texte si besoin">+ étiquette</button>' +
    '<span class="etat' + (peutEnregistrer && annotationModifiee(R) ? " modifie" : "") +
      '" id="identEtat">' + esc(etat) + '</span>';

  const nom = document.getElementById("identNom");
  nom.oninput = () => {
    annotationPatch(R, "nom", nom.value.trim() || null);
    refreshRunLabels();
    majEtat();
  };
  const reset = document.getElementById("identReset");
  if (reset) reset.onclick = () => {
    // Empty, and not "absent": an erased key would let the recorded name come back, and the
    // return to the launch's name would not survive a regeneration.
    annotationPatch(R, "nom", "");
    refreshRunLabels();
    renderIdentity();
  };
  const desc = document.getElementById("identDesc");
  desc.oninput = () => { annotationPatch(R, "description", desc.value.trim()); majEtat(); };

  bar.querySelectorAll(".tag button").forEach(b => b.onclick = () => {
    const restantes = {};
    tags.forEach(([k, v], i) => { if (i !== +b.dataset.tag) restantes[k] = v; });
    annotationPatch(R, "etiquettes", restantes);
    renderIdentity();
  });
  document.getElementById("identTagAdd").onclick = e => {
    const zone = document.createElement("span");
    zone.className = "tagedit";
    zone.innerHTML = '<input class="k" type="text" placeholder="étiquette" '
                   + 'aria-label="Clé de la nouvelle étiquette">' +
                     '<input class="v" type="text" placeholder="texte (facultatif)" '
                   + 'aria-label="Texte de la nouvelle étiquette, facultatif">';
    e.currentTarget.replaceWith(zone);
    const k = zone.querySelector(".k"), v = zone.querySelector(".v");
    const poser = () => {
      const cle = k.value.trim();
      if (!cle){ renderIdentity(); return; }
      const suite = Object.fromEntries(tags);
      suite[cle] = v.value.trim();
      annotationPatch(R, "etiquettes", suite);
      renderIdentity();
    };
    // Enter confirms, Escape abandons, and leaving the field counts as confirming: the three
    // gestures one tries in front of two small fields with no button.
    [k, v].forEach(champ => {
      champ.onkeydown = ev => {
        if (ev.key === "Enter"){ ev.preventDefault(); poser(); }
        if (ev.key === "Escape"){ ev.preventDefault(); renderIdentity(); }
      };
      champ.onblur = () => setTimeout(() => {
        if (!zone.contains(document.activeElement)) poser();
      }, 120);
    });
    k.focus();
  };

  function majEtat(){
    const e = document.getElementById("identEtat");
    if (!e) return;
    const modifie = peutEnregistrer && annotationModifiee(R);
    e.textContent = peutEnregistrer ? (modifie ? "non enregistré" : "à jour")
                                    : "gardé dans ce navigateur";
    e.classList.toggle("modifie", modifie);
    renderAnnotActs();
  }
}

/**
 * The actions on the annotations, in the top bar.
 *
 * <p>Save, export, import, see the JSON: these are gestures, not content. They therefore
 * join the application's buttons rather than slipping into the report, and "Save" appears
 * only where it means something — when the page is served by the tool.
 *
 */
function renderAnnotActs(){
  const box = document.getElementById("annotbar");
  if (!box) return;
  const modifie = peutEnregistrer && annotationModifiee(R);
  box.innerHTML =
    '<span class="toolgrp fichegrp"><span class="mark" title="La fiche de cette exécution : le nom, ' +
    'la description et les étiquettes que VOUS lui donnez — le bandeau juste en dessous. ' +
    'Aucune mesure n\'en est modifiée.">' + TOOLMARK.fiche + 'fiche</span>' +
    (peutEnregistrer && serveurGarde
      ? '<span class="mark" title="Ce serveur est gardé par un secret partagé : seules les ' +
        'personnes qui l\'ont peuvent lire et annoter" aria-label="Serveur gardé par un ' +
        'secret partagé">🔒</span>'
      : '') +
    (peutEnregistrer
      ? '<a href="#" id="annotSave"' + (modifie ? ' style="font-weight:700"' : '') +
        ' title="Écrire la fiche de cette exécution à côté de ses résultats">' +
        (modifie ? "enregistrer •" : "enregistrer") + '</a><span class="sep">·</span>'
      : '') +
    '<a href="#" id="annotExport" title="Télécharger les fiches de toutes les exécutions de ce rapport, en un fichier">exporter</a>' +
    '<span class="sep">·</span>' +
    '<a href="#" id="annotImport" title="Reprendre un fichier de fiches, entier ou pour une seule exécution">importer</a>' +
    '<span class="sep">·</span>' +
    '<a href="#" id="annotDump" title="Voir ce qui serait écrit">JSON</a>' +
    '<input type="file" id="annotFile" accept=".json,application/json" hidden></span>';

  const save = document.getElementById("annotSave");
  if (save) save.onclick = e => { e.preventDefault(); enregistrerAnnotations(save); };
  document.getElementById("annotExport").onclick = e => { e.preventDefault(); exporterAnnotations(); };
  const fichier = document.getElementById("annotFile");
  document.getElementById("annotImport").onclick = e => { e.preventDefault(); fichier.click(); };
  fichier.onchange = () => {
    const f = fichier.files && fichier.files[0];
    if (!f) return;
    f.text().then(t => {
      const n = importerAnnotations(t);
      renderIdentity();
      refreshRunLabels();
      mode === "tree" ? renderTree() : renderClasses();
      drawHome();
      montrer(n + " exécution" + (n > 1 ? "s" : "") + " reprise" + (n > 1 ? "s" : "")
              + " de « " + f.name + " »"
              + (peutEnregistrer ? " — « enregistrer » les posera sur le serveur." : "."),
              "Fiches reprises");
    }).catch(e => montrer(e.message, "Import refusé"));
    fichier.value = "";
  };
  document.getElementById("annotDump").onclick = e => {
    e.preventDefault();
    // A report where nobody has filled in a card yet gave "{}", alone, in a corner. That is
    // exact, and perfectly useless: the panel now says what it expects and what that file
    // is for.
    const fiches = annotationsFile();
    const combien = Object.keys(fiches).length;
    const texte = JSON.stringify(fiches, null, 2);
    montrer(texte,
      combien
        ? "Fiches de ce rapport — " + combien + " exécution" + (combien > 1 ? "s" : "")
        : "Fiches de ce rapport — aucune pour l'instant",
      texte,
      combien ? null
        : "Aucune exécution de ce rapport n'a encore de fiche. Dès qu'on donne à l'une "
        + "d'elles un nom, une description, une étiquette ou un élagage, elle apparaît "
        + "ici. C'est ce fichier que « exporter » télécharge et que « importer » reprend, "
        + "et c'est aussi ce que le serveur écrit à côté des mesures.");
  };
}

/** Displays a text over the page — it serves for copying, not for reading in the flow. */
/**
 * The corner panel: a title, a body, and what is needed to close it again.
 *
 * @param titre    what is being looked at — without it, the panel could open on two
 *                 characters with nothing saying what they were
 * @param aCopier  the text the "copy" button puts in the clipboard; this panel serves to
 *                 take JSON up again elsewhere, not to read it
 * @param avant    a sentence above, when the text alone does not suffice
 */
function montrer(texte, titre, aCopier, avant){
  const out = document.getElementById("annotout");
  if (!out) return;
  out.hidden = false;
  out.innerHTML = "";

  const tete = document.createElement("div");
  tete.className = "tete";
  const t = document.createElement("span");
  t.className = "titre";
  t.textContent = titre || "Runtime X-Ray";
  tete.appendChild(t);

  if (aCopier) {
    const copier = document.createElement("button");
    copier.className = "acte";
    copier.textContent = "copier";
    copier.onclick = () => {
      // With no clipboard — page opened as a file, permission refused — the text is
      // selected: the user's Ctrl-C does the rest.
      const dit = m => { copier.textContent = m; setTimeout(() => copier.textContent = "copier", 1800); };
      const corps = out.querySelector(".json");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(aCopier).then(() => dit("copié ✓"), () => selectionner(corps, dit));
      } else selectionner(corps, dit);
    };
    tete.appendChild(copier);
  }

  const fermer = document.createElement("button");
  fermer.className = "acte";
  fermer.textContent = "✕";
  fermer.title = "Fermer";
  fermer.setAttribute("aria-label", "Fermer");
  fermer.onclick = () => { out.hidden = true; };
  tete.appendChild(fermer);
  out.appendChild(tete);

  const corps = document.createElement("div");
  corps.className = "corps";
  if (avant) {
    const p = document.createElement("div");
    p.className = "vide";
    p.textContent = avant;
    corps.appendChild(p);
  }
  const json = document.createElement("span");
  json.className = "json";
  json.textContent = texte;
  corps.appendChild(json);
  out.appendChild(corps);
}

/** Selects the displayed text, for want of an accessible clipboard. */
function selectionner(noeud, dit){
  if (!noeud) { dit("copie refusée"); return; }
  const plage = document.createRange();
  plage.selectNodeContents(noeud);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(plage);
  dit("sélectionné — Ctrl-C");
}

/** The annotations of every run in the report, in the shape the tool expects. */
function annotationsFile(){
  const out = {};
  D.runs.forEach(run => {
    const a = annotationOf(run);
    const tags = a.etiquettes && Object.keys(a.etiquettes).length ? a.etiquettes : null;
    const e = elagageActif(run) ? elagageOf(run) : null;
    if (!a.nom && !a.description && !tags && !e) return;
    // A name alone keeps the short shape, the one that was already circulating.
    out[run.uuid] = (!a.description && !tags && !e)
      ? a.nom
      : {nom: a.nom || undefined, description: a.description || undefined,
         etiquettes: tags || undefined, elagage: e || undefined};
  });
  return out;
}

/** Back to the overview: the current method is deselected so as to set off again from the
 *  run's context. */
function goHome(){
  selected = null; callIndex = null; ctxIndex = 0;

  if (c){ c.innerHTML = ""; c.style.display = "none"; }
  document.querySelectorAll(".node.sel").forEach(n => n.classList.remove("sel"));
  document.getElementById("code").scrollTop = 0;
  drawHome();
}

/**
 * Unfolds the whole tree, with a guard rail: on a real application, opening everything may
 * represent tens of thousands of nodes and freeze the page. We stop at a budget and say so,
 * rather than letting one believe everything is displayed.
 */
const EXPAND_BUDGET = 1500;

function expandAll(){
  let count = 0, passes = 0;
  while (passes++ < 40){
    const closed = [...document.querySelectorAll("#list .node")].filter(n => {
      const tw = n.querySelector(".tw");
      if (!tw || tw.textContent !== "▸") return false;
      // Opening ANOTHER run's root selects it and rebuilds the tree: mass unfolding would
      // fight against itself. We stay in the run being looked at; the others open with a
      // deliberate click.
      return !n.classList.contains("runroot");
    });
    if (!closed.length) break;
    for (const n of closed){
      if (count >= EXPAND_BUDGET) break;
      n.click();
      count = document.querySelectorAll("#list .node").length;
    }
    if (count >= EXPAND_BUDGET) break;
  }
  return count;
}

function collapseAll(){
  mode === "cls" ? renderClasses() : renderTree();
  reselect();
}

document.getElementById("expandbtn").onclick = e => {

  if (expanded){
    collapseAll();

    setOption("expandbtn", {icon: OPT.deplier, label: "tout déplier", pressed: false,
                            title: "Ouvrir toutes les branches d'un coup"});
    return;
  }
  const n = expandAll();
  b.dataset.state = "open";
  setOption("expandbtn", {icon: OPT.replier, label: "tout replier", pressed: true,
                          title: "Tout est ouvert — cliquer pour tout refermer"});
  const head = document.querySelector("#list .grouphead");
  if (n >= EXPAND_BUDGET && head){
    head.textContent = "affichage arrêté à " + n + " lignes — replier, puis ouvrir la branche voulue";
  }
};

/**

function changerOnglet(rendu){

function reselect(){

(function splitters(){
  const root = document.documentElement;
  const nav = document.getElementById("nav");
  const vs = document.getElementById("vsplit"), hs = document.getElementById("hsplit");
  let navPrev = 330, valPrev = 190;

  const startDrag = (el, onMove) => {
    el.addEventListener("mousedown", e => {
      e.preventDefault(); el.classList.add("dragging");
      const move = ev => onMove(ev);
      const up = () => { el.classList.remove("dragging");
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up); };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
  };
  startDrag(vs, ev => {
    const w = Math.max(0, Math.min(ev.clientX, window.innerWidth - 200));
    root.style.setProperty("--navw", w + "px");
    if (w > 40) navPrev = w;
  });
  startDrag(hs, ev => {
    const box = document.getElementById("values").getBoundingClientRect();
    const h = Math.max(0, Math.min(box.bottom - ev.clientY, window.innerHeight - 220));
    root.style.setProperty("--valh", h + "px");
    if (h > 30) valPrev = h;
  });
  const toggleNav = () => {
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--navw")) || 330;
    const open = cur <= 40;
    root.style.setProperty("--navw", open ? navPrev + "px" : "0px");
    document.getElementById("vtoggle").textContent = open ? "‹" : "›";
  };
  const toggleValues = () => {
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--valh")) || 190;
    const open = cur <= 30;
    root.style.setProperty("--valh", open ? valPrev + "px" : "0px");
    document.getElementById("htoggle").textContent = open ? "⌄" : "⌃";
  };
  vs.ondblclick = toggleNav;
  hs.ondblclick = toggleValues;
  document.getElementById("vtoggle").onclick = e => { e.stopPropagation(); toggleNav(); };
  document.getElementById("htoggle").onclick = e => { e.stopPropagation(); toggleValues(); };
})();

// The settings' icons are laid down here rather than in the template: their drawing changes
// with the button's state, and there is only one place that decides it.
setOption("unitbtn",  {icon: OPT.pct});
setOption("pkgbtn",   {icon: OPT.pkgOn});
setOption("valbtn",   {icon: OPT.champs});

// The entry view follows the left-hand tab: opening on the second would read as an odd state

(async () => {

})();

    "⚠ C'est le seul réglage qui explique « Source indisponible ». La couverture reste juste : ce sont les fichiers .java qui manquent, pas la mesure.": "⚠ It is the only setting that explains “Source unavailable”. The coverage stays correct: it is the .java files that are missing, not the measurement.",
  };

  /*
   * The composed sentences, which the exact dictionary cannot reach: they carry a class
   * name, a count, a percentage. They are recognised by their shape and the variable part
   * is kept as it is — except the numbers, which change convention on crossing the
   * Channel: “1 234” and “12,3 %” become “1,234” and “12.3%”.
   */
  const nb = s => s.replace(/[\s\u00a0\u202f]/g, "").replace(",", ".")
                   .replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const dec = s => s.replace(",", ".");

  const MOTIFS = [
    [/^Paquet (.+) — cliquer déplie ce qu'il contient$/,
      (m) => "Package " + m[1] + " — clicking unfolds what it holds"],
    [/^(.+) — cliquer ouvre cette méthode et son code$/,
      (m) => m[1] + " — clicking opens this method and its code"],
    [/^(.+) — code hors des classes analysées : ni source, ni couverture$/,
      (m) => m[1] + " — code outside the analysed classes: no source, no coverage"],
    [/^(.+?)\s+—\s+(.+?) au total, dont (.+) % en propre$/,
      (m) => m[1] + "  —  " + m[2] + " total, of which " + dec(m[3]) + "% self"],
    [/^(.+)\(\) — a tourné pendant cette exécution\. Cliquer affiche son code, ligne par ligne\.$/,
      (m) => m[1] + "() — ran during this run. Clicking shows its code, line by line."],
    [/^(.+)\(\) — jamais exécutée\. Cliquer affiche son code, ligne par ligne\.$/,
      (m) => m[1] + "() — never executed. Clicking shows its code, line by line."],
    [/^Voir (.+) dans « (.+) »$/, (m) => "See " + m[1] + " in \u201c" + m[2] + "\u201d"],
    [/^— (\d+) chemins? d'appel$/,
      (m) => "— " + m[1] + " call path" + (m[1] === "1" ? "" : "s")],
    [/^Afficher le code de (.+)$/, (m) => "Show the code of " + m[1]],
    [/^Identifiant permanent : (.+)$/, (m) => "Permanent id: " + m[1]],
    [/^Nom au lancement : (.+) · Identifiant : (.+)$/,
      (m) => "Name at launch: " + m[1] + " · Id: " + m[2]],
    [/^Nom au lancement : (.+)$/, (m) => "Name at launch: " + m[1]],
    [/^Nom de cette exécution\. (.+)$/, (m) => "Name of this run. " + (traduire(m[1]) || m[1])],
    [/^([\d\s\u00a0\u202f,.]+) méthodes?$/, (m) => nb(m[1]) + " methods"],
    [/^([\d\s\u00a0\u202f,.]+) mesures$/, (m) => nb(m[1]) + " samples"],
    [/^([\d\s\u00a0\u202f,.]+) exécutions?$/, (m) => nb(m[1]) + " runs"],
    [/^([\d,.]+) % du temps$/, (m) => dec(m[1]) + "% of time"],
    [/^(\d+) sur (\d+)$/, (m) => m[1] + " of " + m[2]],
    [/^\s*classe\(s\) mesurée\(s\) ont leur code source dans cette page \((\d+) %\)\.$/,
      (m) => " measured class(es) have their source code in this page (" + m[1] + "%)."],
    [/^(\d+) classe\(s\) mesurée\(s\) sur (\d+) n'ont pas leur source\.$/,
      (m) => m[1] + " measured class(es) out of " + m[2] + " have no source."],
    [/^✓ (\d+) classe\(s\)$/, (m) => "\u2713 " + m[1] + " class(es)"],
    [/^(\d+) sans source$/, (m) => m[1] + " without source"],
    [/^… (\d+) ligne\(s\) au-dessus, hors de cette méthode$/,
      (m) => "… " + m[1] + " line(s) above, outside this method"],
    [/^… (\d+) ligne\(s\) en dessous, hors de cette méthode$/,
      (m) => "… " + m[1] + " line(s) below, outside this method"],
    [/^… (\d+) ligne\(s\) jamais exécutée\(s\)$/,
      (m) => "… " + m[1] + " line(s) never executed"],
    [/^▾ valeurs des paramètres \((\d+)\)$/, (m) => "▾ argument values (" + m[1] + ")"],
    [/^✓ (\d+) fichier\(s\) \.java$/, (m) => "\u2713 " + m[1] + " .java file(s)"],
    [/^(\d+) fichier\(s\)$/, (m) => m[1] + " file(s)"],
    [/^terminée normalement \(code (\d+)\)$/, (m) => "ended normally (code " + m[1] + ")"],
    [/^(.+) — (\d+) cœurs?$/, (m) => m[1] + " — " + m[2] + (m[2] === "1" ? " core" : " cores")],
    [/^Ouvrir (.+) dans la liste du code$/, (m) => "Open " + m[1] + " in the code list"],
    [/^Ouvrir (.+) et ses appels relevés$/, (m) => "Open " + m[1] + " and its recorded calls"],
    [/^→ Ouvrir (.+) et voir ses valeurs$/, (m) => "→ Open " + m[1] + " and see its values"],
    [/^(\d+) appel\(s\) capturé\(s\) — voir les valeurs$/,
      (m) => m[1] + " captured call(s) — see the values"],
    [/^Les (\d+) appels observés de$/, (m) => "The " + m[1] + " observed calls of"],
    // Bounded to a qualified name: “Ouvrir” also begins whole sentences.
    [/^Ouvrir ([\w.$<>]+)$/, (m) => "Open " + m[1]],
    [/^appelle (.+) ([\d,.]+) ms$/, (m) => "calls " + m[1] + " " + dec(m[2]) + " ms"],
    [/^appel (\d+)$/, (m) => "call " + m[1]],
    [/^(\d+) appels?$/, (m) => m[1] + (m[1] === "1" ? " call" : " calls")],
    [/^\((\d+) appels?\)$/, (m) => "(" + m[1] + (m[1] === "1" ? " call)" : " calls)")],
    [/^« (.+) » ne désigne pas une méthode : le format attendu est package\.Class::method\. Sans « :: », aucune valeur n'est capturée\.$/,
      (m) => "\u201c" + m[1] + "\u201d does not name a method: the expected format is "
           + "package.Class::method. Without \u201c::\u201d, no value is captured."],
    [/^affichage arrêté à ([\d\s\u00a0\u202f,.]+) lignes — replier, puis ouvrir la branche voulue$/,
      (m) => "display stopped at " + nb(m[1]) + " lines — fold, then open the branch you want"],
    [/^← Vue d'ensemble(.*)$/, (m) => "← Overview" + m[1]],
    [/^([\d\s\u00a0\u202f,.]+) classes?$/,
      (m) => nb(m[1]) + (m[1].trim() === "1" ? " class" : " classes")],
    [/^([\d,.]+) % du code exécuté · ([\d\s\u00a0\u202f,.]+) méthodes$/,
      (m) => dec(m[1]) + "% of the executed code · " + nb(m[2]) + " methods"],
    [/^Identifiant permanent, il ne change jamais : (.+)$/,
      (m) => "Permanent id, it never changes: " + m[1]],
    [/^VALEURS REÇUES PAR (.+)$/, (m) => "VALUES RECEIVED BY " + m[1]],
    [/^(.+) — ([\d,.]+) % de ses instructions ont tourné\. Cliquer déplie ses méthodes et ouvre la classe\.$/,
      (m) => m[1] + " — " + dec(m[2]) + "% of its instructions ran. Clicking unfolds its methods and opens the class."],
    [/^Les relevés de temps ont été pris pendant que l'inspection des valeurs était active : ([\d,.]+) % d'entre eux tombaient dans son instrumentation\..*$/,
      (m) => "The time samples were taken while value inspection was active: " + dec(m[1])
           + "% of them fell inside its instrumentation. They were attributed to the "
           + "application method that triggered them, which restores the shape of the tree. "
           + "Caveat: the cost shown for the observed method remains overestimated."],
    // The most general one last: “38,3 % Something” must be tried only once the sentences
    // that begin with a percentage have been set aside.
    [/^([\d,.]+) % (.+)$/, (m) => dec(m[1]) + "% " + m[2]]
  ];

  /** The original French of every already-translated node — to give it back intact. */
  const ORIGINE = new WeakMap();

  function traduire(fr) {
    const cle = fr.trim();
    if (!cle) return null;
    const exact = DICO[cle];
    if (exact !== undefined) return fr.replace(cle, exact);
    for (const [motif, rendre] of MOTIFS) {
      const m = cle.match(motif);
      if (m) return fr.replace(cle, rendre(m));
    }
    return null;
  }

  /*
   * The displayed source code is not translated: it is the observed application's code. It
   * is also, by far, the bulk of the DOM — setting it aside keeps the translation instant
   * on a report of several hundred classes.
   */
  const HORS = new Set(["SCRIPT", "STYLE", "TEXTAREA"]);
  const ecarte = el => HORS.has(el.nodeName.toUpperCase())
      // Only the code CELL is set aside, not the table: the same rows carry the folds
      // (“… 50 line(s) above”) and the call annotations, which are the tool's own text.
      //
      || (el.nodeName === "TD" && el.classList.contains("c"))
      // Those two carry nothing but a package or class name. Translating them would make a
      // class named “Comment” a “How” — false text, right where one is searching.
      || el.classList.contains("nm") || el.classList.contains("lbl");

  const ATTRS = ["title", "placeholder", "aria-label"];

  function parcourir(racine, vers) {
    const pile = [racine];
    while (pile.length) {
      const n = pile.pop();
      if (n.nodeType === 1) {
        if (ecarte(n)) continue;
        for (const a of ATTRS) {
          const v = n.getAttribute && n.getAttribute(a);
          if (v) poser(n, a, v, vers);
        }
        for (let k = n.firstChild; k; k = k.nextSibling) pile.push(k);
      } else if (n.nodeType === 3 && n.nodeValue.trim()) {
        poser(n, null, n.nodeValue, vers);
      }
    }
  }

  function poser(n, attr, valeur, vers, neuf) {
    const boite = ORIGINE.get(n) || {};
    const cle = attr || "#texte";
    // A tooltip rewritten by the page brings a NEW French text: keeping the old one would
    // amount to translating again a text that is no longer displayed.
    const fr = !neuf && boite[cle] !== undefined ? boite[cle] : valeur;
    if (neuf) delete boite[cle];
    const rendu = vers === "fr" ? fr : traduire(fr);
    // Double punctuation takes a space in French and takes none in English. That space is
    // in the template, outside the translated text: without this, “scope : on” would
    // survive the translation and be noticed on every line.
    const fini = vers === "en" && rendu !== null ? rendu.replace(/ +([:;!?])/g, "$1") : rendu;
    if (fini === null || fini === valeur) return;
    if (boite[cle] === undefined) { boite[cle] = fr; ORIGINE.set(n, boite); }
    if (attr) n.setAttribute(attr, fini); else n.nodeValue = fini;
  }

  // ------------------------------------------------------------------ the language

  const CLE = "runtime-xray.langue";
  const lu = () => { try { return localStorage.getItem(CLE); } catch (e) { return null; } };
  const garder = v => { try { localStorage.setItem(CLE, v); } catch (e) { /* file:// */ } };

  // English by default. French only if the browser announces it — and nothing else: a
  // German browser reads English, not French by an accident of alphabetical order.
  const choisie = lu();
  let langue = choisie === "fr" || choisie === "en" ? choisie
      : (navigator.language || "en").toLowerCase().startsWith("fr") ? "fr" : "en";

  const TITRE_FR = document.title;

  let observateur = null;

  function appliquer(vers) {
    langue = vers;
    if (observateur) observateur.disconnect();
    parcourir(document.body, vers);
    document.documentElement.lang = vers;
    document.title = vers === "fr" ? TITRE_FR
        : (DICO[TITRE_FR] !== undefined ? DICO[TITRE_FR] : TITRE_FR);
    document.querySelectorAll("#langsel button").forEach(b => {
      const on = b.dataset.lang === vers;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    if (observateur) observateur.observe(document.body, QUOI);
  }

  document.querySelectorAll("#langsel button").forEach(b => {
    b.addEventListener("click", () => { garder(b.dataset.lang); appliquer(b.dataset.lang); });
  });

  // Everything the page draws afterwards — and it draws almost everything afterwards —
  // goes through here. The observer is cut while we write: without that, every translation
  // would call itself back.
  // Tooltips are watched as well as nodes: the page rewrites several of them after the
  // fact — the “expand everything” button changes its own at every toggle — and a `title`
  // reassigned creates no node, hence does not show in `childList`.
  const QUOI = {childList: true, subtree: true, attributes: true, attributeFilter: ATTRS};

  observateur = new MutationObserver(lots => {
    if (langue === "fr") return;
    observateur.disconnect();
    for (const lot of lots) {
      if (lot.type === "attributes") {
        const v = lot.target.getAttribute(lot.attributeName);
        if (v) poser(lot.target, lot.attributeName, v, langue, true);
      } else for (const n of lot.addedNodes) {
        if (n.nodeType === 1 || n.nodeType === 3) parcourir(n, langue);
      }
    }
    observateur.observe(document.body, QUOI);
  });

  appliquer(langue);
})();
</script>
</body>
</html>
