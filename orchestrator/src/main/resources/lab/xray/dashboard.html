<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vue intégrée — Runtime X-Ray</title>
<style>
  :root{
    --bg:#fff; --panel:#f6f8fa; --panel2:#fbfcfd; --border:#d0d7de; --text:#1f2328;
    --muted:#59636e; --accent:#0969da; --accent-soft:#ddf4ff;
    --full:#b7f0c6; --part:#ffec9e; --miss:#ffc9c4;
    --fullbar:#1a7f37; --partbar:#9a6700; --missbar:#cf222e; --violet:#8250df;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1117; --panel:#151b23; --panel2:#10151c; --border:#30363d; --text:#e6edf3;
      --muted:#9198a1; --accent:#4493f8; --accent-soft:#121d2f;
      --full:#16512c; --part:#5c4710; --miss:#63201f;
      --fullbar:#3fb950; --partbar:#d29922; --missbar:#f85149; --violet:#ab7df8;
    }
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  header{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;
         align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
  header h1 a{color:inherit;text-decoration:none}
  header h1 a:hover{color:var(--accent)}
  .crumb .back{display:inline-flex;align-items:center;gap:5px;color:#fff;background:var(--accent);
               border-radius:15px;padding:3px 11px;font-size:12px;font-weight:600;
               cursor:pointer;text-decoration:none}
  .crumb .back:hover{filter:brightness(1.12)}
  /* Une seule icône d'application : les badges des trois outils invitaient à cliquer
     alors qu'ils n'étaient qu'informatifs. Leur explication vit dans la légende, en bas. */
  .applogo{display:flex;align-items:center}
  .stat{color:var(--muted);font-size:12.5px} .stat b{color:var(--text)}
  .runpick{padding:7px 9px;border-bottom:1px solid var(--border);background:var(--accent-soft)}
  .runpick[hidden]{display:none}
  .runlabel{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--accent);font-weight:700}
  .runlabel{display:block;margin-bottom:4px}
  #runboxes label{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 0;
                  cursor:pointer;color:var(--text)}
  #runboxes .cnt{color:var(--muted);font-size:11px;margin-left:auto}
  .spacer{margin-left:auto}
  .cleanbtn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;
            font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;
            border:1px solid var(--border);background:var(--bg);color:var(--muted)}
  .cleanbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .cleanbtn .ic{display:inline-flex}
  .cleanbtn .ic svg{display:block}
  .cleanbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  /* Ce que fait l'autre position du bouton, écrit à côté : un interrupteur qui change
     d'intitulé quand on l'actionne ne dit jamais ce qu'on obtiendra en cliquant. */
  .altlabel{font-size:11.5px;color:var(--muted);margin-left:9px}
  /* Les liens sont groupés PAR OUTIL : « couverture détaillée » et « couverture ciblée »
     viennent du même outil et le répéter sur chacun était du bruit. La marque porte le nom
     une fois, les liens suivent. */
  .links{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .toolgrp{display:inline-flex;align-items:center;gap:6px}
  .toolgrp .mark{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;
                 letter-spacing:.3px;color:var(--muted);text-transform:uppercase}
  .links a{margin:0}
  .toolgrp .sep{color:var(--border)}
  .helpbtn{font:inherit;font-size:12px;font-weight:600;padding:4px 11px;border-radius:15px;
           cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted)}
  .helpbtn:hover{border-color:var(--accent);color:var(--accent)}
  #help{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;
        align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  #help[hidden]{display:none}
  .helpbox{position:relative;background:var(--bg);border:1px solid var(--border);
           border-radius:12px;max-width:880px;width:100%;padding:28px 32px 34px}
  .helpclose{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);
             font-size:17px;cursor:pointer}
  .helpclose:hover{color:var(--text)}
  .reserve{border:1px solid var(--border);border-left:3px solid var(--partbar);
           border-radius:6px;background:var(--panel);padding:12px 15px;color:var(--muted);
           font-size:12.5px;margin-top:22px}
  .reserve b{color:var(--text)}
  main{display:grid;grid-template-columns:var(--navw,330px) 6px 1fr;height:calc(100% - 47px)}
  @media(max-width:860px){main{grid-template-columns:1fr;height:auto} .split{display:none}}
  /* Séparateurs déplaçables : glisser pour redimensionner, double-cliquer pour replier
     entièrement le panneau voisin — utile quand on veut le code plein écran. */
  .split{background:var(--border);cursor:col-resize;position:relative}
  /* Un bouton visible sur chaque séparateur : le double-clic seul est une astuce qu'on
     ne découvre jamais. */
  .splitbtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:16px;height:34px;border-radius:8px;border:1px solid var(--border);
            background:var(--panel);color:var(--muted);font-size:11px;line-height:1;
            cursor:pointer;padding:0;z-index:3;display:flex;align-items:center;justify-content:center}
  .splitbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg)}
  .splitbtn.h{width:34px;height:16px}
  .split:hover,.split.dragging{background:var(--accent)}
  .split::after{content:"";position:absolute;inset:0 -4px}
  .split.h{cursor:row-resize;height:6px}
  .splitlabel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
              font-size:9px;color:var(--bg);pointer-events:none}
  #nav{border-right:1px solid var(--border);background:var(--panel2);
       display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--border)}
  .tabs button{flex:1;padding:8px 4px;background:none;border:0;border-bottom:2px solid transparent;
               color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  /* La barre passe à la ligne plutôt que d'écraser le champ : avec cinq boutons, un
     min-width:0 réduisait « Chercher… » à « Che », qui ne veut plus rien dire. */
  .listbar{display:flex;gap:6px;margin:8px;flex-wrap:wrap}
  #search{flex:1 1 100%;padding:5px 9px;border:1px solid var(--border);border-radius:6px;
          background:var(--bg);color:var(--text);font:inherit;font-size:12.5px;min-width:96px}
  /* Les réglages étaient des étiquettes nues — « % », « pkg » — qu'il fallait avoir
     essayées pour savoir ce qu'elles faisaient. Chacun porte maintenant son icône, son
     intitulé en toutes lettres, et l'état où il se trouve : un réglage actif est bleu et
     plein, un réglage disponible est gris et creux. On voit donc d'un coup d'œil ce qui est
     en cours et ce qu'il reste à activer. */
  .unitbtn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:11.5px;
           font-weight:600;padding:4px 9px;border-radius:14px;border:1px solid var(--border);
           background:var(--bg);color:var(--muted);cursor:pointer;line-height:1;
           white-space:nowrap}
  .unitbtn .ic{display:inline-flex;flex:0 0 auto}
  .unitbtn .ic svg{display:block}
  .unitbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .unitbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);
                                background:var(--accent-soft)}
  .unitbtn[aria-pressed="true"] .ic{color:var(--accent)}
  #scope{display:none;padding:7px 10px;border-bottom:1px solid var(--border);
         font-size:11.5px;color:var(--muted)}
  #scope b{color:var(--text)}
  #scope button{margin-left:8px;font:inherit;font-size:11px;background:var(--bg);color:var(--accent);
                border:1px solid var(--border);border-radius:5px;padding:2px 7px;cursor:pointer}
  .list{overflow:auto;flex:1 1 auto;min-height:0;padding:4px 4px 24px}
  .node{padding:2px 7px;border-radius:5px;cursor:pointer;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .node:hover{background:var(--accent-soft)}
  .node.sel{background:var(--accent);color:#fff}
  /* Le curseur clavier n'est PAS la sélection : on doit pouvoir parcourir l'arbre sans
     changer ce qu'affiche le panneau de droite. D'où un liseré, pas un aplat. */
  .node.cur{outline:2px solid var(--accent);outline-offset:-2px}
  .node.sel.cur{outline-color:#fff}
  .node .pct{color:var(--muted);font-size:11px;margin-right:6px;display:inline-block;
             width:38px;text-align:right;font-variant-numeric:tabular-nums}
  .node.sel .pct{color:#e8f0fb}
  .node .tw{display:inline-block;width:11px;color:var(--muted)}
  .node.jdk{color:var(--muted)}
  .node.runroot{font-weight:600;padding:5px 7px;margin-top:4px;border-radius:6px;
                background:var(--panel);border:1px solid var(--border)}
  .node.runroot.on{border-color:var(--accent)}
  .runbadge{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);
            border:1px solid var(--accent);border-radius:9px;padding:0 5px;vertical-align:1px}
  .pct2{color:var(--muted);font-weight:400;font-size:11px}
  .tagval{font-size:10px;border:1px solid var(--violet);color:var(--violet);
          border-radius:10px;padding:0 5px;vertical-align:1px}
  .node.pkgnode{color:var(--muted)}
  .node.valnode{cursor:default;font-size:11.5px}
  .node.valnode:hover{background:none}
  .vkey{color:var(--muted)} .veq{color:var(--border);margin:0 4px}
  .vval{color:var(--text)}
  .node.vret .vkey{color:var(--violet)}
  /* « filtrer » n'apparaît qu'au survol : présent en permanence sur des centaines de
     lignes, il ferait un mur de texte et détournerait de la lecture. */
  .node .mask{float:right;margin-left:8px;opacity:0;color:var(--muted);font-size:10.5px;
              padding:0 5px;border-radius:9px;border:1px solid var(--border);
              font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .node:hover .mask{opacity:.75}
  .node .mask:hover{opacity:1;color:#fff;background:var(--missbar);border-color:var(--missbar)}
  .filterhint{padding:6px 10px;font-size:11.5px;color:var(--muted);
              border-bottom:1px solid var(--border);line-height:1.4}
  .filterhint b{color:var(--text)}
  .filterhint[hidden]{display:none}
  .node.sel .mask{color:#e8f0fb}
  #maskpop{position:fixed;z-index:60;background:var(--bg);border:1px solid var(--border);
           border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;min-width:230px}
  #maskpop h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
              color:var(--muted)}
  #maskpop button{display:block;width:100%;text-align:left;font:inherit;font-size:12.5px;
                  background:none;border:0;border-radius:6px;padding:5px 7px;cursor:pointer;
                  color:var(--text)}
  #maskpop button:hover{background:var(--accent-soft);color:var(--accent)}
  #maskpop button .q{color:var(--muted);font-size:11px;margin-left:6px}
  /* Le bandeau se distingue par un liseré, pas par une couleur en dur : une teinte fixe
     devient illisible dès que le lecteur est en thème sombre. */
  .maskbar{padding:7px 9px;border-bottom:1px solid var(--border);background:var(--panel);
           border-left:3px solid var(--missbar);font-size:12px;color:var(--text)}
  .maskbar > b{display:block;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;
               color:var(--muted);margin-bottom:2px}
  .maskbar[hidden]{display:none}
  .maskbar .chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);
                 border:1px solid var(--border);border-radius:12px;padding:1px 4px 1px 8px;
                 margin:3px 4px 0 0;font-size:11.5px}
  .maskbar .chip button{font:inherit;border:0;background:none;cursor:pointer;color:var(--muted);
                        padding:0 3px;border-radius:8px}
  .maskbar .chip button:hover{color:#fff;background:var(--missbar)}
  .maskbar .acts{margin-top:6px;display:flex;gap:8px}
  .maskbar .acts button{font:inherit;font-size:11.5px;border:1px solid var(--border);
                        background:var(--bg);color:var(--accent);border-radius:12px;
                        padding:2px 9px;cursor:pointer}
  .maskbar .acts button:hover{border-color:var(--accent)}
  /* Le repli se fait entre les noms, pas au milieu : « org.apache.com | mons » sur deux
     lignes ne se lit plus comme un nom de paquet. Un nom plus large que la colonne reste
     coupé — mais lui seul. */
  .maskbar code{font-size:11px;word-break:normal;overflow-wrap:break-word}
  /* Quand on affiche tout le code, la couleur dit en un coup d'œil ce qui a servi. */
  .node.live .lbl{color:var(--fullbar)}
  .node.partial .lbl{color:var(--partbar)}
  .node.dead .lbl{color:var(--missbar);opacity:.85}
  .node.dead .pct{color:var(--missbar)}
  .tagdead{font-size:10px;border:1px solid var(--missbar);color:var(--missbar);
           border-radius:10px;padding:0 5px;vertical-align:1px}
  .node.pkgnode .lbl{color:var(--text)}
  .node.callnode{color:var(--violet)}
  .callbadge{font-size:10px;border:1px solid var(--violet);color:var(--violet);
             border-radius:10px;padding:0 5px;vertical-align:1px}
  /* La ligne sélectionnée est un aplat bleu plein : tout ce qu'elle porte repasse en blanc.
     Sans ces règles, la couleur de couverture — vert, orange, rouge — restait appliquée au
     nom et se retrouvait sur ce bleu, où elle ne se lit plus. */
  .node.sel, .node.sel.jdk, .node.sel.callnode{color:#fff}
  .node.sel .lbl, .node.sel.live .lbl, .node.sel.partial .lbl,
  .node.sel.dead .lbl, .node.sel.pkgnode .lbl{color:#fff;opacity:1}
  .node.sel.dead .pct{color:#e8f0fb}
  .node.sel .tagdead{color:#fff;border-color:#fff}
  .call.pick{cursor:pointer;border-radius:5px;padding-left:6px;padding-right:6px}
  .call.pick:hover{background:var(--accent-soft)}
  /* Le tableau peut être large : il défile dans son cadre, jamais la page entière. */
  .cmpwrap{overflow-x:auto;margin-top:8px}
  table.cmp{border-collapse:collapse;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:11.5px;white-space:nowrap}
  table.cmp th{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
               font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);
               text-align:left;padding:3px 10px 5px;border-bottom:1px solid var(--border);
               font-weight:600}
  table.cmp td{padding:4px 10px;border-bottom:1px solid var(--border);color:var(--violet);
               max-width:34ch;overflow:hidden;text-overflow:ellipsis}
  table.cmp td.idx{color:var(--muted);font-size:10.5px;white-space:nowrap;
                   font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  table.cmp th.vary{color:var(--accent)}
  table.cmp td.vary{background:var(--accent-soft);color:var(--text);font-weight:600}
  table.cmp td.ret{color:var(--text);font-weight:600}
  table.cmp tr[data-i]{cursor:pointer}
  table.cmp tr[data-i]:hover td{background:var(--accent-soft)}
  table.cmp tr.on td{outline:1px solid var(--accent);outline-offset:-1px}
  .tagrun{font-size:10px;border:1px solid var(--accent);color:var(--accent);
          border-radius:10px;padding:0 5px;vertical-align:1px}
  .tagonly{font-size:10px;border:1px solid var(--partbar);color:var(--partbar);
           border-radius:10px;padding:0 5px;vertical-align:1px}
  /* Sélection = fond bleu plein. Les pastilles violettes y deviennent illisibles : sur
     fond accentué, elles passent en blanc, comme le reste du texte de la ligne. */
  .node.sel .tagval, .node.sel .callbadge{border-color:#fff;color:#fff;background:transparent}
  .node.sel .vkey, .node.sel .vval, .node.sel .veq{color:#fff}
  .grouphead{padding:6px 8px 2px;color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
  #detail{display:flex;flex-direction:column;min-height:0}
  .crumb{padding:9px 16px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .viewbar{padding:0 16px 9px;border-bottom:1px solid var(--border);display:flex;gap:8px}
  .crumb b{font-weight:650} .crumb span{color:var(--muted)}
  .crumb a.pkgseg{color:var(--muted);text-decoration:none;border-radius:4px;padding:0 2px}
  .crumb a.pkgseg:hover{color:#fff;background:var(--missbar)}
  .crumb a.pkgseg:hover::after{content:" filtrer"; font-size:9.5px; opacity:.85}
  .crumb .pkgdot{color:var(--muted)}
  .pill{font-size:11px;border:1px solid var(--border);border-radius:20px;padding:1px 8px;color:var(--muted)}
  #context{display:none;padding:7px 16px;border-bottom:1px solid var(--border);background:var(--panel2)}
  .ctxlabel{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
  .ctxpath{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
           padding:3px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent}
  .ctxpath:hover{background:var(--accent-soft)}
  .ctxpath.on{border-color:var(--accent);background:var(--accent-soft)}
  .ctxpath .share{display:inline-block;width:38px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ctxpath a{color:var(--accent);text-decoration:none}
  .ctxpath a:hover{text-decoration:underline}
  .ctxpath a.cur{color:var(--text);font-weight:600}
  .ctxpath .sep{color:var(--muted)}
  .ctxelse{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);font-size:11.5px}
  .ctxelse a{color:var(--accent);text-decoration:none}
  .ctxelse a:hover{text-decoration:underline}
  #code{overflow:auto;flex:1 1 auto;min-height:0;padding-bottom:24px}
  table.src{border-collapse:collapse;width:100%;
            font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  table.src td{padding:0 6px;vertical-align:top;white-space:pre}
  #code a.iters{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:1px dotted}
  #code a.iters:hover{background:var(--accent-soft)}
  tr.itersrow td{background:var(--accent-soft);padding:6px 10px}
  .iters-detail{font-size:11.5px;color:var(--muted);white-space:normal;line-height:1.9}
  .iter{display:inline-block;background:var(--bg);border:1px solid var(--border);
        border-radius:10px;padding:1px 8px;margin:0 4px 0 0;font-size:11px}
  .iter b{color:var(--accent);margin-right:5px}
  td.n{text-align:right;color:var(--muted);user-select:none;width:1%;
       border-right:1px solid var(--border);font-variant-numeric:tabular-nums}
  /* Un liseré en marge en plus du fond : sur un fond sombre, la teinte seule se remarque
     mal, et en mode resserré on ne voit presque que des lignes exécutées. */
  tr.full td.c{background:var(--full);box-shadow:inset 3px 0 0 var(--fullbar)}
  tr.part td.c{background:var(--part);box-shadow:inset 3px 0 0 var(--partbar)}
  tr.miss td.c{background:var(--miss);box-shadow:inset 3px 0 0 var(--missbar)}
  td.c{width:99%}
  tr.inmethod td.n{color:var(--accent);font-weight:700}
  td.ann{color:var(--muted);font-size:11px;width:1%;max-width:300px;text-align:right;
         white-space:normal;padding-left:14px}
  td.ann a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
  td.ann .dur{opacity:.6}
  td.ann a.values{color:var(--violet);border-bottom-color:var(--violet);font-weight:600}
  /* Discret par défaut : le code doit rester du code, pas une page de liens. */
  a.callink{color:inherit;text-decoration:none;border-bottom:1px dotted var(--accent);
            cursor:pointer}
  a.callink:hover{color:var(--accent);background:var(--accent-soft);border-radius:3px}
  .fold{color:var(--muted);font-style:italic;padding:2px 12px;font-size:11.5px;
        background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  #values{background:var(--panel);padding:10px 16px;overflow:auto;
          height:var(--valh,190px);flex:0 0 auto}
  #values:empty{display:none} #values:empty + .legend{border-top:1px solid var(--border)}
  #values h3{margin:0 0 6px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
  #values h3 code{text-transform:none;letter-spacing:0;color:var(--text);font-size:12px}
  .sig{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;

<script>
const D = /*__DATA__*/;
// Plusieurs exécutions peuvent cohabiter dans le même rapport. R désigne celle qu'on
// regarde ; tout le reste de la page lit R, jamais D directement (sauf les sources,
// communes à toutes les exécutions).
let runIndex = 0;
let R = D.runs[0];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const dot = s => s.replace(/\//g,".");
let clean = true, mode = "exec", scopeFrame = null, selected = null, filter = "", ctxIndex = 0;
// Un nœud d'arbre d'appel désigne un CHEMIN, pas un appel : le profil est un agrégat.
// Les appels individuels viennent de l'inspection, et chacun est sélectionnable à part.
// callIndex vaut null quand on regarde la méthode, ou l'indice de l'appel regardé.
let callIndex = null;
// Les listes « Code exécuté » et « Packages » peuvent réunir plusieurs exécutions : on
// coche celles qu'on veut voir. La vue de code, elle, reste rattachée à UNE exécution —
// couverture et valeurs n'ont de sens que dans celle où l'appel a eu lieu.
let shownRuns = new Set(D.runs.map((_, i) => i));

/* ---------------------------------------------------------- masquage par apprentissage
 * On n'écrit pas d'avance la liste des paquets qu'on ne veut pas voir : on la découvre en
 * lisant le code, où ils se signalent tout seuls. D'où ce mécanisme — cliquer « filtrer » à côté
 * d'une méthode, choisir jusqu'où remonter (la classe, son paquet, le paquet parent…), et
 * elle disparaît. La liste s'accumule, se relit, et se recopie dans le fichier de
 * configuration pour que les exécutions suivantes partent déjà propres.
 *
 * Le masquage est purement visuel : le nœud n'est pas rendu, donc son poids reste compté
 * dans son parent — exactement le repli appliqué au JDK côté outil. Rien n'est perdu. */
const MASK_KEY = "runtime-xray.masques";
let masked = [];
try { masked = JSON.parse(localStorage.getItem(MASK_KEY) || "[]"); } catch(e){ masked = []; }

/** Les paquets déjà masqués À LA COLLECTE, venus de la configuration : ils ne sont plus
 *  dans les données, on les montre pour que la liste affichée dise toute la vérité. */
const maskedAtSource = (D.runs.find(r => r.paquetsMasques) || {}).paquetsMasques || "";

function isMasked(frame){
  if (!masked.length || !frame) return false;
  const n = frame.replace(/\./g, "/");
  return masked.some(p => n === p || n.startsWith(p + "/") || n.startsWith(p + "."));
}

/** Les niveaux de masquage possibles pour une méthode, du plus large au plus étroit. */
function maskLevels(frame){
  const cls = frame.includes(".") ? frame.slice(0, frame.lastIndexOf(".")) : frame;
  const parts = cls.split("/");
  const out = [];
  for (let i = 1; i < parts.length; i++){
    out.push({ path: parts.slice(0, i).join("/"),
               label: parts.slice(0, i).join("."),
               quoi: "tout ce paquet" });
  }
  out.push({ path: cls, label: parts.join("."), quoi: "cette classe seule" });
  return out;
}

function saveMasks(){
  localStorage.setItem(MASK_KEY, JSON.stringify(masked));
  renderMaskBar();
  mode === "cls" ? renderClasses() : renderTree();
  reselect();
}

function addMask(path){
  if (!masked.includes(path)){
    // Une règle plus large rend les plus étroites inutiles : on les retire pour que la
    // ligne de configuration produite reste lisible.
    masked = masked.filter(m => !(m === path || m.startsWith(path + "/")));
    masked.push(path);
    masked.sort();
  }
  saveMasks();
}
// Deux façons de lire le temps : la part du total, ou une durée estimée. La seconde parle
// davantage à qui cherche « combien de temps », la première à qui compare deux méthodes.
let unit = "pct";
// Les noms de paquet complets rendent l'arbre illisible sur un projet à l'arborescence
// profonde ; on peut les replier d'un bouton.
let showPackages = true;
// La vue Code est alphabétique par construction — paquets, classes et méthodes triés par
// nom : on y cherche quelque chose qu'on connaît. Le classement par temps, lui, est la
// question de la vue Exécutions.
// Dans la vue par structure : ne montrer que ce qui a tourné, ou tout le code du projet.
// Quand on montre tout, il faut distinguer d'un coup d'œil ce qui a servi de ce qui dort.
let executedOnly = true;

/** Nom d'une frame, avec ou sans son paquet, selon le réglage. */
function frameLabel(frame){
  const full = dot(frame);
  if (showPackages) return full;
  const parts = full.split(".");
  return parts.length <= 2 ? full : parts.slice(-2).join(".");
}

/** Un relevé est pris toutes les millisecondes de temps processeur : le compte d'échantillons
 *  d'une méthode est donc, à peu de chose près, son temps processeur en millisecondes. */
function formatWeight(samples, total){
  if (!samples) return "·";
  if (unit === "pct"){
    const share = 100 * samples / (total || 1);
    return share >= 0.05 ? share.toFixed(1) + "%" : "·";
  }
  const ms = samples * (R.intervalMs || 1);
  if (ms >= 10000) return (ms / 1000).toFixed(1) + "s";
  if (ms >= 1000) return (ms / 1000).toFixed(2) + "s";
  return Math.round(ms) + "ms";
}

/* ---------------------------------------------------------------- agrégats */
function ranIn(run, frame){
  const cls = frame.slice(0, frame.lastIndexOf("."));
  const name = frame.slice(frame.lastIndexOf(".") + 1);
  const info = run.methods[cls];
  return !!(info && info.methods.some(m => m.name === name && m.covered));
}
function computeAgg(){
  let cov=0, miss=0; const dead=[];
  for (const classes of Object.values(R.packages))
    for (const c of classes){ cov+=c.covered; miss+=c.missed; if(!c.covered) dead.push(c.simple); }
  const weights = {};
  (function walk(n){ for(const k of n.children){ weights[k.name]=(weights[k.name]||0)+k.total; walk(k);} })(R.calltree);
  let methods=0;
  for (const info of Object.values(R.methods)) methods += info.methods.filter(m=>m.covered).length;
  return {cov, miss, dead, weights, methods,
          pct: cov+miss ? 100*cov/(cov+miss) : 0, samples: R.calltree.total};
}
let AGG = computeAgg();

/* ------------------------------------------------------- identité des exécutions
 * Une exécution porte trois choses distinctes, et les confondre fait perdre la trace de ce
 * qu'on regarde : un identifiant, qui ne change jamais ; le nom donné au lancement, qui dit
 * ce qu'on croyait mesurer ; le nom posé après coup, qui dit ce qu'on a compris. La page
 * sait saisir les deux derniers, plus une description et des étiquettes ; elle les garde
 * dans le navigateur et sait rendre le « noms.json » qui les rendra définitifs.
 */
const ANNOT_KEY = "runtime-xray-annotations";
let annotations = {};
try { annotations = JSON.parse(localStorage.getItem(ANNOT_KEY) || "{}"); } catch(e){ annotations = {}; }
function saveAnnotations(){
  try { localStorage.setItem(ANNOT_KEY, JSON.stringify(annotations)); } catch(e){}
}
/** Ce qui a été saisi dans la page l'emporte sur ce que le rapport portait déjà. */
function annotationOf(run){
  const local = annotations[run.uuid] || {};
  return {
    nom: local.nom !== undefined ? local.nom : (run.nomOutil || ""),
    description: local.description !== undefined ? local.description : (run.description || ""),
    etiquettes: local.etiquettes !== undefined ? local.etiquettes : (run.etiquettes || {})
  };
}
function annotationPatch(run, champ, valeur){
  const a = annotations[run.uuid] || (annotations[run.uuid] = {});
  if (valeur === null) delete a[champ]; else a[champ] = valeur;
  if (!Object.keys(a).length) delete annotations[run.uuid];
  saveAnnotations();
}
function shortId(run){ return (run.uuid || "").slice(0, 8); }
/** Nom posé dans l'outil, sinon nom du lancement, sinon l'identifiant : jamais rien d'inventé. */
function runLabel(run){
  return annotationOf(run).nom || run.nomOrigine || shortId(run) || run.chemin || "exécution";
}
/** Repose les libellés partout où ils s'affichent, sans reconstruire la vue. */
function refreshRunLabels(){
  document.querySelectorAll("[data-runname]").forEach(el => {
    el.textContent = runLabel(D.runs[+el.dataset.runname]);
  });
  const c = document.getElementById("crumbname");
  if (c) c.textContent = runLabel(R);
}

(function initRuns(){
  if (D.runs.length < 2) return;
  document.getElementById("runpick").hidden = false;
  const box = document.getElementById("runboxes");
  box.innerHTML = D.runs.map((r, i) =>
    '<label><input type="checkbox" data-run="' + i + '" checked> ' +
    '<span data-runname="' + i + '">' + esc(runLabel(r)) + '</span>' +
    (r.uuid ? '<span class="uid" title="Identifiant permanent : ' + esc(r.uuid) + '">'
              + esc(shortId(r)) + '</span>' : '') +
    '<span class="cnt">' + methodCount(r) + ' méthodes</span></label>').join("");
  box.querySelectorAll("input[data-run]").forEach(cb => cb.onchange = () => {
    const i = +cb.dataset.run;
    cb.checked ? shownRuns.add(i) : shownRuns.delete(i);
    if (!shownRuns.size){ shownRuns.add(i); cb.checked = true; return; }  // jamais rien à voir
    const open = captureExpanded();
    mode === "cls" ? renderClasses() : renderTree();
    restoreExpanded(open);
    reselect();
  });
})();

function methodCount(run){
  let n = 0;
  for (const info of Object.values(run.methods)) n += info.methods.filter(m => m.covered).length;
  return n;
}

  if (redraw){ selected = null; renderTree(); drawHome(); }
}

/* --------------------------------------------------------- frame -> source */
function frameInfo(frame){
  const i = frame.lastIndexOf(".");
  if (i < 0) return null;
  const cls = frame.slice(0,i), name = frame.slice(i+1);
  const info = R.methods[cls];
  if (!info) return null;
  const decl = info.methods.find(m => m.name === name);
  return {frame, cls, name, line: decl ? decl.line : 0,
          source: info.source, methods: info.methods};
}

/* ------------------------------------------- périmètre : sous une méthode */
function framesUnder(target){
  const acc = {};
  (function walk(node, inside){
    for (const kid of node.children){
      const now = inside || kid.name === target;
      if (now) acc[kid.name] = (acc[kid.name]||0) + kid.total;
      walk(kid, now);
    }
  })(R.calltree, false);
  return acc;
}
function executedMethods(){
  const scoped = scopeFrame ? framesUnder(scopeFrame) : null;
  const merged = new Map();
  for (const i of [...shownRuns].sort()){
    const run = D.runs[i];
    const weights = {};
    (function walk(node){ for (const k of node.children){ weights[k.name] = (weights[k.name]||0) + k.total; walk(k); } })(run.calltree);
    for (const [cls, info] of Object.entries(run.methods)){
      for (const m of info.methods){
        if (!m.covered) continue;
        const frame = cls + "." + m.name;
        if (scoped && !(frame in scoped)) continue;
        if (filter && !(dot(frame).toLowerCase().includes(filter))) continue;
        const seen = merged.get(frame);
        const samples = weights[frame] || 0;
        if (!seen){
          merged.set(frame, {frame, cls, name: m.name, line: m.line, source: info.source,
                             methods: info.methods, samples, runs: [i], bestRun: i, best: samples});
        } else {
          seen.samples += samples;
          seen.runs.push(i);
          if (samples > seen.best){ seen.best = samples; seen.bestRun = i; }
        }
      }
    }
  }
  // Seul usage restant : les méthodes les plus coûteuses de la vue d'ensemble. Le tri par
  // temps est donc le bon, et le seul.
  return [...merged.values()]
      .sort((a, b) => b.samples - a.samples || a.frame.localeCompare(b.frame));
}

function renderScope(){

  if (mode !== "exec"){ box.innerHTML = ""; box.style.display = "none"; return; }
  // Rien à afficher quand le périmètre est complet : une explication permanente freine la

  if (!scopeFrame){ box.innerHTML = ""; box.style.display = "none"; return; }
  box.style.display = "block";

      esc(dot(scopeFrame).split(".").slice(-2).join(".")) + "</b>" +
      "<button id='unscope'>Toute l'exécution</button>";
  const b = document.getElementById("unscope");
  if (b) b.onclick = () => { scopeFrame = null; mode === "cls" ? renderClasses() : renderTree(); };
}
/**
 * Certaines actions changent la liste des nœuds — cocher une exécution, basculer
 * exécuté/tout — et imposent de reconstruire. Refermer l'arbre à cette occasion fait
 * perdre le fil de ce qu'on regardait : on note ce qui était ouvert, et on le rouvre.
 */
function captureExpanded(){
  const open = new Set();
  document.querySelectorAll("#list .node").forEach(n => {
    const tw = n.querySelector(".tw");
    if (tw && tw.textContent === "▾"){
      const key = n.dataset.frame || n.dataset.path;
      if (key) open.add(key);
    }
  });
  return open;
}

function restoreExpanded(open){
  if (!open || !open.size) return;
  for (let pass = 0; pass < 30; pass++){
    const toOpen = [...document.querySelectorAll("#list .node")].filter(n => {
      const tw = n.querySelector(".tw");
      const key = n.dataset.frame || n.dataset.path;
      return tw && tw.textContent === "▸" && key && open.has(key) && !n.classList.contains("runroot");
    });
    if (!toOpen.length) return;
    toOpen.forEach(n => n.click());
  }
}

/* ------------------------------------------------------------ navigation au clavier
 * Un arbre se parcourt aux flèches — c'est le geste attendu partout ailleurs, et il évite
 * de viser à la souris des lignes hautes de 18 pixels. Le modèle est celui des explorateurs
 * de fichiers : haut/bas déplacent, droite ouvre puis descend, gauche ferme puis remonte.
 *
 * Le curseur est distinct de la sélection : on peut se promener sans changer ce qu'affiche
 * le panneau de droite, et n'ouvrir que ce qu'on décide d'ouvrir. */
let cursor = null;

function visibleNodes(){
  // offsetParent est nul dès qu'un ancêtre est en display:none — c'est exactement
  // « replié », sans avoir à remonter les conteneurs à la main.
  return [...document.querySelectorAll("#list .node")].filter(n => n.offsetParent !== null);
}

function setCursor(el){
  if (!el) return;
  document.querySelectorAll("#list .node.cur").forEach(n => n.classList.remove("cur"));
  el.classList.add("cur");
  cursor = el;
  el.scrollIntoView({ block: "nearest" });
}

function twOf(el){ const t = el.querySelector(".tw"); return t ? t.textContent : ""; }

/** Le conteneur des enfants d'un nœud : toujours le frère qui le suit. */
function holderOf(el){
  const h = el.nextElementSibling;
  return h && !h.classList.contains("node") ? h : null;
}

function parentNode(el){
  const holder = el.parentElement;
  if (!holder || holder.id === "list") return null;
  const prev = holder.previousElementSibling;
  return prev && prev.classList.contains("node") ? prev : null;
}

document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!["ArrowDown", "ArrowUp", "ArrowRight", "ArrowLeft", "Enter", " ", "Home", "End"].includes(e.key)) return;

  const nodes = visibleNodes();
  if (!nodes.length) return;
  if (!cursor || !cursor.isConnected || cursor.offsetParent === null) setCursor(nodes[0]);
  const i = nodes.indexOf(cursor);
  e.preventDefault();

  switch (e.key){
    case "ArrowDown": setCursor(nodes[Math.min(i + 1, nodes.length - 1)]); break;
    case "ArrowUp":   setCursor(nodes[Math.max(i - 1, 0)]); break;
    case "Home":      setCursor(nodes[0]); break;
    case "End":       setCursor(nodes[nodes.length - 1]); break;
    case "ArrowRight": {
      if (twOf(cursor) === "▸"){ cursor.click(); }          // fermé : on ouvre
      else {
        const h = holderOf(cursor);                          // déjà ouvert : on descend
        const first = h && [...h.children].find(c => c.classList.contains("node"));
        if (first) setCursor(first);
      }
      break;
    }
    case "ArrowLeft": {
      if (twOf(cursor) === "▾"){ const c = cursor; c.click(); setCursor(c); }  // ouvert : on ferme
      else setCursor(parentNode(cursor) || cursor);                            // sinon on remonte
      break;
    }
    case "Enter":
    case " ": {
      const c = cursor;
      c.click();
      setCursor(c);
      break;
    }
  }
});

  pop.querySelectorAll("button").forEach(b => b.onclick = e => {

    addMask(b.dataset.p);

  setTimeout(() => document.addEventListener("click", closeMaskPicker, { once: true }), 0);
}

}

/** La liste de ce qui est masqué, et surtout la ligne à recopier dans la configuration :
 *  sans elle, l'apprentissage resterait dans ce navigateur et serait à refaire. */
function renderMaskBar(){
  const bar = document.getElementById("maskbar");
  if (!masked.length && !maskedAtSource){ bar.hidden = true; bar.innerHTML = ""; return; }
  bar.hidden = false;
  const source = maskedAtSource
    ? '<div style="color:var(--muted);font-size:11.5px">Déjà masqué à la mesure : <code>' +
      esc(maskedAtSource) + '</code></div>'
    : "";
  if (!masked.length){ bar.innerHTML = source; return; }
  bar.innerHTML =
    '<b>Masqué — retenu automatiquement</b>' +
    masked.map(m => '<span class="chip">' + esc(m.replace(/\//g, ".")) +
                    '<button data-p="' + esc(m) + '" title="Réafficher">✕</button></span>').join("") +
    // Rien à enregistrer : la liste est conservée par le navigateur et se retrouve telle
    // quelle au prochain chargement du rapport. Le bouton ci-dessous ne sert donc PAS à
    // sauvegarder — il sert à ne plus MESURER ce code du tout, ce qui est un autre sujet :
    // moins de temps de collecte, un rapport plus léger. Une page statique ne peut pas
    // écrire dans le fichier de configuration ; c'est aussi ce qui la rend transportable.
    '<div class="acts">' +
      '<button id="maskcopy" title="Pour ne plus MÊME MESURER ce code aux prochaines ' +
      'exécutions : copie la ligne HIDDEN_PACKAGES à coller dans le fichier de ' +
      'configuration">Ne plus le mesurer non plus</button>' +
      '<button id="maskclear">Tout réafficher</button>' +
    '</div>' + source;
  bar.querySelectorAll(".chip button").forEach(b => b.onclick = () => {
    masked = masked.filter(m => m !== b.dataset.p);
    saveMasks();
  });
  document.getElementById("maskcopy").onclick = e => {
    const line = 'HIDDEN_PACKAGES="' + masked.map(m => m.replace(/\//g, ".")).join(", ") + '"';
    navigator.clipboard.writeText(line).then(
      () => { e.target.textContent = "ligne copiée ✓ — à coller dans la conf";
              setTimeout(renderMaskBar, 2400); },
      () => { e.target.textContent = line; });
  };
  document.getElementById("maskclear").onclick = () => { masked = []; saveMasks(); };
}

function renderTree(){
  mode = "tree"; tab("tab-tree"); renderScope();
  // L'arbre montre TOUTES les exécutions comme racines : les cocher n'aurait pas de sens.
  toggleRunPicker(false);
  showOptionsFor("tree"); resetExpandButton();
  const box = document.getElementById("list"); box.innerHTML = "";

  // Les exécutions sont les RACINES de l'arbre : une exécution est le contexte d'appel le
  // plus haut qui soit, celui qui englobe tous les autres. Avec plusieurs exécutions, on
  // les voit côte à côte et on descend dans celle qu'on veut.
  D.runs.forEach((run, idx) => {
    const total = run.calltree.total || 1;
    const head = document.createElement("div");
    head.className = "node runroot" + (idx === runIndex ? " on" : "");
    head.innerHTML = '<span class="tw">' + (idx === runIndex ? "▾" : "▸") + '</span>' +
                     '<span class="runbadge">exécution</span> ' +
                     '<span data-runname="' + idx + '">' + esc(runLabel(run)) + '</span>' +
                     (run.uuid ? '<span class="uid" title="Identifiant permanent : '
                                 + esc(run.uuid) + '">' + esc(shortId(run)) + '</span>' : '') +
                     ' <span class="pct2">' + total.toLocaleString("fr") + ' mesures</span>';
    box.appendChild(head);
    const holder = document.createElement("div");
    holder.style.display = idx === runIndex ? "block" : "none";
    box.appendChild(holder);
    let built = false;
    if (idx === runIndex){ level(holder, run.calltree, 1, total, idx); built = true; }
    head.onclick = () => {
      // Changer d'exécution reconstruit la liste entière. Toucher AU PRÉALABLE au DOM
      // qu'on s'apprête à remplacer laissait un conteneur déjà rempli mais marqué fermé —
      // d'où une ligne orpheline sous la racine. On rend la main tout de suite : c'est le
      // re-rendu qui ouvre la bonne exécution.
      if (idx !== runIndex){ switchRun(idx, true); return; }

      const open = holder.style.display === "none";
      if (open && !built){ level(holder, run.calltree, 1, total, idx); built = true; }
      holder.style.display = open ? "block" : "none";
      head.querySelector(".tw").textContent = open ? "▾" : "▸";
      if (!open) goHome();
    };
  });

  /**
   * Les enfants à afficher réellement.
   *
   * <p>Le critère est simple et c'est le bon : <b>a-t-on son code source ?</b> Un arbre
   * d'appel sert à ouvrir des méthodes et à les lire. Une frame qu'on ne peut pas ouvrir —
   * un rouage de la machine virtuelle, un appel natif, une bibliothèque livrée sans ses
   * sources — n'apporte rien à cet usage : on ne pourra ni la comprendre, ni la corriger.
   *
   * <p>Elle est donc repliée sur son appelant, et on <b>remonte à sa place ses descendants
   * lisibles</b> : sans ça, du code applicatif appelé à travers un rouage de la VM (un
   * lambda, une réflexion, un thread) disparaîtrait de l'arbre avec lui. Le temps, lui,
   * reste compté chez l'appelant — rien n'est perdu.
   *
   * <p>Ces classes ne disparaissent pas de l'analyse pour autant : l'onglet <b>Code</b> les
   * liste avec leur couverture, car là c'est un inventaire, pas une lecture.
   */
  function visibleChildren(node){
    const out = [];
    for (const kid of node.children){
      if (isMasked(kid.name)) continue;
      if (hasSource(kid.name)) out.push(kid);
      else out.push(...visibleChildren(kid));
    }
    return out.sort((a, b) => b.total - a.total);
  }

  function level(container, node, depth, total, idx){
    for (const kid of visibleChildren(node)){
      if (filter && !dot(kid.name).toLowerCase().includes(filter) && !hasMatch(kid)) continue;
      const known = !!frameInfo(kid.name);
      const el = document.createElement("div");
      el.className = "node" + (known ? "" : " jdk");
      el.style.paddingLeft = (6 + depth * 11) + "px";
      const hasCalls = frameInfo(kid.name) && (R.values[kid.name] || []).length;
      el.dataset.frame = kid.name;
      el.dataset.samples = kid.total;
      el.dataset.total = total;
      const kidsShown = visibleChildren(kid);
      el.innerHTML = '<span class="tw">' + ((kidsShown.length || hasCalls) ? "▸" : "") + '</span>' +
                     '<span class="pct">' + formatWeight(kid.total, total) + '</span>' +
                     '<span class="lbl">' + esc(frameLabel(kid.name)) + '</span>' +
                     // Pas de « filtrer » ici : dans l'arbre d'appel on suit une exécution, on ne
                     // range pas du code. Le geste vit dans la vue Code et dans le chemin
                     // affiché au-dessus du source, là où on a le paquet sous les yeux.
                     ((known && (R.values[kid.name] || []).length)
                        ? ' <span class="tagval">' + R.values[kid.name].length + ' appels</span>' : '');
      container.appendChild(el);
      const holder = document.createElement("div");
      holder.style.display = "none";
      container.appendChild(holder);
      // Les enfants ne sont construits qu'au premier dépliage. Sur une vraie application,
      // un arbre d'appel compte des dizaines de milliers de nœuds : tout construire d'avance
      // fige la page. Ici on ne paie que ce qu'on ouvre.
      // Les appels observés de cette méthode deviennent des nœuds à part entière : un
      // nœud = un appel, ce que le profil agrégé ne peut pas offrir.
      const observedCalls = known ? (R.values[kid.name] || []) : [];
      let built = false;
      el.onclick = e => {
        e.stopPropagation();
        if (kidsShown.length || observedCalls.length){
          const open = holder.style.display === "none";
          if (open && !built){
            observedCalls.forEach((call, k) => {
              const leaf = document.createElement("div");
              leaf.className = "node callnode";
              leaf.style.paddingLeft = (6 + (depth + 1) * 11) + "px";
              const resume = (call.params || []).map(x => x.value).join(", ");
              leaf.innerHTML = '<span class="tw">▸</span><span class="callbadge">appel ' +
                               (k + 1) + '</span> ' + esc(resume.slice(0, 60));
              leaf.title = resume;
              leaf.__call = call;
              leaf.__depth = depth + 2;
              const fields = document.createElement("div");
              fields.style.display = "none";
              let filled = false;
              leaf.onclick = ev => {
                ev.stopPropagation();
                const open = fields.style.display === "none";
                if (open && !filled){ fillValueNodes(fields, call, depth + 2); filled = true; }
                fields.style.display = open ? "block" : "none";
                leaf.querySelector(".tw").textContent = open ? "▾" : "▸";
                if (idx !== runIndex) switchRun(idx, false);
                const info2 = frameInfo(kid.name);
                if (info2) select(info2, leaf, k);
              };
              holder.appendChild(leaf);
              holder.appendChild(fields);
            });
            level(holder, kid, depth + 1, total, idx);
            built = true;
          }
          holder.style.display = open ? "block" : "none";
          el.querySelector(".tw").textContent = open ? "▾" : "▸";
        }
        if (idx !== runIndex) switchRun(idx, false);
        if (known) selectFrame(kid.name, el);
      };
    }
  }
  function hasMatch(node){
    return visibleChildren(node).some(k => dot(k.name).toLowerCase().includes(filter) || hasMatch(k));
  }
}

/**
 * Vue par structure : paquet › sous-paquet › classe › méthode, filtrée au code réellement
 * exécuté par les exécutions cochées, en ordre alphabétique.
 *
 * <p>C'est le pendant de l'arbre d'appel : celui-ci suit l'exécution, celle-là suit
 * l'organisation du code. On y cherche une classe qu'on connaît, plutôt qu'un chemin.
 */
function renderClasses(){
  mode = "cls"; tab("tab-cls"); renderScope(); toggleRunPicker(true);
  showOptionsFor("cls"); resetExpandButton();
  const box = document.getElementById("list"); box.innerHTML = "";

  // Union des exécutions cochées : une classe compte si elle a tourné dans l'une d'elles.
  const classes = new Map();
  for (const i of [...shownRuns].sort()){
    const run = D.runs[i];
    for (const [pkg, list] of Object.entries(run.packages)){
      for (const c of list){
        if (isMasked(c.name)) continue;
        if (executedOnly && !c.covered) continue;
        const seen = classes.get(c.name);
        if (!seen) classes.set(c.name, {...c, pkg, runs: [i]});
        else { seen.covered = Math.max(seen.covered, c.covered); seen.runs.push(i); }
      }
    }
  }

  // Arborescence des paquets, un niveau par segment.
  const root = {children: new Map(), classes: []};
  for (const c of [...classes.values()]){
    if (filter && !(dot(c.name).toLowerCase().includes(filter))) continue;
    let node = root;
    for (const seg of c.pkg.split("/")){
      if (!node.children.has(seg)) node.children.set(seg, {children: new Map(), classes: []});
      node = node.children.get(seg);
    }
    node.classes.push(c);
  }

  // Un paquet qui ne contient qu'un sous-paquet est fusionné avec lui : « lab.sample.speed »
  // se lit mieux que trois niveaux vides à déplier.
  function compact(node, prefix){
    while (node.classes.length === 0 && node.children.size === 1){
      const [seg, only] = [...node.children.entries()][0];
      prefix = prefix ? prefix + "." + seg : seg;
      node = only;
    }
    return {node, prefix};
  }

  (function level(container, node, prefix, depth){
    for (const [seg, child] of [...node.children.entries()].sort((a,b)=>a[0].localeCompare(b[0]))){
      const merged = compact(child, seg);
      const el = document.createElement("div");
      el.className = "node pkgnode";
      const dotted = (prefix ? prefix + "." : "") + merged.prefix;
      el.dataset.path = "pkg:" + dotted;
      el.style.paddingLeft = (6 + depth*11) + "px";
      const count = countClasses(merged.node);
      el.innerHTML = '<span class="tw">▸</span><span class="lbl">' + esc(merged.prefix.toLowerCase()) +
                     '</span> <span class="pct2">' + count +
                     (count > 1 ? " classes" : " classe") + '</span>' +
                     '<span class="mask" title="Ne plus voir ce paquet ni ce qu\'il contient">filtrer</span>';
      container.appendChild(el);
      const holder = document.createElement("div");
      holder.style.display = "none";
      container.appendChild(holder);
      let built = false;
      el.onclick = e => {
        // Sur un paquet, pas de choix de niveau à proposer : le nœud EST le niveau.
        if (e.target.classList.contains("mask")){ addMask(dotted.replace(/\./g, "/")); return; }
        const open = holder.style.display === "none";
        if (open && !built){ level(holder, merged.node, merged.prefix, depth+1); built = true; }
        holder.style.display = open ? "block" : "none";
        el.querySelector(".tw").textContent = open ? "▾" : "▸";
      };
    }
    for (const c of node.classes.sort((a,b)=>a.simple.localeCompare(b.simple))){
      const el = document.createElement("div");
      el.className = "node";
      el.style.paddingLeft = (6 + depth*11) + "px";
      const pct = c.covered + c.missed ? Math.round(100*c.covered/(c.covered+c.missed)) : 0;
      el.dataset.path = "cls:" + c.name;
      if (!c.covered) el.classList.add("dead");
      else if (pct < 100) el.classList.add("partial");
      else el.classList.add("live");
      el.innerHTML = '<span class="tw">▸</span><span class="pct">' + pct + '%</span>' +
                     '<span class="lbl">' + esc(c.simple) + '</span>' +
                     (!c.covered ? ' <span class="tagdead">jamais exécutée</span>' : '') +
                     '<span class="mask" title="Ne plus voir cette classe, ou tout son paquet">filtrer</span>';
      container.appendChild(el);
      const holder = document.createElement("div");
      holder.style.display = "none";
      container.appendChild(holder);
      let built = false;
      el.onclick = e => {
        if (e.target.classList.contains("mask")){ openMaskPicker(c.name, e.target); return; }
        const open = holder.style.display === "none";
        if (open && !built){ methodsOf(holder, c, depth+1); built = true; }
        holder.style.display = open ? "block" : "none";
        el.querySelector(".tw").textContent = open ? "▾" : "▸";
        openClass(c, el);
      };
    }
  })(box, root, "", 0);

  function countClasses(node){
    let n = node.classes.length;
    for (const child of node.children.values()) n += countClasses(child);
    return n;
  }
}

/** Les méthodes exécutées d'une classe, en ordre alphabétique. */
function methodsOf(container, c, depth){
  const run = D.runs.find((r, i) => shownRuns.has(i) && r.methods[c.name]) || R;
  const info = run.methods[c.name];
  if (!info) return;
  const scoped = scopeFrame ? framesUnder(scopeFrame) : null;
  const methods = info.methods
      .filter(m => m.covered || !executedOnly)
      .filter(m => !scoped || ((c.name + "." + m.name) in scoped))
      .sort((a, b) => a.name.localeCompare(b.name));
  for (const m of methods){
    const frame = c.name + "." + m.name;
    const el = document.createElement("div");
    el.className = "node " + (m.covered ? "live" : "dead");
    el.style.paddingLeft = (6 + depth*11 + 12) + "px";
    el.dataset.frame = frame;
    const weight = AGG.weights[frame] || 0;
    el.dataset.samples = weight;
    el.dataset.total = R.calltree.total;
    el.innerHTML = '<span class="pct">' + formatWeight(weight, R.calltree.total) + '</span>' +
                   '<span class="lbl">' + esc(m.name) + '</span>' +
                   ((R.values[frame] || []).length
                      ? ' <span class="tagval">' + R.values[frame].length + ' appels</span>' : '');
    el.onclick = e => {
      e.stopPropagation();
      const t = frameInfo(frame);
      if (t) select(t, el);
    };
    container.appendChild(el);
  }
}

function openClass(c, el){
  const info = {frame: c.name, cls: c.name, name: null, line: 0, source: c.source,
                methods: (R.methods[c.name] || {}).methods || []};
  select(info, el);
}

/* ------------------------------------------- contextes d'appel d'une méthode
   Dans l'arbre, le contexte est donné par le chemin parcouru. Dans les listes à plat
   (Code exécuté, Packages) il manque : une méthode appelée depuis deux endroits n'est
   pas la même histoire. On reconstruit donc les chemins connus qui mènent à elle. */
function pathsTo(frame, max = 4){
  const found = [];
  (function walk(node, path){
    for (const kid of node.children){
      const next = path.concat([kid.name]);
      if (kid.name === frame) found.push({path: next, total: kid.total});
      else walk(kid, next);
    }
  })(R.calltree, []);
  found.sort((a,b) => b.total - a.total);
  const sum = found.reduce((a,f) => a + f.total, 0) || 1;
  return {chemins: found.slice(0, max), total: sum, nb: found.length};
}
/** Combien de chemins distincts mènent à cette méthode dans une exécution donnée. */
function occurrencesOf(run, frame){
  let n = 0;
  (function walk(node){
    for (const kid of node.children){
      if (kid.name === frame) n++;
      walk(kid);
    }
  })(run.calltree);
  return n;
}
function renderContexts(info){
  const box = document.getElementById("context");
  if (!info || !info.name){ box.innerHTML = ""; box.style.display = "none"; return; }
  const {chemins, total, nb} = pathsTo(info.frame);
  if (!chemins.length){ box.innerHTML = ""; box.style.display = "none"; return; }
  box.style.display = "block";
  const label = nb === 1 ? "Appelée depuis un seul contexte :"
                         : "Appelée depuis " + nb + " contextes — choisir lequel regarder :";
  box.innerHTML = '<span class="ctxlabel">' + label + '</span>' +
    chemins.map((c, i) => {
      const chain = c.path.filter(f => frameInfo(f));
      const short = chain.map((f, j) =>
        '<a href="#" data-f="'+esc(f)+'" class="'+(j === chain.length-1 ? "cur" : "")+'">'+
        esc(f.split("/").pop())+'</a>').join('<span class="sep"> › </span>');
      return '<div class="ctxpath'+(i === ctxIndex ? " on" : "")+'" data-i="'+i+'">'+
             '<span class="share">'+(100*c.total/total).toFixed(0)+' %</span>'+short+'</div>';
    }).join("");
  box.querySelectorAll(".ctxpath").forEach(el => el.onclick = e => {
    if (e.target.tagName === "A") return;
    ctxIndex = +el.dataset.i;
    renderContexts(info);
  });
  // Une même méthode peut avoir tourné dans d'autres exécutions : on le dit, et on y va.
  if (D.runs.length > 1){
    const ailleurs = D.runs
      .map((run, i) => ({ i, run, n: occurrencesOf(run, info.frame) }))
      .filter(o => o.i !== runIndex && o.n > 0);
    if (ailleurs.length){
      box.innerHTML += '<div class="ctxelse">Aussi appelée dans : ' +
        ailleurs.map(o => '<a href="#" data-run="'+o.i+'">'+esc(o.run.nom)+
          ' <span class="share">'+o.n+' contexte'+(o.n > 1 ? 's' : '')+'</span></a>').join(" · ") +
        '</div>';
      box.querySelectorAll("a[data-run]").forEach(a => a.onclick = e => {
        e.preventDefault();
        switchRun(+a.dataset.run, false);
        const t = frameInfo(info.frame);
        if (t) select(t, null);
      });
    }
  }
  box.querySelectorAll("a[data-f]").forEach(a => a.onclick = e => {
    e.preventDefault();
    const t = frameInfo(a.dataset.f);
    if (t) { ctxIndex = 0; select(t, null); }
  });
}

/* -------------------------------------------- appels cliquables dans le code
   Rendre navigable le code lui-même : sur une ligne qui appelle une méthode de
   l'application, le nom de cette méthode devient un lien. C'est le geste naturel —
   on lit le code, on suit l'appel — et il évite de passer par la liste de gauche.

   L'ambiguïté (deux classes ayant une méthode du même nom) est levée d'abord par les
   appels RÉELLEMENT observés sur cette ligne ; à défaut, on ne lie que les noms qui
   n'existent qu'à un seul endroit. Mieux vaut pas de lien qu'un lien qui ment. */
let methodIndex = null;

function buildMethodIndex(){
  const index = new Map();
  for (const [cls, info] of Object.entries(R.methods)){
    for (const m of info.methods){
      if (!m.covered) continue;                 // ne pas proposer du code jamais exécuté
      if (!index.has(m.name)) index.set(m.name, []);
      index.get(m.name).push(cls + "." + m.name);
    }
  }
  return index;
}

const RESERVED = new Set(["if","for","while","switch","catch","return","new","super","this","synchronized"]);

/** Étendue des durées observées pour un appel : une valeur unique masquerait la dispersion,
 *  qui est souvent l'information intéressante. */
function durationRange(a){
  if (a.cost) return a.cost;                       // ancien format, une seule mesure
  if (a.minMs === undefined) return "";
  const f = v => (v < 1 ? v.toFixed(3) : v.toFixed(2)) + "";
  return a.minMs === a.maxMs ? f(a.minMs) + "ms" : f(a.minMs) + "–" + f(a.maxMs) + "ms";
}

/**
 * Déplie les passages d'une boucle sous la ligne qui la porte.
 *
 * <p>L'agrégat « ×8 entre 0,01 et 0,30 ms » dit qu'il y a de la dispersion sans dire d'où
 * elle vient. Le détail, lui, la montre : c'est presque toujours le premier tour qui coûte
 * — cache froid, chargement paresseux, compilation à la volée — et les suivants sont
 * plats. Cette différence change le diagnostic, donc elle mérite un nœud par passage.
 */
function wireIterations(){
  document.querySelectorAll("#code a.iters").forEach(a => {
    a.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      const row = a.closest("tr");
      const next = row.nextElementSibling;
      if (next && next.classList.contains("itersrow")){ next.remove(); return; }
      const call = (R.trace[a.dataset.l] || [])[+a.dataset.i];
      if (!call) return;
      const p = call.passages || [];
      const tr = document.createElement("tr");
      tr.className = "itersrow";
      const body = p.length
        ? p.map((ms, k) => '<span class="iter"><b>' + (k + 1) + '</b>' +
            (ms < 1 ? ms.toFixed(3) : ms.toFixed(2)) + ' ms</span>').join("")
        : '<span class="iter">durées non relevées</span>';
      const reste = call.n > p.length
        ? '<span class="iter" style="opacity:.7">+' + (call.n - p.length) +
          ' passages non détaillés</span>' : "";
      tr.innerHTML = '<td class="n"></td><td colspan="2" class="iters-detail">' +
        '<b>' + esc(call.callee) + '</b> — un nœud par passage : ' + body + reste + '</td>';
      row.after(tr);
    };
  });
}

function linkifyCalls(escapedLine, lineNumber){
  if (!methodIndex) methodIndex = buildMethodIndex();
  // Ce que la trace a vu partir de cette ligne : l'information la plus sûre.
  const observed = new Map();
  for (const call of (R.trace[lineNumber] || [])){
    if (call.frame) observed.set(call.frame.slice(call.frame.lastIndexOf(".") + 1), call.frame);
  }
  return escapedLine.replace(/\b([A-Za-z_$][\w$]*)(\s*\()/g, (whole, name, tail) => {
    if (RESERVED.has(name)) return whole;
    let frame = observed.get(name);
    if (!frame){
      const candidates = methodIndex.get(name);
      if (!candidates || candidates.length !== 1) return whole;
      frame = candidates[0];
    }
    if (selected && frame === selected.frame) return whole;   // ne pas se lier à soi-même
    return '<a class="callink" href="#" data-f="' + frame + '" title="' +
           dot(frame) + '">' + name + '</a>' + tail;
  });
}

/* ------------------------------------------------------------ vue de code */
function selectFrame(frame, el){
  const info = frameInfo(frame);
  if (!info) return;
  scopeFrame = frame;
  select(info, el);
}
function select(info, el, call){
  document.querySelectorAll(".node.sel").forEach(n=>n.classList.remove("sel"));
  if (el) el.classList.add("sel");
  selected = info;
  callIndex = (call === undefined) ? null : call;
  draw();
}
/**
 * Le paquet du fichier ouvert, découpé niveau par niveau, chacun masquable.
 *
 * <p>C'est le geste le plus direct : on est en train de lire du code qui ne nous concerne
 * pas, et le chemin de ce code est déjà écrit au-dessus. Cliquer un niveau dit « plus
 * jamais celui-là » sans changer de vue ni chercher où le dire.
 */
/** Vrai si la frame désigne du code dont on peut afficher le source. */
function hasSource(frame){
  const info = frameInfo(frame);
  return !!(info && D.sources[info.source]);
}

/**
 * Découpe une valeur composite en ses champs de premier niveau.
 *
 * <p>Une valeur relevée s'écrit {@code Trip[id=TRIP-164, mode=CAR, legs=[Leg[from=…]]]} :
 * elle contient déjà ses propres clés, mais aplaties sur une ligne, illisibles dès qu'il y
 * a plus de trois champs. Les redonner un par un rend la lecture immédiate.
 *
 * <p>Le découpage compte les crochets : couper naïvement sur les virgules casserait
 * {@code legs=[Leg[…], Leg[…]]} en morceaux qui ne veulent plus rien dire.
 */
function splitFields(value){
  const open = value.indexOf("[");
  if (open < 0 || !value.endsWith("]")) return null;
  const inner = value.slice(open + 1, -1);
  const out = [];
  let depth = 0, start = 0;
  for (let i = 0; i < inner.length; i++){
    const c = inner[i];
    if (c === "[" || c === "(") depth++;
    else if (c === "]" || c === ")") depth--;
    else if (c === "," && depth === 0){ out.push(inner.slice(start, i)); start = i + 1; }
  }
  out.push(inner.slice(start));
  const pairs = [];
  for (const part of out){
    const t = part.trim();
    if (!t) continue;
    const eq = t.indexOf("=");
    // Sans '=' au premier niveau, ce n'est pas une structure à champs : on ne force pas.
    if (eq <= 0) return null;
    pairs.push({ cle: t.slice(0, eq).trim(), valeur: t.slice(eq + 1).trim() });
  }
  return pairs.length ? pairs : null;
}

/**
 * Comment découper une valeur capturée.
 *
 * <p>Deux granularités, parce qu'aucune ne convient à tous les cas. Une valeur composite
 * ({@code Trip[id=…, mode=…, legs=…]}) se lit bien éclatée en un champ par ligne — c'est ce
 * qui rend le contexte d'un appel lisible d'un coup d'œil. Mais quand les paramètres sont
 * nombreux, ou qu'on veut simplement savoir <b>ce qui a été passé</b> sans entrer dedans,
 * une ligne par paramètre suffit et tient à l'écran.
 */
let valueSplit = "champs";   // "champs" | "params"

/** Les valeurs d'un appel, une ligne clé/valeur sous le nœud de l'appel. */
function fillValueNodes(container, call, depth){
  const add = (cle, valeur, kind) => {
    const el = document.createElement("div");
    el.className = "node valnode" + (kind ? " " + kind : "");
    el.style.paddingLeft = (6 + depth * 11) + "px";
    el.innerHTML = '<span class="tw"></span><span class="vkey">' + esc(cle) +
                   '</span><span class="veq">=</span><span class="vval">' + esc(valeur) + '</span>';
    el.title = cle + " = " + valeur;
    container.appendChild(el);
  };
  (call.params || []).forEach((p, i) => {
    const fields = valueSplit === "champs" ? splitFields(p.value) : null;
    if (fields) {
      // La valeur porte ses propres clés : ce sont elles qui parlent, pas « paramètre 2 ».
      fields.forEach(f => add(f.cle, f.valeur));
    } else {
      add(p.type || ("paramètre " + (i + 1)), p.value);
    }
  });
  if (call.retour) add("⟵ retour", call.retour.value, "vret");
  if (!container.children.length) add("aucune valeur relevée", "", "vret");
}

function crumbPackage(cls){
  const parts = dot(cls).split(".").slice(0, -1);
  if (!parts.length) return '<span>(paquet par défaut) ›</span>';
  return parts.map((seg, i) => {
    const path = parts.slice(0, i + 1).join("/");
    return '<a href="#" class="pkgseg" data-p="' + esc(path) + '" title="Filtrer ' +
           esc(parts.slice(0, i + 1).join(".")) + ' — ne plus afficher ce paquet ni ce ' +
           'qu\'il contient">' +
           esc(seg) + '</a>';
  }).join('<span class="pkgdot">.</span>') + ' <span>›</span>';
}

function draw(){
  const code = document.getElementById("code");
  if (!selected){ drawHome(); return; }
  const info = selected, src = D.sources[info.source], cov = R.coverage[info.source] || {};
  const myCalls = R.values[info.frame] || [];
  const traced = info.cls === R.tracedClass;
  const samples = AGG.weights[info.frame] || 0;

  document.getElementById("crumb").innerHTML =
    '<a class="back" id="backHome" title="Revenir à la vue d\'ensemble">← Vue d\'ensemble</a> <span>›</span> ' +
    (D.runs.length > 1 ? '<span class="pill" title="Exécution dont proviennent la couverture et les valeurs affichées">'
        + '<span id="crumbname">' + esc(runLabel(R)) + '</span></span> <span>›</span> ' : '') +
    crumbPackage(info.cls) + ' <b>'+
    esc(info.cls.split("/").pop())+'.java</b>'+
    (info.name ? ' <span>›</span> <b>'+esc(info.name)+'()</b>' : '') +
    (samples ? ' <span class="pill" title="Temps passé dans cette méthode">'+
        formatWeight(samples, R.calltree.total) + ' du temps</span>' : '') +
    (myCalls.length ? ' <span class="pill" id="pillValues" style="color:var(--violet);border-color:var(--violet);cursor:pointer">'
        + myCalls.length + ' appel(s) capturé(s) — voir les valeurs</span>' : '') +
    (mode==="exec" && info.name ? ' <span class="pill" style="cursor:pointer" id="scopeBtn">ne montrer que ce qui tourne sous cette méthode</span>' : '') +
    jacocoLink(info);

  document.querySelectorAll("#crumb a.pkgseg").forEach(a => a.onclick = e => {
    e.preventDefault();
    addMask(a.dataset.p);
  });

  if (!src){ code.innerHTML = '<p style="padding:18px;color:var(--muted)">Source indisponible.</p>';
             document.getElementById("values").innerHTML=""; return; }

  let from = 0, to = 1e9;
  if (info.line){
    from = declarationLine(info);
    const next = info.methods.filter(m=>m.line>info.line).map(m=>m.line).sort((a,b)=>a-b)[0];
    to = next ? next-1 : 1e9;
  }
  // En mode resserré, on n'affiche QUE la méthode sélectionnée : à un instant donné on est
  // dans une seule méthode, ce qui lève l'ambiguïté d'une classe qui en contient plusieurs.
  const narrow = clean && info.line;
  let html = '<table class="src">', fold = 0;
  if (narrow && from > 1)
    html += '<tr><td colspan="3" class="fold">… '+(from-1)+' ligne(s) au-dessus, hors de cette méthode</td></tr>';
  src.forEach((text,i) => {
    const nr = i+1, c = cov[nr];
    if (narrow && (nr < from || nr > to)) return;
    if (clean && c && c.s === "miss"){ fold++; return; }
    if (fold){ html += '<tr><td colspan="3" class="fold">… '+fold+' ligne(s) jamais exécutée(s)</td></tr>'; fold = 0; }
    const cls = [c ? c.s : "", (info.line && nr>=from && nr<=to) ? "inmethod" : ""].join(" ");
    let ann = "";
    if (info.line && nr === info.line && myCalls.length)
      ann = '<a href="#" id="lineValues" class="values">▾ valeurs des paramètres ('+myCalls.length+')</a>';
    else if (traced && R.trace[nr])
      { const all = R.trace[nr];
        ann = "appelle " + all.slice(0,2).map((a, ai) =>
          '<a href="#" data-f="'+esc(a.frame||"")+'">'+esc(a.callee)+'</a>' +
          // Une ligne dans une boucle est appelée N fois : le ×N est cliquable et déplie
          // un nœud par passage. L'étendue min–max dit qu'il y a de la dispersion ;
          // seul le détail dit LAQUELLE, et c'est presque toujours la première itération
          // qui explique tout.
          (a.n > 1
            ? ' <a href="#" class="iters" data-l="'+nr+'" data-i="'+ai+'" ' +
              'title="Voir chaque passage de la boucle, un par un">×'+a.n+'</a>'
            : '') +
          ' <span class="dur">'+esc(durationRange(a))+'</span>').join(" · ")
          + (all.length > 2 ? ' <span style="opacity:.7">+'+(all.length-2)+'</span>' : ''); }
    html += '<tr class="'+cls+'" id="L'+nr+'"><td class="n">'+nr+'</td><td class="c">'+
            linkifyCalls(esc(text), nr)+'</td><td class="ann">'+ann+'</td></tr>';
  });
  if (fold) html += '<tr><td colspan="3" class="fold">… '+fold+' ligne(s) jamais exécutée(s)</td></tr>';
  if (narrow && to < src.length)
    html += '<tr><td colspan="3" class="fold">… '+(src.length-to)+' ligne(s) en dessous, hors de cette méthode</td></tr>';
  code.innerHTML = html+"</table>";
  wireIterations();

  const anchor = document.getElementById("L"+(info.line||1));
  if (anchor) code.scrollTop += anchor.getBoundingClientRect().top
                              - code.getBoundingClientRect().top - code.clientHeight/3;
  code.querySelectorAll("td.c a.callink").forEach(a => a.onclick = e => {
    e.preventDefault();
    const t = frameInfo(a.dataset.f);
    if (t) { ctxIndex = 0; select(t, null); }
  });
  // Les liens d'itération ont déjà leur gestionnaire ; les recâbler ici les rendrait inertes.
  code.querySelectorAll("td.ann a:not(.iters)").forEach(a => a.onclick = e => {
    e.preventDefault();
    const f = a.dataset.f;
    if (f && frameInfo(f)) select(frameInfo(f), null);
  });
  const sb = document.getElementById("scopeBtn");
  if (sb) sb.onclick = () => { scopeFrame = info.frame; renderClasses(); };
  const lv = document.getElementById("lineValues");
  if (lv) lv.onclick = e => { e.preventDefault();
    document.getElementById("values").scrollIntoView({block:"nearest"}); };
  const bh = document.getElementById("backHome");
  if (bh) bh.onclick = e => { e.preventDefault(); goHome(); };
  renderContexts(info);
  drawValues(info);
  const pv = document.getElementById("pillValues");
  if (pv) pv.onclick = () => document.getElementById("values").scrollIntoView({block:"nearest"});
}
/** Lien direct vers la page de couverture de CETTE classe, à la bonne ligne. Le rapport
 *  détaillé montre des choses que la vue intégrée n'affiche pas (compteurs par branche,
 *  complexité) : il faut pouvoir y basculer sans repartir de sa racine. */
function jacocoLink(info){
  if (!(R.rapports || {}).couverture) return "";
  const pkg = info.cls.split("/").slice(0, -1).join(".");
  const file = info.cls.split("/").pop() + ".java.html";
  const href = (R.chemin || "") + "jacoco/html/" + pkg + "/" + file +
               (info.line ? "#L" + info.line : "");
  return ' <a class="pill" style="text-decoration:none" target="_blank" rel="noopener" href="' +
         href + '" title="Ouvrir cette classe dans le rapport de couverture détaillé">' +
         'voir dans le rapport détaillé ↗</a>';
}
function declarationLine(info){
  const src = D.sources[info.source] || [];
  if (!info.name) return info.line;
  const needle = new RegExp("\\b" + info.name.replace(/[$]/g, "\\$") + "\\s*\\(");
  for (let i = info.line - 1; i >= Math.max(0, info.line - 12); i--)
    if (needle.test(src[i] || "")) return i + 1;
  return info.line;
}
function declarationOf(info){
  const src = D.sources[info.source] || [];
  if (!info.line || !info.name) return "";
  const needle = new RegExp("\\b" + info.name.replace(/[$]/g, "\\$") + "\\s*\\(");
  for (let i = info.line - 1; i >= Math.max(0, info.line - 12); i--)
    if (needle.test(src[i] || "")) return (src[i] || "").trim().replace(/\s*\{\s*$/, "");
  return "";
}
function drawValues(info){
  const box = document.getElementById("values");
  const calls = R.values[info.frame] || [];
  if (!calls.length){
    const others = Object.keys(R.values);
    // Expliquer POURQUOI il n'y a rien : sans cela, on croit à un défaut de l'outil alors
    // que c'est un choix — l'observation des valeurs est ciblée, et elle doit l'être.
    const nom = esc(info.name || info.cls.split("/").pop());
    // Une classe n'a pas de méthode à nommer : proposer « --root paquet.Classe:: » livrait
    // une commande que personne ne peut lancer. On dit alors ce qui manque.
    const cible = info.name ? "<code>" + nom + "</code>" : "la classe <code>" + nom + "</code>";
    const commande = "--root " + esc(dot(info.cls)) + "::" +
                     (info.name ? esc(info.name) : "<i>methode</i>");
    const racine = R.context && R.context.methodeRacine ? R.context.methodeRacine : null;
    box.innerHTML = others.length
      ? '<h3>Valeurs des paramètres</h3><div class="explain">' +
        '<b>Aucune valeur n\'a été capturée pour ' + cible + '</b> — ce qui ne veut ' +
        'pas dire qu\'elle n\'a pas tourné : la couverture et les temps la montrent bien. ' +
        'L\'observation des valeurs est <b>ciblée</b> sur une méthode racine' +
        (racine ? ' — ici <code>' + esc(racine) + '</code>' : '') + ', parce qu\'observer ' +
        'toutes les méthodes produirait un volume ingérable et fausserait la mesure.' +
        '<br>Pour obtenir les valeurs de ' + cible + ', relancer avec ' +
        '<code>' + commande + '</code>' +
        (info.name ? '' : ' — en nommant la méthode à observer') + '.' +
        '<br>Méthodes observées dans cette exécution : ' + others.map(f =>
          '<a href="#" class="vlink" data-f="' + esc(f) + '">' + esc(f.split("/").pop()) + '</a>')
          .join(" · ") + '</div>'
      : '<h3>Valeurs des paramètres</h3><div class="explain">Aucune méthode n\'a été observée ' +
        'dans cette exécution : relancer avec <code>--root paquet.Classe::methode</code> pour ' +
        'capturer les valeurs reçues par une méthode.</div>';
    box.querySelectorAll(".vlink").forEach(a => a.onclick = e => {
      e.preventDefault();
      const t = frameInfo(a.dataset.f);
      if (t) select(t, null);
    });
    return;
  }

  // Ce panneau ne redit PAS ce que l'arbre montre déjà. L'arbre déplie UN appel, champ par
  // champ, dans une colonne étroite. Ici on met les appels CÔTE À CÔTE — c'est ce qui répond
  // à la seule question qui compte vraiment devant des valeurs capturées : « qu'est-ce qui
  // change d'un appel à l'autre, et est-ce ça qui explique la branche prise ? ». Une colonne
  // par champ, une ligne par appel, et les colonnes qui varient sont signalées.
  const decl = declarationOf(info);
  const table = compareCalls(calls);
  box.innerHTML =
    '<h3>Les ' + calls.length + ' appel' + (calls.length > 1 ? 's' : '') +
    ' observé' + (calls.length > 1 ? 's' : '') + ' de <code>' + esc(info.name) + '</code>, comparés</h3>' +
    (decl ? '<div class="sig">' + esc(decl) + '</div>' : '') +
    (table.varying.size
      ? '<div class="explain">Les colonnes <b>surlignées</b> sont celles dont la valeur ' +
        'change d\'un appel à l\'autre : c\'est là qu\'il faut chercher ce qui a fait ' +
        'diverger l\'exécution.</div>'
      : '<div class="explain">Tous ces appels ont reçu les mêmes valeurs.</div>') +
    table.html;

  box.querySelectorAll("tr[data-i]").forEach(row => row.onclick = () => {
    callIndex = (callIndex === +row.dataset.i) ? null : +row.dataset.i;
    highlightCall();
  });
  highlightCall();

  function highlightCall(){
    box.querySelectorAll("tr[data-i]").forEach(r =>
      r.classList.toggle("on", +r.dataset.i === callIndex));
  }
}

/**
 * Met les appels en regard : une colonne par champ, une ligne par appel.
 *
 * <p>Les clés viennent des valeurs elles-mêmes quand elles en portent
 * ({@code Trip[id=…, mode=…]}), sinon du type du paramètre. Une colonne dont toutes les
 * cellules sont identiques ne dit rien de la divergence : on la garde — le contexte compte —
 * mais on ne signale que celles qui varient.
 */
function compareCalls(calls){
  const rows = calls.map(call => {
    const cells = new Map();
    (call.params || []).forEach((prm, i) => {
      const fields = valueSplit === "champs" ? splitFields(prm.value) : null;
      if (fields) fields.forEach(f => cells.set(f.cle, f.valeur));
      else cells.set(prm.type || ("paramètre " + (i + 1)), prm.value);
    });
    return { cells, retour: call.retour ? call.retour.value : null };
  });

  const keys = [];
  for (const r of rows) for (const k of r.cells.keys()) if (!keys.includes(k)) keys.push(k);

  const varying = new Set();
  for (const k of keys){
    const distinct = new Set(rows.map(r => r.cells.get(k)));
    if (distinct.size > 1) varying.add(k);
  }
  const retVaries = new Set(rows.map(r => r.retour)).size > 1;

  const head = '<tr><th></th>' +
    keys.map(k => '<th' + (varying.has(k) ? ' class="vary"' : '') + '>' + esc(k) + '</th>').join("") +
    '<th class="ret' + (retVaries ? " vary" : "") + '">⟵ retour</th></tr>';

  const body = rows.map((r, i) =>
    '<tr data-i="' + i + '" title="Mettre cet appel en évidence"><td class="idx">appel ' + (i + 1) + '</td>' +
    keys.map(k => {
      const v = r.cells.has(k) ? r.cells.get(k) : "—";
      return '<td' + (varying.has(k) ? ' class="vary"' : '') + ' title="' + esc(k + " = " + v) +
             '">' + esc(v) + '</td>';
    }).join("") +
    '<td class="ret' + (retVaries ? " vary" : "") + '">' +
    (r.retour === null ? "<i>—</i>" : esc(r.retour)) + '</td></tr>').join("");

  return { varying, html: '<div class="cmpwrap"><table class="cmp">' + head + body + '</table></div>' };
}
