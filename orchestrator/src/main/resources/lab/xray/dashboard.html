}
/* ------------------------------------------------------------ navigation au clavier
 * Un arbre se parcourt aux flèches — c'est le geste attendu partout ailleurs, et il évite
 * de viser à la souris des lignes hautes de 18 pixels. Le modèle est celui des explorateurs
 * de fichiers : haut/bas déplacent, droite ouvre puis descend, gauche ferme puis remonte.
 *
 * Le curseur est distinct de la sélection : on peut se promener sans changer ce qu'affiche
 * le panneau de droite, et n'ouvrir que ce qu'on décide d'ouvrir. */
let cursor = null;

function visibleNodes(){
  // offsetParent est nul dès qu'un ancêtre est en display:none — c'est exactement
  // « replié », sans avoir à remonter les conteneurs à la main.
  return [...document.querySelectorAll("#list .node")].filter(n => n.offsetParent !== null);
}

function setCursor(el){
  if (!el) return;
  document.querySelectorAll("#list .node.cur").forEach(n => n.classList.remove("cur"));
  el.classList.add("cur");
  cursor = el;
  el.scrollIntoView({ block: "nearest" });
}

function twOf(el){ const t = el.querySelector(".tw"); return t ? t.textContent : ""; }

/** Le conteneur des enfants d'un nœud : toujours le frère qui le suit. */
function holderOf(el){
  const h = el.nextElementSibling;
  return h && !h.classList.contains("node") ? h : null;
}

function parentNode(el){
  const holder = el.parentElement;
  if (!holder || holder.id === "list") return null;
  const prev = holder.previousElementSibling;
  return prev && prev.classList.contains("node") ? prev : null;
}

document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  // Un bouton ou un lien qui a le focus répond LUI-MÊME à Entrée et à Espace : les lui
  // prendre pour piloter l'arbre rendait muette au clavier chaque commande de la page —
  // l'aide, les exports, le repli des panneaux, celui de « Jamais exécuté ». Les flèches,
  // elles, restent à l'arbre : on veut pouvoir le parcourir sans y revenir à la souris.
  if (t && t.closest && (e.key === "Enter" || e.key === " ")
      && t.closest("button, a[href], select, summary")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!["ArrowDown", "ArrowUp", "ArrowRight", "ArrowLeft", "Enter", " ", "Home", "End"].includes(e.key)) return;

  const nodes = visibleNodes();
  if (!nodes.length) return;
  if (!cursor || !cursor.isConnected || cursor.offsetParent === null) setCursor(nodes[0]);
  const i = nodes.indexOf(cursor);
  e.preventDefault();

  switch (e.key){
    case "ArrowDown": setCursor(nodes[Math.min(i + 1, nodes.length - 1)]); break;
    case "ArrowUp":   setCursor(nodes[Math.max(i - 1, 0)]); break;
    case "Home":      setCursor(nodes[0]); break;
    case "End":       setCursor(nodes[nodes.length - 1]); break;
    case "ArrowRight": {
      if (twOf(cursor) === "▸"){ cursor.click(); }          // fermé : on ouvre
      else {
        const h = holderOf(cursor);                          // déjà ouvert : on descend
        const first = h && [...h.children].find(c => c.classList.contains("node"));
        if (first) setCursor(first);
      }
      break;
    }
    case "ArrowLeft": {
      if (twOf(cursor) === "▾"){ const c = cursor; c.click(); setCursor(c); }  // ouvert : on ferme
      else setCursor(parentNode(cursor) || cursor);                            // sinon on remonte
      break;
    }
    case "Enter":
    case " ": {
      const c = cursor;
      c.click();
      setCursor(c);
      break;
    }
  }
});

function tab(id){
  // aria-selected suit ce que la classe « on » montre : sans lui, un lecteur d'écran
  // annonce deux onglets identiques.
  ["tab-cls", "tab-tree"].forEach(t => {
    const b = document.getElementById(t);
    if (b) b.setAttribute("aria-selected", String(t === id));
  }); document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on"));
                  document.getElementById(id).classList.add("on"); }


/** Le choix du niveau : c'est lui qui fait l'apprentissage. Masquer une méthode isolée ne
 *  sert presque jamais — ce qu'on veut, c'est la bibliothèque entière, ou juste la classe
 *  bavarde. On propose donc chaque remontée possible, du paquet racine à la classe. */
function openMaskPicker(frame, anchor){
  closeMaskPicker();
  const pop = document.createElement("div");
  pop.id = "maskpop";
  pop.innerHTML = '<h4>Ne plus afficher…</h4>' +
    maskLevels(frame).map(l =>
      '<button data-p="' + esc(l.path) + '">' + esc(l.label) +
      '<span class="q">' + l.quoi + '</span></button>').join("");
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.min(r.left, window.innerWidth - pop.offsetWidth - 12) + "px";
  pop.style.top = Math.min(r.bottom + 4, window.innerHeight - pop.offsetHeight - 12) + "px";
  pop.querySelectorAll("button").forEach(b => b.onclick = e => {
    e.stopPropagation();
    addMask(b.dataset.p);
    closeMaskPicker();
  });
  setTimeout(() => document.addEventListener("click", closeMaskPicker, { once: true }), 0);
}
function closeMaskPicker(){
  const old = document.getElementById("maskpop");
  if (old) old.remove();
}

/** La liste de ce qui est masqué, et surtout la ligne à recopier dans la configuration :
 *  sans elle, l'apprentissage resterait dans ce navigateur et serait à refaire. */
function renderMaskBar(){
  const bar = document.getElementById("maskbar");
  if (!masked.length && !maskedAtSource){ bar.hidden = true; bar.innerHTML = ""; return; }
  bar.hidden = false;
  const source = maskedAtSource
    ? '<div style="color:var(--muted);font-size:11.5px">Déjà masqué à la mesure : <code>' +
      esc(maskedAtSource) + '</code></div>'
    : "";
  if (!masked.length){ bar.innerHTML = source; return; }
  bar.innerHTML =
    '<b>Masqué — retenu automatiquement</b>' +
    masked.map(m => '<span class="chip">' + esc(m.replace(/\//g, ".")) +
                    '<button data-p="' + esc(m) + '" title="Réafficher">✕</button></span>').join("") +
    // Rien à enregistrer : la liste est conservée par le navigateur et se retrouve telle
    // quelle au prochain chargement du rapport. Le bouton ci-dessous ne sert donc PAS à
    // sauvegarder — il sert à ne plus MESURER ce code du tout, ce qui est un autre sujet :
    // moins de temps de collecte, un rapport plus léger. Une page statique ne peut pas
    // écrire dans le fichier de configuration ; c'est aussi ce qui la rend transportable.
    '<div class="acts">' +
      '<button id="maskcopy" title="Pour ne plus MÊME MESURER ce code aux prochaines ' +
      'exécutions : copie la ligne HIDDEN_PACKAGES à coller dans le fichier de ' +
      'configuration">Ne plus le mesurer non plus</button>' +
      '<button id="maskclear">Tout réafficher</button>' +
    '</div>' + source;
  bar.querySelectorAll(".chip button").forEach(b => b.onclick = () => {
    masked = masked.filter(m => m !== b.dataset.p);
    saveMasks();
  });
  document.getElementById("maskcopy").onclick = e => {
    const line = 'HIDDEN_PACKAGES="' + masked.map(m => m.replace(/\//g, ".")).join(", ") + '"';
    navigator.clipboard.writeText(line).then(
      () => { e.target.textContent = "ligne copiée ✓ — à coller dans la conf";
              setTimeout(renderMaskBar, 2400); },
      () => { e.target.textContent = line; });
  };
  document.getElementById("maskclear").onclick = () => { masked = []; saveMasks(); };
}

/**
 * Le choix d'élagage, proposé sur le nœud qu'on désigne.
 *
 * <p>Deux gestes seulement, et leur portée est dite en toutes lettres : couper vaut pour
 * <b>ce chemin</b>, pas pour la méthode partout où elle apparaît — une méthode appelée
 * depuis deux endroits reste visible dans l'autre.
 */
function openPrunePicker(run, path, anchor){
  closeMaskPicker();
  const e = elagageOf(run);
  const nom = dot(path.split(";").pop());
  const pop = document.createElement("div");
  pop.id = "maskpop";
  pop.innerHTML = '<h4>Élaguer l\'arbre</h4>' +
    '<button data-a="couper">Couper cette branche' +
    '<span class="q">retire ' + esc(nom) + ' et tout ce qui en part, sur ce chemin seulement</span></button>' +
    '<button data-a="racine">Repartir d\'ici' +
    '<span class="q">masque les niveaux au-dessus : l\'arbre commence à ' + esc(nom) + '</span></button>' +
    (elagageActif(run)
      ? '<button data-a="reset">Tout rétablir<span class="q">revenir à l\'arbre mesuré</span></button>'
      : "");
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.min(r.left, window.innerWidth - pop.offsetWidth - 12) + "px";
  pop.style.top = Math.min(r.bottom + 4, window.innerHeight - pop.offsetHeight - 12) + "px";
  pop.querySelectorAll("button").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    if (b.dataset.a === "couper" && !e.coupes.includes(path)) e.coupes = e.coupes.concat([path]);
    if (b.dataset.a === "racine") e.racine = path;
    if (b.dataset.a === "reset"){ e.racine = ""; e.coupes = []; }
    poseElagage(run, e);
    closeMaskPicker();
    // Élaguer ne doit pas refermer l'arbre : on rouvre ce qui l'était, sinon chaque coupe
    // coûte de retrouver son chemin.
    const ouvert = captureExpanded();
    renderTree();
    restoreExpanded(ouvert);
    if (!selected) drawHome();
  });
  setTimeout(() => document.addEventListener("click", closeMaskPicker, { once: true }), 0);
}

/**
 * Ce qui a été coupé, affiché en permanence.
 *
 * <p>Un arbre amputé sans rien qui le dise se lit comme une mesure incomplète — c'est le
 * même principe que le bandeau des paquets masqués.
 */
function renderPruneBar(){
  const bar = document.getElementById("prunebar");
  if (!bar) return;
  const run = R;
  const e = elagageOf(run);
  // Le bandeau reste visible dans les deux onglets : le graphe de temps de la vue
  // d'ensemble suit l'élagage lui aussi, et un cadrage qui ne se voit que d'un côté se
  // fait oublier de l'autre.
  if (!elagageActif(run)){ bar.hidden = true; bar.innerHTML = ""; return; }
  bar.hidden = false;
  const chip = (label, titre, action) =>
    '<span class="chip" title="' + esc(titre) + '"><span>' + esc(label) + '</span>' +
    '<button data-a="' + action + '" title="Rétablir">✕</button></span>';
  bar.innerHTML = '<b>Arbre élagué</b>' +
    (e.racine ? chip("racine : " + dot(e.racine.split(";").pop()), dot(e.racine), "racine") : "") +
    e.coupes.map((c, i) =>
      chip("coupé : " + dot(c.split(";").pop()), dot(c), "coupe:" + i)).join("") +
    '<div class="note">Les pourcentages restent rapportés au total mesuré : élaguer cadre ' +
    'la lecture, ne corrige pas la mesure.</div>' +
    '<div class="acts"><button data-a="reset">Tout rétablir</button></div>';
  bar.querySelectorAll("button").forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === "racine") e.racine = "";
    else if (a === "reset"){ e.racine = ""; e.coupes = []; }
    else if (a.startsWith("coupe:")) e.coupes = e.coupes.filter((_, i) => i !== +a.slice(6));
    poseElagage(run, e);
    const ouvert = captureExpanded();
    renderTree();
    restoreExpanded(ouvert);
    if (!selected) drawHome();
  });
}

function renderTree(){
  mode = "tree"; tab("tab-tree"); renderScope();
  renderPruneBar();
  // L'arbre montre TOUTES les exécutions comme racines : les cocher n'aurait pas de sens.
  toggleRunPicker(false);
  showOptionsFor("tree"); resetExpandButton();
  const box = document.getElementById("list"); box.innerHTML = "";

  // Les exécutions sont les RACINES de l'arbre : une exécution est le contexte d'appel le
  // plus haut qui soit, celui qui englobe tous les autres. Avec plusieurs exécutions, on
  // les voit côte à côte et on descend dans celle qu'on veut.
  D.runs.forEach((run, idx) => {
    const total = run.calltree.total || 1;
    const head = document.createElement("div");
    head.className = "node runroot" + (idx === runIndex ? " on" : "");
    head.innerHTML = '<span class="tw">' + (idx === runIndex ? "▾" : "▸") + '</span>' +
                     '<span class="runbadge">exécution</span> ' +
                     // Le nom est ce qui s'élide : le survol le rend en entier, sinon un
                     // nom un peu long deviendrait indevinable.
                     '<span class="runname" data-runname="' + idx + '" title="'
                     + esc(runLabel(run)) + '">' + esc(runLabel(run)) + '</span>' +
                     (run.uuid ? '<span class="uid" title="Identifiant permanent : '
                                 + esc(run.uuid) + '">' + esc(shortId(run)) + '</span>' : '') +
                     ' <span class="pct2" title="Relevés de pile pris pendant cette '
                     + 'exécution : c\'est le total dont découlent ses pourcentages">'
                     + total.toLocaleString("fr") + ' mesures</span>';
    box.appendChild(head);
    const holder = document.createElement("div");
    holder.style.display = idx === runIndex ? "block" : "none";
    box.appendChild(holder);
    let built = false;
    if (idx === runIndex){ level(holder, prunedTree(run), 1, total, idx); built = true; }
    head.onclick = () => {
      // Changer d'exécution reconstruit la liste entière. Toucher AU PRÉALABLE au DOM
      // qu'on s'apprête à remplacer laissait un conteneur déjà rempli mais marqué fermé —
      // d'où une ligne orpheline sous la racine. On rend la main tout de suite : c'est le
      // re-rendu qui ouvre la bonne exécution.
      if (idx !== runIndex){ switchRun(idx, true); return; }

      const open = holder.style.display === "none";
      if (open && !built){ level(holder, prunedTree(run), 1, total, idx); built = true; }
      holder.style.display = open ? "block" : "none";
      head.querySelector(".tw").textContent = open ? "▾" : "▸";
      if (!open) goHome();
    };
  });

  /**
   * Les enfants à afficher réellement.
   *
   * <p>Le critère est simple et c'est le bon : <b>a-t-on son code source ?</b> Un arbre
   * d'appel sert à ouvrir des méthodes et à les lire. Une frame qu'on ne peut pas ouvrir —
   * un rouage de la machine virtuelle, un appel natif, une bibliothèque livrée sans ses
   * sources — n'apporte rien à cet usage : on ne pourra ni la comprendre, ni la corriger.
   *
   * <p>Elle est donc repliée sur son appelant, et on <b>remonte à sa place ses descendants
   * lisibles</b> : sans ça, du code applicatif appelé à travers un rouage de la VM (un
   * lambda, une réflexion, un thread) disparaîtrait de l'arbre avec lui. Le temps, lui,
   * reste compté chez l'appelant — rien n'est perdu.
   *
   * <p>Ces classes ne disparaissent pas de l'analyse pour autant : l'onglet <b>Code</b> les
   * liste avec leur couverture, car là c'est un inventaire, pas une lecture.
   */
  function visibleChildren(node){
    const out = [];
    for (const kid of node.children){
      if (isMasked(kid.name)) continue;
      if (hasSource(kid.name)) out.push(kid);
      else out.push(...visibleChildren(kid));
    }
    return out.sort((a, b) => b.total - a.total);
  }

  function level(container, node, depth, total, idx){
    for (const kid of visibleChildren(node)){
      if (filter && !dot(kid.name).toLowerCase().includes(filter) && !hasMatch(kid)) continue;
      const known = !!frameInfo(kid.name);
      const el = document.createElement("div");
      el.className = "node" + (known ? "" : " jdk");
      el.title = known
        ? dot(kid.name) + " — cliquer ouvre cette méthode et son code"
        : dot(kid.name) + " — code hors des classes analysées : ni source, ni couverture";
      el.style.paddingLeft = (6 + depth * 11) + "px";
      const hasCalls = frameInfo(kid.name) && (R.values[kid.name] || []).length;
      el.dataset.frame = kid.name;
      el.dataset.samples = kid.total;
      el.dataset.total = total;
      const kidsShown = visibleChildren(kid);
      el.innerHTML = '<span class="tw">' + ((kidsShown.length || hasCalls) ? "▸" : "") + '</span>' +
                     '<span class="pct" title="Part du temps mesuré passée sous cet appel, '
                     + 'ce qu\'il appelle compris">'
                     + formatWeight(kid.total, total) + '</span>' +
                     '<span class="lbl">' + esc(frameLabel(kid.name)) + '</span>' +
                     // Pas de « filtrer » ici : dans l'arbre d'appel on suit une exécution, on ne
                     // range pas du code. Le geste vit dans la vue Code et dans le chemin
                     // affiché au-dessus du source, là où on a le paquet sous les yeux.
                     ((known && (R.values[kid.name] || []).length)
                        ? ' <span class="tagval" title="Invocations de cette méthode dont les '
                          + 'paramètres ont été relevés : les déplier montre un nœud par appel">'
                          + R.values[kid.name].length + ' appels</span>' : '') +
                     '<span class="prune" title="Couper cette branche, ou repartir d\'ici">élaguer</span>';
      el.dataset.path = pathOf(kid);
      container.appendChild(el);
      const holder = document.createElement("div");
      holder.style.display = "none";
      container.appendChild(holder);
      // Les enfants ne sont construits qu'au premier dépliage. Sur une vraie application,
      // un arbre d'appel compte des dizaines de milliers de nœuds : tout construire d'avance
      // fige la page. Ici on ne paie que ce qu'on ouvre.
      // Les appels observés de cette méthode deviennent des nœuds à part entière : un
      // nœud = un appel, ce que le profil agrégé ne peut pas offrir.
      const observedCalls = known ? (R.values[kid.name] || []) : [];
      let built = false;
      el.onclick = e => {
        e.stopPropagation();
        if (e.target.classList.contains("prune")){
          openPrunePicker(D.runs[idx], pathOf(kid), e.target);
          return;
        }
        if (kidsShown.length || observedCalls.length){
          const open = holder.style.display === "none";
          if (open && !built){
            observedCalls.forEach((call, k) => {
              const leaf = document.createElement("div");
              leaf.className = "node callnode";
              leaf.style.paddingLeft = (6 + (depth + 1) * 11) + "px";
              const resume = (call.params || []).map(x => x.value).join(", ");
              leaf.innerHTML = '<span class="tw">▸</span><span class="callbadge">appel ' +
                               (k + 1) + '</span> ' + esc(resume.slice(0, 60));
              leaf.title = resume;
              leaf.__call = call;
              leaf.__depth = depth + 2;
              const fields = document.createElement("div");
              fields.style.display = "none";
              let filled = false;
              leaf.onclick = ev => {
                ev.stopPropagation();
                const open = fields.style.display === "none";
                if (open && !filled){ fillValueNodes(fields, call, depth + 2); filled = true; }
                fields.style.display = open ? "block" : "none";
                leaf.querySelector(".tw").textContent = open ? "▾" : "▸";
                if (idx !== runIndex) switchRun(idx, false);
                const info2 = frameInfo(kid.name);
                if (info2) select(info2, leaf, k);
              };
              holder.appendChild(leaf);
              holder.appendChild(fields);
            });
            level(holder, kid, depth + 1, total, idx);
            built = true;
          }
          holder.style.display = open ? "block" : "none";
          el.querySelector(".tw").textContent = open ? "▾" : "▸";
        }
        if (idx !== runIndex) switchRun(idx, false);
        if (known) selectFrame(kid.name, el);
      };
    }
  }
  function hasMatch(node){
    return visibleChildren(node).some(k => dot(k.name).toLowerCase().includes(filter) || hasMatch(k));
  }
  reprendreSelection();
}

/**
 * Vue par structure : paquet › sous-paquet › classe › méthode, filtrée au code réellement
 * exécuté par les exécutions cochées, en ordre alphabétique.
 *
 * <p>C'est le pendant de l'arbre d'appel : celui-ci suit l'exécution, celle-là suit
 * l'organisation du code. On y cherche une classe qu'on connaît, plutôt qu'un chemin.
 */
function renderClasses(){
  mode = "cls"; tab("tab-cls"); renderScope(); toggleRunPicker(true);
  renderPruneBar();
  showOptionsFor("cls"); resetExpandButton();
  const box = document.getElementById("list"); box.innerHTML = "";

  // Union des exécutions cochées : une classe compte si elle a tourné dans l'une d'elles.
  const classes = new Map();
  for (const i of [...shownRuns].sort()){
    const run = D.runs[i];
    for (const [pkg, list] of Object.entries(run.packages)){
      for (const c of list){
        if (isMasked(c.name)) continue;
        if (executedOnly && !c.covered) continue;
        const seen = classes.get(c.name);
        if (!seen) classes.set(c.name, {...c, pkg, runs: [i]});
        else { seen.covered = Math.max(seen.covered, c.covered); seen.runs.push(i); }
      }
    }
  }

  // Arborescence des paquets, un niveau par segment.
  const root = {children: new Map(), classes: []};
  for (const c of [...classes.values()]){
    if (filter && !(dot(c.name).toLowerCase().includes(filter))) continue;
    let node = root;
    for (const seg of c.pkg.split("/")){
      if (!node.children.has(seg)) node.children.set(seg, {children: new Map(), classes: []});
      node = node.children.get(seg);
    }
    node.classes.push(c);
  }

  // Un paquet qui ne contient qu'un sous-paquet est fusionné avec lui : « lab.sample.speed »
  // se lit mieux que trois niveaux vides à déplier.
  function compact(node, prefix){
    while (node.classes.length === 0 && node.children.size === 1){
      const [seg, only] = [...node.children.entries()][0];
      prefix = prefix ? prefix + "." + seg : seg;
      node = only;
    }
    return {node, prefix};
  }

  (function level(container, node, prefix, depth){
    for (const [seg, child] of [...node.children.entries()].sort((a,b)=>a[0].localeCompare(b[0]))){
      const merged = compact(child, seg);
      const el = document.createElement("div");
      el.className = "node pkgnode";
      const dotted = (prefix ? prefix + "." : "") + merged.prefix;
      el.dataset.path = "pkg:" + dotted;
      el.title = "Paquet " + dotted + " — cliquer déplie ce qu'il contient";
      el.style.paddingLeft = (6 + depth*11) + "px";
      const count = countClasses(merged.node);
      el.innerHTML = '<span class="tw">▸</span><span class="lbl">' + esc(merged.prefix.toLowerCase()) +
                     '</span> <span class="pct2" title="Classes analysées sous ce paquet">'
                     + count + (count > 1 ? " classes" : " classe") + '</span>' +
                     '<span class="mask" title="Ne plus voir ce paquet ni ce qu\'il contient">filtrer</span>';
      container.appendChild(el);
      const holder = document.createElement("div");
      holder.style.display = "none";
      container.appendChild(holder);
      let built = false;
      el.onclick = e => {
        // Sur un paquet, pas de choix de niveau à proposer : le nœud EST le niveau.
        if (e.target.classList.contains("mask")){ addMask(dotted.replace(/\./g, "/")); return; }
        const open = holder.style.display === "none";
        if (open && !built){ level(holder, merged.node, merged.prefix, depth+1); built = true; }
        holder.style.display = open ? "block" : "none";
        el.querySelector(".tw").textContent = open ? "▾" : "▸";
      };
    }
    for (const c of node.classes.sort((a,b)=>a.simple.localeCompare(b.simple))){
      const el = document.createElement("div");
      el.className = "node";
      el.style.paddingLeft = (6 + depth*11) + "px";
      const pct = c.covered + c.missed ? Math.round(100*c.covered/(c.covered+c.missed)) : 0;
      el.dataset.path = "cls:" + c.name;
      el.title = dot(c.name) + " — " + (c.covered ? pct + " % de ses instructions ont tourné"
                                                  : "jamais exécutée")
               + ". Cliquer déplie ses méthodes et ouvre la classe.";
      if (!c.covered) el.classList.add("dead");
      else if (pct < 100) el.classList.add("partial");
      else el.classList.add("live");
      el.innerHTML = '<span class="tw">▸</span><span class="pct" title="Part des '
                   + 'instructions de cette classe qui ont été exécutées">' + pct + '%</span>' +
                     '<span class="lbl">' + esc(c.simple) + '</span>' +
                     (!c.covered ? ' <span class="tagdead">jamais exécutée</span>' : '') +
                     '<span class="mask" title="Ne plus voir cette classe, ou tout son paquet">filtrer</span>';
      container.appendChild(el);
      const holder = document.createElement("div");
      holder.style.display = "none";
      container.appendChild(holder);
      let built = false;
      el.onclick = e => {
        if (e.target.classList.contains("mask")){ openMaskPicker(c.name, e.target); return; }
        const open = holder.style.display === "none";
        if (open && !built){ methodsOf(holder, c, depth+1); built = true; }
        holder.style.display = open ? "block" : "none";
        el.querySelector(".tw").textContent = open ? "▾" : "▸";
        openClass(c, el);
      };
    }
  })(box, root, "", 0);

  function countClasses(node){
    let n = node.classes.length;
    for (const child of node.children.values()) n += countClasses(child);
    return n;
  }
  reprendreSelection();
}

/** Les méthodes exécutées d'une classe, en ordre alphabétique. */
function methodsOf(container, c, depth){
  const run = D.runs.find((r, i) => shownRuns.has(i) && r.methods[c.name]) || R;
  const info = run.methods[c.name];
  if (!info) return;
  const scoped = scopeFrame ? framesUnder(scopeFrame) : null;
  const methods = info.methods
      .filter(m => m.covered || !executedOnly)
      .filter(m => !scoped || ((c.name + "." + m.name) in scoped))
      .sort((a, b) => a.name.localeCompare(b.name));
  for (const m of methods){
    const frame = c.name + "." + m.name;
    const el = document.createElement("div");
    el.className = "node " + (m.covered ? "live" : "dead");
    el.style.paddingLeft = (6 + depth*11 + 12) + "px";
    el.dataset.frame = frame;
    el.title = m.name + "() — " + (m.covered ? "a tourné pendant cette exécution"
                                             : "jamais exécutée")
             + ". Cliquer affiche son code, ligne par ligne.";
    const weight = AGG.weights[frame] || 0;
    el.dataset.samples = weight;
    el.dataset.total = R.calltree.total;
    el.innerHTML = '<span class="pct" title="Part du temps mesuré passée dans cette méthode '
                   + 'et dans ce qu\'elle appelle">'
                   + formatWeight(weight, R.calltree.total) + '</span>' +
                   '<span class="lbl">' + esc(m.name) + '</span>' +
                   ((R.values[frame] || []).length
                      ? ' <span class="tagval" title="Invocations dont les paramètres ont été '
                        + 'relevés — le bandeau du bas les montre">'
                        + R.values[frame].length + ' appels</span>' : '');
    el.onclick = e => {
      e.stopPropagation();
      const t = frameInfo(frame);
      if (t) select(t, el);
    };
    container.appendChild(el);
  }
}

function openClass(c, el){
  const info = {frame: c.name, cls: c.name, name: null, line: 0, source: c.source,
                methods: (R.methods[c.name] || {}).methods || []};
  select(info, el);
}

/* ------------------------------------------- contextes d'appel d'une méthode
   Dans l'arbre, le contexte est donné par le chemin parcouru. Dans les listes à plat
   (Code exécuté, Packages) il manque : une méthode appelée depuis deux endroits n'est
   pas la même histoire. On reconstruit donc les chemins connus qui mènent à elle. */
function pathsTo(frame, max = 4){
  const found = [];
  (function walk(node, path){
    for (const kid of node.children){
      const next = path.concat([kid.name]);
      if (kid.name === frame) found.push({path: next, total: kid.total});
      else walk(kid, next);
    }
  })(R.calltree, []);
  found.sort((a,b) => b.total - a.total);
  const sum = found.reduce((a,f) => a + f.total, 0) || 1;
  return {chemins: found.slice(0, max), total: sum, nb: found.length};
}
/** Combien de chemins distincts mènent à cette méthode dans une exécution donnée. */
/**
 * En combien d'endroits cette exécution appelle cette méthode.
 *
 * <p>Lu dans l'index de présence, calculé à l'assemblage : le compter ici demanderait
 * l'arbre d'appel de l'exécution, donc de charger toutes celles qu'on ne regarde pas pour
 * afficher une ligne sous celle qu'on regarde.
 */
function occurrencesOf(run, frame){
  const rang = D.runs.indexOf(run);
  const compte = D.presence[frame];
  if (compte) return compte[rang] || 0;
  if (!run.calltree) return 0;      // index absent et bloc non chargé : on n'invente pas
  let n = 0;
  (function walk(node){
    for (const kid of node.children){ if (kid.name === frame) n++; walk(kid); }
  })(run.calltree);
  return n;
}
function renderContexts(info){
  const box = document.getElementById("context");
  if (!info || !info.name){ box.innerHTML = ""; box.style.display = "none"; return; }
  const {chemins, total, nb} = pathsTo(info.frame);
  if (!chemins.length){ box.innerHTML = ""; box.style.display = "none"; return; }
  // Le dernier maillon de chaque chemin EST la méthode ouverte : il est déjà écrit dans le
  // fil d'Ariane juste au-dessus, et il est identique sur toutes les lignes. Ce qui
  // distingue un contexte d'un autre, c'est qui appelle — on ne montre que cela.
  const chaines = chemins.map(c => ({
    part: 100 * c.total / total,
    appelants: c.path.filter(f => frameInfo(f) && f !== info.frame)
  })).filter(c => c.appelants.length);
  // Une méthode appelée de nulle part — une racine d'exécution — n'a pas de contexte à
  // montrer. Le bandeau se taisait déjà quand aucun chemin n'était connu ; il se tait
  // aussi quand le seul chemin connu ne contient qu'elle-même.
  if (!chaines.length){ box.innerHTML = ""; box.style.display = "none"; return; }

  box.style.display = "block";
  // Avec un seul contexte, « 100 % » est vrai et ne dit rien : 100 % d'un seul chemin.
  // On ne le montre que là où il départage.
  const seul = chaines.length === 1;
  const label = seul ? "Appelée depuis :"
                     : "Appelée depuis " + nb + " contextes — choisir lequel regarder :";
  box.innerHTML = '<span class="ctxlabel">' + label + '</span>' +
    chaines.map((c, i) => {
      const short = c.appelants.map(f =>
        '<a href="#" data-f="'+esc(f)+'">'+esc(f.split("/").pop())+'</a>')
        .join('<span class="sep"> › </span>');
      return '<div class="ctxpath'+(seul ? " seul" : (i === ctxIndex ? " on" : ""))+'"'+
             ' data-i="'+i+'">'+
             (seul ? "" : '<span class="share">'
                + (c.part < 1 && c.part > 0 ? "&lt;1" : c.part.toFixed(0)) + ' %</span>')
             + short + '</div>';
    }).join("");
  box.querySelectorAll(".ctxpath").forEach(el => el.onclick = e => {
    if (e.target.tagName === "A") return;
    ctxIndex = +el.dataset.i;
    renderContexts(info);
  });
  // Une même méthode peut avoir tourné dans d'autres exécutions : on le dit, et on y va.
  if (D.runs.length > 1){
    const ailleurs = D.runs
      .map((run, i) => ({ i, run, n: occurrencesOf(run, info.frame) }))
      .filter(o => o.i !== runIndex && o.n > 0);
    if (ailleurs.length){
      box.innerHTML += '<div class="ctxelse" title="Cette méthode a aussi tourné dans '
        + 'd\'autres exécutions de ce rapport : cliquer bascule dessus">Aussi appelée dans : ' +
        ailleurs.map(o => '<a href="#" data-run="'+o.i+'" title="Voir '+esc(dot(info.frame))
          + ' dans « '+esc(runLabel(o.run))+' »">'+esc(runLabel(o.run)) +
          ' <span class="share">— '+o.n+' chemin'+(o.n > 1 ? 's' : '')+' d\'appel</span></a>')
          .join(" · ") + '</div>';
      box.querySelectorAll("a[data-run]").forEach(a => a.onclick = e => {
        e.preventDefault();
        switchRun(+a.dataset.run, false);
        const t = frameInfo(info.frame);
        if (t) select(t, null);
      });
    }
  }
  box.querySelectorAll("a[data-f]").forEach(a => a.onclick = e => {
    e.preventDefault();
    const t = frameInfo(a.dataset.f);
    if (t) { ctxIndex = 0; select(t, null); }
  });
}

/* -------------------------------------------- appels cliquables dans le code
   Rendre navigable le code lui-même : sur une ligne qui appelle une méthode de
   l'application, le nom de cette méthode devient un lien. C'est le geste naturel —
   on lit le code, on suit l'appel — et il évite de passer par la liste de gauche.

   L'ambiguïté (deux classes ayant une méthode du même nom) est levée d'abord par les
   appels RÉELLEMENT observés sur cette ligne ; à défaut, on ne lie que les noms qui
   n'existent qu'à un seul endroit. Mieux vaut pas de lien qu'un lien qui ment. */
let methodIndex = null;

function buildMethodIndex(){
  const index = new Map();
  for (const [cls, info] of Object.entries(R.methods)){
    for (const m of info.methods){
      if (!m.covered) continue;                 // ne pas proposer du code jamais exécuté
      if (!index.has(m.name)) index.set(m.name, []);
      index.get(m.name).push(cls + "." + m.name);
    }
  }
  return index;
}

const RESERVED = new Set(["if","for","while","switch","catch","return","new","super","this","synchronized"]);

/** Étendue des durées observées pour un appel : une valeur unique masquerait la dispersion,
 *  qui est souvent l'information intéressante. */
function durationRange(a){
  if (a.cost) return a.cost;                       // ancien format, une seule mesure
  if (a.minMs === undefined) return "";
  const f = v => (v < 1 ? v.toFixed(3) : v.toFixed(2)) + "";
  return a.minMs === a.maxMs ? f(a.minMs) + "ms" : f(a.minMs) + "–" + f(a.maxMs) + "ms";
}

/**
 * Déplie les passages d'une boucle sous la ligne qui la porte.
 *
 * <p>L'agrégat « ×8 entre 0,01 et 0,30 ms » dit qu'il y a de la dispersion sans dire d'où
 * elle vient. Le détail, lui, la montre : c'est presque toujours le premier tour qui coûte
 * — cache froid, chargement paresseux, compilation à la volée — et les suivants sont
 * plats. Cette différence change le diagnostic, donc elle mérite un nœud par passage.
 */
function wireIterations(){
  document.querySelectorAll("#code a.iters").forEach(a => {
    a.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      const row = a.closest("tr");
      const next = row.nextElementSibling;
      if (next && next.classList.contains("itersrow")){ next.remove(); return; }
      const call = (R.trace[a.dataset.l] || [])[+a.dataset.i];
      if (!call) return;
      const p = call.passages || [];
      const tr = document.createElement("tr");
      tr.className = "itersrow";
      const body = p.length
        ? p.map((ms, k) => '<span class="iter"><b>' + (k + 1) + '</b>' +
            (ms < 1 ? ms.toFixed(3) : ms.toFixed(2)) + ' ms</span>').join("")
        : '<span class="iter">durées non relevées</span>';
      const reste = call.n > p.length
        ? '<span class="iter" style="opacity:.7">+' + (call.n - p.length) +
          ' passages non détaillés</span>' : "";
      tr.innerHTML = '<td class="n"></td><td colspan="2" class="iters-detail">' +
        '<b>' + esc(call.callee) + '</b> — un nœud par passage : ' + body + reste + '</td>';
      row.after(tr);
    };
  });
}

function linkifyCalls(escapedLine, lineNumber){
  if (!methodIndex) methodIndex = buildMethodIndex();
  // Ce que la trace a vu partir de cette ligne : l'information la plus sûre.
  const observed = new Map();
  for (const call of (R.trace[lineNumber] || [])){
    if (call.frame) observed.set(call.frame.slice(call.frame.lastIndexOf(".") + 1), call.frame);
  }
  return escapedLine.replace(/\b([A-Za-z_$][\w$]*)(\s*\()/g, (whole, name, tail) => {
    if (RESERVED.has(name)) return whole;
    let frame = observed.get(name);
    if (!frame){
      const candidates = methodIndex.get(name);
      if (!candidates || candidates.length !== 1) return whole;
      frame = candidates[0];
    }
    if (selected && frame === selected.frame) return whole;   // ne pas se lier à soi-même
    return '<a class="callink" href="#" data-f="' + frame + '" title="' +
           dot(frame) + '">' + name + '</a>' + tail;
  });
}


/* ============================================================ navigation
   Deux onglets qui montrent le même code sous deux angles, et une méthode ouverte : passer
   de l'un à l'autre perdait la sélection et renvoyait à la vue d'ensemble. On repartait
   alors de zéro pour retrouver ce qu'on venait de quitter. */

/** Ce qu'on est en train de regarder, réduit à ce qui suffit à y revenir. */
function vueCourante(){
  return {mode: mode, run: runIndex, frame: selected ? selected.frame : null,
          call: callIndex, ctx: ctxIndex, scope: scopeFrame};
}
function memeVue(a, b){
  return !!a && !!b && a.mode === b.mode && a.run === b.run && a.frame === b.frame
      && a.call === b.call;
}

let histoire = [], histoirePos = -1, rejoue = false;

/**
 * Note la vue courante dans l'historique.
 *
 * <p>Rien n'est noté pendant qu'on rejoue une vue — sans quoi revenir en arrière
 * empilerait aussitôt la vue d'où l'on vient, et le bouton « suivant » ne servirait
 * jamais. Repartir d'une vue ancienne coupe la suite, comme le fait un navigateur.
 */
function noterVue(){
  if (rejoue) return;
  const v = vueCourante();
  if (memeVue(histoire[histoirePos], v)) { histoire[histoirePos] = v; return; }
  histoire = histoire.slice(0, histoirePos + 1);
  histoire.push(v);
  histoirePos = histoire.length - 1;
  majNav();
}

function allerA(pos){
  if (pos < 0 || pos >= histoire.length) return;
  const v = histoire[pos];
  histoirePos = pos;
  rejoue = true;
  try {
    if (v.run !== runIndex) switchRun(v.run, false);
    scopeFrame = v.scope;
    ctxIndex = v.ctx || 0;
    if (v.mode === "tree") renderTree(); else renderClasses();
    if (v.frame){
      const t = frameInfo(v.frame);
      if (t){ select(t, null, v.call === null ? undefined : v.call); devoiler(v.frame); }
    } else goHome();
  } finally { rejoue = false; }
  majNav();
}

function majNav(){
  const p = document.getElementById("navprec"), s = document.getElementById("navsuiv");
  if (!p || !s) return;
  p.disabled = histoirePos <= 0;
  s.disabled = histoirePos >= histoire.length - 1;
}

/* ------------------------------------------------ dévoiler une méthode dans une vue */

/**
 * Ouvre ce qu'il faut pour que {@code frame} soit visible et sélectionné dans la vue
 * courante, et rend {@code true} si on l'a trouvée.
 *
 * <p>Les deux arbres se construisent au fur et à mesure qu'on les déplie : on ne peut pas
 * chercher un nœud qui n'existe pas encore. On rejoue donc le chemin, en cliquant les
 * parents l'un après l'autre — exactement ce qu'aurait fait la main.
 */
function devoiler(frame){
  const trouve = mode === "tree" ? devoilerDansArbre(frame) : devoilerDansCode(frame);
  return trouve;
}

function devoilerDansCode(frame){
  const info = frameInfo(frame);
  if (!info) return false;
  const paquet = dot(info.cls).split(".").slice(0, -1).join(".");
  let conteneur = document.getElementById("list");
  for (let garde = 0; garde < 40; garde++){
    const noeuds = [...conteneur.querySelectorAll(":scope > .node")];
    const classe = noeuds.find(n => n.dataset.path === "cls:" + info.cls);
    if (classe){
      if (deplier(classe)) { /* la classe s'ouvre et se sélectionne elle-même */ }
      const dedans = classe.nextElementSibling;
      const meth = info.name && dedans
        ? [...dedans.querySelectorAll(":scope > .node")].find(n => n.dataset.frame === frame)
        : null;
      const cible = meth || classe;
      cible.click();
      cible.scrollIntoView({block: "center", behavior: "smooth"});
      return true;
    }
    // Les paquets sont compactés — « lab.sample » peut tenir en un seul nœud : on cherche
    // celui dont le chemin est un préfixe du paquet visé, et on descend dedans.
    const pkg = noeuds.find(n => (n.dataset.path || "").startsWith("pkg:")
      && (paquet + ".").startsWith(n.dataset.path.slice(4) + "."));
    if (!pkg) return false;
    deplier(pkg);
    conteneur = pkg.nextElementSibling;
    if (!conteneur) return false;
  }
  return false;
}

/** Ouvre un nœud s'il est fermé, et dit s'il a fallu le faire. */
function deplier(el){
  const tw = el.querySelector(".tw");
  if (tw && tw.textContent === "▸"){ el.click(); return true; }
  return false;
}

/** Le chemin le plus court, dans un arbre d'appel, jusqu'à un nom de frame. */
function cheminVers(arbre, frame){
  const file = [{node: arbre, chemin: []}];
  while (file.length){
    const {node, chemin} = file.shift();
    for (const kid of node.children || []){
      const suite = chemin.concat([pathOf(kid)]);
      if (kid.name === frame) return suite;
      file.push({node: kid, chemin: suite});
    }
  }
  return null;
}

function devoilerDansArbre(frame){
  // On regarde d'abord l'exécution ouverte ; sinon la première où la méthode apparaît,
  // dans l'ordre du rapport.
  const ordre = [runIndex].concat(D.runs.map((_, i) => i).filter(i => i !== runIndex));
  for (const idx of ordre){
    // Seules les exécutions déjà chargées livrent un chemin : les autres se contentent du
    // compte, que l'index de présence donne sans rien charger.
    if (!D.runs[idx].calltree) continue;
    const chemin = cheminVers(prunedTree(D.runs[idx]), frame);
    if (!chemin) continue;
    if (idx !== runIndex){
      // Changer d'exécution reconstruit l'arbre : on repose l'intention, et c'est le
      // re-rendu qui la consomme.
      aDevoiler = frame;
      switchRun(idx, true);
      return true;
    }
    return poserDansArbre(chemin);
  }
  return false;
}

function poserDansArbre(chemin){
  const box = document.getElementById("list");
  const racine = [...box.querySelectorAll(":scope > .node.runroot")][runIndex];
  if (!racine) return false;
  deplier(racine);
  let conteneur = racine.nextElementSibling;
  for (let i = 0; i < chemin.length; i++){
    if (!conteneur) return false;
    const el = [...conteneur.querySelectorAll(":scope > .node")]
      .find(n => n.dataset.path === chemin[i]);
    if (!el) return false;
    if (i === chemin.length - 1){
      el.click();
      el.scrollIntoView({block: "center", behavior: "smooth"});
      return true;
    }
    deplier(el);
    conteneur = el.nextElementSibling;
  }
  return false;
}

/** Ouvre un paquet dans la vue Code — ce que fait un clic sur le fil d'Ariane. */
function ouvrirPaquet(chemin){
  const vise = dot(chemin);
  aDevoiler = null;
  if (mode !== "cls") renderClasses();
  let conteneur = document.getElementById("list");
  for (let garde = 0; garde < 40; garde++){
    const noeuds = [...conteneur.querySelectorAll(":scope > .node")];
    const pkg = noeuds.find(n => (n.dataset.path || "").startsWith("pkg:")
      && (vise + ".").startsWith(n.dataset.path.slice(4) + "."));
    if (!pkg) return;
    deplier(pkg);
    pkg.scrollIntoView({block: "center", behavior: "smooth"});
    if (pkg.dataset.path.slice(4) === vise) return;
    conteneur = pkg.nextElementSibling;
    if (!conteneur) return;
  }
}

/** L'intention posée avant un rendu, consommée à la fin de celui-ci. */
let aDevoiler = null;

/**
 * Reprend la sélection après un changement de vue.
 *
 * <p>Appelé à la fin des deux rendus. Si la méthode n'existe pas dans la vue d'arrivée —
 * un paquet masqué, une exécution où elle n'a jamais tourné — on ne force rien : la vue
 * s'ouvre normalement, et on le dit plutôt que de faire semblant.
 */
function reprendreSelection(){
  const frame = aDevoiler;
  aDevoiler = null;
  if (!frame) return;
  rejoue = true;
  try {
    if (!devoiler(frame)) montrerBref(dot(frame).split(".").pop()
      + " n'apparaît pas dans cette vue.");
  } finally { rejoue = false; }
  noterVue();
}

/** Un mot en bas à droite, qui s'efface tout seul. */
function montrerBref(texte){
  let b = document.getElementById("bref");
  if (!b){
    b = document.createElement("div");
    b.id = "bref";
    document.body.appendChild(b);
  }
  b.textContent = texte;
  b.hidden = false;
  clearTimeout(montrerBref.t);
  montrerBref.t = setTimeout(() => { b.hidden = true; }, 3200);
}

/* ------------------------------------------------------------ vue de code */
function selectFrame(frame, el){
  const info = frameInfo(frame);
  if (!info) return;
  scopeFrame = frame;
  select(info, el);
}
function select(info, el, call){
  document.querySelectorAll(".node.sel").forEach(n=>n.classList.remove("sel"));
  if (el) el.classList.add("sel");
  selected = info;
  callIndex = (call === undefined) ? null : call;
  // Le code de cette classe vit dans un bloc : on l'attend, puis on dessine. C'est le seul
  // endroit qui en a besoin — l'arbre, lui, se contente des clés.
  XR.source(info && info.source).then(draw, draw);
  noterVue();
}
/**
 * Le paquet du fichier ouvert, découpé niveau par niveau, chacun masquable.
 *
 * <p>C'est le geste le plus direct : on est en train de lire du code qui ne nous concerne
 * pas, et le chemin de ce code est déjà écrit au-dessus. Cliquer un niveau dit « plus
 * jamais celui-là » sans changer de vue ni chercher où le dire.
 */
/**
 * Ce qu'on dit à la place du code, quand on ne l'a pas.
 *
 * <p>« Source indisponible » est un constat d'échec sans prise : il ne dit ni ce qu'on
 * cherchait, ni où l'on a regardé, ni quoi corriger. Or l'outil sait les trois. Le panneau
 * les écrit — la clé attendue, chaque racine avec son chemin absolu et ce qu'elle a rendu,
 * et, quand un fichier du même nom traîne ailleurs dans l'index, où il est.
 *
 * <p>Le cas le plus fréquent — aucune racine passée — se termine par la ligne exacte à
 * ajouter à la configuration. C'est un message qu'on doit pouvoir suivre sans rien
 * connaître de l'outil.
 */
function constatSourceAbsente(info){
  const d = diagSources(), racines = d.racines || [];
  const cle = info.source || "(inconnue)";
  const nom = cle.split("/").pop();
  const ailleurs = ((d.parNom || {})[nom]) || [];
  let h = '<div class="constat">';
  h += '<h3>Le code de cette classe n\'a pas été trouvé</h3>';
  const paquet = cle.lastIndexOf("/") > 0 ? dot(cle.slice(0, cle.lastIndexOf("/")))
                                          : "(paquet par défaut)";
  h += '<p>La couverture rapporte ce fichier sous la clé <code>'+esc(cle)+'</code> — '
     + 'c\'est-à-dire le paquet <code>'+esc(paquet)
     + '</code> et le fichier <code>'+esc(nom)+'</code>. C\'est ce fichier-là qui manque.</p>';

  if (!racines.length){
    h += '<p class="cause"><b>Aucun répertoire de sources n\'a été passé à l\'outil.</b> '
       + 'La mesure n\'en a pas besoin, l\'affichage du code annoté si.</p>';
    h += '<p>Ajouter au fichier de configuration :</p>'
       + '<pre class="remede">SOURCE_DIRS="'+esc(racineProbable(cle))+'"</pre>'
       + '<p>ou relancer avec <code>--sources '+esc(racineProbable(cle))+'</code>. '
       + 'Plusieurs racines se séparent par <code>:</code>. Le niveau exact importe peu : '
       + 'l\'outil lit le paquet déclaré par chaque fichier, pas son chemin.</p>';
  } else {
    h += '<p>Répertoires de sources consultés — '+racines.length+' :</p><ul class="racines">';
    racines.forEach(r => {
      h += '<li><code>'+esc(r.demandee)+'</code>'
         + (r.absolue && r.absolue !== r.demandee ? ' <span class="abs">→ '+esc(r.absolue)+'</span>' : '')
         + '<br><span class="'+(r.existe ? 'ok' : 'ko')+'">'
         + (r.existe ? '✓ répertoire lu — '+(r.fichiers||0)+' fichier(s) .java'
                     : '✗ '+esc(r.motif || 'introuvable'))
         + '</span>'
         + (r.motif && r.existe ? '<br><span class="ko">'+esc(r.motif)+'</span>' : '')
         + '</li>';
    });
    h += '</ul>';
    h += '<p>Total indexé : <b>'+(d.fichiers||0)+'</b> fichier(s) .java'
       + (d.tronque ? ' <span class="ko">(parcours tronqué : la racine passée est très '
                    + 'large, l\'index est incomplet)</span>' : '') + '.</p>';

    if (ailleurs.length){
      h += '<p class="cause">Un fichier nommé <code>'+esc(nom)+'</code> a pourtant été trouvé :</p>'
         + '<ul class="racines">';
      ailleurs.forEach(o => {
        h += '<li><code>'+esc(o.chemin)+'</code><br><span class="abs">paquet déclaré : <b>'
           + esc(o.paquet || '(aucun)')+'</b> — indexé sous <code>'+esc(o.cle)+'</code></span></li>';
      });
      h += '</ul><p>Le paquet déclaré ne correspond pas à celui que la couverture rapporte : '
         + 'ce n\'est pas la même classe, ou les sources présentes ne sont pas celles du '
         + 'binaire analysé.</p>';
    } else if (d.fichiers){
      h += '<p class="cause">Aucun fichier de ce nom sous ces racines.</p>'
         + '<p>Les sources indexées ne couvrent pas ce paquet : il manque une racine, ou le '
         + 'code de cette classe vient d\'une bibliothèque dont on n\'a pas les sources.</p>';
    }
  }
  h += pistesSources();
  h += '<p class="apres">Le détail complet — configuration, exécutions, rapprochement classe '
     + 'par classe — est dans <code>diagnostic.json</code>, à côté de cette page.</p>';
  return h + '</div>';
}

/**
 * La racine à proposer quand rien n'a été passé.
 *
 * <p>On ne devine pas le disque : on propose la disposition la plus répandue. Elle est
 * juste dans la grande majorité des projets, et fausse elle reste un point de départ que
 * le lecteur corrige d\'un coup d\'œil — ce qu\'un message vide ne permettait pas.
 */
function racineProbable(){
  return "src/main/java";
}

/** Vrai si la frame désigne du code dont on peut afficher le source. */
function hasSource(frame){
  const info = frameInfo(frame);
  // Les CLÉS suffisent : demander le contenu pour savoir s'il existe annulerait tout le
  // bénéfice du découpage, puisque l'arbre pose la question sur chaque nœud.
  return !!(info && D.sourcesDisponibles[info.source]);
}

/**
 * Découpe une valeur composite en ses champs de premier niveau.
 *
 * <p>Une valeur relevée s'écrit {@code Trip[id=TRIP-164, mode=CAR, legs=[Leg[from=…]]]} :
 * elle contient déjà ses propres clés, mais aplaties sur une ligne, illisibles dès qu'il y
 * a plus de trois champs. Les redonner un par un rend la lecture immédiate.
 *
 * <p>Le découpage compte les crochets : couper naïvement sur les virgules casserait
 * {@code legs=[Leg[…], Leg[…]]} en morceaux qui ne veulent plus rien dire.
 */
function splitFields(value){
  const open = value.indexOf("[");
  if (open < 0 || !value.endsWith("]")) return null;
  const inner = value.slice(open + 1, -1);
  const out = [];
  let depth = 0, start = 0;
  for (let i = 0; i < inner.length; i++){
    const c = inner[i];
    if (c === "[" || c === "(") depth++;
    else if (c === "]" || c === ")") depth--;
    else if (c === "," && depth === 0){ out.push(inner.slice(start, i)); start = i + 1; }
  }
  out.push(inner.slice(start));
  const pairs = [];
  for (const part of out){
    const t = part.trim();
    if (!t) continue;
    const eq = t.indexOf("=");
    // Sans '=' au premier niveau, ce n'est pas une structure à champs : on ne force pas.
    if (eq <= 0) return null;
    pairs.push({ cle: t.slice(0, eq).trim(), valeur: t.slice(eq + 1).trim() });
  }
  return pairs.length ? pairs : null;
}

/**
 * Comment découper une valeur capturée.
 *
 * <p>Deux granularités, parce qu'aucune ne convient à tous les cas. Une valeur composite
 * ({@code Trip[id=…, mode=…, legs=…]}) se lit bien éclatée en un champ par ligne — c'est ce
 * qui rend le contexte d'un appel lisible d'un coup d'œil. Mais quand les paramètres sont
 * nombreux, ou qu'on veut simplement savoir <b>ce qui a été passé</b> sans entrer dedans,
 * une ligne par paramètre suffit et tient à l'écran.
 */
let valueSplit = "champs";   // "champs" | "params"

/** Les valeurs d'un appel, une ligne clé/valeur sous le nœud de l'appel. */
function fillValueNodes(container, call, depth){
  const add = (cle, valeur, kind) => {
    const el = document.createElement("div");
    el.className = "node valnode" + (kind ? " " + kind : "");
    el.style.paddingLeft = (6 + depth * 11) + "px";
    el.innerHTML = '<span class="tw"></span><span class="vkey">' + esc(cle) +
                   '</span><span class="veq">=</span><span class="vval">' + esc(valeur) + '</span>';
    el.title = cle + " = " + valeur;
    container.appendChild(el);
  };
  (call.params || []).forEach((p, i) => {
    const fields = valueSplit === "champs" ? splitFields(p.value) : null;
    if (fields) {
      // La valeur porte ses propres clés : ce sont elles qui parlent, pas « paramètre 2 ».
      fields.forEach(f => add(f.cle, f.valeur));
    } else {
      add(p.type || ("paramètre " + (i + 1)), p.value);
    }
  });
  if (call.retour) add("⟵ retour", call.retour.value, "vret");
  if (!container.children.length) add("aucune valeur relevée", "", "vret");
}

function crumbPackage(cls){
  const parts = dot(cls).split(".").slice(0, -1);
  if (!parts.length) return '<span>(paquet par défaut) ›</span>';
  // Un fil d'Ariane sert à remonter, pas à faire disparaître. Cliquer un segment ouvrait
  // ici le paquet dans le masque : le geste le plus naturel de la page faisait la chose la
  // plus destructrice. Il ouvre maintenant ce paquet dans la vue Code ; « ne plus voir »
  // reste où il a toujours été, au bout de la ligne dans la liste de gauche.
  return parts.map((seg, i) => {
    const path = parts.slice(0, i + 1).join("/");
    return '<a href="#" class="pkgseg" data-p="' + esc(path) + '" title="Ouvrir ' +
           esc(parts.slice(0, i + 1).join(".")) + ' dans la liste du code">' +
           esc(seg) + '</a>';
  }).join('<span class="pkgdot">.</span>') + ' <span>›</span>';
}

function draw(){
  const code = document.getElementById("code");
  if (!selected){ drawHome(); return; }
  const info = selected, src = D.sources[info.source], cov = covPourVue(info.source);
  const myCalls = R.values[info.frame] || [];
  const traced = info.cls === R.tracedClass;
  const samples = AGG.weights[info.frame] || 0;

  document.getElementById("crumb").innerHTML =
    '<a class="back" id="backHome" title="Revenir à la vue d\'ensemble">← Vue d\'ensemble</a> <span>›</span> ' +
    (D.runs.length > 1 ? '<span class="pill" title="' + (cumul
        ? 'Couverture réunie sur les exécutions cochées — les valeurs affichées restent '
          + 'celles de l\'exécution regardée'
        : 'Exécution dont proviennent la couverture et les valeurs affichées')
        + '"' + (cumul ? ' style="color:var(--violet);border-color:var(--violet)"' : '') + '>'
        + (cumul ? 'cumul de ' + runsCoches().length + ' exécutions'
                 : '<span id="crumbname">' + esc(runLabel(R)) + '</span>')
        + '</span> <span>›</span> ' : '') +
    crumbPackage(info.cls) + ' <b>'+
    esc(info.cls.split("/").pop())+'.java</b>'+
    (info.name ? ' <span>›</span> <b>'+esc(info.name)+'()</b>' : '') +
    (samples ? ' <span class="pill" title="Part du temps mesuré passée dans cette méthode '
        + 'et dans ce qu\'elle appelle, tous appels confondus">'
        + partDuTemps(samples) + '</span>' : '') +
    (myCalls.length ? ' <span class="pill" id="pillValues" title="Invocations de cette '
        + 'méthode dont Arthas a relevé les paramètres et le retour — cliquer ouvre le '
        + 'bandeau du bas" style="color:var(--violet);border-color:var(--violet);cursor:pointer">'
        + myCalls.length + ' appel(s) capturé(s) — voir les valeurs</span>' : '') +
    (mode==="exec" && info.name ? ' <span class="pill" style="cursor:pointer" id="scopeBtn"'
        + ' title="Restreindre la liste de gauche au code appelé sous cette méthode, sans '
        + 'avoir à descendre d\'appel en appel">ne montrer que ce qui tourne sous cette '
        + 'méthode</span>' : '') +
    jacocoLink(info);

  document.querySelectorAll("#crumb a.pkgseg").forEach(a => a.onclick = e => {
    e.preventDefault();
    ouvrirPaquet(a.dataset.p);
  });

  if (!src){ code.innerHTML = constatSourceAbsente(info);
             document.getElementById("values").innerHTML=""; return; }

  let from = 0, to = 1e9;
  if (info.line){
    from = declarationLine(info);
    const next = info.methods.filter(m=>m.line>info.line).map(m=>m.line).sort((a,b)=>a-b)[0];
    to = next ? next-1 : 1e9;
  }
  // En mode resserré, on n'affiche QUE la méthode sélectionnée : à un instant donné on est
  // dans une seule méthode, ce qui lève l'ambiguïté d'une classe qui en contient plusieurs.
  const narrow = clean && info.line;
  let html = '<table class="src">', fold = 0;
  if (narrow && from > 1)
    html += '<tr><td colspan="3" class="fold">… '+(from-1)+' ligne(s) au-dessus, hors de cette méthode</td></tr>';
  src.forEach((text,i) => {
    const nr = i+1, c = cov[nr];
    if (narrow && (nr < from || nr > to)) return;
    if (clean && c && c.s === "miss"){ fold++; return; }
    if (fold){ html += '<tr><td colspan="3" class="fold">… '+fold+' ligne(s) jamais exécutée(s)</td></tr>'; fold = 0; }
    const cls = [c ? c.s : "", (info.line && nr>=from && nr<=to) ? "inmethod" : ""].join(" ");
    let ann = "";
    if (info.line && nr === info.line && myCalls.length)
      ann = '<a href="#" id="lineValues" class="values" title="Ouvrir le bandeau du bas sur '
          + 'les invocations relevées de cette méthode : leurs paramètres et leur retour">'
          + '▾ valeurs des paramètres ('+myCalls.length+')</a>';
    else if (traced && R.trace[nr])
      { const all = R.trace[nr];
        ann = "appelle " + all.slice(0,2).map((a, ai) =>
          '<a href="#" data-f="'+esc(a.frame||"")+'">'+esc(a.callee)+'</a>' +
          // Une ligne dans une boucle est appelée N fois : le ×N est cliquable et déplie
          // un nœud par passage. L'étendue min–max dit qu'il y a de la dispersion ;
          // seul le détail dit LAQUELLE, et c'est presque toujours la première itération
          // qui explique tout.
          (a.n > 1
            ? ' <a href="#" class="iters" data-l="'+nr+'" data-i="'+ai+'" ' +
              'title="Voir chaque passage de la boucle, un par un">×'+a.n+'</a>'
            : '') +
          ' <span class="dur">'+esc(durationRange(a))+'</span>').join(" · ")
          + (all.length > 2 ? ' <span style="opacity:.7">+'+(all.length-2)+'</span>' : ''); }
    html += '<tr class="'+cls+'" id="L'+nr+'"><td class="n">'+nr+'</td><td class="c">'+
            linkifyCalls(esc(text), nr)+'</td><td class="ann">'+pastillesRuns(c)+ann+'</td></tr>';
  });
  if (fold) html += '<tr><td colspan="3" class="fold">… '+fold+' ligne(s) jamais exécutée(s)</td></tr>';
  if (narrow && to < src.length)
    html += '<tr><td colspan="3" class="fold">… '+(src.length-to)+' ligne(s) en dessous, hors de cette méthode</td></tr>';
  code.innerHTML = html+"</table>";
  wireIterations();

  const anchor = document.getElementById("L"+(info.line||1));
  if (anchor) code.scrollTop += anchor.getBoundingClientRect().top
                              - code.getBoundingClientRect().top - code.clientHeight/3;
  code.querySelectorAll("td.c a.callink").forEach(a => a.onclick = e => {
    e.preventDefault();
    const t = frameInfo(a.dataset.f);
    if (t) { ctxIndex = 0; select(t, null); }
  });
  // Les liens d'itération ont déjà leur gestionnaire ; les recâbler ici les rendrait inertes.
  code.querySelectorAll("td.ann a:not(.iters)").forEach(a => a.onclick = e => {
    e.preventDefault();
    const f = a.dataset.f;
    if (f && frameInfo(f)) select(frameInfo(f), null);
  });
  const sb = document.getElementById("scopeBtn");
  if (sb) sb.onclick = () => { scopeFrame = info.frame; renderClasses(); };
  const lv = document.getElementById("lineValues");
  if (lv) lv.onclick = e => { e.preventDefault();
    document.getElementById("values").scrollIntoView({block:"nearest"}); };
  renderIdentity();   // le bandeau d'identité s'efface : on lit une méthode, pas l'exécution
  const bh = document.getElementById("backHome");
  if (bh) bh.onclick = e => { e.preventDefault(); goHome(); };
  renderContexts(info);
  drawValues(info);
  const pv = document.getElementById("pillValues");
  if (pv) pv.onclick = () => document.getElementById("values").scrollIntoView({block:"nearest"});
}
/** Lien direct vers la page de couverture de CETTE classe, à la bonne ligne. Le rapport
 *  détaillé montre des choses que la vue intégrée n'affiche pas (compteurs par branche,
 *  complexité) : il faut pouvoir y basculer sans repartir de sa racine. */
function jacocoLink(info){
  if (!(R.rapports || {}).couverture) return "";
  const pkg = info.cls.split("/").slice(0, -1).join(".");
  const file = info.cls.split("/").pop() + ".java.html";
  const href = (R.chemin || "") + "jacoco/html/" + pkg + "/" + file +
               (info.line ? "#L" + info.line : "");
  return ' <a class="pill" style="text-decoration:none" target="_blank" rel="noopener" href="' +
         href + '" title="Ouvrir cette classe dans le rapport HTML de JaCoCo — la même ' +
         'couverture, présentée par l\'outil qui l\'a mesurée">' +
         'voir dans JaCoCo ↗</a>';
}
function declarationLine(info){
  const src = D.sources[info.source] || [];
  if (!info.name) return info.line;
  const needle = new RegExp("\\b" + info.name.replace(/[$]/g, "\\$") + "\\s*\\(");
  for (let i = info.line - 1; i >= Math.max(0, info.line - 12); i--)
    if (needle.test(src[i] || "")) return i + 1;
  return info.line;
}
function declarationOf(info){
  const src = D.sources[info.source] || [];
  if (!info.line || !info.name) return "";
  const needle = new RegExp("\\b" + info.name.replace(/[$]/g, "\\$") + "\\s*\\(");
  for (let i = info.line - 1; i >= Math.max(0, info.line - 12); i--)
    if (needle.test(src[i] || "")) return (src[i] || "").trim().replace(/\s*\{\s*$/, "");
  return "";
}
function drawValues(info){
  const box = document.getElementById("values");
  const calls = R.values[info.frame] || [];
  if (!calls.length){
    const others = Object.keys(R.values);
    // Expliquer POURQUOI il n'y a rien : sans cela, on croit à un défaut de l'outil alors
    // que c'est un choix — l'observation des valeurs est ciblée, et elle doit l'être.
    const nom = esc(info.name || info.cls.split("/").pop());
    // Une classe n'a pas de méthode à nommer : proposer « --root paquet.Classe:: » livrait
    // une commande que personne ne peut lancer. On dit alors ce qui manque.
    const cible = info.name ? "<code>" + nom + "</code>" : "la classe <code>" + nom + "</code>";
    const commande = "--root " + esc(dot(info.cls)) + "::" +
                     (info.name ? esc(info.name) : "<i>methode</i>");
    const racine = R.context && R.context.methodeRacine ? R.context.methodeRacine : null;
    box.innerHTML = others.length
      ? '<h3>Valeurs des paramètres</h3><div class="explain">' +
        '<b>Aucune valeur n\'a été capturée pour ' + cible + '</b> — ce qui ne veut ' +
        'pas dire qu\'elle n\'a pas tourné : la couverture et les temps la montrent bien. ' +
        'L\'observation des valeurs est <b>ciblée</b> sur une méthode racine' +
        (racine ? ' — ici <code>' + esc(racine) + '</code>' : '') + ', parce qu\'observer ' +
        'toutes les méthodes produirait un volume ingérable et fausserait la mesure.' +
        '<br>Pour obtenir les valeurs de ' + cible + ', relancer avec ' +
        '<code>' + commande + '</code>' +
        (info.name ? '' : ' — en nommant la méthode à observer') + '.' +
        '<br>Méthodes observées dans cette exécution : ' + others.map(f =>
          '<a href="#" class="vlink" data-f="' + esc(f) + '">' + esc(f.split("/").pop()) + '</a>')
          .join(" · ") + '</div>'
      : '<h3>Valeurs des paramètres</h3><div class="explain">Aucune méthode n\'a été observée ' +
        'dans cette exécution : relancer avec <code>--root paquet.Classe::methode</code> pour ' +
        'capturer les valeurs reçues par une méthode.</div>';
    box.querySelectorAll(".vlink").forEach(a => a.onclick = e => {
      e.preventDefault();
      const t = frameInfo(a.dataset.f);
      if (t) select(t, null);
    });
    return;
  }

  // Ce panneau ne redit PAS ce que l'arbre montre déjà. L'arbre déplie UN appel, champ par
  // champ, dans une colonne étroite. Ici on met les appels CÔTE À CÔTE — c'est ce qui répond
  // à la seule question qui compte vraiment devant des valeurs capturées : « qu'est-ce qui
  // change d'un appel à l'autre, et est-ce ça qui explique la branche prise ? ». Une colonne
  // par champ, une ligne par appel, et les colonnes qui varient sont signalées.
  const decl = declarationOf(info);
  const table = compareCalls(calls);
  box.innerHTML =
    '<h3>Les ' + calls.length + ' appel' + (calls.length > 1 ? 's' : '') +
    ' observé' + (calls.length > 1 ? 's' : '') + ' de <code>' + esc(info.name) + '</code>, comparés</h3>' +
    (decl ? '<div class="sig">' + esc(decl) + '</div>' : '') +
    (table.varying.size
      ? '<div class="explain">Les colonnes <b>surlignées</b> sont celles dont la valeur ' +
        'change d\'un appel à l\'autre : c\'est là qu\'il faut chercher ce qui a fait ' +
        'diverger l\'exécution.</div>'
      : '<div class="explain">Tous ces appels ont reçu les mêmes valeurs.</div>') +
    table.html;

  box.querySelectorAll("tr[data-i]").forEach(row => row.onclick = () => {
    callIndex = (callIndex === +row.dataset.i) ? null : +row.dataset.i;
    highlightCall();
  });
  highlightCall();

  function highlightCall(){
    box.querySelectorAll("tr[data-i]").forEach(r =>
      r.classList.toggle("on", +r.dataset.i === callIndex));
  }
}

/**
 * Met les appels en regard : une colonne par champ, une ligne par appel.
 *
 * <p>Les clés viennent des valeurs elles-mêmes quand elles en portent
 * ({@code Trip[id=…, mode=…]}), sinon du type du paramètre. Une colonne dont toutes les
 * cellules sont identiques ne dit rien de la divergence : on la garde — le contexte compte —
 * mais on ne signale que celles qui varient.
 */
function compareCalls(calls){
  const rows = calls.map(call => {
    const cells = new Map();
    (call.params || []).forEach((prm, i) => {
      const fields = valueSplit === "champs" ? splitFields(prm.value) : null;
      if (fields) fields.forEach(f => cells.set(f.cle, f.valeur));
      else cells.set(prm.type || ("paramètre " + (i + 1)), prm.value);
    });
    return { cells, retour: call.retour ? call.retour.value : null };
  });

  const keys = [];
  for (const r of rows) for (const k of r.cells.keys()) if (!keys.includes(k)) keys.push(k);

  const varying = new Set();
  for (const k of keys){
    const distinct = new Set(rows.map(r => r.cells.get(k)));
    if (distinct.size > 1) varying.add(k);
  }
  const retVaries = new Set(rows.map(r => r.retour)).size > 1;

  const head = '<tr><th></th>' +
    keys.map(k => '<th' + (varying.has(k) ? ' class="vary"' : '') + '>' + esc(k) + '</th>').join("") +
    '<th class="ret' + (retVaries ? " vary" : "") + '">⟵ retour</th></tr>';

  const body = rows.map((r, i) =>
    '<tr data-i="' + i + '" title="Mettre cet appel en évidence"><td class="idx">appel ' + (i + 1) + '</td>' +
    keys.map(k => {
      const v = r.cells.has(k) ? r.cells.get(k) : "—";
      return '<td' + (varying.has(k) ? ' class="vary"' : '') + ' title="' + esc(k + " = " + v) +
             '">' + esc(v) + '</td>';
    }).join("") +
    '<td class="ret' + (retVaries ? " vary" : "") + '">' +
    (r.retour === null ? "<i>—</i>" : esc(r.retour)) + '</td></tr>').join("");

  return { varying, html: '<div class="cmpwrap"><table class="cmp">' + head + body + '</table></div>' };
}

/**

 * des paquets. Chacun de ces choix peut se révéler faux sur un cas qu'on n'avait pas prévu,
 * et la page elle-même peut cesser de s'ouvrir. Les sorties d'origine restent donc
 * atteignables en un clic — c'est ce qui sépare un rapport vérifiable d'un rapport à

function rawBlock(){
  // La même table que le menu de la barre du haut : ce qui s'y ajoute apparaît ici sans
  // qu'on y pense, et les deux ne peuvent plus se contredire.
  const groupes = fichiersDuRun();
  const lien = (g, it) => {
    const [ok, href, titre] = it;
    const quoi = g.toujours ? it[4] : it[3];
    return ok ? '<a class="lk" href="' + href + '" target="_blank" rel="noopener">' +

  return '<h2>Les sorties brutes des outils</h2>' +
    '<p class="rawnote">Ce qui suit n\'est pas produit par cette page : ce sont les fichiers ' +
    'que chaque outil a écrits, tels quels. À consulter quand la synthèse surprend — ou ' +
    'si elle ne s\'ouvre plus. Ils sont aussi dans le menu <b>Exports</b>, en haut.</p>' +
    groupes.map(g => {
      const corps = g.items.map(it => lien(g, it)).join("");

      return '<h3 class="rawh">' + (TOOLMARK[g.mark] || "") + ' ' + esc(g.nom) + '</h3>' +
