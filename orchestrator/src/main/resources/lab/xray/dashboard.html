/**
 * Flamme dessinée ici même, à partir des mêmes mesures que l'arbre. Deux raisons de ne pas
 * dépendre d'un fichier produit à côté : le rapport reste une page unique, et le lien ne
 * peut pas être cassé. Chaque barre mène à sa méthode.
 */
function flameBlock(){
  const root = R.calltree;
  if (!root || !root.total) return "";
  const H = 18, MAXD = 12;
  const bars = [];
  let maxDepth = 0;

  (function layout(node, depth, x){
    for (const kid of node.children){
      const w = kid.total / root.total;
      if (w * 100 < 0.4 || depth > MAXD){ x += w; continue; }   // trop fin pour être lu
      // Le temps PROPRE : ce que la méthode garde pour elle, une fois retiré ce qu'elle a
      // délégué. C'est la seule quantité qui désigne un endroit où agir — une barre large
      // dont un enfant est tout aussi large ne fait que passer le relais.
      const delegue = kid.children.reduce((sum, c) => sum + c.total, 0);
      bars.push({x, w, depth, name: kid.name, known: !!frameInfo(kid.name), total: kid.total,
                 propre: Math.max(0, kid.total - delegue) / root.total});
      maxDepth = Math.max(maxDepth, depth);
      layout(kid, depth + 1, x);
      x += w;
    }
  })(root, 0, 0);
  if (!bars.length) return "";

  const body = bars.map(b => {
    const label = frameLabel(b.name).split(".").slice(-2).join(".");
    return '<div class="fl' + (b.known ? " known" : "") + '"' +
      (b.known ? ' data-f="' + esc(b.name) + '"' : '') +
      ' style="left:' + (b.x * 100).toFixed(4) + '%;width:' + (b.w * 100).toFixed(4) + '%;' +
      'top:' + (b.depth * H) + 'px;background:' + flameColour(b.propre, b.known) + '"' +
      ' title="' + esc(dot(b.name)) + '  —  ' + formatWeight(b.total, root.total) +
      ' au total, dont ' + (b.propre * 100).toFixed(1) + ' % en propre">' +
      '<span>' + esc(label) + '</span></div>';
  }).join("");

  return '<h2>Où le temps est passé</h2>' +
    '<p style="margin-bottom:8px">Chaque barre est une méthode ; sa <b>largeur</b> est la ' +
    'part du temps passé dessous, sa <b>couleur</b> la part qu\'elle garde <b>pour elle</b>, ' +
    'une fois retiré ce qu\'elle a délégué. Une barre large et pâle ne fait que passer le ' +
    'relais ; <span class="flamekey"></span> une barre colorée est un endroit où le temps ' +
    'se consomme vraiment. Cliquer entre dans la méthode.</p>' +
    '<div class="flame" style="height:' + ((maxDepth + 1) * H) + 'px">' + body + '</div>';
}

/**
 * Ajuste les étiquettes du graphe de temps à la largeur réelle de leur barre.
 *
 * <p>Une barre étroite portant « RoutePlanne » ou « Breaks.t » ne désigne rien : le nom
 * coupé au milieu coûte de la place sans rien apprendre. On essaie donc le nom complet,
 * puis le seul nom de méthode, puis rien du tout — le survol donne l'intitulé entier dans
 * tous les cas. La mesure se fait après rendu, parce que la largeur d'une barre est un
 * pourcentage : elle dépend de la fenêtre, pas des données.
 */
function fitFlameLabels(){
  document.querySelectorAll(".flame .fl").forEach(el => {
    const span = el.querySelector("span");
    if (!span) return;
    const full = span.dataset.full || span.textContent;
    span.dataset.full = full;
    for (const essai of [full, full.split(".").pop(), ""]) {
      span.textContent = essai;
      if (span.scrollWidth <= span.clientWidth) break;
    }
  });
}
// La largeur des barres suit la fenêtre : ce qui tenait à 1400 px ne tient plus à 900.
addEventListener("resize", () => {
  clearTimeout(fitFlameLabels.t);
  fitFlameLabels.t = setTimeout(fitFlameLabels, 120);
});

/**
 * La couleur dit le temps PROPRE, pas la profondeur.
 *
 * <p>Colorer par profondeur ne disait rien : la position verticale la donne déjà, et le
 * résultat était six nuances du même jaune, décoratives. Le temps propre, lui, répond à la
 * question qu'on se pose devant un flame graph — <i>où le temps se consomme-t-il
 * réellement ?</i> — et il distingue une méthode qui travaille d'une méthode qui délègue.
 *
 * <p>L'échelle est volontairement compressée : au-delà de quelques pour cent de temps
 * propre, on est déjà dans ce qui compte, et un dégradé linéaire écraserait tout le reste
 * dans la même teinte pâle.
 */
function flameColour(propre, known){
  if (!known) return "var(--border)";
  const t = Math.min(1, Math.sqrt(propre / 0.25));      // 25 % en propre = saturation
  const tons = ["#dbe7f3", "#f3e2b4", "#f5cf7a", "#ef9f45", "#e2662c", "#c8341b"];
  return tons[Math.min(tons.length - 1, Math.round(t * (tons.length - 1)))];
}

/**
 * Fiche d'identité de l'exécution regardée, et de quoi la compléter.
 *
 * <p>La saisie reste dans le navigateur — la page est un fichier, elle n'écrit nulle part.
 * Le bouton du bas rend le {@code noms.json} correspondant : déposé à côté des exécutions,
 * il fait entrer ces annotations dans le rapport lui-même, pour tout le monde.
 */
function renderIdentity(){
  const box = document.getElementById("identity");
  if (!box) return;
  const a = annotationOf(R);
  const row = (k, v) => '<tr><td class="ck">' + k + '</td><td class="cv">' + v + '</td></tr>';
  const tags = Object.entries(a.etiquettes || {});
  const tagLines = tags.map(([k, v], i) =>
      '<div class="tagline" data-tag="' + i + '">' +
      '<input type="text" class="k" value="' + esc(k) + '" placeholder="étiquette">' +
      '<input type="text" class="v" value="' + esc(v == null ? "" : String(v)) + '" placeholder="texte (facultatif)">' +
      '<button class="mini drop" title="Retirer cette étiquette">✕</button></div>').join("");

  box.innerHTML = '<h2>Identité de cette exécution</h2><div class="annot"><table class="ctx">' +
    row("Identifiant", '<code>' + esc(R.uuid || "—") + '</code>'
        + '<span class="hint">permanent : il ne change jamais, même renommée</span>') +
    row("Nom au lancement", R.nomOrigine
        ? '<code>' + esc(R.nomOrigine) + '</code><span class="hint">donné par <code>--name</code></span>'
        : '<span class="hint">aucun — <code>--name</code> n\'a pas été donné, '
          + 'c\'est l\'identifiant qui sert de nom</span>') +
    row("Nom dans l\'outil",
        '<input type="text" id="annotName" value="' + esc(a.nom) + '" placeholder="' +
        esc(R.nomOrigine || shortId(R)) + '"> ' +
        '<button class="mini" id="annotNameReset">valeur par défaut</button>' +
        '<span class="hint sous">c\'est ce nom qui s\'affiche partout</span>') +
    row("Description", '<textarea id="annotDesc" placeholder="ce qu\'on cherchait, ce qu\'on a vu, ce qu\'il reste à vérifier">'
        + esc(a.description) + '</textarea>') +
    row("Étiquettes", '<div id="annotTags">' + tagLines + '</div>' +
        '<button class="mini" id="annotTagAdd">+ étiquette</button>' +
        '<span class="hint">une clé, et un texte si besoin</span>') +
    '</table>' +
    '<p><button class="mini" id="annotDump">rendre le noms.json</button>' +
    '<span class="hint">à déposer à côté des exécutions pour que ces annotations '
    + 'entrent dans le rapport</span></p><pre id="annotOut" hidden></pre></div>';

  const name = document.getElementById("annotName");
  name.oninput = () => {
    annotationPatch(R, "nom", name.value.trim() || null);
    refreshRunLabels();
  };
  document.getElementById("annotNameReset").onclick = () => {
    annotationPatch(R, "nom", null);
    name.value = "";
    refreshRunLabels();
  };
  const desc = document.getElementById("annotDesc");
  desc.oninput = () => annotationPatch(R, "description", desc.value.trim() || null);

  const collectTags = () => {
    const out = {};
    document.querySelectorAll("#annotTags .tagline").forEach(line => {
      const k = line.querySelector(".k").value.trim();
      if (k) out[k] = line.querySelector(".v").value.trim();
    });
    annotationPatch(R, "etiquettes", Object.keys(out).length ? out : null);
  };
  document.querySelectorAll("#annotTags .tagline").forEach(line => {
    line.querySelectorAll("input").forEach(i => i.oninput = collectTags);
    line.querySelector(".drop").onclick = () => { line.remove(); collectTags(); };
  });
  document.getElementById("annotTagAdd").onclick = () => {
    const line = document.createElement("div");
    line.className = "tagline";
    line.innerHTML = '<input type="text" class="k" placeholder="étiquette">' +
                     '<input type="text" class="v" placeholder="texte (facultatif)">' +
                     '<button class="mini drop" title="Retirer cette étiquette">✕</button>';
    document.getElementById("annotTags").appendChild(line);
    line.querySelectorAll("input").forEach(i => i.oninput = collectTags);
    line.querySelector(".drop").onclick = () => { line.remove(); collectTags(); };
    line.querySelector(".k").focus();
  };
  document.getElementById("annotDump").onclick = () => {
    const out = document.getElementById("annotOut");
    out.hidden = false;
    out.textContent = JSON.stringify(annotationsFile(), null, 2);
    const r = document.createRange();
    r.selectNodeContents(out);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  };
}

/** Les annotations de toutes les exécutions du rapport, dans la forme attendue par l'outil. */
function annotationsFile(){
  const out = {};
  D.runs.forEach(run => {
    const a = annotationOf(run);
    const tags = a.etiquettes && Object.keys(a.etiquettes).length ? a.etiquettes : null;
    if (!a.nom && !a.description && !tags) return;
    // Un nom seul garde la forme courte, celle qui circulait déjà.
    out[run.uuid] = (!a.description && !tags)
      ? a.nom
      : {nom: a.nom || undefined, description: a.description || undefined, etiquettes: tags || undefined};
  });
  return out;
}

/** Revenir à la vue d'ensemble : on déselectionne la méthode en cours pour repartir du

  if (c){ c.innerHTML = ""; c.style.display = "none"; }
  document.querySelectorAll(".node.sel").forEach(n => n.classList.remove("sel"));
  document.getElementById("code").scrollTop = 0;
  drawHome();
}

    '</ol>' +
    valuesHelp() +
    '<h2>Comment ce rapport est produit</h2>' +
    '<p>Trois outils libres et gratuits ont observé la même exécution :</p>' +
    '<ul class="tools">' +
      '<li>' + TOOLMARK.jacoco + '<b>JaCoCo</b> — les lignes exécutées, et la liste exhaustive ' +
        'du code qui a tourné.</li>' +
      '<li>' + TOOLMARK.async + '<b>async-profiler</b> — les mesures de temps et l\'arbre ' +
        'agrégé des appels.</li>' +
      '<li>' + TOOLMARK.arthas + '<b>Arthas</b> — les valeurs des paramètres, et le chemin ' +
        'réellement suivi par un appel précis.</li>' +
    '</ul>' +
    '<p>Aucun ne fait les trois : c\'est leur combinaison qui répond. Tous fonctionnent sans ' +
    'connexion Internet et sans licence.</p>' +
    // Les deux arbres portaient presque le même nom et se confondaient. Ils répondent
    // pourtant à deux questions différentes, et on se sert des DEUX.
    '<h2>Deux arbres, deux questions — on utilise les deux</h2>' +
    '<table class="hh"><tr><th></th><th>L\'arbre agrégé</th><th>Le chemin d\'un appel</th></tr>' +
    '<tr><td>Où</td><td>Onglet <b>Exécutions</b>, à gauche</td>' +
      '<td>Annotations « appelle … » dans le code, à droite</td></tr>' +
    '<tr><td>Produit par</td><td>' + TOOLMARK.async + ' async-profiler</td>' +
      '<td>' + TOOLMARK.arthas + ' Arthas</td></tr>' +
    '<tr><td>Répond à</td><td>« Où passe le temps, tous appels confondus ? »</td>' +
      '<td>« Qu\'a fait <i>cet</i> appel-là, dans l\'ordre ? »</td></tr>' +
    '<tr><td>Comment</td><td>Par sondage : la JVM est photographiée mille fois par seconde, ' +
      'et les photos sont additionnées. Rien n\'est ralenti, mais un appel bref peut ' +
      'échapper à toutes les photos.</td>' +
      '<td>Par instrumentation : chaque entrée et sortie est notée. Rien n\'échappe, mais ' +
      'seules quelques invocations sont suivies, et elles sont ralenties.</td></tr>' +
    '<tr><td>Ne peut pas</td><td>Distinguer deux appels de la même méthode : c\'est une ' +
      'somme.</td><td>Dire ce que fait l\'application <i>en général</i> : c\'est un exemple.</td></tr>' +
    '</table>' +
    '<p>D\'où la répartition : on cherche <b>où regarder</b> dans l\'arbre agrégé, puis on ' +
    'ouvre la méthode et on lit <b>ce qui s\'y est passé</b> dans le chemin d\'un appel. ' +
    'Une ligne dans une boucle porte un <b>×N</b> cliquable : il déplie un nœud par passage.</p>' +
    linksBlock() +
    '</div>';
}

function openHelp(){
  document.getElementById("helpbody").innerHTML = helpContent();
  document.getElementById("help").hidden = false;
}

/* ------------------------------------------------------------ interactions */
document.getElementById("home").onclick = e => { e.preventDefault(); goHome(); };
document.getElementById("pkgbtn").onclick = () => {
  showPackages = !showPackages;
  setOption("pkgbtn", {
    icon: showPackages ? OPT.pkgOn : OPT.pkgOff,
    label: showPackages ? "noms de paquet" : "noms de classe",
    pressed: showPackages,
    title: showPackages
      ? "Les noms de paquet sont affichés — cliquer pour ne garder que les noms de classe"
      : "Seuls les noms de classe sont affichés — cliquer pour remettre les paquets"
  });
  // Renommer sur place : reconstruire refermerait l'arbre qu'on vient d'ouvrir.
  document.querySelectorAll("#list .node[data-frame]").forEach(el => {
    const label = el.querySelector(".lbl");
    if (label) label.textContent = frameLabel(el.dataset.frame);
  });
};
/**
 * Déplie l'arbre entier, avec un garde-fou : sur une vraie application, tout ouvrir peut
 * représenter des dizaines de milliers de nœuds et figer la page. On s'arrête à un budget
 * et on le dit, plutôt que de laisser croire que tout est affiché.
 */
const EXPAND_BUDGET = 1500;

function expandAll(){
  let count = 0, passes = 0;
  while (passes++ < 40){
    const closed = [...document.querySelectorAll("#list .node")].filter(n => {
      const tw = n.querySelector(".tw");
      if (!tw || tw.textContent !== "▸") return false;
      // Ouvrir la racine d'une AUTRE exécution la sélectionne et reconstruit l'arbre :
      // le dépliage en masse se battrait contre lui-même. On reste dans l'exécution
      // regardée ; les autres s'ouvrent d'un clic délibéré.
      return !n.classList.contains("runroot");
    });
    if (!closed.length) break;
    for (const n of closed){
      if (count >= EXPAND_BUDGET) break;
      n.click();
      count = document.querySelectorAll("#list .node").length;
    }
    if (count >= EXPAND_BUDGET) break;
  }
  return count;
}

function collapseAll(){
  mode === "cls" ? renderClasses() : renderTree();
  reselect();
}

document.getElementById("expandbtn").onclick = e => {
  const b = e.currentTarget;
  const expanded = b.dataset.state === "open";
  if (expanded){
    collapseAll();
    b.dataset.state = "";
    setOption("expandbtn", {icon: OPT.deplier, label: "tout déplier", pressed: false,
                            title: "Ouvrir toutes les branches d'un coup"});
    return;
  }
  const n = expandAll();
  b.dataset.state = "open";
  setOption("expandbtn", {icon: OPT.replier, label: "tout replier", pressed: true,
                          title: "Tout est ouvert — cliquer pour tout refermer"});
  const head = document.querySelector("#list .grouphead");
  if (n >= EXPAND_BUDGET && head){
    head.textContent = "affichage arrêté à " + n + " lignes — replier, puis ouvrir la branche voulue";
  }
};

document.getElementById("scopebtn").onclick = () => {
  executedOnly = !executedOnly;
  setOption("scopebtn", {
    icon: executedOnly ? OPT.execute : OPT.tout,
    label: executedOnly ? "code exécuté" : "tout le code",
    pressed: executedOnly,
    title: executedOnly
      ? "Seul le code exécuté est listé — cliquer pour voir tout le code"
      : "Tout le code est listé, le non exécuté en rouge — cliquer pour n'afficher que l'exécuté"
  });
  if (mode === "cls"){
    const open = captureExpanded();
    renderClasses();
    restoreExpanded(open);
    reselect();
  }
};
document.getElementById("valbtn").onclick = () => {
  valueSplit = valueSplit === "champs" ? "params" : "champs";
  setOption("valbtn", {
    icon: valueSplit === "champs" ? OPT.champs : OPT.params,
    label: valueSplit === "champs" ? "par champ" : "par paramètre",
    pressed: valueSplit === "champs",
    title: valueSplit === "champs"
      ? "Une ligne par champ de la valeur — cliquer pour n'avoir qu'une ligne par paramètre"
      : "Une ligne par paramètre — cliquer pour éclater chaque valeur en ses champs"
  });
  // Redessiner sur place les appels déjà dépliés : reconstruire refermerait l'arbre.
  document.querySelectorAll("#list .node.callnode").forEach(leaf => {
    const holder = leaf.nextElementSibling;
    if (!holder || holder.style.display === "none" || !holder.children.length) return;
    const call = leaf.__call;
    if (!call) return;
    holder.innerHTML = "";
    fillValueNodes(holder, call, leaf.__depth);
  });
  if (selected) draw();
};

document.getElementById("unitbtn").onclick = () => {
  unit = unit === "pct" ? "ms" : "pct";
  setOption("unitbtn", {
    icon: unit === "pct" ? OPT.pct : OPT.ms,
    label: unit === "pct" ? "part du temps" : "temps estimé",
    // Ce réglage n'est pas un interrupteur : les deux positions disent la même mesure dans
    // une autre unité. Il ne s'allume donc pas — il annonce l'unité en cours.
    title: unit === "pct"
      ? "Part du temps total — cliquer pour voir un temps estimé"
      : "Temps estimé (un relevé ≈ 1 ms de temps processeur) — cliquer pour voir la part"
  });
  // Reformater sur place : reconstruire refermerait l'arbre qu'on vient d'ouvrir.
  document.querySelectorAll("#list .node[data-samples]").forEach(el => {
    const pct = el.querySelector(".pct");
    if (pct) pct.textContent = formatWeight(+el.dataset.samples, +el.dataset.total);
  });
  if (selected) draw();
};
document.getElementById("helpbtn").onclick = openHelp;
document.getElementById("helpclose").onclick = () => document.getElementById("help").hidden = true;
document.getElementById("help").onclick = e => {
  if (e.target.id === "help") document.getElementById("help").hidden = true;
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("help").hidden = true;
});
document.getElementById("tab-tree").onclick = renderTree;
document.getElementById("tab-cls").onclick  = renderClasses;
function reselect(){
  // Re-rendre la liste efface la surbrillance : on la repose sur la méthode courante,
  // sinon basculer un réglage donne l'impression d'avoir perdu le contexte.
  if (!selected) return;
  const target = [...document.querySelectorAll("#list .node")]
    .find(n => (n.title || "") === dot(selected.frame || "") ||
               n.textContent.includes(selected.cls.split("/").pop() + "." + (selected.name || "")));
  if (target) target.classList.add("sel");
}
document.getElementById("clean").onclick = () => {
  clean = !clean;
  setOption("clean", {
    icon: clean ? OPT.cible : OPT.fichier,
    label: clean ? "Resserré sur la méthode" : "Fichier entier",
    pressed: clean,
    title: clean ? "Resserré : seule la méthode sélectionnée est affichée, sans ses lignes mortes"
                 : "Fichier entier, y compris le code jamais exécuté"
  });
  const alt = document.getElementById("cleanalt");
  if (alt) alt.textContent = clean ? "cliquer pour afficher le fichier entier"
                                   : "cliquer pour revenir à la seule méthode";
  mode === "cls" ? renderClasses() : renderTree();
  reselect();
  draw();
};
document.getElementById("search").oninput = e => {
  filter = e.target.value.trim().toLowerCase();
  mode === "cls" ? renderClasses() : renderTree();
};
/* ------------------------------------------------------- panneaux ajustables */
(function splitters(){
  const root = document.documentElement;
  const nav = document.getElementById("nav");
  const vs = document.getElementById("vsplit"), hs = document.getElementById("hsplit");
  let navPrev = 330, valPrev = 190;

  const startDrag = (el, onMove) => {
    el.addEventListener("mousedown", e => {
      e.preventDefault(); el.classList.add("dragging");
      const move = ev => onMove(ev);
      const up = () => { el.classList.remove("dragging");
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up); };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
  };
  startDrag(vs, ev => {
    const w = Math.max(0, Math.min(ev.clientX, window.innerWidth - 200));
    root.style.setProperty("--navw", w + "px");
    if (w > 40) navPrev = w;
  });
  startDrag(hs, ev => {
    const box = document.getElementById("values").getBoundingClientRect();
    const h = Math.max(0, Math.min(box.bottom - ev.clientY, window.innerHeight - 220));
    root.style.setProperty("--valh", h + "px");
    if (h > 30) valPrev = h;
  });
  const toggleNav = () => {
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--navw")) || 330;
    const open = cur <= 40;
    root.style.setProperty("--navw", open ? navPrev + "px" : "0px");
    document.getElementById("vtoggle").textContent = open ? "‹" : "›";
  };
  const toggleValues = () => {
    const cur = parseInt(getComputedStyle(root).getPropertyValue("--valh")) || 190;
    const open = cur <= 30;
    root.style.setProperty("--valh", open ? valPrev + "px" : "0px");
    document.getElementById("htoggle").textContent = open ? "⌄" : "⌃";
  };
  vs.ondblclick = toggleNav;
  hs.ondblclick = toggleValues;
  document.getElementById("vtoggle").onclick = e => { e.stopPropagation(); toggleNav(); };
  document.getElementById("htoggle").onclick = e => { e.stopPropagation(); toggleValues(); };
})();

// Les icônes des réglages sont posées ici plutôt que dans le gabarit : leur dessin change
// avec l'état du bouton, et il n'y a qu'un seul endroit qui en décide.
setOption("unitbtn",  {icon: OPT.pct});
setOption("pkgbtn",   {icon: OPT.pkgOn});
setOption("valbtn",   {icon: OPT.champs});
setOption("scopebtn", {icon: OPT.execute});
setOption("expandbtn",{icon: OPT.deplier, title: "Ouvrir toutes les branches d'un coup"});
setOption("clean",    {icon: OPT.cible});

// La vue d'entrée suit l'onglet de gauche : s'ouvrir sur le second se lirait comme un
// état bizarre plutôt que comme un choix.
renderClasses();
drawHome();
</script>
