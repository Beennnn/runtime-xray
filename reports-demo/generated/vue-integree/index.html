<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vue intégrée — Runtime X-Ray</title>
<style>
  :root{
    --bg:#fff; --panel:#f6f8fa; --panel2:#fbfcfd; --border:#d0d7de; --text:#1f2328;
    --muted:#59636e; --accent:#0969da; --accent-soft:#ddf4ff;
    --full:#dafbe1; --part:#fff8c5; --miss:#ffebe9;
    --fullbar:#1a7f37; --partbar:#9a6700; --missbar:#cf222e; --violet:#8250df;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1117; --panel:#151b23; --panel2:#10151c; --border:#30363d; --text:#e6edf3;
      --muted:#9198a1; --accent:#4493f8; --accent-soft:#121d2f;
      --full:#12261c; --part:#2b2412; --miss:#2d1416;
      --fullbar:#3fb950; --partbar:#d29922; --missbar:#f85149; --violet:#ab7df8;
    }
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  header{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;
         align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
  .badges{display:flex;gap:4px;align-items:center}
  .stat{color:var(--muted);font-size:12.5px} .stat b{color:var(--text)}
  .spacer{margin-left:auto}
  .toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .links{font-size:12px;color:var(--muted)} .links a{margin-left:10px}
  #note{display:none;padding:8px 16px;background:var(--part);border-bottom:1px solid var(--border);
        font-size:12.5px;color:var(--text)}
  #note.on{display:block}
  main{display:grid;grid-template-columns:330px 1fr;height:calc(100% - 47px)}
  body.noted main{height:calc(100% - 47px - 37px)}
  @media(max-width:860px){main{grid-template-columns:1fr;height:auto}}
  #nav{border-right:1px solid var(--border);background:var(--panel2);
       display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--border)}
  .tabs button{flex:1;padding:8px 4px;background:none;border:0;border-bottom:2px solid transparent;
               color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  #search{margin:8px;padding:5px 9px;border:1px solid var(--border);border-radius:6px;
          background:var(--bg);color:var(--text);font:inherit;font-size:12.5px}
  #scope{padding:7px 10px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--muted)}
  #scope b{color:var(--text)}
  #scope button{margin-top:5px;font:inherit;font-size:11px;background:var(--bg);color:var(--accent);
                border:1px solid var(--border);border-radius:5px;padding:2px 7px;cursor:pointer}
  .list{overflow:auto;flex:1 1 auto;min-height:0;padding:4px 4px 24px}
  .node{padding:2px 7px;border-radius:5px;cursor:pointer;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .node:hover{background:var(--accent-soft)}
  .node.sel{background:var(--accent);color:#fff}
  .node .pct{color:var(--muted);font-size:11px;margin-right:6px;display:inline-block;
             width:38px;text-align:right;font-variant-numeric:tabular-nums}
  .node.sel .pct{color:#e8f0fb}
  .node .tw{display:inline-block;width:11px;color:var(--muted)}
  .node.jdk{color:var(--muted)}
  .grouphead{padding:6px 8px 2px;color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
  #detail{display:flex;flex-direction:column;min-height:0}
  .crumb{padding:9px 16px;border-bottom:1px solid var(--border);font-size:13px;
         display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .crumb b{font-weight:650} .crumb span{color:var(--muted)}
  .pill{font-size:11px;border:1px solid var(--border);border-radius:20px;padding:1px 8px;color:var(--muted)}
  #code{overflow:auto;flex:1 1 auto;min-height:0;padding-bottom:24px}
  table.src{border-collapse:collapse;width:100%;
            font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  table.src td{padding:0 6px;vertical-align:top;white-space:pre}
  td.n{text-align:right;color:var(--muted);user-select:none;width:1%;
       border-right:1px solid var(--border);font-variant-numeric:tabular-nums}
  tr.full td.c{background:var(--full)} tr.part td.c{background:var(--part)} tr.miss td.c{background:var(--miss)}
  td.c{width:99%}
  tr.inmethod td.n{color:var(--accent);font-weight:700}
  td.ann{color:var(--violet);font-size:11px;width:1%;max-width:290px;text-align:right;
         white-space:normal;padding-left:14px}
  td.ann a{color:var(--violet);text-decoration:none;border-bottom:1px dotted var(--violet)}
  .fold{color:var(--muted);font-style:italic;padding:2px 12px;font-size:11.5px;
        background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  #values{border-top:1px solid var(--border);background:var(--panel);padding:10px 16px;max-height:32%;overflow:auto}
  #values h3{margin:0 0 7px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
  .call{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
        padding:4px 0;border-bottom:1px solid var(--border)}
  .call .v{color:var(--violet)} .call .t{color:var(--muted)}
  .legend{padding:7px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin:0 4px 0 10px}
  .home{padding:26px 32px;max-width:820px}
  .home h2{font-size:17px;margin:0 0 6px}
  .home p{color:var(--muted);margin:0 0 18px}
  .home .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
  @media(max-width:700px){.home .cards{grid-template-columns:1fr}}
  .card{border:1px solid var(--border);border-radius:9px;padding:13px 15px;background:var(--panel)}
  .card .k{font-size:22px;font-weight:680} .card .l{color:var(--muted);font-size:12.5px}
  .home ol{color:var(--muted);padding-left:20px} .home ol li{margin:6px 0}
  .home code{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>

  <h1>Vue intégrée</h1>
  <div class="stat" id="stats"></div>
  <span class="spacer"></span>
  <span class="links" id="links"></span>
  <label class="toggle"><input type="checkbox" id="clean"> Masquer le code non exécuté</label>
</header>
<div id="note"></div>
<main>
  <div id="nav">
    <div class="tabs">
      <button id="tab-exec" class="on">Code exécuté</button>
      <button id="tab-tree">Arbre d'appel</button>
      <button id="tab-cls">Packages</button>

    <input id="search" placeholder="Filtrer…" autocomplete="off">
    <div id="scope"></div>
    <div class="list" id="list"></div>
  </div>
  <div id="detail">
    <div class="crumb" id="crumb"></div>
    <div id="code"></div>
    <div id="values"></div>
    <div class="legend" id="legend"></div>
  </div>
</main>

}, {"type": "Boolean", "value": "false"}, {"type": "Double", "value": "588.6771168"}]}, {"ts": "2026-08-20 20:48:29.736", "cost": "0.017125ms", "values": [{"type": "String", "value": "TRIP-87"}, {"type": "Mode", "value": "WALK"}, {"type": "Weather", "value": "RAIN"}, {"type": "TimeOfDay", "value": "RUSH_HOUR"}, {"type": "Boolean", "value": "false"}, {"type": "Double", "value": "2572.2331599999993"}]}, {"ts": "2026-08-20 20:48:29.737", "cost": "0.011167ms", "values": [{"type": "String", "value": "TRIP-88"}, {"type": "Mode", "value": "CAR"}, {"type": "Weather", "value": "SUNNY"}, {"type": "TimeOfDay", "value": "NIGHT"}, {"type": "Boolean", "value": "false"}, {"type": "Double", "value": "25.946879999999997"}]}], "sources": {"lab/sample/Scenarios.java": ["package lab.sample;", "", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "import lab.sample.model.TimeOfDay;", "import lab.sample.model.Trip;", "import lab.sample.model.Weather;", "", "import java.util.ArrayList;", "import java.util.List;", "", "/**", " * Les trajets rejoués à l'identique par tous les outils.", " *", " * <p>Le tirage est <b>déterministe</b> : ni {@code Random}, ni horloge. Deux exécutions", " * produisent exactement la même trace — sans quoi comparer deux rapports reviendrait à", " * comparer deux exécutions différentes, et l'écart observé ne dirait plus rien de l'outil.", " *", " * <p>{@code Mode.PLANE} et {@code Weather.SNOW} sont volontairement absents du tirage.", " */", "final class Scenarios {", "", "    private Scenarios() {}", "", "    private static final Mode[] MODES = {Mode.CAR, Mode.TRAIN, Mode.BIKE, Mode.WALK};", "    private static final Weather[] WEATHERS = {Weather.SUNNY, Weather.RAIN};", "    private static final TimeOfDay[] TIMES = {TimeOfDay.QUIET, TimeOfDay.RUSH_HOUR, TimeOfDay.NIGHT};", "    private static final String[] PLACES = {\"Toulouse\", \"Albi\", \"Montauban\", \"Castres\", \"Auch\", \"Foix\"};", "", "    static Trip at(int i) {", "        Mode mode = MODES[i % MODES.length];", "        Weather weather = WEATHERS[(i / 4) % WEATHERS.length];", "        TimeOfDay time = TIMES[(i / 8) % TIMES.length];", "        boolean luggage = (i % 5) == 0;", "", "        int legCount = 1 + (i % 4);", "        List<Leg> legs = new ArrayList<>(legCount);", "        for (int l = 0; l < legCount; l++) {", "            String from = PLACES[(i + l) % PLACES.length];", "            String to = PLACES[(i + l + 1) % PLACES.length];", "            double km = 2 + ((i + l * 7) % 60);", "            legs.add(new Leg(from, to, km));", "        }", "        // Concaténation simple et non \"TRIP-%05d\".formatted(i) : le formatage coûtait à lui", "        // seul ~40 % du temps CPU et écrasait le calcul dans le flame graph. Le profil doit", "        // montrer la logique évaluée, pas la fabrication du jeu de test.", "        return new Trip(\"TRIP-\" + i, mode, weather, time, luggage, List.copyOf(legs));", "    }", "}"], "lab/sample/RoutePlanner.java": ["package lab.sample;", "", "import lab.sample.comfort.Breaks;", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "import lab.sample.model.Trip;", "import lab.sample.speed.SpeedModel;", "import lab.sample.speed.Speeds;", "import lab.sample.terrain.Terrain;", "import lab.sample.traffic.Traffic;", "import lab.sample.transfer.Connections;", "import lab.sample.weather.LuggagePenalty;", "import lab.sample.weather.WeatherPenalty;", "", "/**", " * <b>La fonction sous analyse.</b> « Combien de temps pour aller de A à B ? »", " *", " * <p>C'est le point d'entrée que chaque outil doit savoir cibler : à l'exécution de", " * cette fonction, donne-moi les lignes exécutées, l'arbre d'appel et les valeurs des", " * paramètres.", " *", " * <p>Elle appelle quatre familles de calcul <b>selon le contexte</b>, jamais toutes en", " * même temps :", " * <ul>", " *   <li>la vitesse du mode choisi — toujours, mais via une implémentation différente ;</li>", " *   <li>les bouchons — voiture à l'heure de pointe uniquement ;</li>", " *   <li>la météo et les bagages — vélo et marche uniquement ;</li>", " *   <li>les correspondances — train uniquement ;</li>", " *   <li>les pauses — au-delà d'une durée <em>calculée</em>, quel que soit le mode.</li>", " * </ul>", " * Deux trajets différents produisent donc deux arbres d'appel différents, à partir du", " * même appel de la même méthode. C'est précisément ce qu'on demande aux outils de montrer.", " */", "public final class RoutePlanner {", "", "    private RoutePlanner() {}", "", "    /**", "     * @param trip le trajet à évaluer", "     * @return la durée totale estimée, en minutes", "     */", "    public static double travelTimeMinutes(Trip trip) {", "        SpeedModel speed = Speeds.forMode(trip.mode());", "", "        double minutes = 0;", "        // Boucle indexée volontairement : la boucle for-each sur une List immuable", "        // allouait un itérateur par étape, qui représentait à lui seul la moitié des", "        // échantillons. Constaté au profiler, corrigé, re-mesuré.", "        for (int i = 0; i < trip.legs().size(); i++) {", "            minutes += legMinutes(trip.legs().get(i), speed, trip.mode());", "        }", "", "        if (Traffic.applies(trip.mode(), trip.timeOfDay())) {", "            minutes += Traffic.delayMinutes(trip.legs());", "        }", "", "        if (WeatherPenalty.applies(trip.mode())) {", "            minutes *= WeatherPenalty.slowdownFactor(trip.weather());", "            minutes *= LuggagePenalty.slowdownFactor(trip.withLuggage());", "        }", "", "        if (trip.mode() == Mode.TRAIN) {", "            minutes += Connections.waitMinutes(trip.legs(), 0);", "        }", "", "        // Décidé sur la durée obtenue, pas sur un argument reçu : voir Breaks.", "        minutes += Breaks.totalMinutes(minutes);", "", "        return minutes;", "    }", "", "    private static double legMinutes(Leg leg, SpeedModel speed, Mode mode) {", "        double minutes = leg.distanceKm() / speed.kmPerHour(leg) * 60.0;", "        if (Terrain.applies(mode)) {", "            minutes *= Terrain.slowdownFactor(leg, mode);", "        }", "        return minutes;", "    }", "}"], "lab/sample/Main.java": ["package lab.sample;", "", "import lab.sample.model.Trip;", "", "import java.util.ArrayList;", "import java.util.List;", "", "/**", " * Lanceur de l'application-cible.", " *", " * <p>Deux options n'existent que pour les besoins de l'analyse :", " * <ul>", " *   <li>{@code --iterations} — un profiler par échantillonnage n'a rien à montrer sur", " *       une exécution de 5 ms ; il faut du temps CPU pour que des frames soient prélevées.</li>", " *   <li>{@code --hold-seconds} — les outils qui s'<em>attachent</em> à un process vivant", " *       (VisualVM, JMC, JProfiler, YourKit) ont besoin que la JVM soit encore là quand", " *       l'opérateur clique. Sans cette pause, la cible est morte avant d'avoir été", " *       sélectionnée dans la liste.</li>", " * </ul>", " */", "public final class Main {", "", "    /** Nombre de trajets distincts fabriqués avant la mesure. Assez pour couvrir toutes", "     *  les combinaisons mode × météo × horaire × bagages, assez peu pour que leur", "     *  fabrication ne pèse rien face à la boucle de calcul. */", "    private static final int TRIP_VARIANTS = 240;", "", "    /** Calibré pour que le calcul dure ~10 s sur un Mac Apple Silicon. C'est le minimum", "     *  confortable pour qu'un outil qui s'attache à un process vivant (VisualVM, JMC,", "     *  JProfiler) ait le temps d'être lancé, de sélectionner la JVM et d'enregistrer", "     *  quelque chose. Une exécution d'une seconde ne laisse aucune prise. */", "    private static final int DEFAULT_ITERATIONS = 16_000_000;", "", "    public static void main(String[] args) throws InterruptedException {", "        int iterations = intArg(args, \"--iterations\", DEFAULT_ITERATIONS);", "        int holdSeconds = intArg(args, \"--hold-seconds\", 0);", "", "        System.out.printf(\"sample-app : %d trajets évalués, pause finale %d s%n\", iterations, holdSeconds);", "        Metrics metrics = new Metrics();", "        metrics.stage(\"JVM démarrée\");", "", "        // Les trajets sont fabriqués UNE FOIS, hors de la boucle mesurée.", "        // Sans cette séparation, la génération du jeu de test (concaténations de chaînes,", "        // allocations de listes) capte ~70 % des échantillons et l'arbre d'appel montre", "        // java.lang.StringConcatHelper au lieu du calcul d'itinéraire. Mesuré, pas supposé.", "        List<Trip> trips = new ArrayList<>(TRIP_VARIANTS);", "        for (int i = 0; i < TRIP_VARIANTS; i++) {", "            trips.add(Scenarios.at(i));", "        }", "", "        metrics.stage(\"jeu de trajets fabriqué\");", "", "        double total = 0;", "        for (int i = 0; i < iterations; i++) {", "            total += RoutePlanner.travelTimeMinutes(trips.get(i % TRIP_VARIANTS));", "        }", "        // Imprimé pour que le calcul ne puisse pas être éliminé, et pour vérifier d'un", "        // coup d'œil que deux exécutions comparées ont bien fait le même travail.", "        metrics.stage(\"calcul terminé\");", "        System.out.printf(\"durée cumulée = %.0f minutes%n\", total);", "", "        if (holdSeconds > 0) {", "            System.out.printf(\"JVM maintenue en vie %d s — attache ton profiler (pid %d)%n\",", "                    holdSeconds, ProcessHandle.current().pid());", "            Thread.sleep(holdSeconds * 1000L);", "        }", "    }", "", "    private static int intArg(String[] args, String name, int fallback) {", "        for (int i = 0; i < args.length - 1; i++) {", "            if (args[i].equals(name)) {", "                return Integer.parseInt(args[i + 1]);", "            }", "        }", "        return fallback;", "    }", "}"], "lab/sample/Metrics.java": ["package lab.sample;", "", "/**", " * Mesures d'étape : temps écoulé et mémoire occupée.", " *", " * <p>Volontairement fondé sur le seul JDK ({@code System.nanoTime}, {@code Runtime}) :", " * ces chiffres servent de <b>référence indépendante</b>. Quand un outil d'analyse annonce", " * un temps ou une empreinte, on veut pouvoir le confronter à une mesure qui ne vient pas", " * de lui — et constater au passage combien l'outil lui-même ralentit l'exécution.", " *", " * <p>La mémoire est lue après un appel à {@code System.gc()} : sans lui, on mesure surtout", " * les déchets pas encore ramassés, ce qui ne veut rien dire. L'appel reste une", " * <em>suggestion</em> faite à la JVM, jamais une garantie — d'où l'ordre de grandeur", " * annoncé plutôt qu'une valeur exacte.", " */", "public final class Metrics {", "", "    private final long startNanos = System.nanoTime();", "    private long lastNanos = startNanos;", "", "    void stage(String label) {", "        long now = System.nanoTime();", "        double sinceLastMs = (now - lastNanos) / 1_000_000.0;", "        double totalMs = (now - startNanos) / 1_000_000.0;", "        lastNanos = now;", "", "        System.gc();", "        Runtime runtime = Runtime.getRuntime();", "        long usedMb = (runtime.totalMemory() - runtime.freeMemory()) / (1024 * 1024);", "        long maxMb = runtime.maxMemory() / (1024 * 1024);", "", "        System.out.printf(\"  [%-28s] étape %8.0f ms | cumul %8.0f ms | mémoire ~%d Mo / %d Mo max%n\",", "                label, sinceLastMs, totalMs, usedMb, maxMb);", "    }", "}"], "lab/sample/traffic/RushHourDelay.java": ["package lab.sample.traffic;", "", "import lab.sample.model.Leg;", "", "/** Retard dû aux bouchons de l'heure de pointe. */", "public final class RushHourDelay {", "", "    private RushHourDelay() {}", "", "    static double minutesFor(Leg leg) {", "        // Les bouchons pénalisent surtout les entrées et sorties d'agglomération,", "        // donc les étapes courtes : d'où un retard qui ne suit pas la distance.", "        if (leg.distanceKm() < 5) {", "            return 8;", "        }", "        return leg.distanceKm() < 40 ? 15 : 20;", "    }", "}"], "lab/sample/traffic/Traffic.java": ["package lab.sample.traffic;", "", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "import lab.sample.model.TimeOfDay;", "", "import java.util.List;", "", "/**", " * Retard lié à la circulation.", " *", " * <p>Sous-arbre entièrement <b>conditionnel</b> : il n'existe que pour la voiture, et", " * seulement à l'heure de pointe. Sur un trajet en train à 22 h, aucune de ces lignes", " * ne s'exécute — et c'est exactement ce que le dépôt cherche à rendre visible.", " */", "public final class Traffic {", "", "    private Traffic() {}", "", "    public static boolean applies(Mode mode, TimeOfDay timeOfDay) {", "        return mode == Mode.CAR && timeOfDay == TimeOfDay.RUSH_HOUR;", "    }", "", "    public static double delayMinutes(List<Leg> legs) {", "        double total = 0;", "        for (Leg leg : legs) {", "            total += RushHourDelay.minutesFor(leg);", "        }", "        return total;", "    }", "}"], "lab/sample/speed/BikeSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** À vélo : on ralentit sur les longues distances (fatigue). */", "public final class BikeSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return leg.distanceKm() > 20 ? 15 : 18;", "    }", "}"], "lab/sample/speed/Speeds.java": ["package lab.sample.speed;", "", "import lab.sample.model.Mode;", "", "/** Fabrique : associe un mode de transport à son modèle de vitesse. */", "public final class Speeds {", "", "    // Instances partagées : les modèles de vitesse sont sans état. Les allouer à chaque", "    // appel captait ~25 % des échantillons — du bruit d'allocation qui masquait le calcul.", "    private static final SpeedModel CAR = new CarSpeed();", "    private static final SpeedModel TRAIN = new TrainSpeed();", "    private static final SpeedModel BIKE = new BikeSpeed();", "    private static final SpeedModel WALK = new WalkSpeed();", "", "    private Speeds() {}", "", "    public static SpeedModel forMode(Mode mode) {", "        return switch (mode) {", "            case CAR -> CAR;", "            case TRAIN -> TRAIN;", "            case BIKE -> BIKE;", "            case WALK -> WALK;", "            // Instancié ici et non partagé comme les autres : ainsi PlaneSpeed n'est", "            // JAMAIS chargée ni exécutée, et reste à 0 % dans le rapport de couverture.", "            // Un champ static final l'aurait fait construire au chargement de Speeds.", "            case PLANE -> new PlaneSpeed();", "        };", "    }", "}"], "lab/sample/speed/TrainSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** En train : vitesse quasi constante, indépendante de la longueur de l'étape. */", "public final class TrainSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return leg.distanceKm() > 100 ? 220 : 90;", "    }", "}"], "lab/sample/speed/PlaneSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** En avion. <b>Jamais instanciée par les scénarios</b> : cette classe entière doit", " *  apparaître à 0 % dans un rapport de couverture. C'est le test le plus visuel du", " *  critère « sait-on par où le code n'est PAS passé ? » — un profiler par", " *  échantillonnage, lui, ne dira jamais rien de ce code. */", "public final class PlaneSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return leg.distanceKm() > 1000 ? 850 : 600;", "    }", "}"], "lab/sample/speed/WalkSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** À pied : 5 km/h, la vitesse de marche de tout le monde. */", "public final class WalkSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        return 5;", "    }", "}"], "lab/sample/speed/CarSpeed.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** En voiture : plus l'étape est longue, plus on roule vite (ville puis voie rapide). */", "public final class CarSpeed implements SpeedModel {", "", "    @Override", "    public double kmPerHour(Leg leg) {", "        if (leg.distanceKm() < 5) {", "            return 25;   // trajet urbain", "        }", "        return leg.distanceKm() < 40 ? 70 : 110;", "    }", "}"], "lab/sample/speed/SpeedModel.java": ["package lab.sample.speed;", "", "import lab.sample.model.Leg;", "", "/** Vitesse moyenne d'un mode de transport sur une étape.", " *", " *  <p>Point de <b>dispatch virtuel</b> du programme : l'appel part toujours de", " *  l'interface, mais c'est l'implémentation concrète qui travaille. Un bon arbre", " *  d'appel doit nommer l'implémentation réellement exécutée ; certains outils", " *  s'arrêtent à l'interface, et c'est une différence qui se voit tout de suite. */", "public interface SpeedModel {", "    double kmPerHour(Leg leg);", "}"], "lab/sample/transfer/Timetable.java": ["package lab.sample.transfer;", "", "import lab.sample.model.Leg;", "", "import java.util.Map;", "import java.util.concurrent.ConcurrentHashMap;", "", "/**", " * Consultation des horaires — la seule opération <b>bloquante</b> du programme.", " *", " * <p>Elle simule un appel à un service extérieur par un {@code Thread.sleep}. Sa", " * présence n'est pas décorative : elle crée du <em>temps d'attente</em> à côté du temps", " * de calcul, et c'est un excellent discriminant entre outils. Un profiler qui échantillonne", " * le CPU ne la verra pratiquement pas ; un profiler en temps réel (wall clock) la verra", " * dominer. Deux outils peuvent donc donner deux réponses opposées à « où passe le temps ? »", " * sur exactement la même exécution — et il faut savoir laquelle on regarde.", " *", " * <p>Le résultat est mis en cache : un horaire ne se demande qu'une fois par liaison.", " */", "public final class Timetable {", "", "    private static final Map<String, Integer> CACHE = new ConcurrentHashMap<>();", "    private static final int LOOKUP_MILLIS = 3;", "", "    private Timetable() {}", "", "    /** @return la fréquence de passage, en minutes, pour cette liaison. */", "    public static int frequencyMinutes(Leg leg) {", "        return CACHE.computeIfAbsent(leg.from() + \">\" + leg.to(), key -> {", "            try {", "                Thread.sleep(LOOKUP_MILLIS); // appel réseau simulé", "            } catch (InterruptedException e) {", "                Thread.currentThread().interrupt();", "            }", "            return 10 + (Math.abs(key.hashCode()) % 50);", "        });", "    }", "}"], "lab/sample/transfer/Connections.java": ["package lab.sample.transfer;", "", "import lab.sample.model.Leg;", "", "import java.util.List;", "", "/**", " * Temps d'attente aux correspondances — propre au train.", " *", " * <p>Le calcul est <b>récursif</b> sur la liste des étapes : il ajoute un foyer de", " * récursion distinct de celui de {@code comfort.Breaks}, dans une branche que seuls", " * certains scénarios empruntent. Utile pour vérifier qu'un outil ne confond pas deux", " * récursions différentes dans le même arbre.", " */", "public final class Connections {", "", "    private Connections() {}", "", "    public static double waitMinutes(List<Leg> legs, int index) {", "        if (index >= legs.size() - 1) {", "            return 0; // dernière étape : plus de correspondance après", "        }", "        double here = transferMinutes(legs.get(index), legs.get(index + 1));", "        return here + waitMinutes(legs, index + 1);", "    }", "", "    private static double transferMinutes(Leg arriving, Leg departing) {", "        // Une correspondance dans la même gare est plus rapide qu'un changement de gare,", "        // et l'attente dépend de la fréquence de passage — donc d'une consultation", "        // d'horaires, seule opération bloquante du programme.", "        double walk = arriving.to().equals(departing.from()) ? 6 : 18;", "        return walk + Timetable.frequencyMinutes(departing) / 2.0;", "    }", "}"], "lab/sample/comfort/Breaks.java": ["package lab.sample.comfort;", "", "/**", " * Pauses obligatoires sur les longs trajets.", " *", " * <p>Particularité volontaire : la décision se prend sur une <b>valeur calculée</b>", " * (la durée obtenue jusque-là) et non sur un argument reçu tel quel. Un outil qui ne", " * capture que les arguments d'entrée de la fonction analysée ne saura pas expliquer", " * pourquoi cette branche a été prise — alors qu'elle change le résultat.", " */", "public final class Breaks {", "", "    /** Au-delà de 2 h de conduite ou de marche, on s'arrête. */", "    public static final double THRESHOLD_MINUTES = 120;", "", "    private Breaks() {}", "", "    public static int count(double travelMinutes) {", "        if (travelMinutes < THRESHOLD_MINUTES) {", "            return 0;", "        }", "        return (int) (travelMinutes / THRESHOLD_MINUTES);", "    }", "", "    public static double totalMinutes(double travelMinutes) {", "        return count(travelMinutes) * 15.0;", "    }", "}"], "lab/sample/terrain/Terrain.java": ["package lab.sample.terrain;", "", "import lab.sample.model.Leg;", "import lab.sample.model.Mode;", "", "/**", " * Ralentissement dû au relief, moyenné sur les sous-segments d'une étape.", " *", " * <p>Deux raisons d'exister :", " * <ul>", " *   <li>c'est le <b>cœur de calcul</b> du programme — sans lui, l'application passe son", " *       temps dans les itérateurs du JDK et un profiler ne montre rien du métier ;</li>", " *   <li>il n'est appelé que pour les modes sensibles au terrain : le train suit une voie", " *       ferrée dont la pente est négligeable, il saute donc tout ce sous-arbre.</li>", " * </ul>", " */", "public final class Terrain {", "", "    /** Nombre de sous-segments analysés par étape. */", "    private static final int STEPS = 24;", "", "    private Terrain() {}", "", "    public static boolean applies(Mode mode) {", "        return mode != Mode.TRAIN;", "    }", "", "    public static double slowdownFactor(Leg leg, Mode mode) {", "        double sum = 0;", "        for (int step = 0; step < STEPS; step++) {", "            double grade = Elevation.gradePercentAt(leg, step);", "            sum += penaltyFor(grade, mode);", "        }", "        return sum / STEPS;", "    }", "", "    /** Une montée coûte plus qu'une descente ne rapporte, et d'autant plus qu'on est", "     *  à la force du mollet. */", "    private static double penaltyFor(double gradePercent, Mode mode) {", "        double sensitivity = switch (mode) {", "            case BIKE -> 0.09;", "            case WALK -> 0.05;", "            case CAR -> 0.01;", "            case TRAIN -> 0.00;", "            case PLANE -> 0.00;", "        };", "        if (gradePercent > 0) {", "            return 1.0 + gradePercent * sensitivity;", "        }", "        return 1.0 + gradePercent * sensitivity * 0.3; // la descente ne compense qu'en partie", "    }", "}"], "lab/sample/terrain/Elevation.java": ["package lab.sample.terrain;", "", "import lab.sample.model.Leg;", "", "/** Relief le long d'une étape, échantillonné en sous-segments.", " *", " *  <p>Déterministe : le profil d'une étape donnée est toujours le même, sinon deux", " *  exécutions ne seraient plus comparables. */", "public final class Elevation {", "", "    private Elevation() {}", "", "    /** @return la pente du {@code step}-ième sous-segment, en pourcentage (−8 % à +8 %). */", "    public static double gradePercentAt(Leg leg, int step) {", "        // Arithmétique simple plutôt que Math.sin/cos : les intrinsèques trigonométriques", "        // apparaissaient comme feuilles dominantes du profil (dsin/dcos, ~50 % des", "        // échantillons), ce qui rendait l'arbre d'appel illisible pour qui cherche les", "        // méthodes métier. Le relief reste déterministe et varié.", "        double phase = (Math.abs(leg.from().hashCode()) % 17) + step;", "        double wave = ((phase * 37) % 21) - 10.0;          // -10 .. +10, en dents de scie", "        double smooth = wave * (1.0 - Math.abs(wave) / 25.0);", "        return smooth * 0.8;", "    }", "}"], "lab/sample/model/Mode.java": ["package lab.sample.model;", "", "/** Comment on se déplace. C'est le principal <b>aiguilleur</b> du calcul : chaque mode", " *  active une famille de calculs différente (bouchons pour la voiture, correspondances", " *  pour le train, météo pour le vélo et la marche).", " *", " *  <p>{@code PLANE} n'est jamais choisi par les scénarios : la classe de vitesse", " *  correspondante doit rester à 0 % dans un rapport de couverture. */", "public enum Mode { CAR, TRAIN, BIKE, WALK, PLANE }"], "lab/sample/model/Weather.java": ["package lab.sample.model;", "", "/** Météo du jour. {@code SNOW} n'est jamais tiré par les scénarios : second trou de", " *  couverture volontaire, à l'intérieur d'une classe par ailleurs bien couverte —", " *  un cas que les rapports agrégés par package ont tendance à diluer. */", "public enum Weather { SUNNY, RAIN, SNOW }"], "lab/sample/model/Leg.java": ["package lab.sample.model;", "", "/** Une étape du trajet : une portion parcourue d'un seul tenant. */", "public record Leg(String from, String to, double distanceKm) {}"], "lab/sample/model/TimeOfDay.java": ["package lab.sample.model;", "", "/** Moment de la journée. Seule {@code RUSH_HOUR} déclenche le calcul de bouchons,", " *  et seulement en voiture : c'est l'exemple le plus simple d'une fonction appelée", " *  ou non selon le contexte. */", "public enum TimeOfDay { QUIET, RUSH_HOUR, NIGHT }"], "lab/sample/model/Trip.java": ["package lab.sample.model;", "", "import java.util.List;", "", "/**", " * Le trajet dont on veut connaître la durée — <b>le paramètre dont on veut voir la", " * valeur capturée</b>.", " *", " * <p>Chaque champ envoie l'exécution dans une branche différente. C'est ce qui rend la", " * question « quelles valeurs ont été passées ? » décisive : deux appels de même", " * signature peuvent parcourir des sous-arbres complètement disjoints, et un outil qui", " * n'affiche que {@code Trip@3f2a1b} ne permet pas de savoir lequel des deux on regarde.", " */", "public record Trip(", "        String id,", "        Mode mode,", "        Weather weather,", "        TimeOfDay timeOfDay,", "        boolean withLuggage,   // ne pèse qu'à vélo et à pied", "        List<Leg> legs) {", "", "    public double totalDistanceKm() {", "        double km = 0;", "        for (Leg leg : legs) {", "            km += leg.distanceKm();", "        }", "        return km;", "    }", "}"], "lab/sample/weather/WeatherPenalty.java": ["package lab.sample.weather;", "", "import lab.sample.model.Mode;", "import lab.sample.model.Weather;", "", "/**", " * Ralentissement dû à la météo.", " *", " * <p>Ne concerne que les modes exposés — vélo et marche. La branche {@code SNOW} n'est", " * jamais empruntée : c'est un trou de couverture <em>à l'intérieur</em> d'une méthode", " * par ailleurs exécutée des milliers de fois. Un rapport qui n'affiche qu'un", " * pourcentage par classe le masque ; un rapport qui colorie les lignes le montre.", " */", "public final class WeatherPenalty {", "", "    private WeatherPenalty() {}", "", "    public static boolean applies(Mode mode) {", "        return mode == Mode.BIKE || mode == Mode.WALK;", "    }", "", "    public static double slowdownFactor(Weather weather) {", "        return switch (weather) {", "            case SUNNY -> 1.00;", "            case RAIN -> 1.15;", "            case SNOW -> 1.60;", "        };", "    }", "}"], "lab/sample/weather/LuggagePenalty.java": ["package lab.sample.weather;", "", "/** Ralentissement dû aux bagages. Double condition : il faut des bagages <b>et</b> un", " *  mode où ils gênent. Deux conditions imbriquées = une branche qu'on n'atteint que", " *  dans une minorité de scénarios. */", "public final class LuggagePenalty {", "", "    private LuggagePenalty() {}", "", "    public static double slowdownFactor(boolean withLuggage) {", "        return withLuggage ? 1.10 : 1.00;", "    }", "}"]}, "tracedClass": "lab/sample/RoutePlanner"};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const dot = s => s.replace(/\//g,".");
let clean = false, mode = "exec", scopeFrame = null, selected = null, filter = "";

/* ---------------------------------------------------------------- agrégats */
const AGG = (() => {
  let cov=0, miss=0; const dead=[];
  for (const classes of Object.values(D.packages))
    for (const c of classes){ cov+=c.covered; miss+=c.missed; if(!c.covered) dead.push(c.simple); }
  const weights = {};
  (function walk(n){ for(const k of n.children){ weights[k.name]=(weights[k.name]||0)+k.total; walk(k);} })(D.calltree);
  let methods=0;
  for (const info of Object.values(D.methods)) methods += info.methods.filter(m=>m.covered).length;
  return {cov, miss, dead, weights, methods,
          pct: cov+miss ? 100*cov/(cov+miss) : 0, samples: D.calltree.total};
})();

document.getElementById("stats").innerHTML =
  "<b>"+AGG.pct.toFixed(1)+" %</b> du code exécuté · <b>"+AGG.methods+"</b> méthodes ayant tourné"+
  (AGG.dead.length ? " · <b>"+AGG.dead.length+"</b> classe(s) morte(s)" : "");
document.getElementById("links").innerHTML =
  '<a href="../jacoco/html/index.html">rapport JaCoCo</a>' +
  '<a href="../jacoco-focused/html/index.html">rapport ciblé</a>' +
  '<a href="../async-profiler/flamegraph.html">flame graph</a>';
if (D.profileNote){
  const n = document.getElementById("note");
  n.className = "on";
  n.innerHTML = "⚠️ <b>Réserve sur les pourcentages de temps</b> — " + esc(D.profileNote);
  document.body.classList.add("noted");
}
document.getElementById("legend").innerHTML =
  '<span class="sw" style="background:var(--fullbar)"></span>exécuté' +
  '<span class="sw" style="background:var(--partbar)"></span>partiellement' +
  '<span class="sw" style="background:var(--missbar)"></span>jamais exécuté' +
  '<span style="margin-left:16px"><b>Qui produit quoi</b> : ' +
  '<span style="color:var(--fullbar)">■</span> JaCoCo, la couleur des lignes et la liste du code exécuté · ' +
  '<span style="color:var(--partbar)">■</span> async-profiler, les pourcentages et l\'arbre · ' +
  '<span style="color:var(--violet)">■</span> Arthas, les annotations de ligne et les valeurs.</span>';

/* --------------------------------------------------------- frame -> source */
function frameInfo(frame){
  const i = frame.lastIndexOf(".");
  if (i < 0) return null;
  const cls = frame.slice(0,i), name = frame.slice(i+1);
  const info = D.methods[cls];
  if (!info) return null;
  const decl = info.methods.find(m => m.name === name);
  return {frame, cls, name, line: decl ? decl.line : 0,
          source: info.source, methods: info.methods};
}

/* ------------------------------------------- périmètre : sous une méthode */
function framesUnder(target){
  const acc = {};
  (function walk(node, inside){
    for (const kid of node.children){
      const now = inside || kid.name === target;
      if (now) acc[kid.name] = (acc[kid.name]||0) + kid.total;
      walk(kid, now);
    }
  })(D.calltree, false);
  return acc;
}
function executedMethods(){
  const scoped = scopeFrame ? framesUnder(scopeFrame) : null;
  const out = [];
  for (const [cls, info] of Object.entries(D.methods))
    for (const m of info.methods){
      if (!m.covered) continue;
      const frame = cls + "." + m.name;
      if (scoped && !(frame in scoped)) continue;
      if (filter && !(dot(frame).toLowerCase().includes(filter))) continue;
      out.push({frame, cls, name: m.name, line: m.line, source: info.source,
                methods: info.methods, samples: AGG.weights[frame] || 0});
    }
  return out.sort((a,b) => b.samples - a.samples || a.frame.localeCompare(b.frame));
}

/* ------------------------------------------------------------------ listes */
function renderScope(){
  const box = document.getElementById("scope");
  if (mode !== "exec"){ box.innerHTML = ""; return; }
  box.innerHTML = scopeFrame
    ? "Périmètre : <b>ce qui a tourné sous " + esc(dot(scopeFrame).split(".").slice(-2).join(".")) +
      "</b> — établi sur les piles échantillonnées, une méthode très rare peut manquer." +
      "<br><button id='unscope'>Toute l'exécution</button>"
    : "Périmètre : <b>toute l'exécution</b>. Liste établie par JaCoCo, donc exhaustive. " +
      "« · » = exécutée, mais trop brève ou trop rare pour être échantillonnée.";
  const b = document.getElementById("unscope");
  if (b) b.onclick = () => { scopeFrame = null; renderExec(); };
}
function tab(id){ document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on"));
                  document.getElementById(id).classList.add("on"); }

function renderExec(){
  mode = "exec"; tab("tab-exec"); renderScope();
  const box = document.getElementById("list"); box.innerHTML = "";
  const rows = executedMethods();
  const total = rows.reduce((a,r)=>a+r.samples,0) || 1;
  const head = document.createElement("div");
  head.className = "grouphead";
  head.textContent = rows.length + " méthode(s) — cliquer pour voir le code";
  box.appendChild(head);
  for (const r of rows){
    const el = document.createElement("div");
    el.className = "node";
    const share = 100*r.samples/total;
    el.innerHTML = '<span class="pct">'+(share >= 0.05 ? share.toFixed(1)+"%" : "·")+
                   '</span>'+esc(r.cls.split("/").pop()+"."+r.name);
    el.title = dot(r.frame);
    el.onclick = () => select(r, el);
    box.appendChild(el);
  }
}

function renderTree(){
  mode = "tree"; tab("tab-tree"); renderScope();
  const box = document.getElementById("list"); box.innerHTML = "";
  const total = D.calltree.total || 1;
  (function level(container, node, depth){
    for (const kid of node.children){
      if (filter && !dot(kid.name).toLowerCase().includes(filter) && !hasMatch(kid)) continue;
      const info = frameInfo(kid.name);
      const el = document.createElement("div");
      el.className = "node " + (info ? "" : "jdk");
      el.style.paddingLeft = (6 + depth*11) + "px";
      el.innerHTML = '<span class="tw">'+(kid.children.length?"▸":"")+'</span>'+
                     '<span class="pct">'+(100*kid.total/total).toFixed(1)+'%</span>'+
                     esc(dot(kid.name));
      container.appendChild(el);
      const holder = document.createElement("div");
      holder.style.display = "none"; container.appendChild(holder);
      level(holder, kid, depth+1);
      el.onclick = e => {
        e.stopPropagation();
        if (kid.children.length){
          const open = holder.style.display === "none";
          holder.style.display = open ? "block" : "none";
          el.querySelector(".tw").textContent = open ? "▾" : "▸";
        }
        if (info){ selectFrame(kid.name, el); }
      };
    }
  })(box, D.calltree, 0);
  function hasMatch(node){
    return node.children.some(k => dot(k.name).toLowerCase().includes(filter) || hasMatch(k));
  }
}

function renderClasses(){
  mode = "cls"; tab("tab-cls"); renderScope();
  const box = document.getElementById("list"); box.innerHTML = "";
  for (const pkg of Object.keys(D.packages).sort()){
    let classes = D.packages[pkg];
    if (clean) classes = classes.filter(c => c.covered > 0);
    if (filter) classes = classes.filter(c => (pkg+"."+c.simple).toLowerCase().includes(filter));
    if (!classes.length) continue;
    const head = document.createElement("div");
    head.className = "grouphead"; head.textContent = dot(pkg);
    box.appendChild(head);
    for (const c of classes){
      const el = document.createElement("div");
      el.className = "node"; el.style.paddingLeft = "14px";
      const pct = c.covered+c.missed ? Math.round(100*c.covered/(c.covered+c.missed)) : 0;
      el.innerHTML = '<span class="pct">'+pct+'%</span>'+esc(c.simple);
      el.onclick = () => select({frame:c.name, cls:c.name, name:null, line:0, source:c.source,
                                 methods:(D.methods[c.name]||{}).methods||[]}, el);
      box.appendChild(el);
    }
  }
}

/* ------------------------------------------------------------ vue de code */
function selectFrame(frame, el){
  const info = frameInfo(frame);
  if (!info) return;
  scopeFrame = frame;
  select(info, el);
}
function select(info, el){
  document.querySelectorAll(".node.sel").forEach(n=>n.classList.remove("sel"));
  if (el) el.classList.add("sel");
  selected = info;
  draw();
}
function draw(){
  const code = document.getElementById("code");
  if (!selected){ drawHome(); return; }
  const info = selected, src = D.sources[info.source], cov = D.coverage[info.source] || {};
  const traced = info.cls === D.tracedClass;
  const samples = AGG.weights[info.frame] || 0;

  document.getElementById("crumb").innerHTML =
    '<span>'+esc(dot(info.cls).split(".").slice(0,-1).join("."))+' ›</span> <b>'+
    esc(info.cls.split("/").pop())+'.java</b>'+
    (info.name ? ' <span>›</span> <b>'+esc(info.name)+'()</b>' : '') +
    (samples ? ' <span class="pill">'+(100*samples/(D.calltree.total||1)).toFixed(1)+' % du temps</span>' : '') +
    (traced ? ' <span class="pill" style="color:var(--violet);border-color:var(--violet)">valeurs capturées</span>' : '') +
    (mode==="exec" && info.name ? ' <span class="pill" style="cursor:pointer" id="scopeBtn">ne montrer que ce qui tourne sous cette méthode</span>' : '');

  if (!src){ code.innerHTML = '<p style="padding:18px;color:var(--muted)">Source indisponible.</p>';
             document.getElementById("values").innerHTML=""; return; }

  let from = 0, to = 1e9;
  if (info.line){
    from = info.line;
    const next = info.methods.filter(m=>m.line>info.line).map(m=>m.line).sort((a,b)=>a-b)[0];
    to = next ? next-1 : 1e9;
  }
  let html = '<table class="src">', fold = 0;
  src.forEach((text,i) => {
    const nr = i+1, c = cov[nr];
    if (clean && c && c.s === "miss"){ fold++; return; }
    if (fold){ html += '<tr><td colspan="3" class="fold">… '+fold+' ligne(s) jamais exécutée(s)</td></tr>'; fold = 0; }
    const cls = [c ? c.s : "", (info.line && nr>=from && nr<=to) ? "inmethod" : ""].join(" ");
    let ann = "";
    if (traced && D.trace[nr])
      { const all = D.trace[nr];
        ann = all.slice(0,2).map(a =>
          '<a href="#" data-f="'+esc(a.frame||"")+'">'+esc(a.callee)+'</a> '+esc(a.cost)).join(" · ")
          + (all.length > 2 ? ' <span style="opacity:.7">+'+(all.length-2)+'</span>' : ''); }
    html += '<tr class="'+cls+'" id="L'+nr+'"><td class="n">'+nr+'</td><td class="c">'+
            esc(text)+'</td><td class="ann">'+ann+'</td></tr>';
  });
  if (fold) html += '<tr><td colspan="3" class="fold">… '+fold+' ligne(s) jamais exécutée(s)</td></tr>';
  code.innerHTML = html+"</table>";

  const anchor = document.getElementById("L"+(info.line||1));
  if (anchor) code.scrollTop += anchor.getBoundingClientRect().top
                              - code.getBoundingClientRect().top - code.clientHeight/3;
  code.querySelectorAll("td.ann a").forEach(a => a.onclick = e => {
    e.preventDefault();
    const f = a.dataset.f;
    if (f && frameInfo(f)) select(frameInfo(f), null);
  });
  const sb = document.getElementById("scopeBtn");
  if (sb) sb.onclick = () => { scopeFrame = info.frame; renderExec(); };
  drawValues(traced);
}
function drawValues(traced){
  const box = document.getElementById("values");
  if (!traced || !D.values.length){ box.innerHTML = ""; return; }
  box.innerHTML = "<h3>Valeurs réellement passées à cette méthode — capturées par Arthas</h3>" +
    D.values.map(v => '<div class="call"><span class="t">'+esc(v.cost)+'</span> — '+
      v.values.map(x => '<span class="v">'+esc(x.value)+'</span>').join(", ")+'</div>').join("");
}
function drawHome(){
  document.getElementById("crumb").innerHTML = '<span>Vue d\'ensemble</span>';
  document.getElementById("values").innerHTML = "";
  const hot = executedMethods().slice(0,5);
  document.getElementById("code").innerHTML =
   '<div class="home"><h2>Ce que cette page montre</h2>'+
   '<p>Une exécution réelle du programme, vue par trois outils gratuits, assemblée ici.</p>'+
   '<div class="cards">'+
     '<div class="card"><div class="k">'+AGG.pct.toFixed(1)+' %</div><div class="l">du code exécuté <span style="opacity:.7">— JaCoCo</span></div></div>'+
     '<div class="card"><div class="k">'+AGG.methods+'</div><div class="l">méthodes ayant tourné</div></div>'+
     '<div class="card"><div class="k">'+AGG.samples.toLocaleString("fr")+'</div><div class="l">échantillons de pile <span style="opacity:.7">— async-profiler</span></div></div>'+
     '<div class="card"><div class="k">'+D.values.length+'</div><div class="l">appels avec leurs valeurs <span style="opacity:.7">— Arthas</span></div></div>'+
   '</div>'+
   '<h2>Comment s\'en servir</h2><ol>'+
     '<li><b>Code exécuté</b> — la liste de tout ce qui a tourné, du plus coûteux au moins coûteux. Cliquer ouvre le code, lignes exécutées en vert.</li>'+
     '<li>Sur une méthode, <b>« ne montrer que ce qui tourne sous cette méthode »</b> restreint la liste à son périmètre — sans avoir à descendre d\'appel en appel.</li>'+
     '<li><b>Arbre d\'appel</b> et <b>Packages</b> sont deux autres portes d\'entrée vers le même code.</li>'+
     '<li><b>Masquer le code non exécuté</b>, en haut à droite, retire du rapport tout ce qui n\'a pas tourné.</li>'+
   '</ol>'+
   (AGG.dead.length ? '<h2>Jamais exécuté</h2><p>'+AGG.dead.map(d=>'<code>'+esc(d)+'</code>').join(" ")+'</p>' : '')+
   '<h2>Les plus coûteuses</h2><p>'+hot.map(h=>'<code>'+esc(h.cls.split("/").pop()+"."+h.name)+'</code>').join(" ")+'</p>'+
   '</div>';
}

/* ------------------------------------------------------------ interactions */
document.getElementById("tab-exec").onclick = renderExec;
document.getElementById("tab-tree").onclick = renderTree;
document.getElementById("tab-cls").onclick  = renderClasses;
document.getElementById("clean").onchange = e => {
  clean = e.target.checked;
  mode === "cls" ? renderClasses() : mode === "tree" ? renderTree() : renderExec();
  draw();
};
document.getElementById("search").oninput = e => {
  filter = e.target.value.trim().toLowerCase();
  mode === "cls" ? renderClasses() : mode === "tree" ? renderTree() : renderExec();
};
renderExec();
drawHome();
</script>
</body>
</html>
